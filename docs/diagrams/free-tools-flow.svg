<svg xmlns='http://www.w3.org/2000/svg' width='1100' height='330' viewBox='0 0 1100 330'><defs><marker id='a' markerWidth='10' markerHeight='10' refX='9' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#5D6B7E'/></marker></defs><rect width='1100' height='330' fill='#F5F7FA'/><text x='24' y='34' font-family='Space Grotesk, Helvetica, Arial, sans-serif' font-size='20' font-weight='700' fill='#002147'>Free tools: read for free, download with a free account</text><rect x='40' y='90' width='150' height='110' rx='6' fill='#fff' stroke='#002147' stroke-width='1.5'/><text x='115.0' y='114' text-anchor='middle' font-family='Space Grotesk, Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#002147'>Search or filter</text><text x='115.0' y='136' text-anchor='middle' font-family='Space Grotesk, Helvetica, Arial, sans-serif' font-size='12' fill='#1E2A3B'>/guides: type, framework,</text><text x='115.0' y='153' text-anchor='middle' font-family='Space Grotesk, Helvetica, Arial, sans-serif' font-size='12' fill='#1E2A3B'>topic, access</text><line x1='190' y1='145' x2='220' y2='145' stroke='#5D6B7E' stroke-width='1.5' marker-end='url(#a)'/><rect x='220' y='90' width='150' height='110' rx='6' fill='#fff' stroke='#002147' stroke-width='1.5'/><text x='295.0' y='114' text-anchor='middle' font-family='Space Grotesk, Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#002147'>Preview</text><text x='295.0' y='136' text-anchor='middle' font-family='Space Grotesk, Helvetica, Arial, sans-serif' font-size='12' fill='#1E2A3B'>every field, purpose,</text><text x='295.0' y='153' text-anchor='middle' font-family='Space Grotesk, Helvetica, Arial, sans-serif' font-size='12' fill='#1E2A3B'>mapping, FAQ (public)</text><line x1='370' y1='145' x2='400' y2='145' stroke='#5D6B7E' stroke-width='1.5' marker-end='url(#a)'/><rect x='400' y='90' width='150' height='110' rx='6' fill='#fff' stroke='#002147' stroke-width='1.5'/><text x='475.0' y='114' text-anchor='middl