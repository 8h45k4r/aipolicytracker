' stroke='#002147' stroke-width='1.5'/><text x='1015.0' y='114' text-anchor='middle' font-family='Space Grotesk, Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#002147'>Admin insight</text><text x='1015.0' y='136' text-anchor='middle' font-family='Space Grotesk, Helvetica, Arial, sans-serif' font-size='12' fill='#1E2A3B'>users, downloads,</text><text x='1015.0' y='153' text-anchor='middle' font-family='Space Grotesk, Helvetica, Arial, sans-serif' font-size='12' fill='#1E2A3B'>sources, CSV export</text><text x='550' y='250' text-anchor='middle' font-family='Space Grotesk, Helvetica, Arial, sans-serif' font-size='12' fill='#5D6B7E'>Reading is never gated. Files live outside the web root and are never linked directly. Every file states version, date and that it is informational only.</text></svg>