<svg xmlns='http://www.w3.org/2000/svg' width='1100' height='330' viewBox='0 0 1100 330'><defs><marker id='a' markerWidth='10' markerHeight='10' refX='9' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#5D6B7E'/></marker></defs><rect width='1100' height='330' fill='#F5F7FA'/><text x='24' y='34' font-family='Space Grotesk, Helvetica, Arial, sans-serif' font-size='20' font-weight='700' fill='#002147'>From official source to published record</text><rect x='40' y='90' width='150' height='110' rx='6' fill='#fff' stroke='#002147' stroke-width='1.5'/><text x='115.0' y='114' text-anchor='middle' font-family='Space Grotesk, Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#002147'>Official source</text><text x='115.0' y='136' text-anchor='middle' font-family='Space Grotesk, Helvetica, Arial, sans-serif' font-size='12' fill='#1E2A3B'>law, regulator,</text><text x='115.0' y='153' text-anchor='middle' font-family='Space Grotesk, Helvetica, Arial, sans-serif' font-size='12' fill='#1E2A3B'>standards body</text><line x1='190' y1='145' x2='220' y2='145' stroke='#5D6B7E' stroke-width='1.5' marker-end='url(#a)'/><rect x='220' y='90' width='150' height='110' rx='6' fill='#fff' stroke='#002147' stroke-width='1.5'/><text x='295.0' y='114' text-anchor='middle' font-family='Space Grotesk, Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#002147'>YAML record</text><text x='295.0' y='136' text-anchor='middle' font-family='Space Grotesk, Helvetica, Arial, sans-serif' font-size='12' fill='#1E2A3B'>source fields, dates,</text><text x='295.0' y='153' text-anchor='middle' font-family='Space Grotesk, Helvetica, Arial, sans-serif' font-size='12' fill='#1E2A3B'>review status, confidence</text><line x1='370' y1='145' x2='400' y2='145' stroke='#5D6B7E' stroke-width='1.5' marker-end='url(#a)'/><rect x='400' y='90' width='150' height='110' rx='6' fill='#002147' stroke='#002147' stroke-width='1.5'/><text x='475.0' y='114' text-anchor='middle' font-family='Space Grotesk, Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#fff'>Validation</text><text x='475.0' y='136' text-anchor='middle' font-family='Space Grotesk, Helvetica, Arial, sans-serif' font-size='12' fill='#E6EEF7'>schema + cross-refs</text><text x='475.0' y='153' text-anchor='middle' font-family='Space Grotesk, Helvetica, Arial, sans-serif' font-size='12' fill='#E6EEF7'>in CI and at startup</text><line x1='550' y1='145' x2='580' y2='145' stroke='#5D6B7E' stroke-width='1.5' marker-end='url(#a)'/><rect x='580' y='90' width='150' height='110' rx='6' fill='#002147' stroke='#002147' stroke-width='1.5'/><text x='655.0' y='114' text-anchor='middle' font-family='Space Grotesk, Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#fff'>Import</text><text x='655.0' y='136' text-anchor='middle' font-family='Space Grotesk, Helvetica, Arial, sans-serif' font-size='12' fill='#E6EEF7'>idempotent upsert</text><text x='655.0' y='153' text-anchor='middle' font-family='Space Grotesk, Helvetica, Arial, sans-serif' font-size='12' fill='#E6EEF7'>into the read model</text><line x1='730' y1='145' x2='760' y2='145' stroke='#5D6B7E' stroke-width='1.5' marker-end='url(#a)'/><rect x='760' y='90' width='150' height='110' rx='6' fill='#fff' stroke='#002147' stroke-width='1.5'/><text x='835.0' y='114' text-anchor='middle' font-family='Space Grotesk, Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#002147'>Public page</text><text x='835.0' y='136' text-anchor='middle' font-family='Space Grotesk, Helvetica, Arial, sans-serif' font-size='12' fill='#1E2A3B'>status, obligations,</text><text x='835.0' y='153' text-anchor='middle' font-family='Space Grotesk, Helvetica, Arial, sans-serif' font-size='12' fill='#1E2A3B'>deadlines, JSON, sitemap</text><line x1='910' y1='145' x2='940' y2='145' stroke='#5D6B7E' stroke-width='1.5' marker-end='url(#a)'/><rect x='940' y='90' width='150' height='110' rx='6' fill='#fff' stroke='#002147' stroke-width='1.5'/><text x='1015.0' y='114' text-anchor='middle' font-family='Space Grotesk, Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#002147'>Reader feedback</text><text x='1015.0' y='136' text-anchor='middle' font-family='Space Grotesk, Helvetica, Arial, sans-serif' font-size='12' fill='#1E2A3B'>prefilled correction</text><text x='1015.0' y='153' text-anchor='middle' font-family='Space Grotesk, Helvetica, Arial, sans-serif' font-size='12' fill='#1E2A3B'>→ admin review queue</text><path d='M1015 200 C 1015 260, 115 260, 115 200' fill='none' stroke='#5D6B7E' stroke-width='1.5' stroke-dasharray='5 4' marker-end='url(#a)'/><text x='560' y='280' text-anchor='middle' font-family='Space Grotesk, Helvetica, Arial, sans-serif' font-size='12' fill='#5D6B7E'>corrections are applied back to the YAML record through a pull request; nothing is published without a reviewer</text></svg>