; PHP-FPM pool for aipolicytracker.org.
;
; Install to /etc/php/<VERSION>/fpm/pool.d/aip.conf and reload php<VERSION>-fpm.
; Replace <VERSION> with the PHP version reported by `php -v` on the host.
;
; This pool is deliberately separate from any other pool on the box: its own
; unix socket, its own user, its own limits. Nothing here touches another site.

[aip]
user = aip
group = aip

listen = /run/php/php-fpm-aip.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; ondemand rather than dynamic: workers start on the first request and exit when
; idle, so an idle site costs almost nothing. The trade-off is roughly 100ms of
; extra latency on the first request after a quiet period.
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 10s

; Recycle a worker after this many requests. Bounds any slow leak in a long-lived
; process without the cost of dynamic process management.
pm.max_requests = 500

; A crawl of the sitemap can arrive as a burst. Queue rather than refuse.
listen.backlog = 128

php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 16M
php_admin_value[post_max_size] = 20M
php_admin_value[max_execution_time] = 60

; Application errors go to the application's own log, not the pool log.
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/www/aip/shared/storage/logs/php-fpm-error.log

; Confine the pool to its own tree plus the temp dir. A path traversal in the app
; cannot then read another site's files even if the filesystem permissions failed.
php_admin_value[open_basedir] = /var/www/aip:/tmp:/usr/share/fonts

; Nothing in this application shells out.
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen

; Sessions belong to this site alone.
php_admin_value[session.save_path] = /var/www/aip/shared/storage/framework/sessions

slowlog = /var/www/aip/shared/storage/logs/php-fpm-slow.log
request_slowlog_timeout = 10s
