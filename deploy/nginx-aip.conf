# nginx server block for aipolicytracker.org.
#
# Install to /etc/nginx/sites-available/aip, symlink into sites-enabled, then
# `nginx -t && systemctl reload nginx`. It adds a server block; it changes no
# shared configuration and touches no other site.
#
# TLS uses a Cloudflare Origin Certificate. Create the two files yourself:
#   /etc/ssl/aip/origin.pem   (the certificate)
#   /etc/ssl/aip/origin.key   (the private key, chmod 600, owned by root)
# Cloudflare SSL mode must be Full (strict).

# Cloudflare sits in front, so the client address arrives in a header. Without
# this every visitor looks like a Cloudflare address and the application's rate
# limits, the hashed addresses in the audit log and the download records all
# describe Cloudflare rather than the visitor.
#
# Refresh these ranges from https://www.cloudflare.com/ips/ when they change.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    listen [::]:80;
    server_name aipolicytracker.org www.aipolicytracker.org;

    # Cloudflare talks to the origin over 443. Anything arriving on 80 is either
    # a misconfiguration or a direct hit on the IP; send it to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aipolicytracker.org www.aipolicytracker.org;

    ssl_certificate     /etc/ssl/aip/origin.pem;
    ssl_certificate_key /etc/ssl/aip/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:aip_ssl:5m;
    ssl_session_timeout 1h;

    root /var/www/aip/current/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    access_log /var/www/aip/shared/storage/logs/nginx-access.log;
    error_log  /var/www/aip/shared/storage/logs/nginx-error.log warn;

    # The application sets its own security headers, including a nonce-based
    # content security policy. Nothing is added here that would duplicate or
    # contradict them.
    server_tokens off;

    # Hashed build assets never change at a given path.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; try_files $uri =404; }
    location = /robots.txt  { access_log off; log_not_found off; try_files $uri =404; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php-fpm-aip.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        # Cloudflare terminates TLS, so the application must be told the original
        # scheme or every generated URL comes out as http.
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Dotfiles are never served. .env sits outside the web root anyway, but a
    # misplaced file should not become a disclosure.
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}
