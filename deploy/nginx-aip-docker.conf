# aipolicytracker.org on a Docker host, behind Cloudflare.
#
#   cp deploy/nginx-aip-docker.conf /etc/nginx/sites-available/aip
#   ln -sfn /etc/nginx/sites-available/aip /etc/nginx/sites-enabled/aip
#   nginx -t && systemctl reload nginx
#
# This one block works in every Cloudflare SSL mode, which is the point of it.
#
#   Flexible      Cloudflare connects on port 80.  Served.
#   Full          Cloudflare connects on 443, does not check the certificate.
#   Full (strict) Cloudflare connects on 443 and validates it.
#
# So the SSL mode can be changed in the dashboard with no matching change here
# and no window where the site is broken. Install the certificate, reload once,
# then move the mode whenever you like.
#
# There is deliberately NO redirect from 80 to 443. Behind Cloudflare the origin
# must not redirect: under Flexible the request already arrived as https to the
# visitor, so a 301 to https travels back through Cloudflare and loops until the
# browser gives up. Upgrading visitors to https is the edge's job — turn on
# "Always Use HTTPS" in Cloudflare, not here.
#
# Port 80 stays open because Cloudflare may use it, so without a restriction
# anyone could reach this origin directly with a forged Host header and bypass
# Cloudflare entirely: the WAF, the rate limits and the bot rules with it. Only
# Cloudflare's published ranges are allowed in, on both ports.
#
# Additive only: a new server block. No shared nginx file is edited.

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

upstream aip_app {
    # The container publishes on loopback only; this is the sole way in.
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;

    # The certificate must already be on disk before this config is loaded.
    # nginx refuses to start or reload when ssl_certificate names a file that
    # does not exist, so install the certificate first and only then reload.
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name aipolicytracker.org www.aipolicytracker.org;

    # Cloudflare origin certificate: SSL/TLS > Origin Server > Create Certificate.
    ssl_certificate     /etc/ssl/aip/origin.pem;
    ssl_certificate_key /etc/ssl/aip/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:aip_ssl:5m;
    ssl_session_timeout 1h;

    # Only Cloudflare may reach this origin, on either port.
    allow 173.245.48.0/20;
    allow 103.21.244.0/22;
    allow 103.22.200.0/22;
    allow 103.31.4.0/22;
    allow 141.101.64.0/18;
    allow 108.162.192.0/18;
    allow 190.93.240.0/20;
    allow 188.114.96.0/20;
    allow 197.234.240.0/22;
    allow 198.41.128.0/17;
    allow 162.158.0.0/15;
    allow 104.16.0.0/13;
    allow 104.24.0.0/14;
    allow 172.64.0.0/13;
    allow 131.0.72.0/22;
    allow 2400:cb00::/32;
    allow 2606:4700::/32;
    allow 2803:f800::/32;
    allow 2405:b500::/32;
    allow 2405:8100::/32;
    allow 2a06:98c0::/29;
    allow 2c0f:f248::/32;
    deny all;

    server_tokens off;
    client_max_body_size 32m;

    access_log /var/log/nginx/aip-access.log;
    error_log  /var/log/nginx/aip-error.log;

    location / {
        proxy_pass http://aip_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The visitor's connection IS https, terminated at the edge. Without
        # this every URL the application generates comes out as http and
        # mixed-content warnings follow.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # Built assets are content-hashed and immutable, so let the browser and the
    # edge keep them.
    location /build/ {
        proxy_pass http://aip_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /favicon.ico { proxy_pass http://aip_app; access_log off; }
    location = /robots.txt  { proxy_pass http://aip_app; access_log off; }
}
