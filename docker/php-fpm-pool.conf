; Overrides for the image's [www] pool, loaded last (zzz-aip.conf, after zz-docker.conf).
; The container runs as www-data, so FPM's user/group lines are ignored (a notice at start).
[www]
; Only nginx in this container talks to FPM.
listen = 127.0.0.1:9000

; Sized for the 512M container limit in deploy/compose.yml, alongside the queue
; worker and the scheduler: up to 6 workers at roughly 40-60 MB each.
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; A request that runs longer than this is ended (JobRun stops itself before it).
request_terminate_timeout = 300s

; Laravel logs to stderr (LOG_CHANNEL=stderr); pass worker output through to docker logs.
catch_workers_output = yes
decorate_workers_output = no
; The host nginx keeps the access log.
access.log = /dev/null
; The application reads its environment (APP_KEY, DB_*).
clear_env = no

php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 16M
php_admin_value[post_max_size] = 32M
