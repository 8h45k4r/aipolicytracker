# nginx inside the app container: serves public/ and hands PHP to php-fpm on
# 127.0.0.1:9000. It runs as www-data (no root), so every path it writes is in /tmp.
# The entrypoint replaces __PORT__ with $PORT (default 8080) and starts it.
#
# The host's nginx (deploy/nginx-aip-docker.conf) still terminates TLS, restricts
# access to the edge and sets X-Forwarded-*; this one only serves the container.
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    # The host nginx keeps the access log; one per request is enough.
    access_log off;

    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # Same limit as the host nginx.
    client_max_body_size 32m;

    server {
        listen __PORT__ default_server;
        root /var/www/html/public;
        index index.php;
        charset utf-8;

        # A file that exists under public/ is served as is; everything else is Laravel.
        location / {
            try_files $uri /index.php?$query_string;
        }

        # Only the front controller runs. No other .php file under public/ executes.
        location = /index.php {
            fastcgi_pass 127.0.0.1:9000;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_read_timeout 300s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }
        location ~ \.php$ {
            return 404;
        }

        # Dot files (.htaccess and the like) are never served; Laravel answers
        # /.well-known/* itself.
        location ~ /\.(?!well-known/) {
            return 404;
        }

        location ^~ /build/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }
    }
}
