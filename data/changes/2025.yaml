changes:
  - slug: 2025-01-23-us-eo-14179
    jurisdiction: us
    policy: us-executive-order-14179
    occurred_on: 2025-01-23
    title: US Executive Order 14179 sets a new federal AI policy after EO 14110 was revoked
    what_changed: >
      Three days after Executive Order 14148 revoked the 2023 "Safe, Secure, and Trustworthy AI" order, EO 14179
      directed an AI Action Plan within 180 days and a review of prior agency actions.
    practical_impact: Federal AI requirements derived from EO 14110 were placed under review; vendors should check what agencies still require.
    impact_level: high
    status_after: in_force
    published: true
    official_source_url: "https://www.whitehouse.gov/presidential-actions/2025/01/removing-barriers-to-american-leadership-in-artificial-intelligence/"
    source_title: "Executive Order 14179"
    source_publisher: "The White House"
    source_document_date: 2025-01-23
    source_tier: 1
    review_status: pending_review
    confidence_level: high
    content_version: 1
  - slug: 2025-02-02-eu-ai-act-prohibitions-apply
    jurisdiction: eu
    policy: eu-ai-act
    occurred_on: 2025-02-02
    title: EU AI Act prohibited practices and AI-literacy duties start to apply
    what_changed: >
      Chapters I and II of the AI Act became applicable, banning the Article 5 practices and requiring providers and
      deployers to ensure AI literacy under Article 4. The Commission published guidelines on prohibited practices
      on 4 February 2025.
    practical_impact: Prohibited-use screening and staff AI training are now legal requirements for anyone using AI in the EU.
    impact_level: urgent
    status_after: partially_applicable
    published: true
    official_source_url: "https://eur-lex.europa.eu/eli/reg/2024/1689/oj"
    source_title: "Regulation (EU) 2024/1689, Article 113(a)"
    source_publisher: "Official Journal of the European Union"
    source_document_date: 2024-07-12
    source_tier: 1
    review_status: pending_review
    confidence_level: high
    content_version: 1
  - slug: 2025-04-03-us-omb-ai-memoranda
    jurisdiction: us
    policy: us-omb-m-25-21
    occurred_on: 2025-04-03
    title: OMB issues M-25-21 and M-25-22 on federal AI use and acquisition
    what_changed: >
      OMB replaced the 2024 memoranda with new requirements for agency AI governance, use-case inventories,
      high-impact AI practices and AI procurement.
    practical_impact: Vendors to US federal agencies need documentation and testing support aligned with the high-impact AI practices.
    impact_level: high
    status_after: in_force
    published: true
    official_source_url: "https://www.whitehouse.gov/omb/information-for-agencies/memoranda/"
    source_title: "OMB Memoranda M-25-21 and M-25-22"
    source_publisher: "Office of Management and Budget"
    source_document_date: 2025-04-03
    source_tier: 1
    review_status: pending_review
    confidence_level: medium
    content_version: 1
  - slug: 2025-07-10-eu-gpai-code-of-practice
    jurisdiction: eu
    policy: eu-ai-act
    occurred_on: 2025-07-10
    title: European Commission publishes the General-Purpose AI Code of Practice
    what_changed: >
      The final Code of Practice for general-purpose AI models was published, with chapters on transparency,
      copyright, and safety and security for models with systemic risk, ahead of the 2 August 2025 application date.
    practical_impact: Model providers can sign the Code to demonstrate compliance with Articles 53 and 55.
    impact_level: high
    status_after: partially_applicable
    published: true
    official_source_url: "https://digital-strategy.ec.europa.eu/en/policies/contents-code-gpai"
    source_title: "General-Purpose AI Code of Practice"
    source_publisher: "European Commission"
    source_document_date: 2025-07-10
    source_tier: 2
    review_status: pending_review
    confidence_level: high
    content_version: 1
  - slug: 2025-07-23-us-ai-action-plan
    jurisdiction: us
    policy: us-executive-order-14179
    occurred_on: 2025-07-23
    title: White House releases America's AI Action Plan
    what_changed: >
      The Action Plan required by EO 14179 set out federal priorities on innovation, infrastructure and international
      leadership, with accompanying executive orders on federal procurement of AI models and data-centre permitting.
    practical_impact: Signals federal deregulatory direction and procurement expectations for AI vendors.
    impact_level: routine
    status_after: in_force
    published: true
    official_source_url: "https://www.ai.gov/action-plan"
    source_title: "America's AI Action Plan"
    source_publisher: "The White House"
    source_document_date: 2025-07-23
    source_tier: 1
    review_status: pending_review
    confidence_level: medium
    content_version: 1
  - slug: 2025-08-02-eu-gpai-obligations-apply
    jurisdiction: eu
    policy: eu-ai-act
    occurred_on: 2025-08-02
    title: EU AI Act general-purpose AI, governance and penalty provisions start to apply
    what_changed: >
      Chapter V obligations for general-purpose AI model providers, the governance chapter, notified-body provisions
      and most penalty provisions became applicable.
    practical_impact: Providers placing general-purpose models on the EU market must now hold documentation, a copyright policy and a training-content summary.
    impact_level: urgent
    status_after: partially_applicable
    published: true
    official_source_url: "https://eur-lex.europa.eu/eli/reg/2024/1689/oj"
    source_title: "Regulation (EU) 2024/1689, Article 113(b)"
