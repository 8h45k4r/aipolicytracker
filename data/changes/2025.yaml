    jurisdiction: india
    policy: india-dpdp-act
    occurred_on: 2025-11-13
    title: India notifies the Digital Personal Data Protection Rules, 2025
    what_changed: >
      The DPDP Rules were notified with phased commencement, starting the countdown for consent, notice, security
      and breach-notification obligations under the DPDP Act 2023.
    practical_impact: Organisations using personal data of Indian residents in AI should plan compliance against the phased dates.
    impact_level: urgent
    status_after: partially_applicable
