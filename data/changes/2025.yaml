  - slug: 2025-07-23-us-ai-action-plan
    jurisdiction: us
    policy: us-executive-order-14179
    occurred_on: 2025-07-23
    title: White House releases America's AI Action Plan
    what_changed: >
      The Action Plan required by EO 14179 set out federal priorities on innovation, infrastructure and international
      leadership, with accompanying executive orders on federal procurement of AI models and data-centre permitting.
    practical_impact: Signals federal deregulatory direction and procurement expectations for AI vendors.
    impact_level: routine
    status_after: in_force
    published: true
    official_source_url: "https://www.ai.gov/action-plan"
