  - slug: 2025-11-05-india-ai-governance-guidelines
    jurisdiction: india
    policy: india-ai-governance-guidelines
    occurred_on: 2025-11-05
    title: MeitY releases the India AI Governance Guidelines
    what_changed: >
      The guidelines set out principles, an institutional framework and recommendations favouring existing-law
      enforcement, voluntary commitments and risk-based oversight over a new AI statute.
    practical_impact: Indian AI developers and deployers have a reference for regulator expectations; no new binding duties.
    impact_level: routine
    status_after: guidance
    published: true
    official_source_url: "https://indiaai.gov.in/"
