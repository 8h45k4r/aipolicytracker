  - slug: 2025-12-02-australia-national-ai-plan
    jurisdiction: australia
    policy: australia-mandatory-guardrails-proposal
    occurred_on: 2025-12-02
    title: Australia releases a National AI Plan signalling an existing-law approach
    what_changed: >
      The National AI Plan set out the government's AI agenda and indicated that AI would be governed by
      strengthening existing laws rather than a standalone AI Act. The status of the 2024 mandatory-guardrails
      proposal must be confirmed.
    practical_impact: Australian organisations should not expect a cross-economy AI Act in the near term; existing-law compliance and the voluntary standard remain the baseline.
    impact_level: high
    status_after: under_consultation
    published: true
    official_source_url: "https://www.industry.gov.au/"
