    jurisdiction: us-california
    policy: us-california-sb-53
    occurred_on: 2025-09-29
    title: California enacts the Transparency in Frontier Artificial Intelligence Act (SB 53)
    what_changed: >
      The Governor signed SB 53, requiring large frontier developers to publish safety frameworks and transparency
      reports and to report critical safety incidents, operative 1 January 2026.
    practical_impact: Frontier-model developers doing business in California need a published safety framework and incident reporting process.
    impact_level: high
