  - slug: 2025-08-28-colorado-ai-act-delayed
    jurisdiction: us-colorado
    policy: us-colorado-ai-act
    occurred_on: 2025-08-28
    title: Colorado delays the AI Act effective date to 30 June 2026
    what_changed: >
      SB 25B-004, passed in a special session, moved the effective date of SB 24-205 from 1 February 2026 to
      30 June 2026 without changing its substance.
    practical_impact: Developers and deployers gained about five months; further amendments were expected in the 2026 session.
    impact_level: high
    status_after: adopted
    published: true
