  - slug: 2025-08-02-eu-gpai-obligations-apply
    jurisdiction: eu
    policy: eu-ai-act
    occurred_on: 2025-08-02
    title: EU AI Act general-purpose AI, governance and penalty provisions start to apply
    what_changed: >
      Chapter V obligations for general-purpose AI model providers, the governance chapter, notified-body provisions
      and most penalty provisions became applicable.
    practical_impact: Providers placing general-purpose models on the EU market must now hold documentation, a copyright policy and a training-content summary.
    impact_level: urgent
    status_after: partially_applicable
    published: true
    official_source_url: "https://eur-lex.europa.eu/eli/reg/2024/1689/oj"
