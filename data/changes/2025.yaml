  - slug: 2025-11-19-eu-digital-omnibus-proposal
    jurisdiction: eu
    policy: eu-ai-act
    occurred_on: 2025-11-19
    title: European Commission proposes Digital Omnibus adjustments to AI Act timelines
    what_changed: >
      The Commission proposed a "Digital Omnibus" package that would, among other changes, link the application of
      certain high-risk obligations to the availability of standards and support tools, with later backstop dates.
      This is a proposal and requires adoption by the European Parliament and Council.
    practical_impact: High-risk timelines may move; organisations should keep planning against Article 113 dates until an amendment is adopted.
    impact_level: high
    status_after: partially_applicable
    published: true
    official_source_url: "https://digital-strategy.ec.europa.eu/en/policies/regulatory-framework-ai"
    source_title: "AI Act policy page (Digital Omnibus proposal)"
    source_publisher: "European Commission"
    source_document_date: 2025-11-19
    source_tier: 1
