  - slug: 2025-08-nepal-national-ai-policy-approved
    jurisdiction: nepal
    policy: nepal-national-ai-policy
    occurred_on: 2025-08-01
    title: Nepal's Council of Ministers approves the National AI Policy
    what_changed: >
      The cabinet approved the National Artificial Intelligence Policy 2082, Nepal's first national AI policy.
      Exact approval date and the published text need confirmation from MoCIT.
    practical_impact: Organisations in Nepal should expect implementing measures, institutions and possible legislation to follow.
    impact_level: high
    status_after: adopted
    published: true
    official_source_url: "https://mocit.gov.np/"
