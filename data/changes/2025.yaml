  - slug: 2025-11-19-eu-digital-omnibus-proposal
    jurisdiction: eu
    policy: eu-ai-act
    occurred_on: 2025-11-19
    title: European Commission proposes Digital Omnibus adjustments to AI Act timelines
    what_changed: >
      The Commission proposed a "Digital Omnibus" package that would, among other changes, link the application of
      certain high-risk obligations to the availability of standards and support tools, with later backstop dates.
      This is a proposal and requires adoption by the European Parliament and Council.
    practical_impact: High-risk timelines may move; organisations should keep planning against Article 113 dates until an amendment is adopted.
    impact_level: high
    status_after: partially_applicable
    published: true
    official_source_url: "https://digital-strategy.ec.europa.eu/en/policies/regulatory-framework-ai"
    source_title: "AI Act policy page (Digital Omnibus proposal)"
    source_publisher: "European Commission"
    source_document_date: 2025-11-19
    source_tier: 1
    review_status: pending_review
    confidence_level: medium
    content_version: 1
    change_summary: Reviewer to link the proposal document and confirm adoption status.
  - slug: 2025-12-02-australia-national-ai-plan
    jurisdiction: australia
    policy: australia-mandatory-guardrails-proposal
    occurred_on: 2025-12-02
    title: Australia releases a National AI Plan signalling an existing-law approach
    what_changed: >
      The National AI Plan set out the government's AI agenda and indicated that AI would be governed by
      strengthening existing laws rather than a standalone AI Act. The status of the 2024 mandatory-guardrails
      proposal must be confirmed.
    practical_impact: Australian organisations should not expect a cross-economy AI Act in the near term; existing-law compliance and the voluntary standard remain the baseline.
    impact_level: high
    status_after: under_consultation
    published: true
    official_source_url: "https://www.industry.gov.au/"
    source_title: "National AI Plan"
    source_publisher: "Department of Industry, Science and Resources"
