    content_version: 1
  - slug: 2024-07-12-eu-ai-act-published
    jurisdiction: eu
    policy: eu-ai-act
    occurred_on: 2024-07-12
    title: EU AI Act published in the Official Journal
    what_changed: >
      Regulation (EU) 2024/1689 was published in the Official Journal, fixing its entry into force for 1 August 2024
      and starting the phased application clock under Article 113.
    practical_impact: Every organisation supplying or using AI in the EU can now plan against fixed dates.
    impact_level: urgent
    status_after: adopted
    published: true
    official_source_url: "https://eur-lex.europa.eu/eli/reg/2024/1689/oj"
    source_title: "Regulation (EU) 2024/1689"
    source_publisher: "Official Journal of the European Union"
    source_document_date: 2024-07-12
    source_tier: 1
    review_status: pending_review
    confidence_level: high
    content_version: 1
  - slug: 2024-09-05-australia-voluntary-standard-and-guardrails
    jurisdiction: australia
    policy: australia-voluntary-ai-safety-standard
    occurred_on: 2024-09-05
    title: Australia releases a Voluntary AI Safety Standard and consults on mandatory guardrails
    what_changed: >
      The Department of Industry, Science and Resources published ten voluntary guardrails and a proposals paper on
      mandatory guardrails for high-risk AI, with consultation to 4 October 2024.
    practical_impact: Australian organisations gained a concrete voluntary baseline aligned with ISO/IEC 42001 and the NIST AI RMF.
    impact_level: high
    status_after: voluntary_standard
    published: true
    official_source_url: "https://www.industry.gov.au/publications/voluntary-ai-safety-standard"
    source_title: "Voluntary AI Safety Standard"
