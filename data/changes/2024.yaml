changes:
  - slug: 2024-05-17-colorado-ai-act-signed
    jurisdiction: us-colorado
    policy: us-colorado-ai-act
    occurred_on: 2024-05-17
    title: Colorado signs the first US state law on algorithmic discrimination
    what_changed: >
      Governor Polis signed SB 24-205, creating duties of reasonable care for developers and deployers of high-risk
      AI systems used in consequential decisions, originally effective 1 February 2026.
    practical_impact: Organisations making consequential decisions about Colorado residents should begin scoping risk programmes and impact assessments.
    impact_level: high
    status_after: adopted
    published: true
    official_source_url: "https://leg.colorado.gov/bills/sb24-205"
    source_title: "SB24-205 Consumer Protections for Artificial Intelligence"
    source_publisher: "Colorado General Assembly"
    source_document_date: 2024-05-17
    source_tier: 1
    review_status: pending_review
    confidence_level: high
    content_version: 1
  - slug: 2024-05-30-singapore-genai-framework
    jurisdiction: singapore
    policy: singapore-model-ai-governance-framework
    occurred_on: 2024-05-30
    title: Singapore publishes the Model AI Governance Framework for Generative AI
    what_changed: >
      IMDA and the AI Verify Foundation released a generative-AI companion to the Model AI Governance Framework with
      nine governance dimensions including accountability, incident reporting and content provenance.
    practical_impact: Generative-AI developers and deployers in Singapore have a reference set of expected practices.
    impact_level: routine
    status_after: voluntary_standard
    published: true
    official_source_url: "https://aiverifyfoundation.sg/resources/mgf-gen-ai/"
