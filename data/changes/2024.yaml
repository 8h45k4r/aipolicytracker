    policy: us-illinois-hb-3773-ai-in-employment
    occurred_on: 2024-08-09
    title: Illinois makes discriminatory AI in employment a civil-rights violation
    what_changed: >
      Public Act 103-0804 amended the Human Rights Act so that using AI with a discriminatory effect in employment decisions, or zip codes as a proxy, is a violation, with notice duties; effective 1 January 2026.
    practical_impact: Illinois employers must test AI hiring and HR tools for discriminatory effect and notify employees before 2026.
    impact_level: high
