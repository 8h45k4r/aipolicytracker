    policy: us-utah-artificial-intelligence-policy-act
    occurred_on: 2024-05-01
    title: Utah AI Policy Act takes effect with generative-AI disclosure duties
    what_changed: >
      SB 149 became effective, requiring disclosure of generative-AI interaction on request in consumer transactions and proactively in regulated occupations, and creating the Office of AI Policy and a learning laboratory.
    practical_impact: Businesses using chatbots with Utah consumers need disclosure processes; the 2025 amendments narrowed the duty to high-risk interactions.
