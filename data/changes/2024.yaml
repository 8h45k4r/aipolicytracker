    title: UN General Assembly adopts its first resolution on safe, secure and trustworthy AI
    what_changed: >
      Resolution A/RES/78/265, adopted by consensus with more than 120 co-sponsors, encourages states to promote trustworthy AI for sustainable development and to develop governance frameworks.
