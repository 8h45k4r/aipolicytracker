    jurisdiction: council-of-europe
    policy: council-of-europe-framework-convention-on-ai
    occurred_on: 2024-05-17
    title: Council of Europe adopts the first binding international treaty on AI
    what_changed: >
      The Committee of Ministers adopted the Framework Convention on AI and Human Rights, Democracy and the Rule of Law (CETS 225); it opened for signature on 5 September 2024 with the EU, UK, US and others signing.
    practical_impact: Ratifying states must ensure AI activities respect human rights, with risk and impact assessment and remedies; companies feel it through national implementation.
