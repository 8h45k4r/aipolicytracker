  - slug: 2026-07-27-eu-digital-omnibus-on-ai-in-force-high-risk-dates-move
    jurisdiction: eu
    policy: eu-ai-act
    occurred_on: 2026-07-27
    title: EU Digital Omnibus on AI enters into force, moving high-risk AI Act duties to December 2027 and August 2028
    what_changed: >
      Regulation (EU) 2026/1744, published in the Official Journal on 24 July 2026, entered into force on 27 July
      2026. It amends Article 113 of the AI Act so that the Chapter III high-risk obligations apply from
      2 December 2027 for stand-alone Annex III systems and from 2 August 2028 for AI embedded in Annex I
      products, adds two Article 5 prohibitions applying from 2 December 2026, and leaves the 2 August 2026
      general application and Article 50 transparency dates in place. Recorded from concordant secondary
      reporting; confirm against the Official Journal text.
    practical_impact: Re-plan high-risk conformity work to the December 2027 and August 2028 dates; transparency duties under Article 50 still applied from 2 August 2026.
    impact_level: urgent
    status_after: partially_applicable
    published: true
    official_source_url: "https://eur-lex.europa.eu/eli/reg/2026/1744/oj"
    source_title: "Regulation (EU) 2026/1744 (Digital Omnibus on AI)"
    source_publisher: "Official Journal of the European Union"
    source_document_date: 2026-07-24
    source_tier: 1
    review_status: pending_review
    confidence_level: medium
    content_version: 1
  - slug: 2026-08-02-eu-ai-act-general-application-and-article-50-transparency-begin
    jurisdiction: eu
    policy: eu-ai-act
    occurred_on: 2026-08-02
    title: EU AI Act general application begins; Article 50 transparency duties now apply
    what_changed: >
      The general application date in Article 113 arrived. Chatbot disclosure, synthetic-content marking and
      deepfake labelling under Article 50 now apply; the high-risk obligations do not, having been deferred by
      Regulation (EU) 2026/1744. Recorded from secondary reporting; confirm against the Official Journal text.
    practical_impact: Label AI interactions and synthetic content now; high-risk conformity work runs to the deferred dates.
    impact_level: high
    status_after: partially_applicable
