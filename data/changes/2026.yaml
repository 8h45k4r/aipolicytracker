    jurisdiction: ca-ontario
    policy: ca-ontario-working-for-workers-four-act-ai-in-job-postings
    occurred_on: 2026-01-01
    title: Ontario job postings must disclose AI screening
    what_changed: >
      The Working for Workers Four Act provisions took effect requiring employers with 25 or more employees to state in public job postings whether AI is used to screen, assess or select applicants.
    practical_impact: Add an AI-use statement to every public job posting for Ontario roles.
    impact_level: routine
