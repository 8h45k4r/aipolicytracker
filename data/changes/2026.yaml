    aipt_id: AIPT-CHG-0147
    jurisdiction: us-california
    policy: null
    occurred_on: 2026-09-16
    title: California SB 1050 requires disclosure of AI synthetic performers in advertising
    what_changed: >
      SB 1050 makes it unlawful to create or publish an advertisement that prominently includes a synthetic
      performer (a human-like digital voice, figure or representation created at least partly with generative AI
      and not depicting an identifiable person) without a clear and conspicuous disclosure. It takes effect on
      1 January 2027. Recorded from secondary reporting; confirm against the chaptered text.
    practical_impact: Advertisers and agencies should add a clear disclosure to any California advertisement that features an AI-generated performer from 1 January 2027.
    impact_level: high
