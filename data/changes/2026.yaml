  - slug: 2026-08-06-us-house-ai-tax-and-work-protection-act-introduced
    aipt_id: AIPT-CHG-0144
    jurisdiction: us
    policy: null
    occurred_on: 2026-08-06
    title: House members introduce the AI Tax and Work Protection Act (H.R. 10044), an excise tax on AI tokens
    what_changed: >
      H.R. 10044 would tax large AI companies on the value of the tokens their models process or on AI-service
      revenue, whichever is higher, with a rate that rises automatically as unemployment climbs, and would create a
      Work Protection Administration in the Department of Labor to fund jobs. Introduced by Representatives Sara
      Jacobs, Greg Casar and Valerie Foushee. Recorded from secondary reporting; confirm on Congress.gov.
    practical_impact: No obligations; a proposal to watch in the economic-transition tracker.
    impact_level: routine
