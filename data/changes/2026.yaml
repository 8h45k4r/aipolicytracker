  - slug: 2026-05-14-colorado-sb26-189-repeals-and-replaces-ai-act
    jurisdiction: us-colorado
    policy: us-colorado-automated-decision-making-technology-act
    occurred_on: 2026-05-14
    title: Colorado repeals and replaces its AI Act with SB 26-189, effective 1 January 2027
    what_changed: >
      The Governor signed SB 26-189, which repeals and re-enacts the Colorado AI Act (SB 24-205) before its delayed
      30 June 2026 effective date. The replacement law narrows the scope to automated decision-making technology
      that materially influences consequential decisions, drops the duty of care, impact assessments, the
      risk-management programme and Attorney General notification, and adds advance notice, adverse-decision
      disclosure, meaningful human review, three-year record keeping and developer documentation duties. Recorded
      from secondary reporting; confirm against the enrolled bill.
    practical_impact: Stop building to the SB 24-205 impact-assessment and risk-programme requirements; plan notice, adverse-decision disclosure, human review, record keeping and developer documentation for consequential decisions from 1 January 2027.
    impact_level: urgent
    status_after: adopted
    published: true
    official_source_url: "https://leg.colorado.gov/bills/sb26-189"
    source_title: "SB26-189 Automated Decision-Making Technology"
    source_publisher: "Colorado General Assembly"
    source_document_date: 2026-05-14
    source_tier: 1
    review_status: pending_review
    confidence_level: medium
    content_version: 1
