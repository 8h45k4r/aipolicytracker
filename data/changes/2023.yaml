  - slug: 2023-10-30-g7-hiroshima-code-of-conduct
    jurisdiction: international
    policy: g7-hiroshima-process-code-of-conduct-for-advanced-ai
    occurred_on: 2023-10-30
    title: G7 leaders publish the Hiroshima Process code of conduct for advanced AI developers
    what_changed: >
      G7 leaders agreed international guiding principles and a voluntary code of conduct with eleven actions for organisations developing advanced AI systems, including risk evaluation, incident monitoring, transparency reporting and content authentication.
    practical_impact: Frontier and foundation-model developers gained a common voluntary baseline that later fed into the OECD reporting framework and the EU GPAI code of practice.
    impact_level: routine
    status_after: voluntary_standard
    published: true
    official_source_url: "https://www.mofa.go.jp/files/100573473.pdf"
