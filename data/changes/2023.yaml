  - slug: 2023-07-05-nyc-local-law-144-enforcement
    jurisdiction: us-new-york
    policy: us-new-york-city-local-law-144-automated-employment-decision-tools
    occurred_on: 2023-07-05
    title: New York City begins enforcing Local Law 144 on automated employment decision tools
    what_changed: >
      The Department of Consumer and Worker Protection started enforcing bias-audit, published-summary and candidate-notice requirements for automated employment decision tools used for hiring or promotion in the city.
    practical_impact: Employers using screening tools for NYC roles need an annual independent bias audit and ten business days of notice to candidates.
    impact_level: high
    status_after: in_force
    published: true
    official_source_url: "https://www.nyc.gov/site/dca/about/automated-employment-decision-tools.page"
    source_title: "Automated Employment Decision Tools (AEDT)"
    source_publisher: "NYC Department of Consumer and Worker Protection"
    source_document_date: 2023-07-05
    source_tier: 1
    review_status: pending_review
    confidence_level: high
    content_version: 1
  - slug: 2023-09-22-quebec-law-25-automated-decisions
    jurisdiction: ca-quebec
    policy: ca-quebec-law-25-automated-decision-provisions
    occurred_on: 2023-09-22
    title: Quebec Law 25 automated-decision and biometric provisions take effect
    what_changed: >
      The second tranche of Law 25 came into force, requiring enterprises to inform individuals of decisions based exclusively on automated processing, explain factors on request, allow observations, declare biometric databases and run privacy impact assessments.
    practical_impact: Any organisation making fully automated decisions about Quebec residents must add notices, explanation and human-review channels.
    impact_level: high
    status_after: in_force
    published: true
    official_source_url: "https://www.publicationsduquebec.gouv.qc.ca/fileadmin/Fichiers_client/lois_et_reglements/LoisAnnuelles/en/2021/2021C25A.PDF"
    source_title: "S.Q. 2021, c. 25"
    source_publisher: "Publications Québec"
