  - slug: 2023-12-17-israel-ai-policy
    jurisdiction: israel
    policy: israel-ai-regulation-and-ethics-policy-2023
    occurred_on: 2023-12-17
    title: Israel adopts a sector-based, risk-based national AI regulation and ethics policy
    what_changed: >
      The Ministry of Innovation, Science and Technology and the Ministry of Justice published Israel's AI policy, preferring sector regulation and soft tools over a horizontal law, with common ethical principles and a coordination centre.
    practical_impact: Organisations in Israel should expect sector regulators, not a single AI law, to set requirements.
    impact_level: routine
    status_after: adopted
    published: true
    official_source_url: "https://www.gov.il/en/pages/ai_2023"
    source_title: "Israel's Policy on Artificial Intelligence Regulation and Ethics"
    source_publisher: "Ministry of Innovation, Science and Technology"
