    jurisdiction: international
    policy: bletchley-declaration-ai-safety-summit-2023
    occurred_on: 2023-11-01
    title: 28 countries and the EU sign the Bletchley Declaration on AI safety
    what_changed: >
      At the first AI Safety Summit, signatories including the US, China and the EU agreed to cooperate on identifying and managing frontier-AI safety risks, launching the summit series and the network of AI safety institutes.
