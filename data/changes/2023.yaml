  - slug: 2023-12-18-iso-iec-42001-published
    jurisdiction: international
    policy: iso-iec-42001-2023-ai-management-system
    occurred_on: 2023-12-18
    title: ISO/IEC 42001, the first AI management-system standard, is published
    what_changed: >
      ISO and IEC published ISO/IEC 42001:2023, a certifiable management-system standard for organisations developing, providing or using AI, with lifecycle controls in Annex A.
    practical_impact: Organisations can certify AI governance; procurement and regulators increasingly reference it as evidence.
    impact_level: routine
    status_after: voluntary_standard
    published: true
