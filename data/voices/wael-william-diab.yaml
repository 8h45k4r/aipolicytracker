summary: >-
  Chairs ISO/IEC JTC 1/SC 42, the joint ISO and IEC subcommittee that develops international
  standards on artificial intelligence, including the AI management system standard ISO/IEC 42001.
  JTC 1 Resolution 12, adopted at its 32nd plenary in Vladivostok, set up SC 42 and named him (United
  States, nominated through ANSI) as chair. The ISO committee page and the IEC dashboard list his
  current term as running to the end of 2027, and the SC 42 Business Plan 2025 names him as chair.
