summary: >-
  IMDA appointed Nanyang Technological University to set up the Digital Trust Centre, led by him,
  and on 22 May 2024 designated the centre as Singapore's AI Safety Institute, with work on testing and evaluation,
  safe model design, content assurance, and governance and policy. His NTU profile lists him as the centre's
  Executive Director. In a February 2026 IMDA article he argued that AI safety can no longer be defined in purely
  technical terms and that different risk types need their own testing methods.
