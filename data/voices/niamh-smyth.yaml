summary: >-
  Ireland's Minister of State responsible for AI and digital transformation at the Department of Enterprise, Tourism
  and Employment. Department releases show her announcing progress on AI Act implementation with Minister Peter
  Burke, launching in July 2026 a consultation for a sectoral strategy on enterprise adoption of AI, naming
  Ireland's first AI Sectoral Champions in October 2026, and publishing a study on AI adoption in manufacturing,
  construction and tourism the same month.
