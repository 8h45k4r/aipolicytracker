summary: >-
  The Parliament of Sri Lanka lists him as Deputy Minister of Digital Economy from 21 November 2024 to date. Ministry
  and government pages report him speaking at the public consultation on Sri Lanka's national AI strategy, tying AI
  to each pillar of the digital economy, announcing Sri Lanka AI Week 2026 and naming a planned National AI Institute
  as a ministry priority, and arguing at a forum alongside the 2026 World Artificial Intelligence Conference in
  Shanghai that developing countries need a voice in global AI rule-making.
