summary: >-
  Heads UNESCO's Sciences Sector, which the Director-General formed under the UNESCO80 reform by
  merging the former Natural Sciences and Social and Human Sciences Sectors. UNESCO's sector page
  lists among its divisions one for Ethics, Research and Technology, the area that carries UNESCO's
  work on the ethics of AI, and the Sciences pages feature an AI ethics and governance observatory.
  She was appointed by Director-General Khaled El-Enany. A UNESCO announcement on 50 emerging leaders
  chosen for a dialogue programme on the age of AI carries her name.
