summary: >-
  As MeitY Secretary he spoke at the launch of the India AI Governance Guidelines, which set out seven principles and
  recommendations across six pillars and name MeitY as the nodal ministry; he said the approach relies on existing
  legislation wherever possible. He wrote the foreword to MeitY's draft Data Empowerment and Protection Architecture
  for AI training, which proposes a techno-legal approach, and at a June 2026 MeitY industry consultation urged
  investment in reskilling as AI changes IT services.
