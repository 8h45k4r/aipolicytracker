summary: >-
  The CAC's leadership page lists him as a deputy head of the Central Propaganda Department, Director of the Office
  of the Central Cyberspace Affairs Commission and Director of the Cyberspace Administration of China. The CAC is the
  lead regulator for generative AI services and, with other ministries, for labelling AI-generated content. CAC
  notices show him signing regulations as director in May 2026 and speaking, as chair of the World Internet
  Conference, at its Wuzhen Summit in November 2026.
