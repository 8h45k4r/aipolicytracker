summary: >-
  Heads Israel's National AI Directorate in the Prime Minister's Office (official pages also spell
  the name Askal). Israeli government pages say he signed a joint statement on AI with the United
  States in January 2026 and an AI memorandum with Azerbaijan in February 2026, and that in August
  2026 he and the Prime Minister launched the National AI Program, which expands Government Decision
  4255. The directorate has also run a public call to identify national challenges where AI could
  help.
