summary: >-
  Member of the European Commission whose portfolio, as the Commission's profile describes it, includes digital and
  frontier technologies, AI innovation and the Digital Decade targets, alongside security and democracy. Commission
  pages show her representing the EU at the AI Impact Summit in New Delhi in February 2026, appearing at the AI
  Office's sessions there, and presenting an Action Plan on Cybersecurity and AI in July 2026. The Commission's AI Act
  page lists a November 2026 update from her to the Council and Parliament on implementing and enforcing the digital
  rulebook.
