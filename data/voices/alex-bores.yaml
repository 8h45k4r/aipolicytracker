summary: >-
  New York Assembly member for District 73 in Manhattan. The Legislature's records list him as sponsor of the
  Assembly version of the RAISE Act (A6453), carried in the Senate by Andrew Gounardes, which requires the largest AI
  developers to publish safety plans and report serious safety incidents. His Assembly pages from 2026 include a floor
  explanation of his frontier AI framework bill in March 2026 and a joint statement with Senator Gounardes in
  September 2026 on a proposed federal ban on state AI rules.
