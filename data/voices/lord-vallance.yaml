summary: >-
  GOV.UK announced on 24 July 2026 his appointment as chair of the new Prime Minister's AI Taskforce, which reports
  directly to the Prime Minister and works on using AI to transform public services and support growth. The Taskforce
  is based in the Office for the Prime Minister and the Cabinet and is led at ministerial level by the AI Minister.
  The announcement notes he was Government Chief Scientific Adviser from 2018 to 2023.
