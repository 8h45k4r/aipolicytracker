summary: >-
  GOV.UK announced on 23 September 2026 her appointment as Vice-Chair of the UK AI Security Institute and Security
  Advisor to the Prime Minister's AI Taskforce, stepping back at the end of September from her full-time roles as the
  Prime Minister's Adviser on AI and Chief Technology Officer of the Institute. Government progress reports record
  that she joined the Frontier AI Taskforce, the Institute's predecessor, to work on AI governance and safety, and was
  later named its Chief Technology Officer.
