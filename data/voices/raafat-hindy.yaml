summary: >-
  Egypt's minister for communications and IT, whose ministry publishes the National AI Strategy
  2025-2030. Egypt's March 2026 national AI governance framework names him as chairman of the National
  Council for Artificial Intelligence, Quantum Computing and Emerging Technologies, which the
  framework calls the supreme strategic body for AI governance in Egypt; the ministry says the council
  took that name and wider mandate in January 2026. State Information Service reports say he attended
  the India AI Impact Summit 2026, and that in July 2026 Egypt signed a letter of intent with UNDP on
  responsible AI governance, including plans for an AI regulatory sandbox.
