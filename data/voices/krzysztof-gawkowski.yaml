summary: >-
  Poland's Deputy Prime Minister and Minister of Digital Affairs. His ministry prepared the act on AI systems that
  applies the EU AI Act in Polish law: the Council of Ministers adopted the draft on 31 March 2026, the act is dated
  3 July 2026 and was published as Dz.U. 2026 poz. 1003. The act gives the digital affairs minister duties to issue
  best-practice recommendations for AI systems and to report yearly on the computing and energy resources AI needs,
  and sets the legal basis for AI regulatory sandboxes.
