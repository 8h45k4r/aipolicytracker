summary: >-
  Komdigi is the ministry preparing Indonesia's draft presidential regulation on a national AI roadmap. In 2026
  ministry releases report her setting out a Meaningful AI framework that judges AI by its effects, saying the
  government is drafting risk-based AI governance to be applied through sectoral rules, and naming data protection,
  transparency, non-discrimination and human control among the principles of the policy being prepared. She also
  called for AI and data-centre development to be coordinated with energy planning.
