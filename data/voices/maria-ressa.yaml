since: "2026-03-03"
summary: >-
  Co-chairs the UN Independent International Scientific Panel on AI, created under General Assembly
  resolution 79/325 to give member states independent scientific assessments of AI. The resolution
  asks the panel to elect one co-chair from a developed and one from a developing country; the UN FAQ
  says the members, appointed by the General Assembly in February 2026, elected her (Philippines) and
  Yoshua Bengio (Canada) at the inaugural meeting on 3 March 2026. The co-chairs presented the panel's
  preliminary report at a UN press conference on 1 July 2026, ahead of the Global Dialogue on AI
  Governance in Geneva.
