summary: >-
  The ministry's site records him as Minister of Science and Technology from April 2026; he was earlier its
  standing deputy minister and once headed an AI laboratory at the VNU-HCM University of Science. The ministry
  prepared Vietnam's Law on Artificial Intelligence, presented to the National Assembly by his predecessor and in
  force since 1 March 2026. Ministry reports show him
  saying at Vietnam International Digital Week in October 2026 that AI must be judged by better public services and
  productivity, and answering National Assembly questions on AI management and standards on 12 November 2026.
