summary: >-
  Ghana's minister for communication, digital technology and innovations. He launched the Ghana
  National Artificial Intelligence Strategy on 24 April 2026, describing it as resting on eight
  pillars, with delivery through the National Information Technology Agency, the Data Protection
  Commission and the Cyber Security Authority. Ministry releases say that in June 2026 he reported
  Cabinet approval of USD 250 million for national compute infrastructure and AI applications, and
  that in October 2026 he said the strategy was being implemented in finance, health, agriculture,
  education and transport, guided by privacy, transparency and accountability.
