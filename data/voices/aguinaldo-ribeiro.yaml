summary: >-
  Federal deputy for Paraíba. The Chamber of Deputies designated him on 20 May 2025 as rapporteur of PL 2338/2023, the
  AI bill passed by the Senate in December 2024, in the special committee set up to report on it, which is chaired by
  Deputy Luisa Canziani. The committee's membership page lists him as rapporteur, and he said the committee would
  start from the Senate's text. The Chamber's record shows no report adopted yet; since March 2026 dozens of other AI
  bills, including the Executive's bill on a national AI system, have been attached to PL 2338/2023.
