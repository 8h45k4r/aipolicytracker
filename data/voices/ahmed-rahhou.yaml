summary: >-
  Heads Morocco's ministry of artificial intelligence, digital transformation and administration
  reform, created in the government appointed by King Mohammed VI on 16 October 2026; the portfolio
  takes over from the ministry delegate for digital transition, which ran the Maroc Digital 2030 strategy and
  its AI roadmap. He took over from Amal El Fallah Seghrouchni at a handover ceremony, with Aicha
  Guellaa as minister delegate for administration reform. The ministry reports that on 3 November
  2026 he met the head of the CGEM business federation on cooperation on AI and digital
  transformation. He previously chaired Morocco's Competition Council.
