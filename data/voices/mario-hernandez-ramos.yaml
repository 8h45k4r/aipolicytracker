summary: >-
  Chairs CDNET, the Council of Europe intergovernmental committee that succeeded the Committee on Artificial
  Intelligence (CAI) and acts as custodian of the Framework Convention on Artificial Intelligence and Human Rights,
  Democracy and the Rule of Law. Council of Europe records state he was elected Chair of the CAI on 18 September 2024
  and chosen as CDNET Chair at its first plenary in April 2026. CDNET's second plenary, in October 2026, adopted two
  components of the HUDERIA risk and impact assessment methodology. He is a professor of constitutional law at the
  Complutense University of Madrid.
