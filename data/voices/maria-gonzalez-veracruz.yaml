summary: >-
  Spain's Secretary of State for Digitalisation and Artificial Intelligence, the body of the Ministry for Digital
  Transformation that runs policy on the digital economy and AI, and president of the AI supervision agency AESIA.
  Ministry releases show that in June 2026 she closed Spain's first AI regulatory sandbox, awarding diplomas to the
  11 participating systems, and that in September 2026 she announced EUR 40 million through Red.es to support AI
  models for startups and SMEs. AESIA's director general was appointed on her proposal in December 2025.
