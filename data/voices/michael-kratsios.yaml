summary: >-
  OSTP advises the President on science and technology and coordinates federal AI policy. A White House release of
  March 2025 reports his Senate confirmation, by 74 votes to 25, as the 13th OSTP Director. His office ran the public
  request for information that drew more than 10,000 comments for the AI Action Plan, and a White House release of
  December 2025 records the third meeting of the White House AI Education Task Force. A letter from two senators of
  13 October 2026 on AI and cybersecurity names OSTP among the offices placed to coordinate a federal response.
