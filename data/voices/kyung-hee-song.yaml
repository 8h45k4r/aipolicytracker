summary: >-
  The PIPC's English pages state that she has chaired the commission since 7 October 2025. The commission supervises
  Korea's personal data law, including how personal data is used to build AI. A PIPC release of 20 August 2026
  reports that the National Assembly passed an amendment creating a special exception for using personal data in AI
  development, subject to public value, stronger safeguards and the commission's deliberation and approval; she is
  quoted describing it as widening data use alongside a matching oversight system.
