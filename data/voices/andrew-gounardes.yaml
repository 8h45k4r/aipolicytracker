summary: >-
  New York state senator for part of Brooklyn. He is the Senate sponsor of the RAISE Act (S6953B), carried in the
  Assembly by Alex Bores, which the Senate records as signed by the Governor; it requires the largest AI developers to
  publish safety plans and report serious safety incidents. In October 2026 his office announced a further bill
  (S10731) that would add independent state-licensed audits of large developers and binding minimum standards for
  safety frameworks; the Senate records it as in committee.
