summary: >-
  Illinois state senator in the 104th General Assembly. The General Assembly lists her as chief Senate sponsor of SB
  315, which creates the Artificial Intelligence Safety Measures Act (Public Act 104-0538), approved by the Governor
  on 6 July 2026 and effective 1 January 2027. The Act requires large frontier developers to publish and update a
  frontier AI framework, publish transparency reports, report safety incidents to state agencies within set deadlines
  and, where it applies, undergo annual independent audits, with civil penalties enforced by the state.
