summary: >-
  California state senator for San Francisco. The Legislature's bill record lists him as lead author of SB 53, the
  Transparency in Frontier Artificial Intelligence Act, which the Governor signed on 29 September 2025 (Chapter 138,
  Statutes of 2025). The law requires large frontier developers to publish safety frameworks and report critical
  safety incidents, protects whistleblowers and sets up the CalCompute public computing cluster. His office's releases
  in 2026 continue to address AI, including a statement on the Governor's AI executive order of September 2026.
