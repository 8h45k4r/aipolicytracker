summary: >-
  Sworn in as Minister for Industry and Innovation and Minister for Science on 13 May 2025, he has said his role
  includes coordinating AI policy across government, working with Assistant Minister Andrew Charlton. With him he
  launched the National AI Plan and announced the Australian AI Safety Institute, set up within the department to
  evaluate emerging AI capabilities and share information on risks. In a July 2026 interview he said the government
  was not moving towards a text and data mining exemption in copyright law.
