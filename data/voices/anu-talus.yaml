summary: >-
  Chairs the European Data Protection Board, which brings together the EU's national data protection authorities and
  the EDPS and issues guidance on how data protection law applies to AI. EDPB pages show that in January 2026 the EDPB
  and EDPS adopted a joint opinion on the Digital Omnibus on AI, raising concerns about postponing high-risk
  obligations, and that in July 2026 the Board adopted guidelines on anonymisation and on web scraping for generative
  AI. The EDPB chair agenda lists her at AI events in 2026.
