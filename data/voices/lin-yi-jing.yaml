summary: >-
  The Ministry of Digital Affairs describes the AI Basic Act as in force and as the cornerstone of Taiwan's AI
  innovation and security governance; under the Act the ministry promotes an AI risk classification and assessment
  framework to help sector regulators set risk-based rules. Ministry releases in 2026 report her presenting
  Taiwan's sovereign AI evaluation results, saying at COMPUTEX 2026 that the government is pursuing ten new AI
  infrastructure initiatives, and leading a delegation to Washington, D.C. in September 2026 on AI and digital
  resilience.
