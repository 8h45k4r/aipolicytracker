summary: >-
  Washington state representative from the Issaquah area. Legislative bill reports name her as prime sponsor of HB
  2225, requested by the Governor and enacted as ESHB 2225 (Chapter 168, Laws of 2026), effective 1 January 2027. The
  law requires AI companion chatbot operators to disclose that the chatbot is not human, adds protections for known
  minors and requires protocols for detecting and responding to self-harm and suicidal ideation; violations are
  treated under the Consumer Protection Act.
