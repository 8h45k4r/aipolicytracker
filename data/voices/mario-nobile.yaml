summary: >-
  Heads AgID, which Law 132/2025 designates, together with the national cybersecurity agency ACN, as Italy's national
  AI authority; AgID's documents describe its tasks as promoting AI innovation and handling notification,
  accreditation and monitoring of conformity-assessment bodies. AgID's transparency portal gives his term as 23 March
  2023 to 23 March 2029, after a Presidency decree of 13 January 2026 renewed him. On 9 November 2026 he signed the
  determination adopting AgID's guidelines on AI in public administration.
