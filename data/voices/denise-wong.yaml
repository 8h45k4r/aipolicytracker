summary: >-
  IMDA and the PDPC announced her appointment as Commissioner of the Personal Data Protection Commission with effect
  from 1 April 2026. She continues concurrently as Assistant Chief Executive of IMDA's Data Innovation and
  Protection Group. The PDPC enforces Singapore's personal data law and has issued advisory guidelines on the use of
  personal data in AI recommendation and decision systems; it co-issued the Model AI Governance Framework with IMDA.
