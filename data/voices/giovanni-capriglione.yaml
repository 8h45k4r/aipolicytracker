summary: >-
  Texas state representative for District 98 (Southlake area) and, in the 89th Legislature, chair of the House
  Committee on Delivery of Government Efficiency. Texas Legislature Online lists him as lead author of HB 149, the
  Texas Responsible Artificial Intelligence Governance Act, effective 1 January 2026, which sets disclosure duties for
  government agencies and health care providers, bans uses such as social scoring by government, creates a regulatory
  sandbox and the Texas Artificial Intelligence Council, and gives enforcement to the Attorney General.
