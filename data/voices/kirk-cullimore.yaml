summary: >-
  Utah state senator. The Legislature lists him as sponsor of S.B. 149 (2024), Artificial Intelligence Amendments,
  signed on 13 March 2024, which created the Office of Artificial Intelligence Policy and its learning laboratory
  programme and requires disclosure of AI use in regulated occupations. In the 2026 General Session he was Senate
  sponsor of further AI bills, including H.B. 320 on the Office of Artificial Intelligence Policy and H.B. 276 on
  AI-generated intimate images and content provenance, both recorded as signed by the Governor.
