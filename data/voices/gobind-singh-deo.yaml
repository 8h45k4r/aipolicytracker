summary: >-
  The Ministry of Digital oversees Malaysia's National AI Office, now set up as AI Malaysia Berhad, which drives the
  National AI Action Plan 2026-2030. Ministry releases in 2026 report him issuing the MY-AI Standards, starting public
  engagement on a proposed AI Governance Bill (which he told Parliament would not directly regulate AI output),
  announcing the inaugural board of AI Malaysia Berhad in September 2026, and announcing that the secretariat of the
  ASEAN AI Safety Network will be based in Kuala Lumpur.
