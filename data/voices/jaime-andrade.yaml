summary: >-
  Illinois state representative in the 104th General Assembly, listed by the General Assembly as chair of the House
  Artificial Intelligence Subcommittee. He was the chief House sponsor of HB 3773 (Public Act 103-0804, approved
  9 August 2024 and effective 1 January 2026), which amends the Illinois Human Rights Act so that an employer's use of
  AI that has a discriminatory effect, using zip codes as a proxy for protected classes, or failing to tell employees
  that AI is used, is a civil rights violation. In 2026 his caucus office reported his bills on AI data centre
  oversight and algorithmic pricing.
