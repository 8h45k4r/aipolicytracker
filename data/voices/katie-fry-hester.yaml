summary: >-
  Maryland state senator for District 9 (Howard and Montgomery counties). She was primary sponsor of SB 818, the
  Artificial Intelligence Governance Act of 2024 (Chapter 496, effective 1 July 2024), which put the Governor's AI
  Subcabinet into law and requires impact assessments of high-risk AI before state agencies buy or build it. In the
  2026 session she sponsored further AI bills, including on AI deepfakes and identity fraud, a Maryland AI Partnership
  in the University System and AI guidance for schools, which the General Assembly records as approved by the
  Governor.
