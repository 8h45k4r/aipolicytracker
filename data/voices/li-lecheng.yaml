summary: >-
  MIIT is one of the ministries that issued China's measures for labelling AI-generated content. MIIT pages report him saying in March 2026 that the ministry would push the integration of AI
  and manufacturing under an AI Plus manufacturing action, while weighing safety and development. In July 2026 he
  led China's delegation to the first UN Global Dialogue on AI Governance in Geneva and, as chair of the 2026 APEC Digital and AI
  Ministerial Meeting in Chengdu, appeared at its press conference; the meeting adopted the Chengdu Statement.
