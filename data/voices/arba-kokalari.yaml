summary: >-
  Member of the European Parliament (EPP, Sweden) on the Internal Market and Consumer Protection committee. Parliament
  records name her as co-rapporteur, with Michael McNamara, on the Digital Omnibus on AI (2025/0359(COD)), the
  Commission proposal for targeted amendments to the AI Act. The joint IMCO-LIBE report was adopted in committee on
  18 March 2026, and in April 2026 Parliament announced a provisional agreement with the Council setting fixed later
  application dates for high-risk rules and adding a ban on AI "nudifier" systems.
