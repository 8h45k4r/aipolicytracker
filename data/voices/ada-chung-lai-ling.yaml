summary: >-
  The PCPD regulates the handling of personal data under Hong Kong's Personal Data (Privacy) Ordinance and has issued
  a Model Personal Data Protection Framework for AI. PCPD releases in 2026 report the office warning in March about
  the privacy and security risks of OpenClaw and other agentic AI, joining 60 privacy authorities in a February joint
  statement on AI-generated imagery, completing compliance checks on 60 organisations' use of AI, and in August
  publishing guidance with nine recommendations on protecting personal data when using agentic AI.
