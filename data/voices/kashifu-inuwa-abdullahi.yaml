summary: >-
  Heads NITDA, Nigeria's federal IT development agency; its National Centre for Artificial
  Intelligence and Robotics published the National Artificial Intelligence Strategy. NITDA releases
  from 2026 report that he described the strategy as the framework for deploying AI in critical
  sectors together with sector regulators such as the Central Bank of Nigeria (July), welcomed a
  national diploma curriculum in AI from the National Board for Technical Education (August), and at
  GITEX Nigeria in September discussed the Cloud First policy and keeping classes of sensitive data,
  including citizens' personal data, within the country.
