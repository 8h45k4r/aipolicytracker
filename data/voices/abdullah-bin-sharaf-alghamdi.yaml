summary: >-
  Heads SDAIA, the Saudi authority for data and AI that issued the National Strategy for Data and AI
  and the national AI Ethics Principles. Saudi Press Agency reports for 2026 say he led the Saudi
  delegation to the India AI Impact Summit in February, where he set out human capacity, an
  integrated national AI ecosystem and governance as the pillars of national AI work and announced
  that Saudi Arabia had joined the Global Partnership on AI; and that in Geneva in July, during the
  Global Dialogue on AI Governance, he met the UNESCO Director-General and promoted the Riyadh-based
  International Center for AI Research and Ethics.
