summary: >-
  California state senator for the Menlo Park area. He authored SB 942, the California AI Transparency Act (Chapter
  291, Statutes of 2024), which requires large generative AI providers to put visible and hidden disclosures in
  AI-generated images, video and audio and to offer a free detection tool. His office reported in August 2026 that the
  law's first phase took effect on 1 August 2026, and that he authored a follow-up bill, SB 1000, on implementation and
  alignment with international standards.
