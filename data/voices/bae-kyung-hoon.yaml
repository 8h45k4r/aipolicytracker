summary: >-
  MSIT's list of ministers gives his term as Deputy Prime Minister and Minister of Science and ICT from 16 July 2025
  to the present, and the ministry's site reports his attendance at the ITU Plenipotentiary Conference on 10 November
  2026. MSIT is the competent ministry for Korea's AI Basic Act. Ministry releases say he led Korea's delegation to
  the India AI Impact Summit in February 2026 and chairs the K-Moonshot Task Force for the national science
  programme.
