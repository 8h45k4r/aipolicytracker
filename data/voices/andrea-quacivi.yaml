summary: >-
  Heads ACN, Italy's national cybersecurity agency, which under Law 132/2025 is one of the two national AI
  authorities and acts as market surveillance authority and point of contact for AI. ACN announced that he took up the
  post on 8 June 2026, following his appointment by the Council of Ministers on 22 May 2026, succeeding Bruno
  Frattasi, who resigned on 21 May 2026.
