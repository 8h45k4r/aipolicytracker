since: "2025-11-01"
summary: >-
  The Ministry of Digital Development and Information announced that he would leave his post as chief executive of
  the National Library Board and become chief executive of IMDA from 1 November 2025, succeeding Lew Chuen Hong. A
  June 2026 ministry speech names him as IMDA's chief executive. IMDA is the authority that publishes Singapore's
  Model AI Governance Framework, its framework for agentic AI and its starter kits for testing AI applications.
