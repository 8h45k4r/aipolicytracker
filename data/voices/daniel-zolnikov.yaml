summary: >-
  Montana state senator from Billings. He sponsored SB 212 (2025), the Right to Compute Act (Chapter 150, Laws of
  2025), which recognises a right to own and use computational resources and limits government restrictions on
  them, and requires critical infrastructure facilities controlled by an AI system to have a risk management
  policy.
  Legislative records for the 2025-2026 interim list him as chair of the Energy and Technology Interim Committee,
  including on its January 2026 agenda.
