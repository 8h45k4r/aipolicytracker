topics: [strategy, policy, governance]
current: true
since: null
summary: >-
  UAE Minister of State for AI, a post the UAE government says he took in 2017 as the first minister
  for this field; the remit was widened in 2020 to the digital economy and remote work applications.
  His office issued the UAE National Strategy for Artificial Intelligence 2031. The UAE Cabinet has
  announced a new Artificial Intelligence and Data Authority, merging three existing bodies, with him
  as chairman. Dubai Media Office reports from October 2026 show him at the Advanced Technology
  Research Council and at the Dubai AI Campus, and he leads the AI technologies and data track of the
  federal programme for agentic AI in government.
