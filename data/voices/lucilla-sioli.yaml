summary: >-
  Heads the European AI Office, the Commission service within DG CONNECT that coordinates the EU's AI strategy and the
  implementation of the AI Act, including supervision of general-purpose AI models. Commission pages describe her
  remit as covering AI Act implementation and international cooperation on trustworthy AI. She moderated the AI
  Office's sessions at the India AI Impact Summit in February 2026 and has spoken on the Apply AI Strategy, urging
  Member States to align their national AI strategies with it.
