summary: >-
  Colorado state senator and Senate Majority Leader. The General Assembly lists him as a prime sponsor of SB 26-189,
  Automated Decision-Making Technology, which repeals and re-enacts the AI rules adopted in SB 24-205 and was signed by
  the Governor on 14 May 2026. Its automated decision-making provisions apply from 1 January 2027, with rules due from
  the Attorney General by that date.
