summary: >-
  As DICT Secretary he leads the department's AI agenda. DICT releases in 2026 report him setting five priorities at
  the State of the Nation in AI event (trust and governance, digital foundations, citizen-facing AI, local talent and
  regional leadership), the department blocking and then, after corrective actions, restoring access to the Grok
  chatbot in January 2026 over non-consensual deepfakes, endorsement of the Philippines AI+ Infrastructure
  Masterplan, and the launch of the eGovAI assistant in the eGovPH app in September 2026.
