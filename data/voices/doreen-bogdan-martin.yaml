summary: >-
  Leads the ITU, the UN agency for digital technologies, which organises the AI for Good Global
  Summit with more than 50 UN partners. ITU's media advisory names her as host of the 2026 summit in
  Geneva (7 to 10 July), held alongside the first UN Global Dialogue on AI Governance; the programme
  lists her closing keynote "AI for Good beyond 2026". ITU says she is Vice-Chair of the AI for Good
  Global Commission launched in July 2026. She is listed as a candidate for Secretary-General at the
  2026 Plenipotentiary Conference in Doha, where elections began on 12 November 2026.
