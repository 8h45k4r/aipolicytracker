summary: >-
  An ICT Division page states that he was appointed minister for post and telecommunication, the ICT Division and
  the Ministry of Science and Technology on 17 February 2026. The ICT Division has published the draft National
  Artificial Intelligence Policy 2026-2030 for public review. Government pages report him saying in May 2026 that
  public-private partnerships would be used to expand 5G, AI, IoT and cloud services, and speaking at a
  cybersecurity and data protection seminar on 10 November 2026.
