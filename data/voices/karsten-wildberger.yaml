summary: >-
  Germany's Federal Minister for Digital Transformation and Government Modernisation since 6 May 2025, whose ministry
  led the federal law implementing the EU AI Act (KI-Marktüberwachungs- und Innovationsförderungsgesetz). The
  ministry describes the design as relying on existing authorities rather than a new one, pooling expertise at the
  Federal Network Agency, with an AI service desk for SMEs and start-ups and a regulatory sandbox. In a Bundestag
  speech on 20 March 2026 he argued for innovation-friendly regulation and for extending the EU deadlines for
  high-risk AI.
