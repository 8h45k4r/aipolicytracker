summary: >-
  Co-chairs the UN Independent International Scientific Panel on AI, set up under General Assembly
  resolution 79/325, which asks the 40-member panel to elect two co-chairs, one from a developed and
  one from a developing country. The General Assembly appointed the members in February 2026, and the
  UN FAQ says the members elected him (Canada) and Maria Ressa (Philippines) as co-chairs at the
  inaugural meeting on 3 March 2026. With his co-chair he presented the panel's preliminary report on
  AI opportunities, risks and impacts at a UN press conference on 1 July 2026, ahead of the Global
  Dialogue on AI Governance in Geneva.
