summary: >-
  Member of the European Parliament (Renew Europe, Ireland) sitting on the Civil Liberties committee. Parliament
  records name him as co-rapporteur, with Arba Kokalari, on the Digital Omnibus on AI (2025/0359(COD)), the targeted
  amendment of the AI Act; the joint IMCO-LIBE report was adopted in committee on 18 March 2026, and in April 2026
  Parliament announced a provisional deal that postponed some high-risk obligations and banned AI "nudifier" systems.
  He also co-chairs the Parliament's working group monitoring AI Act implementation and enforcement.
