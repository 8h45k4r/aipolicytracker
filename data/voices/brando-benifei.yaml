summary: >-
  Member of the European Parliament (S&D, Italy) who was appointed rapporteur for the AI Act in June 2021 and was one
  of the Parliament's two co-rapporteurs on the regulation. Parliament pages name him as co-chair, with Michael
  McNamara, of the joint IMCO-LIBE working group set up to monitor how the AI Act is implemented and enforced; the
  group first met in October 2024. IMCO agendas show him reporting back to the committee on the group's work,
  including in January and March 2026.
