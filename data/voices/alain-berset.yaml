summary: >-
  Secretary General of the Council of Europe for a five-year term that began on 18 September 2024, elected by the
  Parliamentary Assembly. The Council of Europe is the depositary organisation for the Framework Convention on
  Artificial Intelligence, the first legally binding international treaty on AI. Council of Europe pages show him
  promoting signature of the Convention, including North Macedonia's signature on 8 May 2026 during his visit to
  Skopje, which brought the number of signatories to 20, and describing the treaty as binding but flexible and
  covering the whole AI lifecycle.
