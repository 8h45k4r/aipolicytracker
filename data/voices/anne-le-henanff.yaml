summary: >-
  French minister for artificial intelligence and digital affairs, attached to the Minister of the Economy. The
  government's official composition page lists her in the post since October 2025 and in the government formed by
  the decree of 26 February 2026. In September 2026 she co-signed a "Pacte Numérique et IA" with the digital sector,
  a dialogue to be steered by the interministerial digital directorate (DINUM), which the release says is to become
  the State's reference authority for AI and digital.
