name: Amandeep Singh Gill
role: Under-Secretary-General and Special Envoy for Digital and Emerging Technologies
organisation: United Nations Office for Digital and Emerging Technologies (ODET)
jurisdiction: international
category: international
topics: [governance, policy]
current: true
since: "2025-01-01"
summary: >-
  Heads the UN Office for Digital and Emerging Technologies, which the General Assembly created as
  the UN system-wide focal point for digital and emerging technologies; it took over from the Office
  of the Secretary-General's Envoy on Technology on 1 January 2025. UN pages list the office's work
  as AI governance, follow-up of the Global Digital Compact, and digital public infrastructure and
  open source. He was the Secretary-General's Envoy on Technology from 2022 to 2024. In 2026 the
  office convened the second Digital Cooperation Day during the 81st General Assembly high-level week
  and supported the Global Dialogue on AI Governance.
