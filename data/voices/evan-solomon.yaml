summary: >-
  Canada's federal minister responsible for artificial intelligence and digital innovation, and Member of Parliament
  for Toronto Centre. Government of Canada releases in 2026 record him promoting the national AI strategy announced
  by the Prime Minister in June 2026, representing Canada on AI at the 2026 G7 Digital Ministers' Meeting,
  announcing federal funding for AI projects in Atlantic Canada and Quebec, and taking part in ALL IN 2026 in
  September 2026. Briefing material for his appearance before the Senate Committee of the Whole sets out his
  portfolio's priorities.
