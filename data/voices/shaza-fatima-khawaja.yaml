summary: >-
  The ministry's site lists her as Federal Minister for IT and Telecommunication; earlier ministry items called her
  Minister of State. MoITT prepared the National AI Policy 2025, approved by the Federal Cabinet, which she called a
  cornerstone of the Prime Minister's Digital Nation vision; its six pillars cover innovation, human capital, a
  secure AI ecosystem, sector transformation, infrastructure and international partnerships. Government releases
  in 2026 report her at the Indus AI Summit, saying the government was moving from AI policy to implementation.
