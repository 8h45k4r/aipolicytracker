summary: >-
  NIST develops measurement science and voluntary standards, including the AI Risk Management Framework, and houses
  the Center for AI Standards and Innovation (CAISI), which works with industry on testing and evaluating AI models.
  NIST reports that the Senate confirmed him on 18 May 2026 and that he was sworn in on 30 June 2026 as the 18th NIST
  Director, coming from Purdue University, where he was dean of engineering. NIST AI publications issued since then,
  including work done jointly with CAISI, name him as Director, and the agenda of NIST's advisory committee meeting of
  27-28 October 2026 lists his update.
