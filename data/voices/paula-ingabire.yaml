summary: >-
  Rwanda's minister of ICT and innovation; the ministry issued the National AI Policy, which covers AI
  literacy, infrastructure, data, public and private sector adoption and ethical use, and provides for
  a Responsible AI Office in the ministry to coordinate its implementation plan. Rwanda Information
  Society Authority reports that in September 2026 she led a Rwandan delegation to Dreamforce in San
  Francisco, hosting a roundtable on AI in Rwanda that launched the Rwanda Digital AI Catalogue.
