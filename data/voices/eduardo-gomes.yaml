summary: >-
  Senator for Tocantins, in office for the 2019-2027 term and re-elected in October 2026 for 2027-2035. He was the
  rapporteur of PL 2338/2023, Brazil's AI bill, in the Senate's temporary AI committee (CTIA), whose report was
  approved on 5 December 2024, and in plenary, which approved the bill as a substitute text on 10 December 2024 and
  sent it to the Chamber of Deputies. His report proposed making the national data protection authority (ANPD) the
  coordinator of the national AI regulation and governance system (SIA).
