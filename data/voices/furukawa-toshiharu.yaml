summary: >-
  At a September 2026 press conference on the reshuffled second Takaichi Cabinet, the Prime Minister said he would
  take the artificial intelligence strategy portfolio together with promoting AI and digital reform, because digital
  reform in government cannot be separated from AI. The Prime Minister's Office list of ministers names him Minister
  of State for Artificial Intelligence Strategy, alongside Minister for Digital Transformation and other posts. The
  Cabinet Office administers Japan's AI Promotion Act and the Artificial Intelligence Basic Plan.
