summary: >-
  Her Prime Minister's Office profile lists her as Minister for Digital Development and Information and
  Minister-in-charge of Cybersecurity and Smart Nation Group, leading government work on digital development, the
  Smart Nation strategy and cybersecurity. In 2026 ministry speeches she described Singapore's Model AI Governance
  Framework for Agentic AI, announced a programme to accredit third-party AI testers at the International
  Scientific Exchange for AI Safety, and called for human oversight of high-impact AI actions.
