summary: >-
  Heads AESIA, Spain's AI supervision agency attached to the Secretariat of State for Digitalisation and AI. AESIA
  announced in December 2025 that its Governing Board had approved his appointment, on the proposal of the Secretary
  of State, succeeding Ignasi Belda, the agency's first director. He previously led the Spain Digital 2030 and
  Internationalisation Office and advised the Secretary of State, including on setting up the agency. A September
  2026 AESIA release names him as director general at an event in London.
