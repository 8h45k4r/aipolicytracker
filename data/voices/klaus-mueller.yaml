summary: >-
  President of Germany's Federal Network Agency since 1 March 2022. Under Germany's AI Act implementation law
  (KI-MIG), in force from 29 July 2026, the agency became the market surveillance authority, single point of contact
  and complaints office for the AI Act, covering among other things AI in radio equipment and in sensitive areas such
  as personnel management, critical infrastructure and education, and hosts a central coordination centre. The law
  creates a three-member AI market surveillance chamber chaired by the agency's president. In July 2025 the agency
  launched an AI Service Desk to help organisations comply.
