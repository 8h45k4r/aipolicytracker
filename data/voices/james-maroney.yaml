summary: >-
  Connecticut state senator for the 14th District (Milford area) and co-chair of the legislature's General Law
  Committee. The General Assembly's bill record lists him among the sponsors of SB 5, An Act Concerning Online Safety
  (Public Act 26-15), signed in 2026. The Governor's office describes the Act as written jointly by the Governor, the
  Attorney General and Senator Maroney; it includes duties for AI chatbot operators, such as detecting signs of
  self-harm and responding with resources, provisions on AI in employment decisions, and workforce AI training.
