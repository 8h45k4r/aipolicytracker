summary: >-
  Kenya's Cabinet Secretary for information, communications and the digital economy; the ministry
  issued the Kenya Artificial Intelligence Strategy 2025-2030, built on pillars for AI digital
  infrastructure, data and AI governance, and AI research and innovation. At the Nairobi AI Forum 2026
  he said AI and digital technologies are a government priority under that strategy. The ministry
  site also hosts a July 2026 draft Kenya AI and other Emerging Technologies Policy. Ministry pages
  record him launching digital hubs in Nyandarua County in June 2026.
