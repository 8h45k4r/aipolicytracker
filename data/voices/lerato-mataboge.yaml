summary: >-
  Heads the African Union Commission department for infrastructure and energy, whose remit includes
  digital and AI policy. In a 2025 statement at the Global AI Summit on Africa she named digital
  infrastructure, the AI skills gap, a lack of quality datasets and funding as the main barriers to
  AI adoption. AU releases in 2026 report a Commission partnership with Google guided by the
  Continental AI Strategy, a September 2026 meeting of African ambassadors in Geneva convened by her
  department to coordinate positions on digital and AI governance, and her seat on the AI for Good
  Global Commission.
