summary: >-
  Nigeria's federal minister for communications, innovation and the digital economy; the ministry
  oversees NITDA, whose AI centre published the National Artificial Intelligence Strategy. Ministry
  releases from 2026 say he set out plans for a National AI Trust to guide the next phase of AI
  adoption and oversight (June), joined the ITU-convened AI for Good Global Commission as a founding
  member (July), and launched a National Digital Cloud Policy (August). In July 2026 the ministry
  directed that the current approach to regulating internet platforms stay in place while a
  harmonised framework is developed.
