summary: >-
  As vice minister at Komdigi he speaks often for the ministry on AI. Ministry releases in 2026 report him saying AI
  regulation cannot be drafted reactively, that Pancasila is the norm AI developers and companies must follow,
  stressing data quality and the risk of data poisoning, setting out four steps to close the national AI capability
  gap, and telling the film censorship board in October 2026 that final decisions still need human control.
