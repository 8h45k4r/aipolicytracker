summary: >-
  Chair of Poland's Commission for the Development and Security of Artificial Intelligence, the independent body that
  the Act of 3 July 2026 on AI systems makes the market surveillance authority for AI and that can order a system
  withdrawn where it directly threatens life, health, safety or fundamental rights. The Sejm chose her on 18 September
  2026 and the Senate consented on 24 September, for a five-year term. Official pages state she previously directed
  the Research and Innovation Department of the Ministry of Digital Affairs.
