summary: >-
  He works alongside Minister Tim Ayres in the industry and science portfolio and launched the National AI Plan with him. In his
  speeches he has described the Australian AI Safety Institute as a national testing capability, said the government
  will not create a central AI regulator and expects each regulator to treat AI as core business, and argued that
  frontier AI needs regulation for the most significant harms. Ministerial releases report an AI safety and security
  memorandum with the United Kingdom and plans to legislate Australian standards for AI.
