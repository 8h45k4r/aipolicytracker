summary: >-
  UK minister for AI, appointed on 20 July 2026 jointly in the Cabinet Office and the Department for Business,
  Innovation, Science and Trade. GOV.UK lists his remit as including AI policy, AI Growth Zones, sovereign AI and
  economy-wide adoption, and, in the Cabinet Office, the AI Strategy, the Prime Minister's AI Taskforce and the AI
  Security Institute. He leads the AI Taskforce and attends Cabinet. From September 2025 to July 2026 he was
  Parliamentary Under-Secretary of State for AI and Online Safety at the former Department for Science, Innovation and
  Technology.
