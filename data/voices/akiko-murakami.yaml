summary: >-
  METI announced on 14 February 2024 the launch of the AI Safety Institute within the Information-technology
  Promotion Agency, with her as director, to examine evaluation methods for AI safety. The institute's profile lists
  her as its executive director, a part-time post, and its steering committee is chaired by the director. The
  institute's 2025 national status report records a memorandum of cooperation with Anthropic signed on 29 October
  2025, and an institute notice shows her opening its working-group report session for the first half of fiscal 2026.
