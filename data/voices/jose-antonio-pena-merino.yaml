summary: >-
  Head of Mexico's federal Agency for Digital Transformation and Telecommunications, which is responsible for digital
  government, information technology and telecommunications policy in the federal administration. The National AI
  Plan (April 2026), published by the agency, gives it a central role in setting technical standards and guidelines
  for AI and coordinating other authorities. Federal government releases record him presenting the public AI training
  centre (Centro Público de Formación en Inteligencia Artificial) alongside the President.
