topics: [regulation, governance, responsible_ai]
current: true
since: "2026-08-01"
summary: >-
  Chair of the Dutch Data Protection Authority for a five-year term from 1 August 2026, succeeding Aleid Wolfsen, on
  the government's appointment announced in May 2026. The AP has coordinated algorithm and AI oversight in the
  Netherlands since 2023, names AI among its 2026-2028 priorities, publishes a yearly coordination work agenda on AI
  and algorithms, and set up a directorate for AI and algorithm supervision and coordination in October 2026. Under
  the Dutch plan for the AI Act it is to supervise prohibited practices and many high-risk applications.
