summary: >-
  South Africa's minister of communications and digital technologies. In April 2026 he published the
  draft National Artificial Intelligence Policy for public comment, then withdrew it after fictitious
  sources were found in its reference list; a notice he signed on 4 June 2026 formally withdrew the
  draft, and Cabinet approved the withdrawal. In his 2026/27 budget vote speech he announced an
  independent expert review panel chaired by Professor Benjamin Rosman and said the department would
  enforce an internal policy on responsible AI use and review how it drafts policy. Government
  briefings say a revised policy is in preparation.
