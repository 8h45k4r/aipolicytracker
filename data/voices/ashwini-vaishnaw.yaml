summary: >-
  His IndiaAI profile states that he has held the Electronics and IT portfolio since 8 July 2021, together with other
  portfolios. MeitY is the ministry behind the IndiaAI Mission and the India AI Governance Guidelines. Government
  releases report him calling for consensus on social media accountability and AI governance, stressing a
  techno-legal approach to AI regulation at Davos in January 2026, and launching the World Bank's World Development
  Report 2026 on AI in New Delhi in October 2026.
