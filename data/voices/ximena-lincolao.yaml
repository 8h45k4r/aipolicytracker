summary: >-
  Chile's Minister of Science, Technology, Knowledge and Innovation, the ministry that leads national AI policy. Senate
  records show she presented the Executive's proposal for a framework AI law, built on six pillars, to the Senate's
  Committee on Future Challenges, Science, Technology and Innovation, which is studying the AI bill (Boletín
  15869-19, merged with 16821-19) in its second constitutional stage. She told the committee the government wants a national AI action plan and that models from Japan,
  Singapore and Korea should be considered alongside the European rules.
