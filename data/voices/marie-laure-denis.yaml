summary: >-
  Presides over the CNIL, France's data protection authority, which issues guidance on how data protection law
  applies to AI systems. CNIL publications for 2026 state that she has been president since February 2019. Under her
  presidency the CNIL published a 2025-2028 strategic plan naming artificial intelligence among its priorities, and
  she opened the CNIL's Rencontres Informatique & Libertés on 29 September 2026.
