summary: >-
  First Chief Executive Officer of the AI Office of Ireland, the independent statutory body created by the Regulation
  of Artificial Intelligence Act 2026, signed into law on 21 July 2026, to act as Ireland's central coordinating
  authority for the EU AI Act. The government announced his appointment on 30 July 2026. He joined from the Medical
  Council of Ireland, where he was Executive Director of Education, Innovation and Artificial Intelligence. The
  Office's board held its first meeting on 8 September 2026.
