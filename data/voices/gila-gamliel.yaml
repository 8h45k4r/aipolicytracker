summary: >-
  Israel's minister of innovation, science and technology; the ministry co-issued, with the Ministry
  of Justice, Israel's policy on AI regulation and ethics. Ministry pages say that under her Israel
  signed the Council of Europe framework convention on AI, and that an April 2025 ministry report on
  AI as a national priority area was adopted as the basis of the ministry's AI work. A ministry notice
  from 2026 names her as minister at its Horizon Scanning Forum, and the ministry took part in the
  National AI Program launched in August 2026.
