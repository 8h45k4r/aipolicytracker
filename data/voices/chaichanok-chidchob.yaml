summary: >-
  A royal command published on 30 March 2026 names him Minister of Digital Economy and Society in the new cabinet;
  he held the same post in the cabinet appointed in September 2025. MDES co-prepared Thailand's national AI strategy
  and action plan. Government releases in 2026 report him defending the TH-AI Passport programme to give about five
  million people access to AI tools, and a national digital economy committee meeting proposing a sandbox for
  responsible AI use in government agencies, with MDES to lead the testing.
