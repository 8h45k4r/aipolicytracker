summary: >-
  California state senator for the San Diego area. He authored SB 243 on companion chatbots, chaptered on 13 October
  2025 (Chapter 677, Statutes of 2025): operators must tell users they are talking to an AI, keep a protocol for
  suicidal ideation and self-harm and report annually to the State, and injured people can sue. In 2026 his office
  reported his follow-up bill on chatbots and children, SB 1119, moved together with a paired Assembly bill; the
  Governor signed it on 10 September 2026. On 1 October 2026 his office issued a statement on the veto of a separate bill on AI
  therapy chatbots.
