summary: >-
  MSIT announced in November 2024 his appointment as the first director of the AI Safety Institute, launched after
  the AI Seoul Summit; at the time he set out a vision centred on AI risk evaluation, prevention policy and
  technology, and domestic and international cooperation. The institute's leadership page describes it as a
  collaborative, non-regulatory body that helps Korean AI companies reduce risk. He attended the opening of the
  government's AI Basic Act support desk, and the institute lists him opening its sixth AI safety policy research
  seminar on 23 October 2026.
