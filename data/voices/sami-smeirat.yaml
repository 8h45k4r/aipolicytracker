summary: >-
  Jordan's minister of digital economy and entrepreneurship; the ministry issued the Jordanian AI
  Strategy and Implementation Roadmap 2023-2027 and the Jordanian Charter of AI Ethics. Jordan News
  Agency reports from 2026 say he attended the launch of an AI for Government Leaders programme to
  train 15,000 civil servants by 2027 (June), reviewed an AI computing platform at the Aqaba Digital
  Hub meant to let government bodies build AI solutions in a secure environment (September), and met
  the UN ESCWA chief on AI cooperation (July). Spelled Smirat in some official reports.
