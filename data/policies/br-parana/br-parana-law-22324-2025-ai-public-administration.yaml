summary_plain: >-
  Requires AI used by the state executive to be ethical, transparent, explainable and auditable, with a regulatory sandbox
  and staff training; it also renamed the innovation department the Secretariat of Innovation and Artificial Intelligence.
  Decree 9854 of 7 May 2025 regulates the state AI council.
scope_summary: Bodies of the Paraná state executive that develop or use AI.
who_it_applies_to: Paraná state government bodies.
key_dates_summary: Published in the state Official Gazette (No. 11876) on 2 April 2025; Decree 9854 of 7 May 2025.
