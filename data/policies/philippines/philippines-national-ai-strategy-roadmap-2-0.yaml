issuing_body: Department of Trade and Industry (DTI)
summary_plain: >-
  An updated national AI roadmap launched by DTI together with the Center for AI Research, building on the 2021
  roadmap and adding generative AI. It aims to strengthen entrepreneurship and competitiveness, improve public services,
  support responsible governance of AI and identify investment and R&D priorities. CAIR is intended to serve as
  a national AI research hub for industry-relevant solutions.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Department of Trade and Industry (DTI). Oversight:
  DTI with the Center for AI Research (CAIR). Stated purpose: Accelerate AI adoption and R&D to boost competitiveness
  and public services.
key_dates_summary: >-
  2024-07-03: DTI launches NAISR 2.0 and the Center for AI Research; 2025-04-30: DOST proposes a successor National
  AI Strategy for the Philippines (NAIS-PH)
