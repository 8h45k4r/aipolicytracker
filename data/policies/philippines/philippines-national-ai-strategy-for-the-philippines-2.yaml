summary_plain: >-
  A national AI strategy proposed by DOST at National Innovation Day 2025, structured around five core strategies:
  infrastructure, workforce, innovation, ethics and policy, and deployment, phased from 2024 to 2028. It includes
  a national high-performance computing centre, AI micro-credentials and an AI hub linking regional industries to
  solutions, coordinated with DICT, DepEd, CHED, TESDA, DTI and others. DOST later launched NAICRI as its institutional
  backbone.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Department of Science and Technology (DOST).
  Oversight: DOST with the National AI Center for Research and Innovation (NAICRI) and partner agencies. Stated
  purpose: Coordinate a whole-of-government AI strategy on infrastructure, workforce, innovation, ethics and deployment
  through 2028.
