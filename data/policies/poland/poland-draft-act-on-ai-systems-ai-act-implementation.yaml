summary_plain: >-
  The draft act implements the EU AI Act in Poland: it creates the Commission for the Development and Safety of Artificial
  Intelligence as the market-surveillance authority and single point of contact, sets procedures for complaints and inspections,
  provides for a regulatory sandbox and defines the national penalty regime.
scope_summary: Providers, deployers, importers and distributors of AI systems within the scope of the EU AI Act.
