issuing_body: 28 countries and the European Union attending the AI Safety Summit hosted by the United Kingdom
summary_plain: >-
  Signed by countries including the United States, China, the EU, India, Japan and Brazil, the declaration recognises the
  opportunities of AI and the risks of frontier models, commits signatories to cooperate on identifying AI safety risks
  and building risk-based policies, and launched the summit series continued in Seoul (2024) and Paris (2025) and the network
  of AI safety institutes.
