issuing_body: UNESCO General Conference (193 member states)
summary_plain: >-
  The first global normative instrument on AI ethics. It sets values (human rights and dignity, environment and ecosystem
  flourishing, diversity and inclusiveness, peaceful and just societies) and principles (proportionality and do no harm,
  safety and security, fairness, sustainability, privacy, human oversight, transparency and explainability, responsibility,
  awareness and literacy, multi-stakeholder governance), and eleven policy action areas from ethical impact assessment and
  data policy to gender, education, health and the environment. UNESCO supports implementation with a Readiness Assessment
  Methodology (RAM) and an Ethical Impact Assessment tool used by dozens of countries.
scope_summary: Addressed to member states; recommends measures for public and private AI actors; non-binding.
