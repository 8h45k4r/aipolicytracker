title: >-
  OECD Recommendation of the Council on Artificial Intelligence (OECD/LEGAL/0449), adopted 22 May 2019 and revised 3 May
  2024
short_title: OECD AI Principles (Recommendation on AI)
instrument_type: framework
status: adopted
is_binding: false
featured: true
published: true
issuing_body: OECD Council
summary_plain: >-
  The first intergovernmental standard on AI. It sets five values-based principles (inclusive growth and well-being; human
  rights and democratic values including fairness and privacy; transparency and explainability; robustness, security and
  safety; accountability) and five recommendations to governments (invest in research, foster an inclusive AI ecosystem,
  enable an agile policy environment, build human capacity and prepare for labour-market transition, cooperate internationally).
  The 2024 revision updated the definition of an AI system (adopted by the EU AI Act and other laws) and added references
  to general-purpose and generative AI, misinformation and environmental sustainability. Adherents include all OECD members
  and several non-members; the G20 AI Principles (2019) draw on it.
scope_summary: Addressed to governments (adherents) and, through them, to AI actors; non-binding.
