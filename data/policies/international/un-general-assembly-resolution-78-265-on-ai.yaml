slug: un-general-assembly-resolution-78-265-on-ai
jurisdiction: international
title: >-
  UN General Assembly resolution A/RES/78/265: Seizing the opportunities of safe, secure and trustworthy artificial intelligence
  systems for sustainable development (21 March 2024)
short_title: UN General Assembly resolution 78/265 on safe, secure and trustworthy AI
instrument_type: policy
status: adopted
is_binding: false
featured: false
published: true
issuing_body: United Nations General Assembly
summary_plain: >-
  The first General Assembly resolution on AI, adopted by consensus with more than 120 co-sponsors, encourages states to
  promote safe, secure and trustworthy AI systems that respect human rights and advance the Sustainable Development Goals,
  to close digital divides, and to develop governance frameworks and interoperable safeguards; it calls on companies to
  act responsibly. It was followed by resolution A/RES/79/325 (August 2025) establishing an Independent International Scientific
  Panel on AI and a Global Dialogue on AI Governance under the Global Digital Compact.
scope_summary: Recommendatory; addressed to member states, the UN system and stakeholders.
key_dates_summary: >-
  2024-03-21: A/RES/78/265 adopted; 2024-09-22: Global Digital Compact; 2025-08-26: A/RES/79/325 creates the scientific
  panel and global dialogue.
