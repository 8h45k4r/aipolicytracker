title: >-
  Hiroshima Process International Code of Conduct for Organizations Developing Advanced AI Systems (G7, 30 October 2023)
short_title: G7 Hiroshima AI Process code of conduct
instrument_type: code_of_practice
status: voluntary_standard
is_binding: false
featured: false
published: true
issuing_body: G7 Leaders (Hiroshima AI Process)
summary_plain: >-
  Eleven voluntary actions for organisations developing the most advanced AI systems, including foundation and generative
  models: risk identification and mitigation across the lifecycle, post-deployment vulnerability and incident monitoring,
  public transparency reports, responsible information sharing, security controls, content authentication such as watermarking,
  research on societal risks, priority to global challenges, technical standards, and data-input and personal-data safeguards.
  It sits alongside the Hiroshima Process guiding principles and, from 2025, an OECD-run voluntary reporting framework.
scope_summary: Voluntary; aimed at developers of advanced AI systems worldwide.
