summary_plain: >-
  An interactive online tool on OECD.AI that helps governments put the OECD AI Principles into practice. Policymakers
  answer a questionnaire to map their national AI policy landscape, set priorities and find examples of policies from
  other countries, drawn from the OECD.AI policy database and organised around six pillars. It is non-prescriptive, does
  not rank countries and was designed with governments in regional workshops.
scope_summary: >-
  National and regional governments and policymakers designing or reviewing AI policy; no obligations for organisations.
who_it_applies_to: Governments and public authorities; voluntary.
key_dates_summary: First release presented at the OECD Ministerial Council Meeting 2026 (exact date not confirmed).
