title: ISO/IEC 42001:2023 Information technology – Artificial intelligence – Management system
short_title: ISO/IEC 42001:2023 AI management system
instrument_type: standard
status: voluntary_standard
is_binding: false
featured: false
published: true
issuing_body: ISO/IEC JTC 1/SC 42
summary_plain: >-
  The first certifiable management-system standard for AI. It specifies requirements for establishing, implementing, maintaining
  and improving an AI management system within an organisation: context and leadership, AI policy, risk and impact assessment,
  objectives, resources and competence, operational controls across the AI lifecycle, performance evaluation and improvement,
  with Annex A controls on data, transparency, human oversight, third parties and responsible use. Certification is voluntary
  but increasingly requested in procurement; regulators reference it as evidence of governance.
scope_summary: >-
  Voluntary; any organisation developing, providing or using AI systems. This site does not reproduce the standard's text.
