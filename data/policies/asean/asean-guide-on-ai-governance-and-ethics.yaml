published: true
issuing_body: ASEAN Digital Ministers' Meeting
summary_plain: >-
  Endorsed at the 4th ASEAN Digital Ministers' Meeting in February 2024, the guide sets seven guiding principles (transparency
  and explainability, fairness and equity, security and safety, human-centricity, privacy and data governance, accountability
  and integrity, robustness and reliability) and a four-part governance framework (internal governance structures, human
  involvement in decision-making, operations management, stakeholder interaction), with national and regional recommendations
  including an ASEAN working group on AI governance.
scope_summary: >-
  Voluntary; for organisations deploying traditional AI in commercial and non-military contexts across ASEAN member states.
