issuing_body: ASEAN Digital Ministers' Meeting
summary_plain: >-
  Endorsed in January 2025, the expanded guide addresses risks specific to generative AI (hallucination, deepfakes and misinformation,
  intellectual property, privacy, security, bias, embedded values) and proposes governance dimensions covering accountability,
  data, development and deployment, incident reporting, testing and assurance, security, content provenance, safety research
  and public-interest use, with policy recommendations for member states.
scope_summary: Voluntary; developers and deployers of generative AI across ASEAN.
