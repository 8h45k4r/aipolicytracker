summary_plain: >-
  Adopted in March 2023, the guidelines set principles and requirements for trustworthy and responsible AI in Serbia (human
  agency, safety, privacy, transparency, non-discrimination, societal well-being, accountability), with self-assessment
  questions for developers and users, drawing on the EU ethics guidelines and the UNESCO recommendation.
