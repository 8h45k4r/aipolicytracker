summary_plain: >-
  Viet Nam's first comprehensive regulation on personal data, issued as a government decree. It sorts personal data into
  basic and sensitive categories, bans unlawful processing, and sets duties for those who control and process data,
  including meeting requests from data subjects within 72 hours unless another law provides otherwise. Micro, small and
  medium-sized enterprises and start-ups could choose not to appoint a data protection person or unit for their first
  two years. It is a general privacy rule that also governs personal data used by AI systems.
scope_summary: >-
  Agencies, organisations and individuals that process personal data in Viet Nam; the exact territorial reach set out
  in the Decree's scope provisions is pending review.
who_it_applies_to: Organisations and individuals that process personal data in or relating to Viet Nam.
key_dates_summary: Issued 17 April 2023; in force 1 July 2023; Law on Personal Data Protection in force 1 January 2026.
