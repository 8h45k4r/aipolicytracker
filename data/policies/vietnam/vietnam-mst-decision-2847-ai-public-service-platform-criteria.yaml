summary_plain: >-
  A ministerial decision that sets one common set of criteria for assessing AI platforms that support the work of civil
  servants nationally, before they go to trial or official use. Platforms only advise, summarise and analyse; officials
  stay responsible for decisions and outputs are reference material only. Platforms are scored out of 100 and need at
  least 70 for conditional official deployment, while 50 to under 70 allows a trial with reassessment after two months.
  A platform fails if it does not use a Vietnamese large language model controlled by a Vietnamese enterprise with
  training, inference and service infrastructure in Viet Nam, and platforms must cite specific legal provisions and must
  not invent legal citations or process restricted data.
scope_summary: >-
  AI platforms proposed for supporting public-service work, and the 14 ministries, 3 ministerial-level agencies and 34
  localities that deploy them.
who_it_applies_to: Vietnamese ministries, agencies and localities deploying AI platforms for public-service work, and the platforms' suppliers.
