title: Law on Artificial Intelligence (Law No. 134/2025/QH15)
short_title: Law on Artificial Intelligence
instrument_type: act
status: in_force
status_note: >-
  Official portal lists issue date 10-12-2025 and effective date 01-03-2026. Signed PDF: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/01/luat134.signed.pdf
is_binding: true
featured: false
published: true
issuing_body: National Assembly of Vietnam
summary_plain: >-
  Vietnam's first dedicated AI statute, with eight chapters and 35 articles governing the research, development,
  provision, deployment and use of AI systems. It adopts a risk-based approach, requires human oversight in important
  decisions, and provides for national AI infrastructure, a national AI development fund, a regulatory sandbox and
  rules on AI-generated content. It took effect on 1 March 2026 with transition periods for existing systems.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by National Assembly of Vietnam. Oversight: Government/Ministry
  of Science and Technology as state management body. Stated purpose: Establish a comprehensive, risk-based legal
  framework for AI while promoting innovation.
