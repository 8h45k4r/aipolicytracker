issuing_body: Prime Minister of Vietnam
summary_plain: >-
  A prime ministerial decision promulgating Vietnam's national AI strategy to 2030. It targets a top-four ASEAN
  and top-50 global position in AI, three national big data and high-performance computing centres, national innovation
  centres for AI and open datasets across sectors. It directs work on a legal framework, infrastructure, talent
  and application of AI in government and industry, with the Ministry of Science and Technology coordinating.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Prime Minister of Vietnam. Oversight: Ministry
  of Science and Technology as focal point coordinating 15+ ministries. Stated purpose: Make Vietnam a leading AI
  centre in ASEAN and the world's top 50 by 2030.
