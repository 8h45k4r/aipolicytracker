summary_plain: >-
  Businesses in Maine may not use an artificial intelligence chatbot to deal with consumers in trade or commerce in a
  way that could mislead a reasonable consumer into believing they are dealing with a human being, unless the consumer
  is told clearly and conspicuously that they are not. The law defines a chatbot as software that simulates
  conversation by text or voice. A breach is treated as a breach of the Maine Unfair Trade Practices Act.
scope_summary: >-
  Anyone in Maine who uses an AI chatbot to engage in trade or commerce with consumers by text or voice.
who_it_applies_to: Businesses and other persons using AI chatbots to deal with consumers in Maine.
key_dates_summary: Signed by the Governor on 12 June 2025 (chapter 294); effective date of the chapter not confirmed.
penalties_summary: A violation is a violation of the Maine Unfair Trade Practices Act.
what_organizations_must_do: >-
  Tell consumers clearly and conspicuously that they are not dealing with a human whenever an AI chatbot could
  otherwise lead a reasonable consumer to think so.
