summary_plain: >-
  Maine bars anyone from offering therapy or psychotherapy services to the public, including through internet-based
  artificial intelligence, unless the services are provided by a licensed professional; a breach is treated as a
  breach of the Maine Unfair Trade Practices Act. Licensed mental health professionals may use AI only for
  administrative support and, with the client's written notice and consent, for supplementary support such as record
  keeping. AI may not make independent therapeutic decisions, communicate with clients therapeutically or produce
  treatment plans without the licensee's review and approval.
scope_summary: >-
  Anyone offering therapy or psychotherapy services to the public in Maine, including through AI tools, and licensed
  professionals who use AI in providing those services. AI used only in a research project approved by an
  institutional review board is excluded.
who_it_applies_to: Providers of therapy services to the public in Maine, AI service offerors and licensed mental health professionals.
key_dates_summary: Signed by the Governor on 13 April 2026 (chapter 687); effective date of the chapter not confirmed.
penalties_summary: >-
  Offering therapy services through AI without a licensed professional is a violation of the Maine Unfair Trade
  Practices Act; a licensee's breach of the AI-use rules is subject to disciplinary action by the licensing board.
what_organizations_must_do: >-
  Offer therapy only through licensed professionals; licensees using AI for supplementary support must give the client
  written notice and get consent, keep a licensee responsible for therapeutic decisions and treatment plans, and not
  refuse services because a client declines AI use.
