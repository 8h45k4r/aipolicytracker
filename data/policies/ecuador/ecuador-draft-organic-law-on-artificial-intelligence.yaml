summary_plain: >-
  The draft organic law proposes principles for AI (human-centric, transparency, non-discrimination, safety), a risk-based
  classification with prohibited and high-risk uses, obligations for developers and deployers, a national AI authority and
  sanctions, drawing on the EU AI Act and UNESCO recommendation.
scope_summary: Would apply to public and private developers and deployers of AI in Ecuador if enacted.
