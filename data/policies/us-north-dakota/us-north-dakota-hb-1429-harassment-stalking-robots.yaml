summary_plain: >-
  Amends North Dakota's harassment and stalking offences (sections 12.1-17-07 and 12.1-17-07.1 of the Century Code)
  so that they cover conduct carried out with a robot. A robot is defined broadly as an artificial object or system
  that senses, processes and acts using technology, expressly including artificial intelligence and remotely piloted
  aircraft. Using a robot for offensive conduct with no legitimate purpose becomes harassment, and robot-based acts
  and unauthorised tracking can form part of stalking.
scope_summary: >-
  Any person in North Dakota who uses a robot, drone or other AI-enabled system to harass, follow, track or stalk
  another person.
who_it_applies_to: Individuals and organisations whose use of robots or drones could amount to harassment or stalking.
key_dates_summary: Signed by the Governor on 21 April 2025; effective 1 August 2025.
penalties_summary: >-
  Criminal penalties under the harassment and stalking sections; the extracts give a class A misdemeanour as the base
  penalty for stalking.
