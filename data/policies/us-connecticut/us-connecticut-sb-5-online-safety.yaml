summary_plain: >-
  A broad online-safety act that covers frontier developers, AI companions, AI in employment and synthetic content. Its frontier
  provisions bar retaliation against whistleblowers and require large frontier developers to set up an anonymous internal
  reporting process and report to their boards quarterly; no duty to publish a safety framework or transparency report was
  found.
scope_summary: >-
  Frontier developers (models trained with more than 10^26 operations; "large" developers with more than $500 million in revenue),
  AI companion operators, employers using AI and creators of synthetic content, as the act sets out.
who_it_applies_to: Frontier-model developers, AI companion operators and other businesses named in the act.
key_dates_summary: >-
  Signed 27 May 2026; frontier provisions effective 1 October 2026; internal reporting process by 1 January 2027; quarterly
  board reports from 1 May 2027.
