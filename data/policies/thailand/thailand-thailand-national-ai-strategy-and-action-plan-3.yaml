summary_plain: >-
  A cabinet-approved strategy and action plan with five strategies: readiness in ethics, law and regulation; national
  AI infrastructure; human capability and education; AI technology and innovation development; and promotion of
  AI use in public and private sectors. It sets targets for AI talent, research prototypes and economic impact through
  2027 and is implemented in phases coordinated across ministries.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Cabinet of Thailand (prepared by MHESI and MDES;
  NECTEC/NSTDA secretariat). Oversight: National AI Committee with NECTEC/NSTDA as secretariat. Stated purpose:
  Build an effective AI ecosystem to strengthen the economy and quality of life by 2027.
