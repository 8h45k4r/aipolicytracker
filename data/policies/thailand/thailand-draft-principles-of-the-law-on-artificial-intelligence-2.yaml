summary_plain: >-
  Draft principles for a Thai AI law released for public hearing by MDES and ETDA. They propose a risk-based structure
  that distinguishes prohibited and high-risk AI, duties for providers and deployers, human oversight, incident
  reporting and a regulatory sandbox, while leaving sector regulators to set proportionate rules. The draft merges
  the 2022 ONDE royal decree draft and the 2023 ETDA promotion act draft.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Ministry of Digital Economy and Society / Electronic
  Transactions Development Agency (ETDA). Oversight: ETDA under MDES, with sectoral regulators envisaged. Stated
  purpose: Consolidate earlier draft AI instruments into one risk-based AI law.
