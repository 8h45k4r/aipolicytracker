published: true
issuing_body: Ministry of Communication, Digital Technology and Innovations
summary_plain: >-
  A ten-year national roadmap launched by President Mahama that treats data as a national asset and sets out pillars
  covering education and skills, infrastructure and compute, data governance, ecosystem development, sector adoption,
  applied research and public-sector AI. It proposes a National AI Fund and performance indicators for ministries,
  and emphasises localisation of AI for Ghanaian languages.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Ministry of Communication, Digital Technology
  and Innovations. Oversight: Ministry leads with NITA, Data Protection Commission and Cyber Security Authority;
  strategy recommends a Responsible AI Authority. Stated purpose: Make AI a driver of inclusive growth and position
  Ghana as a regional AI hub.
key_dates_summary: >-
