summary_plain: >-
  APRA's letter to the entities it regulates sets out minimum expectations for managing AI risk, after finding
  that many treat AI as ordinary technology and few have put governance into practice. Boards are expected to
  understand AI well enough to challenge management and to oversee an AI strategy within their risk appetite.
  Entities are expected to set consistent governance, including an AI policy, clear ownership across the AI
  lifecycle, an inventory of AI tools and uses, human involvement in high-risk decisions and staff training, and
  to plan for dependence on outside AI providers.
scope_summary: >-
  APRA-regulated entities, such as banks, insurers and superannuation trustees, that use AI.
who_it_applies_to: Boards and management of APRA-regulated entities.
key_dates_summary: Published 30 April 2026.
penalties_summary: >-
  APRA says it will take stronger supervisory action and, where appropriate, pursue enforcement against entities
  that fail to manage AI risk in proportion to their size, scale and complexity.
what_organizations_must_do: >-
  Boards should build AI literacy and oversee AI strategy and monitoring, including third-party dependencies.
  Entities should keep an AI policy and reporting lines, assign ownership across the AI lifecycle, maintain an
  inventory of AI tools and use cases, keep humans involved in high-risk decisions, train staff, and test exit
  and substitution plans for critical AI providers.
