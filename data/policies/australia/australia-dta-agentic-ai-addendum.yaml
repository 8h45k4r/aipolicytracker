summary_plain: >-
  An addendum to the Australian Government's AI technical standard that sets expectations for how agencies
  manage and operate agentic AI systems, meaning systems that pursue goals autonomously with little human
  supervision. It covers governance and system design, data and memory management, evaluation, human oversight
  and monitoring, and the ability to intervene in or shut down a system. Everything in the AI technical standard
  still applies, and agencies are expected to use the two together.
