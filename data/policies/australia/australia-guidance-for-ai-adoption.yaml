summary_plain: >-
  Voluntary guidance setting out six essential practices for safe and responsible AI use: decide who is
  accountable, understand impacts and plan for them, measure and manage risks, share essential information, test
  and monitor, and maintain human control. It comes in a foundations version for organisations starting out or
  using AI in low-risk ways, and an implementation version for those building or customising AI systems or
  handling higher-risk uses. It updates the 10 guardrails of the Voluntary AI Safety Standard and the eight AI
  Ethics Principles.
scope_summary: >-
  Voluntary; aimed at Australian businesses and other organisations adopting, building or customising AI.
who_it_applies_to: Organisations in Australia using or developing AI, on a voluntary basis.
