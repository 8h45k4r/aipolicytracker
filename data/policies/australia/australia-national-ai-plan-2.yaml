summary_plain: >-
  The National AI Plan is the Australian Government's whole-of-government AI strategy with three goals: capture
  the opportunity through infrastructure, domestic capability and investment; spread the benefits through adoption,
  skills and better public services; and keep Australians safe through legal and regulatory frameworks and responsible-practice
  guidance. It consolidates existing AI funding commitments and signals a sector-by-sector regulatory approach supported
  by an AI Safety Institute, rather than a standalone AI act.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Department of Industry, Science and Resources.
  Oversight: DISR leads whole-of-government delivery; National AI Centre supports industry; new Australian AI Safety
  Institute. Stated purpose: Grow an AI-enabled economy while managing harms through existing and targeted regulation.
