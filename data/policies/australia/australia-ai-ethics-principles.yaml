summary_plain: >-
  Eight voluntary principles for designing, developing and using AI in Australia, published as part of the
  government's AI Ethics Framework after a public consultation on a discussion paper. They cover wellbeing of
  people, society and the environment, human-centred values, fairness, privacy protection and security,
  reliability and safety, transparency and explainability, contestability, and accountability. They are meant to
  complement existing law, not replace it, and were trialled with several large businesses.
scope_summary: >-
  Voluntary; aimed at businesses and governments that design, develop or use AI in Australia.
who_it_applies_to: Organisations developing or using AI in Australia, on a voluntary basis.
