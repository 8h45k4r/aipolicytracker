slug: australia-mandatory-guardrails-proposal
jurisdiction: australia
title: "Proposals paper: introducing mandatory guardrails for AI in high-risk settings (Australia)"
short_title: Australian mandatory guardrails proposal
instrument_type: consultation
status: under_consultation
status_note: >
  Consultation ran September to October 2024. The December 2025 National AI Plan reportedly signalled that the
  government would strengthen existing laws rather than introduce a standalone AI Act; a reviewer must confirm
  whether the mandatory-guardrails proposal has been formally dropped, adapted or superseded and update the status.
is_binding: false
published: true
issuing_body: Department of Industry, Science and Resources
summary_plain: >
  The proposals paper sought views on ten mandatory guardrails for developers and deployers of AI in high-risk
  settings, a principles-based definition of high-risk AI (with general-purpose AI treated as high-risk), and three
  regulatory options: adapting existing laws, framework legislation, or a new cross-economy AI Act. The guardrails
  mirror the Voluntary AI Safety Standard, covering accountability, risk management, data governance, testing,
  human control, transparency, contestability, supply-chain transparency, records, and conformity assessment.
scope_summary: >
  A consultation document, not law. If adopted, the guardrails would apply to organisations developing or deploying
  AI in high-risk settings in Australia.
who_it_applies_to: Prospectively, developers and deployers of high-risk AI in Australia; currently no one.
key_dates_summary: Published 5 September 2024; submissions closed 4 October 2024; government response pending at last check.
penalties_summary: None; consultation.
what_organizations_must_do: >
  Nothing yet. Organisations can prepare by adopting the Voluntary AI Safety Standard, whose guardrails match the
  proposed mandatory ones.
