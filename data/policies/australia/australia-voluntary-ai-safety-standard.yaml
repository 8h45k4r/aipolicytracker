obligations:
  - slug: australia-vaiss-accountability-and-risk-management
    title: Establish accountability processes and a risk-management process (guardrails 1 and 2)
    category: governance_accountability
    source_reference: "Guardrails 1 and 2"
    is_binding: false
    actors: [deployer, provider]
    sectors: [cross_sector]
    use_cases: [generative_ai, public_services]
    summary: >
      Guardrail 1 asks organisations to set up accountability processes including governance, internal capability
      and a strategy for regulatory compliance; guardrail 2 asks for a risk-management process to identify and
      mitigate risks across the AI lifecycle.
    practical_action: Adopt an AI policy, assign an accountable owner and run per-use-case risk assessments.
    applicability:
      description: Voluntary for all Australian organisations using AI.
      actors: [deployer, provider]
    evidence_examples:
      - { title: AI accountability and risk-management documentation, artifact_type: document }
    framework_mappings:
      - { framework: iso_42001, reference: "Clauses 5 and 6", note: "The standard states it is aligned with ISO/IEC 42001 and the NIST AI RMF.", confidence_level: high }
      - { framework: nist_ai_rmf, reference: "GOVERN and MAP", note: "Original editorial mapping.", confidence_level: high }
    controls:
      - { control: ai-governance-policy-and-accountability, relationship: satisfies, note: "Guardrail 1: accountable owner, policy and compliance strategy.", confidence_level: high }
      - { control: ai-risk-assessment, relationship: satisfies, note: "Guardrail 2: per-use-case lifecycle risk process.", confidence_level: high }
  - slug: australia-vaiss-testing-human-control-transparency
    title: Test and monitor systems, enable human control, and be transparent with users (guardrails 4 to 6)
    category: human_oversight
    source_reference: "Guardrails 4, 5 and 6"
    is_binding: false
    actors: [deployer, provider]
    sectors: [cross_sector]
    use_cases: [customer_service, hiring_and_hr]
    summary: >
      Test AI models and systems before deployment and monitor them in operation; enable meaningful human control
      and intervention; and inform end users about AI-enabled decisions, interactions with AI and AI-generated content.
    practical_action: Publish AI disclosures, define override paths and keep test and monitoring records.
    applicability:
      description: Voluntary for all Australian organisations using AI.
      actors: [deployer, provider]
    evidence_examples:
      - { title: Test reports and user disclosure records, artifact_type: report }
    framework_mappings:
      - { framework: nist_ai_rmf, reference: "MEASURE and MANAGE functions", note: "Original editorial mapping.", confidence_level: medium }
    controls:
      - { control: accuracy-robustness-security-testing, relationship: supports, note: "Guardrail 3: pre-deployment testing.", confidence_level: high }
      - { control: human-oversight-and-override, relationship: supports, note: "Guardrail 4: meaningful human control.", confidence_level: high }
      - { control: ai-interaction-and-use-disclosure, relationship: supports, note: "Guardrail 5: informing end users.", confidence_level: high }
  - slug: australia-vaiss-contestability-supply-chain-records
    title: Provide contestability, supply-chain transparency and records (guardrails 7 to 9)
    category: vendor_governance
    source_reference: "Guardrails 7, 8 and 9"
    is_binding: false
    actors: [deployer, provider]
    sectors: [cross_sector]
    use_cases: [finance_and_credit, public_services]
    summary: >
      Establish processes for people impacted by AI to challenge use or outcomes; be transparent with other
      organisations across the AI supply chain about data, models and systems; and keep and maintain records to
      allow third parties to assess compliance.
    practical_action: Add AI clauses to supplier contracts and keep an AI system register with evidence links.
    applicability:
      description: Voluntary for all Australian organisations using AI.
      actors: [deployer, provider]
    evidence_examples:
      - { title: AI system register and supplier disclosures, artifact_type: register }
    framework_mappings:
      - { framework: nist_ai_rmf, reference: "GOVERN 6.x", note: "Third-party risk.", confidence_level: medium }
    controls:
      - { control: contractual-allocation-of-ai-duties, relationship: satisfies, note: "AI clauses make supply-chain transparency and record sharing enforceable.", confidence_level: medium }
      - { control: decision-explanation-and-appeal-route, relationship: supports, note: "Challenge process for impacted people.", confidence_level: high }
      - { control: ai-system-inventory, relationship: supports, note: "Register with evidence links for third-party review.", confidence_level: high }
