slug: australia-voluntary-ai-safety-standard
jurisdiction: australia
title: "Voluntary AI Safety Standard (Australia)"
short_title: Australian Voluntary AI Safety Standard
instrument_type: standard
status: voluntary_standard
is_binding: false
featured: true
published: true
issuing_body: Department of Industry, Science and Resources
summary_plain: >
  The Voluntary AI Safety Standard gives Australian organisations ten guardrails for developing and deploying AI
  safely and responsibly: accountability and governance, risk management, data governance and protection, testing
  and monitoring, human control and intervention, user transparency, contestability, supply-chain transparency,
  record keeping, and stakeholder engagement. The guardrails were designed to align with the mandatory guardrails
  proposed for high-risk settings so that early adopters would be prepared if those became law.
scope_summary: >
  Voluntary; aimed at organisations deploying AI in Australia, especially deployers of AI systems in higher-risk
  settings. It creates no legal obligations.
who_it_applies_to: Any Australian organisation deploying or developing AI (voluntary), with practical focus on deployers.
key_dates_summary: Published 5 September 2024 alongside the mandatory-guardrails proposals paper.
penalties_summary: None; voluntary.
what_organizations_must_do: >
  Nothing mandatory. Adopters implement the ten guardrails proportionately to the risk of their AI use cases.
