summary_plain: >-
  Each WA public sector entity nominates an AI Accountable Officer and self-assesses its AI and automated decision-making
  systems; higher-risk, Digital Capability Fund-funded or large projects go to the WA AI Advisory Board, whose advice is non-binding,
  and use cases are recorded in a government AI register.
scope_summary: The WA public sector; universities and local governments are encouraged to comply.
