summary_plain: >-
  Sets minimum requirements for generative AI in the Victorian public sector: agency-approved tools are preferred, AI should
  not be used to make decisions or assessments, privacy, FOI and human-rights obligations still apply, and staff must be trained.
  Relying on unverified AI output could breach the codes of conduct.
