summary_plain: >-
  Requires anyone who uses an online bot to communicate with people in New Jersey, when selling or advertising goods
  or real estate or when seeking support for a candidate, party or ballot question, to say clearly at the start that
  the conversation is being carried on by or through a bot. A bot is an automated online account whose actions or
  posts are wholly or almost wholly not generated directly by a person. The Attorney General can seek civil penalties
  and injunctions; online platforms and internet service providers are not given duties.
scope_summary: >-
  Persons and organisations using automated online accounts to communicate with people in New Jersey for commercial
  sales or advertising, or for election campaigning.
who_it_applies_to: Businesses, campaigns and others using bots to interact with people in New Jersey.
key_dates_summary: Approved on 21 January 2020; takes effect on the 180th day after enactment.
penalties_summary: >-
  Civil penalties of 2,500 dollars for a first offence, 5,000 dollars for a second and 10,000 dollars for each later
  offence, plus injunctive relief sought by the Attorney General.
what_organizations_must_do: >-
  Organisations in scope must disclose at the outset of a bot-driven communication or interaction, clearly and
  conspicuously, that it is being conducted by or through a bot (N.J.S.A. 56:18-1 et seq.).
