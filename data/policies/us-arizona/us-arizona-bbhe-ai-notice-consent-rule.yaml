summary_plain: >-
  Behavioural health professionals licensed by the Arizona Board of Behavioral Health Examiners must, from 1 January 2027,
  tell clients in the written consent for treatment whether and how far artificial intelligence, machine learning or other
  human-simulation tools are used to provide, record or document clinical services. The rule package also adds a
  definition of artificial intelligence to the Board's rules. It is part of a wider update of the Board's rules, not an
  AI-only instrument.
scope_summary: >-
  Professionals licensed by the Arizona Board of Behavioral Health Examiners (counsellors, social workers, marriage and
  family therapists, addiction counsellors) and the consent documents they use with clients.
who_it_applies_to: Behavioural health licensees regulated by the Arizona Board of Behavioral Health Examiners.
key_dates_summary: >-
  Final rulemaking published 26 September 2025 (31 A.A.R. 3032); amended rules effective 2 November 2025; AI notice in the
  consent for treatment required from 1 January 2027.
what_organizations_must_do: >-
  From 1 January 2027, include in the written consent for treatment a notice of the extent, if any, to which AI or similar
  tools are used to provide, record or document clinical services.
