title: >-
  Colorado Amended Regulation 10-1-1 (3 CCR 702-10): Governance and risk management for insurers' use of external consumer
  data, algorithms and predictive models
short_title: Colorado insurer algorithm governance rule (Reg. 10-1-1)
title_native: null
