summary_plain: >-
  Insurers in Colorado that use external consumer data and information sources, or algorithms and predictive models that
  use such data, must run a documented governance and risk management framework to guard against unfair discrimination.
  The board or a board committee oversees it; insurers keep a cross-functional governance group, a version-controlled
  inventory, documented quantitative testing and ongoing monitoring that accounts for model drift, and they remain
  responsible for third-party vendors. The framework is reviewed every year and insurers report to the Division.
scope_summary: >-
  Insurers authorised in Colorado offering individual life insurance, private passenger motor insurance or health benefit
  plans that use external consumer data, algorithms or predictive models.
who_it_applies_to: Life, private passenger motor and health benefit plan insurers authorised in Colorado.
key_dates_summary: >-
  Original regulation (life insurers) effective 14 November 2023; amended regulation adopted 19 August 2025, published in
  the Colorado Register 25 September 2025, effective 15 October 2025; first report from motor and health insurers due
  1 December 2025.
what_organizations_must_do: >-
  Set up and document the governance structure and risk management framework, test and monitor models, oversee vendors,
  review the framework yearly, and file a compliance report each 1 December (or an officer-signed attestation where no
  such data or models are used).
