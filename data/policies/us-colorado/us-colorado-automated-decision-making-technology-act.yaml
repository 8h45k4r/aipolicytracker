faq:
  - question: When does Colorado's SB 26-189 apply?
    answer: >
      To consequential decisions made on or after 1 January 2027, according to secondary reporting on the enrolled
      bill signed on 14 May 2026. Confirm on the Colorado General Assembly site before relying on the date.
  - question: What happened to the Colorado AI Act (SB 24-205)?
    answer: >
      SB 26-189 repealed and re-enacted it before its delayed 30 June 2026 effective date, replacing the duty of
      care, impact assessments and risk-management programme with notice, disclosure, human-review, record-keeping
      and developer-documentation duties.
