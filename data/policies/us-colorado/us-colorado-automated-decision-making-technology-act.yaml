slug: us-colorado-automated-decision-making-technology-act
jurisdiction: us-colorado
title: "Colorado Senate Bill 26-189: Automated Decision-Making Technology (replacement of the Colorado AI Act)"
short_title: Colorado ADMT law (SB 26-189)
instrument_type: act
status: adopted
status_note: >
  Signed by the Governor on 14 May 2026 and, according to concordant secondary reporting, applies to consequential
  decisions made on or after 1 January 2027. It repeals and re-enacts the framework of SB 24-205 (the Colorado AI
  Act) with a narrower scope built around "automated decision-making technology". Recorded on 26 September 2026
  from law-firm summaries; the enrolled bill on the Colorado General Assembly site has not yet been read by a
  reviewer here, so every date and duty below is pending review.
is_binding: true
featured: true
published: true
issuing_body: Colorado General Assembly
summary_plain: >
  SB 26-189 replaces the Colorado AI Act's regulation of "high-risk" AI systems with duties that attach when
  automated decision-making technology materially influences a consequential decision about a Colorado consumer
  in areas such as employment, lending, housing, education, healthcare, insurance and government services. It
  drops the earlier duty of reasonable care, the mandatory risk-management programme, impact assessments and
  Attorney General notification, and substitutes advance notice to the consumer, disclosure after an adverse
  outcome, meaningful human review, three-year record keeping and developer documentation obligations.
scope_summary: >
  Applies to developers and deployers of automated decision-making technology used to make, or to materially
  influence, consequential decisions about Colorado residents. Exemptions and thresholds follow the enrolled
  bill, which a reviewer must read; secondary reporting describes exemptions for certain regulated financial
  institutions and federally approved systems. Enforcement is by the Colorado Attorney General.
who_it_applies_to: Developers and deployers of automated decision-making technology that materially influences consequential decisions about Colorado residents.
key_dates_summary: Signed 14 May 2026; applies to consequential decisions made on or after 1 January 2027 (pending review against the enrolled bill).
penalties_summary: >
  Enforcement by the Colorado Attorney General under the Colorado Consumer Protection Act, according to secondary
  reporting, with no private right of action. Confirm the enforcement provisions against the enrolled bill.
what_organizations_must_do: >
  Inventory the automated tools that influence consequential decisions about Colorado residents; give consumers
  notice before such a tool is used; when an outcome is adverse, tell the consumer that the technology was used,
  the principal reasons, and how to seek meaningful human review; keep records of those decisions for three
  years; and, as a developer, supply deployers with the documentation the statute lists.
