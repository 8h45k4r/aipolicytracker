summary_plain: >-
  Carriers, pharmacy benefit managers, private utilisation review organisations, behavioural health administrative
  services organisations and managed care entities in Colorado that use AI in utilisation review must base AI
  determinations on the individual's own medical or clinical history and keep meaningful human oversight; AI alone may not
  deny coverage on grounds of medical necessity. These entities must file written disclosures saying which review
  functions AI performs, where in the process it is used and how humans oversee it. Carriers and public payers may not
  pay for psychotherapy delivered by AI.
scope_summary: >-
  Entities that use artificial intelligence systems in health care utilisation review in Colorado, and payment for
  psychotherapy services delivered by AI.
who_it_applies_to: >-
  Health insurance carriers, pharmacy benefit managers, private utilisation review organisations, behavioural health
  administrative services organisations, managed care entities and public payers in Colorado.
key_dates_summary: >-
  Signed 2 June 2026; takes effect 1 January 2027 unless a referendum petition is filed against it.
what_organizations_must_do: >-
  Ground AI-assisted utilisation review in individual clinical information, keep a human responsible for adverse
  medical-necessity decisions, file written disclosures of AI use with the relevant state agency, and stop paying for
  AI-delivered psychotherapy.
