  - slug: us-colorado-ai-act-developer-reasonable-care
    title: Developers must use reasonable care to avoid algorithmic discrimination
    category: risk_management
    source_reference: "C.R.S. 6-1-1702(1)"
    is_binding: true
    applies_from: 2026-06-30
    actors: [provider]
    sectors: [employment, financial_services, healthcare, education, public_services]
    use_cases: [hiring_and_hr, finance_and_credit, health, education, public_services]
    summary: >
      A developer of a high-risk AI system must use reasonable care to protect consumers from any known or reasonably
      foreseeable risk of algorithmic discrimination arising from the intended and contracted uses of the system. A
      developer that meets the documentation, public-statement and Attorney General disclosure duties in the rest of
      section 6-1-1702 benefits from a rebuttable presumption that it used reasonable care.
    practical_action: >
      Run and record a discrimination-risk assessment for each high-risk system before release and keep it current so the statutory presumption can be claimed.
    applicability:
      description: Developers doing business in Colorado that develop or intentionally and substantially modify a high-risk AI system.
      actors: [provider]
      risk_categories: [high_risk]
      source_reference: "C.R.S. 6-1-1702(1)"
    evidence_examples:
