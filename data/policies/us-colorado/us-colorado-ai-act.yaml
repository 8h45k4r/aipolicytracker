  - slug: us-colorado-ai-act-developer-disclosure-to-attorney-general
    title: Developers must notify the Attorney General and deployers of discovered algorithmic discrimination
    category: incident_handling
    source_reference: "C.R.S. 6-1-1702(5)"
    is_binding: true
    applies_from: 2026-06-30
    actors: [provider]
    sectors: [employment, financial_services, healthcare, education, public_services]
    use_cases: [hiring_and_hr, finance_and_credit, health, education, public_services]
    summary: >
      Within 90 days after a developer discovers, through ongoing testing or a credible report from a deployer, that
      a high-risk AI system it developed has caused or is reasonably likely to have caused algorithmic
      discrimination, it must disclose this to the Colorado Attorney General and to all known deployers or other
      developers of the system, without unreasonable delay.
    practical_action: >
      Route bias findings and deployer complaints into an incident process with a 90-day regulatory and customer notification clock.
    applicability:
      description: Developers of high-risk AI systems that become aware of algorithmic discrimination caused by their system.
      actors: [provider]
      risk_categories: [high_risk]
      source_reference: "C.R.S. 6-1-1702(5)"
    evidence_examples:
