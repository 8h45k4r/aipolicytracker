      - { title: Attorney General and deployer notification letters, artifact_type: document }
    framework_mappings:
      - { framework: nist_ai_rmf, reference: "MANAGE 4.3, GOVERN 6.2", note: "Incident communication to authorities and downstream parties.", confidence_level: medium }
      - { framework: iso_42001, reference: "Clause 10.2; Annex A.8.4", note: "Corrective action and incident communication.", confidence_level: medium }
    controls:
