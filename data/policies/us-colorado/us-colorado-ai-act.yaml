    controls:
      - { control: ai-interaction-and-use-disclosure, relationship: satisfies, note: "Pre-decision notice with purpose, nature and contact details.", confidence_level: high }
      - { control: decision-explanation-and-appeal-route, relationship: satisfies, note: "Adverse-decision reasons, data correction and appeal for human review.", confidence_level: high }
  - slug: us-colorado-developer-documentation-and-disclosure
