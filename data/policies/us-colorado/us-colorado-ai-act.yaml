faq:
  - question: When does the Colorado AI Act take effect?
    answer: >
      The effective date was delayed to 30 June 2026 by SB 25B-004 in the August 2025 special session. Confirm
      the current date on the Colorado General Assembly site, because further amendments were debated in 2026.
  - question: Does the Colorado AI Act allow consumers to sue?
    answer: No. Enforcement is exclusively by the Colorado Attorney General; there is no private right of action.
