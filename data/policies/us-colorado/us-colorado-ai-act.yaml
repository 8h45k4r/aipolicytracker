      - { title: Bias evaluation results and mitigation record, artifact_type: record }
    framework_mappings:
      - { framework: nist_ai_rmf, reference: "MAP 1.1, MEASURE 2.11, MANAGE 1.3", note: "Fairness and bias evaluated and managed.", confidence_level: medium }
      - { framework: iso_42001, reference: "Clause 6.1.2, 6.1.3", note: "AI risk assessment and treatment.", confidence_level: medium }
    controls:
      - { control: ai-risk-assessment, relationship: satisfies, note: "Identifies and treats discrimination risk per system.", confidence_level: high }
      - { control: accuracy-robustness-security-testing, relationship: supports, note: "Disparate-impact testing across protected classes.", confidence_level: high }
