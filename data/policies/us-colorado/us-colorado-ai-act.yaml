    framework_mappings:
      - { framework: nist_ai_rmf, reference: "GOVERN 1.1, MANAGE 1.3", note: "Legal requirements and risk treatment for deployed systems.", confidence_level: medium }
      - { framework: iso_42001, reference: "Clause 6.1.2; Annex A.9.2", note: "Risk assessment and responsible-use processes.", confidence_level: medium }
    controls:
      - { control: ai-governance-policy-and-accountability, relationship: satisfies, note: "Ownership and the standard of care documented for each system.", confidence_level: medium }
      - { control: ai-risk-assessment, relationship: supports, note: "Discrimination risk identified for each consequential-decision use.", confidence_level: high }
