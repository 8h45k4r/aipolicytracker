  - slug: us-colorado-deployer-risk-management-program
    title: Deployers must implement a risk management policy and programme
    category: risk_management
    source_reference: "C.R.S. 6-1-1703(2)"
    is_binding: true
    applies_from: 2026-06-30
    actors: [deployer]
    sectors: [employment, financial_services, healthcare, education, public_services]
    use_cases: [hiring_and_hr, finance_and_credit]
    summary: >
      Deployers of high-risk AI must implement a risk-management policy and programme governing deployment,
      specifying principles, processes and personnel used to identify, document and mitigate known or reasonably
      foreseeable risks of algorithmic discrimination, and reasonable in light of recognised frameworks such as
      the NIST AI RMF or ISO/IEC 42001.
    practical_action: Adopt an AI risk policy referencing NIST AI RMF or ISO/IEC 42001 and keep programme records.
    applicability:
      description: Deployers of high-risk AI systems affecting Colorado consumers.
      actors: [deployer]
      risk_categories: [high_risk]
    evidence_examples:
      - { title: AI risk management policy and programme, artifact_type: document }
    framework_mappings:
      - { framework: nist_ai_rmf, reference: "Whole framework (named in the statute)", note: "The statute names the AI RMF as a recognised framework.", confidence_level: high }
      - { framework: iso_42001, reference: "Whole management system (named in the statute)", note: "The statute names ISO/IEC 42001 as a recognised framework.", confidence_level: high }
    controls:
      - { control: ai-risk-assessment, relationship: satisfies, note: "Per-system identification, documentation and mitigation of algorithmic discrimination risk.", confidence_level: high }
      - { control: ai-governance-policy-and-accountability, relationship: satisfies, note: "The risk-management policy, principles and personnel the statute expects.", confidence_level: medium }
  - slug: us-colorado-deployer-impact-assessment
    title: Deployers must complete impact assessments for high-risk AI
    category: impact_assessment
    source_reference: "C.R.S. 6-1-1703(3)"
    is_binding: true
    applies_from: 2026-06-30
    actors: [deployer]
    sectors: [employment, financial_services, healthcare, education, public_services]
    use_cases: [hiring_and_hr, finance_and_credit, health]
    summary: >
      Deployers must complete an impact assessment before deployment, annually, and within 90 days of any
      intentional and substantial modification, covering purpose, risks of algorithmic discrimination and
      mitigation, data categories, performance metrics, transparency measures and post-deployment monitoring,
      and retain assessments for at least three years.
    practical_action: Build an impact-assessment template aligned with the statutory elements and calendar the annual refresh.
    applicability:
      description: Deployers of high-risk AI systems.
      actors: [deployer]
      risk_categories: [high_risk]
    evidence_examples:
      - { title: Algorithmic impact assessment, artifact_type: report }
    framework_mappings:
      - { framework: iso_42001, reference: "Clause 6.1.4 AI system impact assessment", note: "Original editorial mapping.", confidence_level: high }
      - { framework: nist_ai_rmf, reference: "MAP 5.x", note: "Original editorial mapping.", confidence_level: medium }
    controls:
      - { control: ai-impact-assessment, relationship: satisfies, note: "Templated assessment aligned to the statutory elements, refreshed annually and on material change.", confidence_level: high }
      - { control: post-market-monitoring-and-drift-detection, relationship: supports, note: "Post-deployment monitoring described in the assessment.", confidence_level: medium }
  - slug: us-colorado-consumer-notice-and-adverse-decision-explanation
    title: Notify consumers and explain adverse consequential decisions
    category: transparency
    source_reference: "C.R.S. 6-1-1703(4)"
    is_binding: true
    applies_from: 2026-06-30
    actors: [deployer]
    sectors: [employment, financial_services, healthcare, education, public_services]
    use_cases: [hiring_and_hr, finance_and_credit]
    summary: >
      Before a high-risk system makes a consequential decision, deployers must notify the consumer that AI is used,
      describe its purpose and nature, and provide contact and opt-out information where applicable. After an
      adverse decision they must state the principal reasons, the data used and its sources, and offer an
      opportunity to correct data and to appeal for human review where feasible.
    practical_action: Add pre-decision AI notices and an adverse-decision explanation and appeal workflow.
    applicability:
      description: Deployers making consequential decisions with high-risk AI.
      actors: [deployer]
      risk_categories: [high_risk]
    evidence_examples:
      - { title: Consumer notice and adverse-action explanation templates, artifact_type: document }
    framework_mappings:
