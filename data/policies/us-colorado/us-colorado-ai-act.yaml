  - slug: us-colorado-ai-act-consumer-ai-interaction-disclosure
    title: Deployers and developers must disclose to consumers that they are interacting with an AI system
    category: transparency
    source_reference: "C.R.S. 6-1-1704"
    is_binding: true
    applies_from: 2026-06-30
    actors: [deployer, provider]
    sectors: [cross_sector, consumer_retail, financial_services, healthcare]
    use_cases: [customer_service, generative_ai]
    summary: >
      Any developer or deployer that makes an AI system available to consumers that is intended to interact with
      them must disclose to each consumer that they are interacting with an AI system, unless that would be obvious
      to a reasonable person. This duty is not limited to high-risk systems and covers chatbots and voice agents
      offered to Colorado consumers.
    practical_action: >
      Add an AI disclosure at the start of chatbot, voice and messaging interactions and record where it appears.
    applicability:
      description: Developers and deployers of any consumer-facing AI system intended to interact with consumers, whatever its risk level.
      actors: [deployer, provider]
      risk_categories: [transparency_risk, high_risk, minimal_risk]
      source_reference: "C.R.S. 6-1-1704"
    evidence_examples:
