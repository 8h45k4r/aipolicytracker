slug: us-colorado-ai-act
jurisdiction: us-colorado
title: "Colorado Senate Bill 24-205: Consumer Protections for Artificial Intelligence (Colorado AI Act)"
short_title: Colorado AI Act
instrument_type: act
status: adopted
status_note: >
  Signed 17 May 2024. The effective date was moved from 1 February 2026 to 30 June 2026 by SB 25B-004, signed in
  August 2025. A reviewer must confirm whether the 2026 legislative session amended the substance or date again.
is_binding: true
featured: true
published: true
issuing_body: Colorado General Assembly
summary_plain: >
  The Colorado AI Act requires developers and deployers of high-risk AI systems to use reasonable care to protect
  consumers from known or reasonably foreseeable risks of algorithmic discrimination. High-risk systems are those
  that make, or are a substantial factor in making, consequential decisions about education, employment, financial
  or lending services, essential government services, healthcare, housing, insurance or legal services. Deployers
  must run risk-management programmes and impact assessments, notify consumers, and explain adverse decisions;
  developers must document systems and disclose known risks.
scope_summary: >
  Applies to developers and deployers doing business in Colorado of high-risk AI systems affecting Colorado
  consumers, with exemptions (for example certain small deployers, systems approved by federal agencies, and some
  regulated financial institutions). Enforcement is exclusively by the Attorney General; there is no private right
  of action.
who_it_applies_to: Developers and deployers of high-risk AI systems used to make consequential decisions about Colorado residents.
key_dates_summary: Signed 17 May 2024; effective 30 June 2026 after the SB 25B-004 delay (subject to verification).
penalties_summary: >
  Violations are deceptive trade practices under the Colorado Consumer Protection Act, enforced by the Attorney
  General. A rebuttable presumption of reasonable care is available where the statute's requirements are met, and
  an affirmative defence exists for organisations that cure violations and follow a recognised risk framework
  such as the NIST AI RMF or ISO/IEC 42001.
what_organizations_must_do: >
  Deployers: adopt a risk-management policy and programme, complete impact assessments annually and within 90 days
  of substantial modification, notify consumers before a consequential decision, explain adverse decisions and
  offer correction and appeal, and notify the Attorney General of discovered algorithmic discrimination within
  90 days. Developers: provide documentation and known-risk disclosures to deployers, publish a public statement on
  high-risk systems, and notify the Attorney General of discovered discrimination.
