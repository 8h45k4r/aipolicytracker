  - slug: us-colorado-ai-act-deployer-reasonable-care
    title: Deployers must use reasonable care to avoid algorithmic discrimination
    category: risk_management
    source_reference: "C.R.S. 6-1-1703(1)"
    is_binding: true
    applies_from: 2026-06-30
    actors: [deployer]
    sectors: [employment, financial_services, healthcare, education, public_services]
    use_cases: [hiring_and_hr, finance_and_credit, health, education, public_services]
    summary: >
      A deployer of a high-risk AI system must use reasonable care to protect consumers from known or reasonably
      foreseeable risks of algorithmic discrimination. A deployer that runs the required risk-management programme,
      completes impact assessments, gives consumer notices and makes the required disclosures benefits from a
      rebuttable presumption of reasonable care; some deployers with fewer than 50 employees are relieved of parts of
      the programme and assessment duties when they rely on the developer's impact assessment.
    practical_action: >
      Treat each consequential-decision use of AI as a governed system with an owner, a risk record and the statutory paperwork so the presumption is available.
    applicability:
      description: Deployers doing business in Colorado that use a high-risk AI system to make or substantially inform consequential decisions.
      actors: [deployer]
      risk_categories: [high_risk]
