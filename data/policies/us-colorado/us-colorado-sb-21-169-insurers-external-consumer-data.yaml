summary_plain: >-
  Insurers in Colorado may not unfairly discriminate on grounds such as race, colour, national or ethnic origin, religion,
  sex, sexual orientation, disability, gender identity or gender expression in any insurance practice, including through
  external consumer data and information sources, algorithms or predictive models. The Commissioner of Insurance writes
  rules for each type of insurance after a stakeholder process, and those rules could not take effect before 1 January
  2023. The Division of Insurance implements it through regulations such as Regulation 10-1-1.
scope_summary: >-
  Insurers doing business in Colorado and their use of external consumer data, algorithms and predictive models in any
  insurance practice.
who_it_applies_to: Insurers doing business in Colorado, by line of insurance as set out in the Commissioner's rules.
key_dates_summary: Signed 6 July 2021; effective 7 September 2021; implementing rules no earlier than 1 January 2023.
what_organizations_must_do: >-
  Avoid unfair discrimination on protected grounds in insurance practices, including through data, algorithms and
  models, and comply with the Commissioner's implementing rules for their line of business.
