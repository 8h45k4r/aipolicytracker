issuing_body: Government of the Netherlands (Ministry of the Interior and Kingdom Relations)
summary_plain: >-
  Adopted in January 2024, the vision sets the government's position on generative AI: a human-centric, safe and fair approach,
  provisional restrictions on using non-contracted generative AI tools with government data, investment in Dutch and European
  open models (GPT-NL), and actions on skills, procurement and supervision. It complements the AI Act and the government's
  AI strategy.
scope_summary: Government of the Netherlands and its bodies; signals expectations for suppliers to government.
