featured: false
published: true
issuing_body: Ministry of the Interior and Kingdom Relations
summary_plain: >-
  A public register in which Dutch government organisations describe the algorithms they use that affect citizens: purpose,
  legal basis, data, human oversight, risks and contact points. Launched in December 2022 and extended since, it aims to
  make automated decision-making by government transparent and contestable. Ministries were asked to publish all impactful
  and high-risk algorithms.
scope_summary: Public bodies in the Netherlands; no duty on private organisations.
