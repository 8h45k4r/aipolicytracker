summary_plain: >-
  A state strategy and implementation roadmap setting out how the Telangana government intends to grow its AI ecosystem
  and use AI in public services over roughly three years, from 2024 to 2027. It is organised around six pillars and
  follows on from the state's earlier 2020 AI framework. It sets policy direction and does not create legal duties.
