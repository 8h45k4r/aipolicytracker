slug: bahrain-general-policy-for-the-use-of-artificial-intelligence
jurisdiction: bahrain
title: General Policy for the Use of Artificial Intelligence
short_title: General Policy for the Use of Artificial Intelligence
instrument_type: policy
status: adopted
status_note: >-
  Document is dated 20 May 2025 (v1.0) while the iGA announcement is dated 27 July 2025; the announcement date is
  used. A separate standalone AI regulation bill (38 articles) was approved by the Shura Council in April 2024 and
  returned by the government for reconsideration, but no official Shura/parliament page could be verified, so it
  is omitted. A national AI strategy is reported to be in development (iGA) but no official document was found.
is_binding: false
featured: false
published: true
issuing_body: Information & eGovernment Authority (iGA)
summary_plain: >-
  A binding policy for Bahraini government entities structured around four pillars: compliance with AI-related laws
  and policies (including the Personal Data Protection Law and the GCC AI ethics guide), use and adoption of AI
  technologies, awareness and education, and local and international cooperation. It defines roles and responsibilities
  for entities and assigns oversight to iGA. Alongside the policy, Bahrain adopted the GCC Guiding Manual on the
  Ethics of AI Use.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Information & eGovernment Authority (iGA). Oversight:
  iGA under the Ministerial Committee for Information Technology and Communication (MCICT). Stated purpose: Ensure
  safe, ethical and lawful use of AI by government entities in line with Vision 2030.
key_dates_summary: >-
  2025-05-20: Policy version 1.0 first release date (per document); 2025-07-27: iGA publicly launches the National
  Policy for the Use of AI and adopts the GCC AI ethics manual
