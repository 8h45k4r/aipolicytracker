title: Draft South Africa National Artificial Intelligence (AI) Policy
short_title: Draft South Africa National Artificial Intelligence
instrument_type: policy
status: archived
status_note: >-
  The earlier South Africa National AI Policy Framework (Aug/Oct 2024, comments to 29 Nov 2024) is referenced in
  the gazette notice, but its DCDT page (dcdt.gov.za/sa-national-ai-policy-framework/...) now serves unrelated content,
  so it is not recorded as a separate entry. Withdrawal notice is signed 4 June 2026 and gazetted 12 June 2026.
is_binding: false
featured: false
published: true
issuing_body: Department of Communications and Digital Technologies (DCDT)
summary_plain: >-
  Approved by Cabinet in March/April 2026 and gazetted for a 60-day comment period, the draft policy proposed guiding
  principles, institutional arrangements and implementation pathways for AI across the public and private sectors,
  building on the department's 2024 National AI Policy Framework. The Minister announced its withdrawal on 26 April
  2026 after fictitious citations were found in its reference list, and the withdrawal was formally gazetted in
  June 2026.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Department of Communications and Digital Technologies
  (DCDT). Oversight: DCDT; Cabinet-approved draft published for public comment. Stated purpose: Set national principles,
  institutions and pathways for safe and inclusive AI adoption.
key_dates_summary: >-
