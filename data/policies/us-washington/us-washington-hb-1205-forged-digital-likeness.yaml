summary_plain: >-
  This law adds the knowing distribution of a forged digital likeness to the offence of criminal impersonation in the
  second degree, a gross misdemeanour. A forged digital likeness is a realistic fake image, video or audio of an
  identifiable real person that misrepresents their appearance, speech or conduct and is likely to deceive a reasonable
  person; the offence requires sharing it as genuine, knowing or having reason to know it is not, with intent to
  defraud, harass, threaten or intimidate or for another unlawful purpose. Lawful uses such as satire, parody, art and
  news are excluded, and online, mobile and broadband services are not liable merely for content others post.
scope_summary: >-
  People in Washington who knowingly distribute realistic synthetic images, video or audio of an identifiable person,
  presented as genuine, for fraudulent, harassing, threatening or other unlawful purposes.
who_it_applies_to: Individuals who distribute forged digital likenesses; intermediaries are protected for third-party content.
key_dates_summary: 'Approved 16 April 2025 (Chapter 51, Laws of 2025); effective 27 July 2025.'
penalties_summary: Criminal impersonation in the second degree is a gross misdemeanour.
