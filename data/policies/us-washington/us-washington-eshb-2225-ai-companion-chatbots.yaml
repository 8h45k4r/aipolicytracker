summary_plain: >-
  Operators must disclose that a companion chatbot is AI, repeat the notice hourly where the user is known to be a minor or
  the chatbot is directed to minors, limit sexual content
  and manipulative engagement tactics for minors, and keep and publish a self-harm protocol with crisis referrals. A violation
  is a violation of the Consumer Protection Act.
scope_summary: AI companion chatbots offered to users in Washington State.
