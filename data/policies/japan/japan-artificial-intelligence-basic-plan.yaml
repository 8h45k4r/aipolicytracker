summary_plain: >-
  The AI Basic Plan is the national strategy required under Article 18 of the 2025 AI Act. It sets basic policies
  and concrete measures across four areas: accelerating AI deployment, strengthening development capabilities, leading
  AI governance and building an AI-powered society, with the stated ambition of Japan becoming the most AI-friendly
  country. The first plan was adopted by Cabinet decision in December 2025 and a revised second plan was adopted
  in July 2026.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Cabinet of Japan (Cabinet Office, AI Strategy
  Headquarters). Oversight: AI Strategy Headquarters chaired by the Prime Minister; Cabinet Office coordinates follow-up
  and revisions. Stated purpose: Statutory national AI strategy to make Japan a leading AI-adopting nation.
