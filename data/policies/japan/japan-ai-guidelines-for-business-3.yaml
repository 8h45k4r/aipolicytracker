summary_plain: >-
  The AI Guidelines for Business consolidate Japan's previous AI R&D, utilisation and governance guidelines into
  a single non-binding document addressed to AI developers, providers and business users. They set common guiding
  principles (such as human-centricity, safety, fairness, privacy, security, transparency and accountability) and
  describe agile governance practices, with an appendix of practical methods and checklists. The guidelines are
  updated periodically; version 1.0 was issued in April 2024 and version 1.2 in March 2026.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Ministry of Economy, Trade and Industry and Ministry
  of Internal Affairs and Communications. Oversight: METI and MIC jointly maintain; secretariat shared with IPA/AI
  Safety Institute; voluntary adoption by developers, providers and users. Stated purpose: Unify earlier AI ethics
  and governance guidelines into one voluntary, risk-based guide for business.
