summary_plain: >-
  The APPI is Japan's general law on personal information, administered by the Personal Information Protection
  Commission. It sets rules for businesses that handle personal information, which apply when AI systems use
  such data. The 2020 amendment widened the data individuals can ask a business to disclose or stop using, so
  that it includes data kept for less than six months, and raised the maximum fine for false reports to 500,000
  yen; a 2021 law then brought public-sector bodies under the same framework.
scope_summary: >-
  Business operators handling personal information in Japan and, since the 2021 amendments, public-sector
  bodies.
who_it_applies_to: Businesses and public bodies handling personal information in Japan.
key_dates_summary: >-
  2020 amendment approved by the Diet 5 June 2020 and promulgated 12 June 2020; amended Act fully in effect 1
  April 2022.
