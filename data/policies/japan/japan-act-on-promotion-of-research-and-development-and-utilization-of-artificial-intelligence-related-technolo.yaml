is_binding: true
featured: false
published: true
issuing_body: National Diet of Japan; administered by the Cabinet Office
summary_plain: >-
  Japan's first AI-specific statute establishes basic principles and a governmental framework for promoting AI research,
  development and use. It creates an AI Strategy Headquarters under the Cabinet, requires the government to adopt
  an AI Basic Plan, and provides for guidelines, information gathering and investigation of cases where AI infringes
  rights, together with guidance to businesses and the public. Businesses are asked to cooperate with government
  measures; the Act contains no fines or prohibitions.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by National Diet of Japan; administered by the Cabinet
  Office. Oversight: Artificial Intelligence Strategy Headquarters chaired by the Prime Minister with all Cabinet
  ministers as members. Stated purpose: Promote AI research and use nationally while addressing public concern about
  risks, without new penalties.
key_dates_summary: >-
