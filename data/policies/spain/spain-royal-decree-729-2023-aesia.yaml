title: >-
  Real Decreto 729/2023, de 22 de agosto, por el que se aprueba el Estatuto de la Agencia Española de Supervisión de Inteligencia
  Artificial
short_title: Royal Decree 729/2023 (AESIA statute)
instrument_type: regulation
status: in_force
is_binding: true
featured: false
published: true
issuing_body: Government of Spain
summary_plain: >-
  Creates and organises AESIA, the Spanish AI Supervision Agency, as a public body attached to the Ministry for Digital
  Transformation. AESIA supervises and inspects AI systems, promotes sandboxes and standards, and acts as national authority
  for the EU AI Act. The decree sets its governance, functions and funding.
scope_summary: >-
  Institutional: establishes the agency and its powers over AI systems placed on or used in the Spanish market.
