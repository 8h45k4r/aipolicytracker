slug: spain-royal-decree-817-2023-ai-sandbox
jurisdiction: spain
title: >-
  Real Decreto 817/2023, de 8 de noviembre, que establece un entorno controlado de pruebas para el ensayo del cumplimiento
  de la propuesta de Reglamento de IA
short_title: Royal Decree 817/2023 (AI regulatory sandbox)
instrument_type: regulation
status: in_force
is_binding: true
featured: false
published: true
issuing_body: Government of Spain
summary_plain: >-
  Establishes Spain's controlled testing environment (sandbox) for providers of high-risk AI systems to test compliance
  with the then-proposed EU AI Act requirements: risk management, data governance, documentation, transparency, human oversight,
  accuracy and robustness. Participation is voluntary; participants receive guidance and produce documentation that feeds
  into national implementation.
scope_summary: >-
  Voluntary for AI providers and, where relevant, deployers selected through calls; obligations arise only for participants.
