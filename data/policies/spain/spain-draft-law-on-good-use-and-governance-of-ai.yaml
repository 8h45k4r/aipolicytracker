issuing_body: Ministry for Digital Transformation and the Civil Service
summary_plain: >-
  The draft implements the EU AI Act in Spain: it allocates supervision among AESIA, the data-protection authority, the
  electoral board, the financial and audiovisual regulators, sets the national penalty scale (up to EUR 35 million or 7%
  of turnover for prohibited practices), treats failure to label AI-generated content as a serious infringement and provides
  for the national sandbox to continue.
scope_summary: >-
  Providers, deployers, importers and distributors of AI systems in Spain within the scope of the EU AI Act.
date_notes: Draft; dates to be confirmed once published in the BOE.
