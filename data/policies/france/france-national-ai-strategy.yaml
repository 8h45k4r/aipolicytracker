issuing_body: Government of France (Ministry of the Economy, SGPI)
summary_plain: >-
  Launched in March 2018 following the Villani report, the national AI strategy funds research institutes (3IA then AI clusters),
  talent, compute and business adoption. The second phase (2021) focused on training and diffusion into the economy; the
  third phase (2024–2025) emphasises sovereign generative-AI models, compute and public-sector use, and framed France's
  hosting of the AI Action Summit in February 2025.
scope_summary: Government investment and coordination programme; no obligations on private organisations.
key_dates_summary: '2018-03-29: strategy launched; 2021-11-08: phase 2; 2025-02-10: AI Action Summit in Paris.'
adopted_on: '2018-03-29'
date_notes: Phase 1 announced 29 March 2018; phase 2 November 2021; phase 3 2024.
