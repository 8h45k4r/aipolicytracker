issuing_body: Commission nationale de l'informatique et des libertés (CNIL)
summary_plain: >-
  A series of practical guidance sheets, first published in 2024 and extended since, explaining how organisations can develop
  and train AI systems in compliance with the GDPR: defining a purpose, choosing a legal basis (including legitimate interest
  for web-scraped training data), data minimisation, retention, data-protection impact assessments, informing people and
  honouring their rights, and security of training datasets and models.
scope_summary: >-
  Applies to any controller or processor developing or training AI systems with personal data under French and EU data-protection
  law.
