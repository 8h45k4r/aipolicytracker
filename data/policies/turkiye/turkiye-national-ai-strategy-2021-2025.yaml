summary_plain: >-
  Published by Presidential Circular in August 2021, the strategy sets six priorities: training AI experts and increasing
  employment, supporting research and innovation, access to quality data and technical infrastructure, regulations to accelerate
  socio-economic adaptation, strengthening international cooperation, and accelerating structural and workforce transformation.
  Its action plan was updated for 2024–2025.
