summary_plain: >-
  A short framework bill proposing principles for AI (safety, transparency, fairness, accountability, privacy), a risk-based
  approach with registration of high-risk systems, operator obligations and penalties, and supervision by designated authorities,
  broadly modelled on the EU AI Act.
