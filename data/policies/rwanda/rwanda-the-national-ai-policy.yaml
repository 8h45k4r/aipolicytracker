summary_plain: >-
  Rwanda's national AI policy sets out six policy areas and fourteen recommendations covering skills and literacy,
  infrastructure, data, responsible AI governance, public-sector adoption and ecosystem development. It proposes
  a Responsible AI Office housed in MINICT to drive an implementation plan and monitor progress. Priority sectors
  include health, agriculture, education, finance and public services.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Ministry of ICT and Innovation (MINICT) with
  Rwanda Utilities Regulatory Authority (RURA). Oversight: MINICT leads; policy proposes a Responsible AI Office
  within MINICT to coordinate implementation. Stated purpose: Use AI to power growth and position Rwanda as a responsible-AI
  innovator.
key_dates_summary: >-
  2023-04-20: Policy approved by Cabinet (per policy partners); full text published by MINICT
