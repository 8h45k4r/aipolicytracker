summary_plain: >-
  Published in January 2020, the strategy sets ethical principles for AI in Norway based on the EU High-Level Expert Group
  guidelines, and measures on data access and sharing, language resources, research, skills, public-sector and business
  adoption, security and the Data Protection Authority's sandbox.
