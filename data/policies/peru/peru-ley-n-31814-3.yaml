issuing_body: Congreso de la República; implemented by the Presidencia del Consejo de Ministros (PCM)
summary_plain: >-
  Law 31814, promulgated on 4 July 2023 and published on 5 July 2023, declares AI development of national interest
  and frames its use within Peru's digital transformation process. It sets principles such as risk-based safety,
  ethics, transparency and multi-stakeholder participation, and designates the PCM's digital government secretariat
  as the national AI authority. The law is promotional in character and left detailed obligations to a later regulation.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Congreso de la República; implemented by the
  Presidencia del Consejo de Ministros (PCM). Oversight: PCM, through the Secretaría de Gobierno y Transformación
  Digital, is the national technical-regulatory authority. Stated purpose: Promote AI adoption within the national
  digital transformation while safeguarding rights.
