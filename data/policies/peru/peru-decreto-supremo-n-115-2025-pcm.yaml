summary_plain: >-
  This regulation, published on 9 September 2025, develops Law 31814 with six titles and 36 articles. It introduces
  a risk classification distinguishing prohibited uses, high-risk systems and acceptable-risk systems, sets transparency,
  data protection and governance obligations for public and private actors, and provides for sandboxes, capacity-building
  and reporting channels. Compliance is phased in over one to four years depending on the sector and type of organisation.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Presidencia del Consejo de Ministros (PCM). Oversight:
  PCM's Secretaría de Gobierno y Transformación Digital supervises compliance. Stated purpose: Operationalise the
  AI promotion law with risk-based obligations.
