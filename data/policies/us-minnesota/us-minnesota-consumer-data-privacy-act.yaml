summary_plain: >-
  Minnesota's comprehensive consumer privacy law gives residents rights over their personal data and is enforced by
  the Attorney General. For profiling that feeds decisions with legal or similarly significant effects, such as those
  on housing, employment, education or health care, consumers can opt out, question the result, be told the reason
  for it and, where feasible, what they could do to get a different outcome. They can also review the personal data
  used and, if it was wrong, have it corrected and the decision reconsidered.
scope_summary: >-
  Controllers and processors handling personal data of Minnesota residents that fall within the Act's thresholds,
  including when they profile consumers for decisions with legal or similarly significant effects.
who_it_applies_to: Businesses (controllers and processors) processing personal data of Minnesota consumers within the Act's thresholds.
key_dates_summary: >-
  Approved by the Governor on 24 May 2024; effective 31 July 2025; postsecondary institutions regulated by the Office of
  Higher Education need not comply until 31 July 2029.
what_organizations_must_do: >-
  Honour opt-outs from profiling used for significant decisions; on request, explain a profiling-based decision, the
  reasons for it and, where feasible, how to obtain a different result; let consumers review and correct the data used
  and reconsider the decision.
