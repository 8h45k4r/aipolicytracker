summary_plain: >-
  Kenya's first national AI strategy sets a five-year agenda built on three pillars: AI digital infrastructure,
  data and AI governance, and AI research, innovation and commercialisation. It aligns with the Kenya National Digital
  Masterplan 2022-2032 and priorities sectors such as agriculture, health and education. A separate implementation
  roadmap was later published by the ministry.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Ministry of Information, Communications and the
  Digital Economy (MICDE). Oversight: MICDE leads implementation with partners; implementation roadmap published
  Dec 2025. Stated purpose: Position Kenya as a competitive, secure and future-ready AI economy.
