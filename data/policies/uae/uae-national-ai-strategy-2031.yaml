issuing_body: UAE Government, Office of the Minister of State for Artificial Intelligence
summary_plain: >
  The UAE National Strategy for AI 2031 aims to position the UAE as a global leader in AI by 2031. It sets objectives
  across priority sectors, AI talent and research, data and infrastructure, government adoption and governance,
  including a commitment to AI ethics and to developing appropriate regulation. It is a strategy document that
  guides government programmes and does not itself impose obligations on private organisations.
scope_summary: >
  UAE federal government entities and national programmes; indirectly the private sector and research institutions
  participating in national AI initiatives.
who_it_applies_to: UAE government entities (primary); AI companies and partners engaging with government (indirect).
key_dates_summary: Announced October 2017; strategy document published 2018; ongoing implementation to 2031.
penalties_summary: None; strategy.
what_organizations_must_do: >
  No mandatory duties. Organisations working with UAE government entities should align with the strategy's
  ethics commitments and the AI Ethics Principles and Guidelines and AI Charter.
