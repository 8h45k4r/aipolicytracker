issuing_body: UAE Cabinet / Artificial Intelligence, Digital Economy and Remote Work Applications Office
summary_plain: >-
  A twelve-principle charter approved by the UAE Cabinet setting expectations for AI development and use, including
  safety, algorithmic bias, data privacy, transparency, human oversight, governance and accountability, and compliance
  with applicable laws and treaties. It is a guiding framework rather than binding legislation and supports the
  objectives of the UAE Strategy for AI.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by UAE Cabinet / Artificial Intelligence, Digital
  Economy and Remote Work Applications Office. Oversight: AI Office under the Minister of State for AI; applies
  across federal entities. Stated purpose: Guiding principles for safe, ethical and inclusive AI aligned with the
  2031 strategy.
