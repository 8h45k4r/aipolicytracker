issuing_body: UAE Government / Minister of State for Artificial Intelligence
summary_plain: >-
  Launched in October 2017, the strategy aims to embed AI across government services and priority sectors such as
  health, education, transport, energy and space, and to make the UAE a leading AI destination by 2031. Its objectives
  include AI-friendly legislation, talent development, research capability, data infrastructure and strong governance.
  The UAE Council for AI was created to drive implementation.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by UAE Government / Minister of State for Artificial
  Intelligence. Oversight: UAE Council for Artificial Intelligence oversees implementation via committees and sub-councils.
  Stated purpose: Make the UAE a global AI leader by 2031 as the first project of UAE Centennial 2071.
