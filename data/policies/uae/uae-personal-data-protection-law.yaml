    summary: >
      Before processing that uses modern technologies and is likely to pose a high risk to privacy, controllers must
      assess the impact on personal data protection, covering the processing, its purposes, risks and safeguards.
    practical_action: Run a DPIA for AI systems processing personal data of UAE residents and keep it on file.
    applicability:
