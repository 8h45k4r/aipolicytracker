obligations:
  - slug: uae-pdpl-automated-decision-objection
    title: Respect the right to object to automated decision-making without human intervention
    category: human_oversight
    source_reference: "Article on data-subject rights relating to automated processing (reviewer to cite article number)"
    is_binding: true
    actors: [deployer]
    sectors: [cross_sector]
    use_cases: [finance_and_credit, hiring_and_hr]
    summary: >
      Data subjects may object to decisions based solely on automated processing, including profiling, that
      produce legal or similarly serious effects, subject to exceptions such as contractual necessity or consent.
    practical_action: Provide a human-review route for significant automated decisions affecting UAE residents.
    applicability:
      description: Controllers making solely automated decisions with significant effects.
      actors: [deployer]
