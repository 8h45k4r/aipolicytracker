is_binding: true
published: true
issuing_body: UAE Federal Government
summary_plain: >
  The UAE Personal Data Protection Law is the federal data-protection law applying outside the DIFC and ADGM free
  zones. It sets principles for lawful processing, consent and its exceptions, data-subject rights (including the
  right to object to automated decision-making without human intervention), controller and processor duties,
  security and breach notification to the UAE Data Office, cross-border transfer rules, and data protection
  impact assessments for high-risk processing including new technologies.
scope_summary: >
  Controllers and processors in the UAE (outside the financial free zones) and those outside the UAE processing
  personal data of individuals in the UAE. Government data, security bodies and health and banking data covered
  by other laws are excluded or partly excluded.
who_it_applies_to: Organisations processing personal data of individuals in the UAE, including AI developers and deployers using such data.
key_dates_summary: Issued 20 September 2021; in force 2 January 2022; compliance period runs from issuance of executive regulations (status to be confirmed).
penalties_summary: Administrative penalties to be set by Cabinet decision (reviewer to confirm current position).
what_organizations_must_do: >
  Establish a lawful basis for AI data processing, provide rights including objection to automated decisions,
  conduct impact assessments for high-risk AI processing, secure data and notify breaches to the Data Office.
