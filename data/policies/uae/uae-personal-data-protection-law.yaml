title: "Federal Decree-Law No. 45 of 2021 on the Protection of Personal Data (UAE PDPL)"
short_title: UAE PDPL
instrument_type: act
status: in_force
status_note: >
  In force since 2 January 2022. Executive regulations that trigger the compliance period for organisations had
