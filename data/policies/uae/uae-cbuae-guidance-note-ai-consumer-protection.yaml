summary_plain: >-
  The UAE central bank's guidance to the financial institutions it licenses on adopting AI and machine learning
  responsibly and protecting consumers. Boards and senior management are to be accountable for AI systems and their
  outcomes, and institutions should test for bias at least once a year and whenever a model is changed or introduced.
  Customers should be told when AI is used, especially for high-impact decisions, and be able to ask for a human review
  or an explanation. Institutions should carry out due diligence on AI vendors, keep an inventory of their AI models and
  always be able to stop using a model through human intervention.
scope_summary: >-
  All financial institutions licensed by the Central Bank of the UAE that develop, buy or use AI or machine learning,
  particularly in dealings with consumers.
