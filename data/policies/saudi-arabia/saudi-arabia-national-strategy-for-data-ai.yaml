summary_plain: >-
  The national strategy, approved by royal decision in July 2020, sets an ambition for Saudi Arabia to be among
  the leading data- and AI-driven economies through phased milestones to 2030. It targets talent development, welcoming
  regulation, investment attraction, research and an active ecosystem, with measurable goals such as training data
  and AI specialists, attracting investment and creating startups.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Saudi Data and Artificial Intelligence Authority
  (SDAIA). Oversight: SDAIA guides and supervises execution by government entities and runs its own initiatives.
  Stated purpose: Make the Kingdom a global hub for data and AI in support of Vision 2030.
