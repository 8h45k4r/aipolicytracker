summary_plain: >-
  SDAIA's AI Ethics Principles set out ethical principles and associated controls for entities developing, deploying
  or affected by AI systems in Saudi Arabia, covering fairness, privacy and security, humanity, social and environmental
  benefit, reliability and safety, transparency, and accountability. The document assigns roles and responsibilities
  and marks certain controls as binding for public entities. The 2025 edition updates the September 2023 version
  1.0.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Saudi Data and Artificial Intelligence Authority
  (SDAIA). Oversight: SDAIA issues and updates the principles and oversees adoption by public entities. Stated purpose:
  Ensure responsible, safe and rights-respecting AI development and use in the Kingdom.
