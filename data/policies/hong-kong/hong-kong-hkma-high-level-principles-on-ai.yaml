summary_plain: >-
  A supervisory circular from the Hong Kong Monetary Authority setting out high-level principles for banks that design
  and adopt AI and big data analytics applications. The themes include explainability of AI outcomes, board and senior
  management accountability, in-house expertise, auditability, data quality, management of third parties and data
  protection. The HKMA kept the principles deliberately high level so as not to hold back innovation, and replaced them in
  October 2026 with new supervisory guidance on responsible AI adoption.
scope_summary: >-
  Authorized institutions in Hong Kong (licensed banks, restricted licence banks and deposit-taking companies) using AI
  applications.
who_it_applies_to: Authorized institutions supervised by the Hong Kong Monetary Authority.
