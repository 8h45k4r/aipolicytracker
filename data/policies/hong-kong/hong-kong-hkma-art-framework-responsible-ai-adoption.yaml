status_note: >-
  Announced by the HKMA on 15 October 2026. The supervisory guidance states that it supersedes the HKMA circular
  "High-level Principles on Artificial Intelligence" of 1 November 2019. A discussion paper on agentic AI governance was
  announced as forthcoming. Recorded on 26 November 2026 from search-engine extracts of the official pages listed; the
  official text could not be opened from the research environment, so every date and duty here is pending review against it.
