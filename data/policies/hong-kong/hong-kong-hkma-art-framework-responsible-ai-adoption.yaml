summary_plain: >-
  A framework from the Hong Kong Monetary Authority, under its Fintech 2030 strategy, for responsible AI use in banking,
  built on three pillars: accountability, resilience and trust. Its supervisory guidance sets nine principles across the
  pillars, drawing on the second cohort of the HKMA generative AI sandbox, and expects banks to assess the materiality and
  risk of each AI use case, with stricter controls such as senior management sign-off for higher-risk ones. The
  announcement also covered an AI training data sharing platform and planned work on agentic AI.
scope_summary: >-
  Authorized institutions in Hong Kong that develop or use AI, including generative and agentic AI applications.
who_it_applies_to: Authorized institutions supervised by the Hong Kong Monetary Authority.
