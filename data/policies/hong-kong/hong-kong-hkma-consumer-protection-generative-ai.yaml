summary_plain: >-
  A circular asking banks to extend the HKMA's 2019 consumer protection principles for big data analytics and AI to
  generative AI used in customer-facing applications, with extra safeguards. Boards and senior management stay
  accountable, a human should be involved in decisions in early deployments, customers should be told when generative AI
  is used and be able to opt out or ask for human review, and customer data must be protected under the Personal Data
  (Privacy) Ordinance.
scope_summary: >-
  Authorized institutions in Hong Kong that use generative AI in applications that serve customers.
who_it_applies_to: Authorized institutions supervised by the Hong Kong Monetary Authority.
