summary_plain: >-
  Published in April 2025, the guideline covers the technical characteristics and risks of generative AI, governance principles
  (safety, transparency, accountability, data protection, fairness) and practical application guidance for developers, service
  providers and users across the AI lifecycle, and is intended as a reference for industry and government.
