issuing_body: Office of the Privacy Commissioner for Personal Data, Hong Kong
summary_plain: >-
  Published 11 June 2024, the framework gives organisations that procure, implement and use AI systems involving personal
  data recommendations in four areas: AI strategy and governance (an AI governance committee, procurement due diligence),
  risk assessment and human oversight (a risk-based approach with levels of human involvement), customisation and implementation
  of AI models (data preparation, testing, security), and communication and engagement with stakeholders (transparency,
  explainability, opt-out, feedback). It builds on the 2021 Guidance on the Ethical Development and Use of AI.
scope_summary: >-
  Voluntary for organisations in Hong Kong deploying AI with personal data; compliance with the Personal Data (Privacy)
  Ordinance remains mandatory.
