summary_plain: >-
  A circular from the Hong Kong Monetary Authority giving banks guiding principles for protecting consumers when they use
  big data analytics and AI. The principles fall under four headings: governance and accountability, fairness,
  transparency and disclosure, and data privacy and protection, including compliance with the Personal Data (Privacy)
  Ordinance. Institutions are expected to apply them in proportion to the risks of each application.
scope_summary: >-
  Authorized institutions in Hong Kong that use big data analytics and AI in products and services offered to customers.
who_it_applies_to: Authorized institutions supervised by the Hong Kong Monetary Authority.
