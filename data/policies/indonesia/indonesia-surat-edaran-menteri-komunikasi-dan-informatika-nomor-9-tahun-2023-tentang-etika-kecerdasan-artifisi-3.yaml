issuing_body: Ministry of Communication and Informatics (now Ministry of Communication and Digital)
summary_plain: >-
  A ministerial circular that lays out ethical values for developing and using AI, such as inclusivity, humanity,
  security, accessibility, transparency, accountability, personal data protection, sustainability and respect for
  intellectual property. It applies to AI-related businesses and to public and private electronic system operators
  in Indonesia. It is soft-law guidance intended as a basis for future regulation.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Ministry of Communication and Informatics (now
  Ministry of Communication and Digital). Oversight: Ministry of Communication and Digital (Komdigi). Stated purpose:
  Set ethical expectations for AI developers and electronic system operators pending binding regulation.
