summary_plain: >-
  A draft presidential regulation, prepared under Presidential Decree No. 38 of 2025, that would establish a binding
  national AI roadmap for 2026-2029 alongside a companion draft regulation on AI ethics. Inter-ministerial discussion
  agreed four policy directions: stakeholder engagement, innovation, technology and research capability, and risk
  mitigation. Cross-ministry deliberations concluded in May 2026 and both drafts were submitted to the President
  for enactment.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Ministry of Communication and Digital (Komdigi).
  Oversight: Komdigi as lead sector coordinating an inter-ministerial committee. Stated purpose: Give Indonesia's
  AI roadmap and ethics rules legal force through presidential regulations.
key_dates_summary: >-
