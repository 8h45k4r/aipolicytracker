summary_plain: >-
  Indonesia's long-range national AI strategy, prepared by a BPPT-led multi-stakeholder working group. It covers
  ethics and policy, talent, infrastructure and data, research and industry innovation, and names five priority
  areas: health, bureaucratic reform, education and research, food security, and mobility and smart cities. It includes
  quick wins and a phased implementation roadmap through 2045.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Agency for the Assessment and Application of
  Technology (BPPT), now part of BRIN. Oversight: BPPT-led working group (now BRIN) with ministries, universities
  and industry. Stated purpose: Direct AI development toward Indonesia's 2045 development goals across priority
  sectors.
