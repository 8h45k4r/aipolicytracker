summary_plain: >-
  Developed by the Qatar Center for Artificial Intelligence and adopted by the government as the national strategy,
  the document sets out six pillars: education, data access, employment, business, research, and ethics. It provides
  recommendations for building an AI research and innovation ecosystem and for the responsible adoption of AI across
  society. A national AI committee was subsequently formed to develop an implementation plan.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Ministry of Communications and Information Technology
  (formerly Ministry of Transport and Communications). Oversight: National Artificial Intelligence Committee under
  MCIT oversees implementation planning. Stated purpose: Prepare Qatar for an 'AI+X' future in line with Qatar National
  Vision 2030.
