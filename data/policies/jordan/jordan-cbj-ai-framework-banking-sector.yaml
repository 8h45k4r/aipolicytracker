summary_plain: >-
  The Central Bank of Jordan's framework for how the banks it regulates use AI. It covers governance, ethics,
  compliance, data management, security, incident response and third-party risk. Banks in scope are expected to set up
  an AI oversight committee or clearly assign responsibility for AI, fold AI risk into their existing risk management
  and keep human oversight and the ability to intervene for critical systems. Customers are to be told clearly when
  they are dealing with an AI system and be able to opt out of AI-driven processes without losing access to essential
  banking services.
scope_summary: >-
  Banking institutions regulated by the Central Bank of Jordan that develop, buy or use AI systems, including through
  third-party providers.
who_it_applies_to: Banks and other institutions regulated by the Central Bank of Jordan that use AI.
