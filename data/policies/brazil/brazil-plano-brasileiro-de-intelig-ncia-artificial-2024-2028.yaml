status_note: >-
  The MCTI landing page confirms launch at the 5th CNCTI without printing the day; the 30 July 2024 date is drawn
  from gov.br news search snippets (MGI/MCTI) and the CCT resolution records its plenary of 29 July 2024. MGI news
  page and CCT resolution page both return HTTP 200 (MGI page content not text-parsed). Full plan PDF at gov.br
  returns HTTP 200. Some MCTI news pages served a 'Conteúdo Restrito' placeholder to automated fetches.
is_binding: false
featured: false
published: true
issuing_body: >-
  Ministério da Ciência, Tecnologia e Inovação (MCTI) with the Conselho Nacional de Ciência e Tecnologia (CCT)
summary_plain: >-
  The PBIA is a four-year national plan that commits around R$23 billion to AI infrastructure, skills, public-sector
  applications, business innovation and governance. Headline measures include acquiring a top-tier supercomputer
  powered by renewable energy, developing Portuguese-language models, and short-term actions in health, education,
  agriculture and public services. The proposal was presented at the 5th National Conference on Science, Technology
  and Innovation and formally approved by the CCT through Resolução CCT nº 4/2024, with a final version later published
  under MCTI coordination.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Ministério da Ciência, Tecnologia e Inovação
  (MCTI) with the Conselho Nacional de Ciência e Tecnologia (CCT). Oversight: MCTI coordinates implementation; plan
  proposal approved by the CCT. Stated purpose: Build sovereign AI capacity and public-interest AI applications.
key_dates_summary: >-
  2024-07-30: PBIA proposal presented at the 5th National CT&I Conference; 2024-11-12: Resolução CCT nº 4/2024 approving
  the PBIA proposal published in the DOU
