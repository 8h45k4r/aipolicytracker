summary_plain: >-
  PL 2338/2023 is Brazil's flagship AI bill, introduced in the Senate in May 2023 and approved by the Senate plenary
  on 10 December 2024 after extensive amendment. It classifies AI systems by risk, bans certain uses, sets obligations
  for developers and deployers of high-risk systems, and provides for rights of affected persons and a national
  governance system. The Senate transmitted the text to the Chamber of Deputies on 17 March 2025, where a special
  committee is examining it.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Senado Federal (author: Senator Rodrigo Pacheco);
  now before the Câmara dos Deputados. Oversight: Bill proposes a national AI governance system led by a competent
  authority (SIA); currently under review by a Chamber of Deputies special committee. Stated purpose: Create a comprehensive,
  risk-based legal framework for AI in Brazil.
