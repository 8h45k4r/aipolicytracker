issuing_body: Parliament of the Republic of Kazakhstan
summary_plain: >-
  The law defines AI systems and their classification by level of autonomy and risk, sets principles (legality, fairness,
  transparency, safety, human control), assigns duties to owners and operators of AI systems including risk management,
  labelling of AI-generated content and protection of personal data, prohibits certain manipulative and social-scoring uses,
  provides for a national AI platform and state support measures, and allocates state regulation to the authorised body.
scope_summary: Owners, developers and operators of AI systems in Kazakhstan and public bodies using AI.
