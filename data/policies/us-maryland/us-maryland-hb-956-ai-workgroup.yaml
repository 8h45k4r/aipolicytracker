summary_plain: >-
  Creates a workgroup of legislators and outside members to study artificial intelligence and recommend how Maryland
  should regulate it. Its remit includes AI used in decisions with a significant effect on people's livelihoods, the
  duties of developers and employers, consumer rights, current private-sector use and the effect of AI on decisions
  about government benefits. It reports to General Assembly committees each year; it places no duties on businesses.
scope_summary: >-
  A legislative study body; members appointed by the Senate President and the House Speaker, with business, consumer
  protection, data privacy and cybersecurity representatives.
who_it_applies_to: The Maryland General Assembly and the workgroup it creates; no duties on private organisations.
key_dates_summary: >-
  Approved on 22 April 2025 as Chapter 105; effective 1 July 2025; first report due by 1 July 2026, then yearly.
