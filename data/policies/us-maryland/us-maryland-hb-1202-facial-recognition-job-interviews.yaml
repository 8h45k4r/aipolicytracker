summary_plain: >-
  Stops employers in Maryland from using a facial recognition service to build a facial template of a job applicant
  during an interview unless the applicant has agreed in a signed waiver. The waiver has to name the applicant, give
  the interview date, state plainly that the applicant consents to facial recognition during the interview and say
  whether the applicant read it. The provision sits in the Labor and Employment Article (section 3-717).
scope_summary: >-
  Employers in Maryland that use facial recognition technology to create facial templates of applicants during job
  interviews.
who_it_applies_to: Employers interviewing job applicants in Maryland.
key_dates_summary: Enacted on 8 May 2020 without the Governor's signature (Chapter 446); effective 1 October 2020.
what_organizations_must_do: >-
  Organisations in scope must not use a facial recognition service to create a facial template during an applicant's
  interview unless the applicant first signs a consent waiver containing the details the law lists.
