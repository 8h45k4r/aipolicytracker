summary_plain: >-
  Sets conditions for health insurers, pharmacy benefit managers and private review agents that use artificial
  intelligence, algorithms or other software in utilization review, including tools run for them by a third party.
  The tool has to rest on the individual patient's clinical history rather than only on group data, may not take the
  place of a health care provider's judgement and may not itself deny, delay or modify care. Tools must be open to
  audit by the Insurance Commissioner, and carriers must say in their quarterly adverse decision reports whether such
  a tool was used.
scope_summary: >-
  Carriers, pharmacy benefit managers and private review agents in Maryland that use AI, algorithms or other software
  tools for utilization review, directly or through a third party.
who_it_applies_to: Maryland health insurance carriers, pharmacy benefit managers and private review agents.
key_dates_summary: Approved by the Governor on 20 May 2025 as Chapter 747; effective 1 October 2025.
what_organizations_must_do: >-
  Organisations in scope must make sure any AI or software tool used in utilization review bases its determinations on
  the enrollee's own medical or clinical history, does not replace the role of a health care provider and does not
  deny, delay or modify services; keep the tool open to inspection by the Insurance Commissioner; review its
  performance regularly (the extracts say at least quarterly); and report in the quarterly adverse decisions and
  grievances report whether such a tool was used in an adverse decision.
