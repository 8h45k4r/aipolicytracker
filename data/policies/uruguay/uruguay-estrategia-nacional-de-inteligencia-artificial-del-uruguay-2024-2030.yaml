summary_plain: >-
  Uruguay's 2024-2030 strategy was approved on 21 November 2024 by the public-sector Strategic Committee for AI
  and Data after a participatory process involving more than 300 people from state bodies, civil society and the
  private sector, with technical support from CAF and UNESCO. It sets guiding principles and three objectives: governance
  and safeguards for ethical and safe AI, national capabilities in infrastructure, data and talent, and use of AI
  for sustainable development and better public services. A roadmap with goals and semi-annual reporting accompanies
  the strategy.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Agencia de Gobierno Electrónico y Sociedad de
  la Información y del Conocimiento (Agesic). Oversight: Agesic leads implementation under the Comité Estratégico
  del Sector Público para IA y Datos, with mid-term review and periodic progress reports. Stated purpose: Ethical,
  sovereign AI development supporting sustainable growth.
