slug: taiwan-artificial-intelligence-basic-act
jurisdiction: taiwan
title: 人工智慧基本法 (Artificial Intelligence Basic Act) – draft approved by the Executive Yuan, July 2024
short_title: Artificial Intelligence Basic Act (draft)
instrument_type: bill
status: proposed
status_note: >-
  Executive Yuan approved the draft on 15 July 2024 and sent it to the Legislative Yuan; passage and promulgation reported
  in late 2025 must be confirmed from the Legislative Yuan gazette before this record is updated.
is_binding: true
featured: false
published: true
issuing_body: Executive Yuan of Taiwan (National Science and Technology Council)
summary_plain: >-
  A framework act setting seven principles for AI development and use, requiring the government to promote AI research,
  talent and infrastructure, to establish a risk-classification framework and safety standards, to protect personal data,
  labour and consumers, to provide for liability, disclosure of AI-generated content and non-discrimination, and to designate
  competent authorities by sector, with the NSTC coordinating.
scope_summary: >-
  Framework obligations on government agencies; obligations for private actors arise through sector regulation adopted under
  the act.
