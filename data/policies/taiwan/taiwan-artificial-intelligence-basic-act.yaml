slug: taiwan-artificial-intelligence-basic-act
aipt_id: AIPT-POL-0183
jurisdiction: taiwan
title: 人工智慧基本法 (Artificial Intelligence Basic Act), promulgated 14 January 2026
short_title: Taiwan Artificial Intelligence Basic Act
instrument_type: act
status: in_force
status_note: >-
  Passed on third reading by the Legislative Yuan on 23 December 2025 (20 articles) and promulgated by Presidential Order on
  14 January 2026; Article 20 brings it into force on promulgation. Updated on 26 November 2026 from search extracts of the
  Legislative Yuan, Presidential Office and Ministry of Justice pages listed, which could not be opened; pending review.
is_binding: true
featured: false
published: true
issuing_body: Legislative Yuan of Taiwan; promulgated by the President (competent authority at central level the National Science and Technology Council)
summary_plain: >-
  A framework act setting seven principles for AI development and use, requiring the government to promote AI research,
  talent and infrastructure, to establish a risk-classification framework and safety standards, to protect personal data,
  labour and consumers, to provide for liability, disclosure of AI-generated content and non-discrimination, and to designate
  competent authorities by sector, with the NSTC coordinating.
scope_summary: >-
  Framework obligations on government agencies; obligations for private actors arise through sector regulation adopted under
  the act.
adopted_on: '2025-12-23'
in_force_on: '2026-01-14'
date_notes: >-
  Third reading 23 December 2025; promulgated 14 January 2026 (order 華總一義字第11500001671號, Presidential Office Gazette
  7837), in force the same day under Article 20. The Executive Yuan approved the draft on 15 July 2024. A resolution passed
  with the Act asks government bodies to assess existing AI uses within six months and set usage rules within a year; it is
  a resolution, not part of the Act.
