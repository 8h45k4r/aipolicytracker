status_note: >-
  Announcement date taken from the draft's filename/date (1 August 2024). Media reported a formal launch in Lagos
  in April 2025 and a NITDA article (Aug 2025) says the strategy was 'released in 2024', but I could not find an
  official final (non-draft) document or launch page on fmcide.gov.ng or nitda.gov.ng, so status is recorded as
  development.
is_binding: false
featured: false
published: true
issuing_body: >-
  Federal Ministry of Communications, Innovation and Digital Economy (FMCIDE) with NITDA / NCAIR
summary_plain: >-
  The draft strategy sets out Nigeria's vision for AI across five pillars: infrastructure, a thriving AI ecosystem,
  sectoral adoption, responsible and ethical AI, and governance. It was co-created through a 2024 multi-stakeholder
  workshop convened by the ministry and includes an implementation roadmap with pilot projects and KPIs. The published
  document on the NCAIR site is marked as a draft dated August 2024.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Federal Ministry of Communications, Innovation
  and Digital Economy (FMCIDE) with NITDA / NCAIR. Oversight: FMCIDE leads; NITDA and its National Centre for AI
  and Robotics implement. Stated purpose: Use AI for economic growth, social inclusion and technological leadership.
key_dates_summary: >-
  2023-08-28: FMCIDE announces initiative to co-create a National AI Strategy; 2024-08-01: Draft National AI Strategy
  2024 published by NCAIR
