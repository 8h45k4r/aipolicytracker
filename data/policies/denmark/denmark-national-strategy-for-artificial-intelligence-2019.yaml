summary_plain: >-
  Published in March 2019, the strategy sets a responsible foundation for AI (ethical principles, data ethics council, legal
  clarity), more and better data, strong competences and new knowledge, and increased investment, with priority sectors
  of health, energy and utilities, agriculture and transport, and a set of public-sector pilot projects.
