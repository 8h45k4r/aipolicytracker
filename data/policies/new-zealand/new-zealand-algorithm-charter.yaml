issuing_body: Stats NZ (Government Chief Data Steward) on behalf of signatory agencies
summary_plain: >-
  Launched in July 2020, the charter commits signatory government agencies to transparency (plain-English explanations of
  how algorithms are used), partnership with Māori (Te Tiriti), people-focused use, data fit for purpose, privacy, ethics
  and human rights safeguards, human oversight and channels for challenge, applied through a risk matrix for high-impact
  algorithms. Around 30 agencies have signed; a 2021 review recommended stronger implementation.
scope_summary: >-
  Voluntary for New Zealand government agencies that sign; applies to operational algorithms that affect people.
