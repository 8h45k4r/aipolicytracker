issuing_body: Ministry of Business, Innovation and Employment
summary_plain: >-
  Published in July 2025, the strategy aims to lift AI adoption by businesses, especially small and medium enterprises,
  and the public sector, by reducing barriers, providing clear guidance (Responsible AI Guidance for Businesses), building
  skills and pursuing a light-touch, proportionate regulatory approach that relies on existing law and international alignment
  (OECD principles). It rules out a standalone AI act for now.
scope_summary: Government programme; no obligations on private organisations.
