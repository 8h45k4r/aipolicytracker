summary_plain: >-
  Pakistan's first national AI policy, organised around six pillars: innovation ecosystem, awareness and readiness,
  secure AI, transformation of sectors, AI infrastructure, and international partnerships. It proposes a National
  AI Fund drawn from Ignite's R&D fund, centres of excellence, venture and innovation funds, regulatory sandboxes
  and KPIs, with an AI Council to oversee delivery. Targets include large-scale training of AI professionals and
  funded research projects.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Ministry of Information Technology and Telecommunication
  (approved by the Federal Cabinet). Oversight: MoITT with a proposed national AI Council and implementation directorate.
  Stated purpose: Build a domestic AI ecosystem, skills base and infrastructure while managing ethical and security
  risks.
