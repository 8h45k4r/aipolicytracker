title: 'Schleswig-Holstein IT Deployment Act (ITEG): Act on the use of data-driven information technologies in public administration'
short_title: Schleswig-Holstein AI in administration act (ITEG)
title_native: Gesetz über die Möglichkeit des Einsatzes von datengetriebenen Informationstechnologien bei öffentlich-rechtlicher
  Verwaltungstätigkeit (IT-Einsatz-Gesetz – ITEG)
