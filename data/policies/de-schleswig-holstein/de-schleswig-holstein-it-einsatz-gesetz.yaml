issuing_body: Landtag of Schleswig-Holstein
summary_plain: >-
  Allows public administration to use AI and other data-driven IT as a general rule, with listed exclusions (for example,
  it may not be used to issue administrative acts involving discretion), and gives people a specific remedy, the "AI complaint"
  (KI-Rüge).
scope_summary: Public administration bodies in Schleswig-Holstein.
who_it_applies_to: Schleswig-Holstein public authorities using data-driven IT.
key_dates_summary: >-
  Enacted 16 March 2022 as Article 12 of the Digitalisation Act; published in the Land gazette (GVOBl. Schl.-H. S. 285, 296)
  on 14 April 2022.
