slug: council-of-europe-framework-convention-on-ai
jurisdiction: council-of-europe
title: >-
  Council of Europe Framework Convention on Artificial Intelligence and Human Rights, Democracy and the Rule of Law (CETS
  No. 225)
short_title: Framework Convention on AI (CETS 225)
instrument_type: act
status: adopted
status_note: >-
  Adopted 17 May 2024 and open for signature since 5 September 2024. Entry into force requires five ratifications including
  three Council of Europe member states; check the treaty office page for the current status.
is_binding: true
featured: true
published: true
issuing_body: Committee of Ministers of the Council of Europe
summary_plain: >-
  The first international treaty on AI. Parties must adopt or maintain measures so that activities within the lifecycle
  of AI systems are consistent with human rights, democracy and the rule of law, covering public authorities and actors
  on their behalf and, by choice of approach, private actors. It sets principles (human dignity and autonomy, transparency
  and oversight, accountability, equality and non-discrimination, privacy, reliability, safe innovation), requires remedies,
  procedural safeguards and risk and impact assessment, allows moratoria or bans for incompatible uses, and creates a Conference
  of the Parties for follow-up. National-security activities and defence are excluded.
scope_summary: >-
  Obligations fall on state parties for the public sector; parties choose how to address private-sector AI activities. Activities
  related to national security and research and development not yet in use are excluded.
who_it_applies_to: States and the EU that ratify; public authorities and private actors through implementing measures.
key_dates_summary: >-
  2024-05-17: adopted by the Committee of Ministers; 2024-09-05: opened for signature in Vilnius; entry into force after
  five ratifications (three from member states).
