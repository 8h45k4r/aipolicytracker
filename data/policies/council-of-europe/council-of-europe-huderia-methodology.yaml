jurisdiction: council-of-europe
title: >-
  Methodology for the Risk and Impact Assessment of Artificial Intelligence Systems from the Point of View of Human Rights,
  Democracy and the Rule of Law (HUDERIA)
short_title: HUDERIA risk and impact assessment methodology
instrument_type: framework
status: guidance
is_binding: false
featured: false
published: true
issuing_body: Council of Europe Committee on Artificial Intelligence (CAI)
summary_plain: >-
  Adopted by the CAI in November 2024, HUDERIA is a structured methodology for assessing risks and impacts of AI systems
  on human rights, democracy and the rule of law across the lifecycle: context-based risk analysis, stakeholder engagement,
  risk and impact assessment, and mitigation planning with iterative review. It supports implementation of the Framework
  Convention and can be used by public and private organisations.
scope_summary: >-
  Voluntary methodology for developers and deployers of AI systems, and for states implementing the Convention.
