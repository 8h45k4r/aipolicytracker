summary_plain: >-
  A revised draft national AI policy published by the ICT Division for public review. It proposes a risk-based approach
  to AI regulation with prohibitions on certain uses, impact assessments for high-risk systems, and institutional
  arrangements for coordination and capacity building. Public consultation on the draft closed in February 2026
  and the committee is reviewing submissions before finalisation.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by ICT Division, Ministry of Posts, Telecommunications
  and Information Technology. Oversight: ICT Division AI Policy Committee; proposed national AI coordination body.
  Stated purpose: Create a risk-based, rights-respecting framework for AI adoption after an earlier 2024 draft stalled.
