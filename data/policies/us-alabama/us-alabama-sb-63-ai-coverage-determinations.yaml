summary_plain: >-
  Health benefit plan providers in Alabama may not leave prior authorisation and coverage decisions to artificial
  intelligence alone: a decision to deny, reduce or defer coverage has to be made by a licensed clinician. Under the
  enrolled text, providers that use AI must describe that use in their written policies and procedures and certify each
  year to the Department of Insurance that their tools do not rely on a group dataset, are applied fairly and do not
  discriminate. The Department can investigate and require corrective action.
scope_summary: >-
  Health benefit plan providers (insurers) that use artificial intelligence when deciding prior authorisation and
  coverage for people in Alabama.
who_it_applies_to: Health benefit plan providers and insurers operating in Alabama that use AI in coverage determinations.
key_dates_summary: >-
  Introduced 13 January 2026; approved by the Governor on 16 April 2026 as Act 2026-589. Earlier versions set an
  effective date of 1 October 2026; the enrolled text's effective date is not fully shown in the extracts.
penalties_summary: >-
  Where it has reasonable grounds to suspect a breach, the Department of Insurance can investigate and require a corrective
  plan; repeat violations can lead to the disciplinary measures in Section 27-3A-6(d), Code of Alabama (per the engrossed
  text).
what_organizations_must_do: >-
  Keep a licensed clinician responsible for any denial, reduction or deferral of coverage; disclose AI use in written
  policies and procedures; certify the AI tools to the Department of Insurance each year.
