summary_plain: >-
  Sets rules for personal data processed through autonomous and semi-autonomous systems in the Dubai International Financial
  Centre: notice and transparency when such a system is used, the deployer as controller and the operator as processor, limits
  on purposes, a future certification scheme, and an Autonomous Systems Officer for high-risk processing.
scope_summary: Organisations processing personal data in the DIFC free zone.
who_it_applies_to: Deployers and operators of AI systems processing personal data in the DIFC.
key_dates_summary: Regulations enacted 1 September 2023; guidance DIFC-DP-GL-23 dated 27 August 2024.
