summary_plain: >-
  Amends Public Utilities Code section 2874, which governs calls placed with automatic dialing-announcing
  devices. The live, unrecorded announcement that must come before a prerecorded message must now also tell the
  person called when the message uses an artificial voice, meaning a voice generated or significantly altered
  using artificial intelligence.
scope_summary: >-
  Callers in California that use automatic dialing-announcing devices to deliver prerecorded messages made with
  an artificial voice.
who_it_applies_to: >-
  Organisations placing automated prerecorded calls that use AI-generated or AI-altered voices.
key_dates_summary: Approved 20 September 2024; effective 1 January 2025.
what_organizations_must_do: >-
  Callers using automatic dialing-announcing devices must say in the opening live announcement that the
  prerecorded message uses an artificial voice where it does.
