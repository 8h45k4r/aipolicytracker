summary_plain: >-
  Health care service plans and disability insurers that use AI, algorithms or other software tools in
  utilization review or management must meet set conditions, including basing decisions on the individual's
  clinical history and the requesting provider's circumstances rather than solely on a group dataset. Such a
  tool may not deny, delay or modify medically necessary care: medical necessity decisions must be made by a
  licensed physician or a licensed health care professional competent to evaluate the clinical issues.
scope_summary: >-
  Health care service plans regulated by the Department of Managed Health Care and disability insurers regulated
  by the Department of Insurance that use AI or software tools in utilization review.
who_it_applies_to: Health plans and health insurers, and their utilization review vendors.
key_dates_summary: Approved and chaptered 28 September 2024; effective 1 January 2025.
what_organizations_must_do: >-
  Ensure any AI or software tool used in utilization review relies on individual clinical information, does not
  itself deny, delay or modify care, and leaves medical necessity decisions to a licensed physician or qualified
  licensed professional.
