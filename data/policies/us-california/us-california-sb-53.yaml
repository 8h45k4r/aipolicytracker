  - slug: us-california-sb-53-transparency-report
    title: Frontier developers must publish a transparency report before deploying a new frontier model
    category: transparency
    source_reference: "Business and Professions Code Section 22757.12 (as added by SB 53)"
    is_binding: true
    applies_from: 2026-01-01
    actors: [gpai_provider, provider]
    sectors: [cross_sector]
    use_cases: [generative_ai]
    summary: >
      Before or at the time a frontier developer deploys a new frontier model, or a substantially modified version,
      it must publish a transparency report on its website describing the model, its intended uses and restrictions,
      the release date and modalities, and how to contact the developer. A large frontier developer must add a
      summary of its catastrophic-risk assessment for the model, the results, any third-party evaluators involved
      and the steps taken under its frontier AI framework, with trade-secret and security redactions explained.
    practical_action: >
      Attach a model-release transparency report to the launch checklist, with a redaction log for withheld details.
    applicability:
      description: Frontier developers above the compute threshold; the catastrophic-risk elements apply to large frontier developers above the revenue threshold.
      actors: [gpai_provider, provider]
      risk_categories: [systemic_risk]
      source_reference: "Business and Professions Code Section 22757.12"
    evidence_examples:
