slug: us-california-sb-53
jurisdiction: us-california
title: "California SB 53: Transparency in Frontier Artificial Intelligence Act"
short_title: California SB 53
instrument_type: act
status: in_force
status_note: >
  Signed 29 September 2025; operative 1 January 2026 for most provisions. A reviewer must confirm the operative
  dates and any federal pre-emption challenge.
is_binding: true
published: true
issuing_body: California State Legislature
summary_plain: >
  SB 53 requires "large frontier developers" (developers of the most compute-intensive models above statutory
  thresholds) to publish a frontier AI framework describing how they assess and mitigate catastrophic risks, publish
  transparency reports when deploying new frontier models, report critical safety incidents to the California Office
  of Emergency Services, and protect employees who report safety concerns. It also directs creation of a public
  computing cluster ("CalCompute").
scope_summary: >
  Applies to developers of frontier models meeting compute-based thresholds, with heightened duties for large
  frontier developers above a revenue threshold. Most obligations are transparency and reporting duties rather than
  prescriptive technical requirements.
who_it_applies_to: Frontier-model developers operating in California, including companies based elsewhere that train frontier models and do business in the state.
key_dates_summary: Signed 29 September 2025; operative 1 January 2026 (to be confirmed).
penalties_summary: Civil penalties enforced by the Attorney General for non-compliance, with amounts set in the statute (reviewer to confirm figures).
what_organizations_must_do: >
  Large frontier developers should publish a frontier AI framework and model transparency reports, set up critical
  safety incident reporting, and implement whistleblower protections and internal reporting channels.
