  - slug: us-california-sb-53-whistleblower-protections
    title: Frontier developers must protect employees who report catastrophic-risk concerns
    category: governance_accountability
    source_reference: "Labor Code Section 1107 (as added by SB 53)"
    is_binding: true
    applies_from: 2026-01-01
    actors: [gpai_provider, provider]
    sectors: [cross_sector]
    use_cases: [generative_ai]
    summary: >
      A frontier developer must not adopt rules or take action that prevent or retaliate against a covered employee
      for disclosing to the Attorney General, a federal authority, a manager or another employee with authority
      that the developer's activities pose a specific and substantial danger to public health or safety from
      catastrophic risk, or that it has violated the Act. Covered employees must be given clear notice of these
      rights, and large frontier developers must run an anonymous internal reporting process with regular updates
      to the reporter and to officers and directors.
    practical_action: >
      Publish a whistleblower policy covering catastrophic-risk concerns, stand up an anonymous channel and brief managers on the anti-retaliation rule.
    applicability:
      description: Frontier developers and their contractors and employees responsible for assessing, managing or responding to catastrophic risk; the anonymous internal process is required of large frontier developers.
      actors: [gpai_provider, provider]
      risk_categories: [systemic_risk]
      source_reference: "Labor Code Section 1107"
    evidence_examples:
      - { title: Whistleblower policy and employee notice, artifact_type: document }
      - { title: Anonymous reporting channel records, description: "Case log with status updates to reporters and board reporting.", artifact_type: record }
    framework_mappings:
      - { framework: nist_ai_rmf, reference: "GOVERN 4.1, GOVERN 4.3", note: "Culture that surfaces risks and incident-sharing practices.", confidence_level: medium }
      - { framework: iso_42001, reference: "Clause 5.1, 7.4; Annex A.3.2", note: "Leadership, communication and roles.", confidence_level: low }
    controls:
