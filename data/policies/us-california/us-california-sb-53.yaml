  - slug: us-california-sb-53-catastrophic-risk-assessment-summaries
    title: Large frontier developers must send periodic summaries of catastrophic-risk assessments to the state
    category: safety_testing
    source_reference: "Business and Professions Code Section 22757.12 (as added by SB 53)"
    is_binding: true
    applies_from: 2026-01-01
    actors: [gpai_provider]
    sectors: [cross_sector]
    use_cases: [generative_ai]
    summary: >
      A large frontier developer must transmit to the California Office of Emergency Services, on the periodic
      schedule the statute sets, a summary of any assessment of catastrophic risk that results from the internal use
      of its frontier models. This covers risks arising before public deployment, such as during internal
      evaluation or use of the model to accelerate research, and complements the public transparency report.
    practical_action: >
      Schedule a recurring internal-use risk assessment and a state submission with a fixed owner in the safety team.
    applicability:
      description: Large frontier developers above the statutory compute and revenue thresholds.
      actors: [gpai_provider]
      risk_categories: [systemic_risk]
      source_reference: "Business and Professions Code Section 22757.12"
    evidence_examples:
