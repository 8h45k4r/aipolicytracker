summary_plain: >-
  Health facilities, clinics, physician offices and group practices that use generative AI to produce patient
  communications about clinical information must include a disclaimer saying that the message was generated by
  AI, and instructions on how the patient can reach a human health care provider. Messages that a licensed or
  certified provider has read and reviewed are exempt. Facility and clinic breaches are enforced under the
  existing Health and Safety Code regime; physician breaches by the Medical Board of California or the
  Osteopathic Medical Board of California.
scope_summary: >-
  Licensed health facilities, clinics, physician offices and group practices in California using generative AI
  for patient communications about clinical information.
who_it_applies_to: Health care providers using generative AI to communicate clinical information to patients.
key_dates_summary: Approved and chaptered 28 September 2024; effective 1 January 2025.
penalties_summary: >-
  Enforced through existing facility and clinic enforcement provisions, or by the medical licensing boards for
  physicians.
what_organizations_must_do: >-
  Add an AI-generated disclaimer and instructions for contacting a human provider to generative AI patient
  communications about clinical information, unless a licensed or certified provider has reviewed them.
