issuing_body: California State Legislature
summary_plain: >-
  Amends the post-mortem right of publicity in Civil Code section 3344.1 to deal with digital replicas. Anyone
  who produces, distributes or makes available a digital replica of a deceased personality's voice or likeness
  in an expressive audiovisual work or sound recording without prior consent is liable for the greater of USD
  10,000 or the actual damages suffered. Uses in news, public affairs and sports broadcasts, comment, criticism,
  scholarship, satire or parody, certain documentary or biographical works, and fleeting or incidental uses are
  exempt.
scope_summary: >-
  Producers and distributors of audiovisual works and sound recordings, and anyone making them available, where
  the work contains a computer-generated, highly realistic replica of a deceased person's voice or likeness.
who_it_applies_to: >-
  Media producers, distributors and others making available works that contain digital replicas of deceased
  people.
key_dates_summary: Approved and chaptered 17 September 2024; amended section effective 1 January 2025.
penalties_summary: >-
  Liability for the greater of USD 10,000 or the actual damages suffered by the injured party.
what_organizations_must_do: >-
  Obtain prior consent from the holder of a deceased personality's rights before producing, distributing or
  making available a digital replica of that person's voice or likeness in an expressive audiovisual work or
  sound recording, unless an exemption applies.
