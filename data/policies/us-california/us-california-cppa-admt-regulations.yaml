summary_plain: >-
  Regulations under the California Consumer Privacy Act on automated decision-making technology (ADMT), risk assessments and
  cybersecurity audits. Businesses that use ADMT to make significant decisions about consumers must comply from 1 January
  2027, with further deadlines phased into 2028.
scope_summary: >-
  Businesses subject to the CCPA that use automated decision-making technology for significant decisions, or whose processing
  requires a risk assessment or cybersecurity audit.
who_it_applies_to: Businesses subject to the California Consumer Privacy Act.
key_dates_summary: >-
  Approved by the Office of Administrative Law 22 September 2025; effective 1 January 2026; ADMT compliance from 1 January
  2027; a submission to the CPPA due 1 April 2028.
