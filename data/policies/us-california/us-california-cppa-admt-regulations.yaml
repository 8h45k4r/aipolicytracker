obligations:
  - slug: us-california-ccpa-admt-pre-use-notice
    aipt_id: AIPT-OBL-0118
    short_title: "Pre-use Notice"
    title: Give consumers a Pre-use Notice before using automated decision-making technology for a significant decision
    category: transparency
    section: "Article 11, § 7220"
    source_reference: "Cal. Code Regs. tit. 11, § 7220"
    official_source_url: "https://cppa.ca.gov/regulations/pdf/ccpa_updates_cyber_risk_admt_appr_text.pdf"
    is_binding: true
    applies_from: 2027-01-01
    actors: [deployer]
    sectors: [employment, financial_services, healthcare, education]
    use_cases: [hiring_and_hr, finance_and_credit, health, education]
    summary: >
      A business that uses automated decision-making technology (ADMT) to make a significant decision about a consumer (one
      that provides or denies financial or lending services, housing, education, employment or contracting opportunities or
      pay, or healthcare) must give a Pre-use Notice. It is presented prominently, at or before the point the personal
      information is collected (or before re-using information already held for this purpose), in the way the business mainly
      interacts with the consumer. It states the specific purpose in plain language, not in generic terms; the right to opt
      out and how (or, where an exception applies, the right to appeal or the exception relied on); the right to access
      information about the ADMT; that retaliation is prohibited; and how the ADMT works, including the categories of personal
      information that affect its output, any human's role, and the alternative process for people who opt out. It may sit in
      the Notice at Collection, and one notice may cover several uses.
    practical_action: >-
      For each system that makes or replaces a human's significant decision, write a Pre-use Notice naming the specific
      decision, the opt-out (or appeal) route, the access right, and how the system and its alternative process work; show it
      before collection in the channel the consumer uses.
    evidence_examples:
      - { title: "The published Pre-use Notice for each use, with the date it went live and where it is shown" }
      - { title: "A record of which significant decisions use ADMT and which notice covers each" }
    controls:
      - { control: ai-interaction-and-use-disclosure, relationship: satisfies, note: "Notice before use that an automated tool will make or substantially make the decision.", confidence_level: high }
      - { control: ai-system-inventory, relationship: supports, note: "Knowing which systems make significant decisions is the starting point for the notice.", confidence_level: medium }
    review_status: pending_review
    confidence_level: high
  - slug: us-california-ccpa-admt-opt-out
    aipt_id: AIPT-OBL-0119
    short_title: "Opt-out of ADMT"
    title: Let consumers opt out of automated decision-making technology for significant decisions, or offer a qualifying human appeal
    category: human_oversight
    section: "Article 11, § 7221"
    source_reference: "Cal. Code Regs. tit. 11, § 7221"
    official_source_url: "https://cppa.ca.gov/regulations/pdf/ccpa_updates_cyber_risk_admt_appr_text.pdf"
    is_binding: true
    applies_from: 2027-01-01
    actors: [deployer]
    sectors: [employment, financial_services, healthcare, education]
    use_cases: [hiring_and_hr, finance_and_credit, health, education]
    summary: >
      Consumers must be able to opt out of the use of ADMT for a significant decision, through at least two designated methods
      that are easy to use and need minimal steps; a business that deals with consumers online must offer an interactive form
      linked from the Pre-use Notice, and a cookie banner is not enough. A verifiable request may not be required. If the
      consumer opts out before processing starts, the ADMT must not be used for them; if after, processing must stop within 15
      business days and service providers and contractors must be told. The business must wait 12 months before asking the
      consumer to consent again. Exceptions include offering an appeal to a human reviewer with authority to overturn the
      decision, and certain admission, acceptance, hiring and work-allocation uses that meet the stated conditions.
    practical_action: >-
      Build the opt-out form and a second method, wire opt-outs to stop processing within 15 business days and to notify
      vendors, or document the exception relied on and, for the human-appeal exception, designate and train reviewers who can
      overturn the decision.
    evidence_examples:
      - { title: "The opt-out link, form and second method, and a log of requests with dates received and processing stopped" }
      - { title: "Notices sent to service providers and contractors about each opt-out" }
      - { title: "Where an exception is used, the documented exception and, for human appeal, the reviewer designation and appeal records" }
    controls:
      - { control: human-oversight-and-override, relationship: supports, note: "The human-appeal exception needs a reviewer with authority to overturn the decision.", confidence_level: high }
      - { control: decision-explanation-and-appeal-route, relationship: supports, note: "The appeal route used under the human-appeal exception.", confidence_level: medium }
      - { control: privacy-and-data-protection-for-ai, relationship: supports, note: "Handling consumer rights requests over personal information.", confidence_level: medium }
    review_status: pending_review
    confidence_level: high
  - slug: us-california-ccpa-admt-access
    aipt_id: AIPT-OBL-0120
    short_title: "Access to ADMT information"
    title: Answer consumers' requests to access information about how automated decision-making technology was used about them
    category: transparency
    section: "Article 11, § 7222"
    source_reference: "Cal. Code Regs. tit. 11, § 7222"
    official_source_url: "https://cppa.ca.gov/regulations/pdf/ccpa_updates_cyber_risk_admt_appr_text.pdf"
    is_binding: true
    applies_from: 2027-01-01
    actors: [deployer]
    sectors: [employment, financial_services, healthcare, education]
    use_cases: [hiring_and_hr, finance_and_credit, health, education]
    summary: >
      On a verified request, the business must explain in plain language the specific purpose for which it used ADMT about the
      consumer; the logic of the ADMT, enough for the consumer to understand how their information produced the output; the
      outcome and how the output was used in the decision, including any human's role; and that retaliation is prohibited, with
      how to exercise other CCPA rights. Trade secrets and certain security information may be withheld. Where ADMT was used
      about the consumer more than four times in 12 months, an aggregate-level response is allowed. Service providers and
      contractors must help.
    practical_action: >-
      Prepare a response template per system covering purpose, logic, outcome and human role, route access requests through the
      existing request-to-know process, and require vendors by contract to supply what the response needs.
    evidence_examples:
      - { title: "An access-response template per system and a log of requests answered" }
      - { title: "Contract terms requiring vendors to assist with access requests" }
    controls:
      - { control: decision-explanation-and-appeal-route, relationship: satisfies, note: "Explaining the purpose, logic and outcome of the decision to the person.", confidence_level: high }
      - { control: contractual-allocation-of-ai-duties, relationship: supports, note: "Vendors must assist with access requests.", confidence_level: medium }
    review_status: pending_review
    confidence_level: high
  - slug: us-california-ccpa-risk-assessment
    aipt_id: AIPT-OBL-0121
    short_title: "Risk assessment"
    title: Conduct and document a risk assessment before processing that presents significant risk, including ADMT for significant decisions
    category: impact_assessment
    section: "Article 10, §§ 7150, 7152, 7155"
    source_reference: "Cal. Code Regs. tit. 11, §§ 7150, 7155"
    official_source_url: "https://cppa.ca.gov/regulations/pdf/ccpa_updates_cyber_risk_admt_appr_text.pdf"
    is_binding: true
    applies_from: 2026-01-01
    actors: [deployer]
    sectors: [cross_sector]
    use_cases: [hiring_and_hr, finance_and_credit, health, education]
    summary: >
      A business must conduct and document a risk assessment before starting processing that presents significant risk to
      consumers' privacy. The listed activities include selling or sharing personal information, processing sensitive personal
      information, using ADMT for a significant decision, and certain automated processing that infers traits such as ability,
      performance at work, economic situation or health. Each assessment is reviewed at least every three years, updated within
      45 calendar days of a material change, and kept for as long as the processing continues or five years after completion,
      whichever is later. Processing that began before the regulations took effect and continues must be assessed by
      31 December 2027.
    practical_action: >-
      List processing activities in the § 7150 categories, assess each before it starts (and existing ones by 31 December
      2027), schedule three-yearly reviews and a 45-day update on material change, and keep every version.
    evidence_examples:
      - { title: "The risk assessment for each in-scope activity, with dates, versions and the material changes that triggered updates" }
      - { title: "The list of processing activities checked against § 7150" }
    controls:
      - { control: ai-impact-assessment, relationship: satisfies, note: "A documented assessment of the processing's risks before it starts.", confidence_level: high }
      - { control: privacy-and-data-protection-for-ai, relationship: supports, note: "Privacy risk assessment of personal-information processing.", confidence_level: high }
      - { control: ai-system-inventory, relationship: supports, note: "Finding which processing activities are in scope.", confidence_level: medium }
    review_status: pending_review
    confidence_level: high
  - slug: us-california-ccpa-risk-assessment-submission
    aipt_id: AIPT-OBL-0122
    short_title: "Risk assessment submission"
    title: Submit risk assessment information to the California Privacy Protection Agency each year
    category: record_keeping
    section: "Article 10, § 7157"
    source_reference: "Cal. Code Regs. tit. 11, § 7157"
    official_source_url: "https://cppa.ca.gov/regulations/pdf/ccpa_updates_cyber_risk_admt_appr_text.pdf"
    is_binding: true
    applies_from: 2028-04-01
    actors: [deployer]
    sectors: [cross_sector]
    summary: >
      For risk assessments conducted in 2026 and 2027, the business submits information to the Agency by 1 April 2028, and for
      later years by 1 April of the following year. The submission includes the business's name and a point of contact, the
      period covered, the number of assessments conducted or updated in total and per processing activity, and whether they
      involved each listed category of personal and sensitive personal information, among other items listed in § 7157(b).
    practical_action: >-
      Keep a register of assessments by year and activity, with the personal-information categories each involved, so the
      annual submission can be compiled; name the point of contact.
    evidence_examples:
      - { title: "The register of risk assessments by year and processing activity" }
      - { title: "Each year's submission and its confirmation" }
    controls:
      - { control: record-keeping-and-logging, relationship: supports, note: "Counts and categories by year come from the assessment register.", confidence_level: medium }
      - { control: ai-governance-policy-and-accountability, relationship: supports, note: "A named point of contact and an owner for the annual submission.", confidence_level: medium }
    review_status: pending_review
    confidence_level: high
