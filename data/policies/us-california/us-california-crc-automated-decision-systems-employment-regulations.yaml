issuing_body: California Civil Rights Council
summary_plain: >-
  Amends the employment regulations under the Fair Employment and Housing Act to address automated-decision
  systems. They make clear that using such a system can breach California anti-discrimination law where it harms
  applicants or employees on the basis of a protected characteristic, require employers to keep automated-
  decision data for four years, and treat assessments such as tests or games that may reveal a disability as a
  possible unlawful medical inquiry.
scope_summary: >-
  Employers and other entities covered by the Fair Employment and Housing Act that use automated-decision
  systems in hiring, promotion and other employment decisions.
who_it_applies_to: Employers covered by FEHA using automated-decision systems.
key_dates_summary: >-
  Approved by the Office of Administrative Law and filed with the Secretary of State 27 June 2025; effective 1
  October 2025.
what_organizations_must_do: >-
  Employers using automated-decision systems must make sure they do not discriminate on protected
  characteristics and must keep automated-decision data for four years.
