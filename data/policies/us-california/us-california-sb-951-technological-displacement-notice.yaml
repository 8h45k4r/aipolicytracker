summary_plain: >-
  Employers must disclose when a mass layoff, relocation or termination is caused by an AI system, giving workers
  and the public more transparency about job losses linked to automation. The Governor's office announced it as one
  of four worker protection bills signed on 30 September 2026; the detailed duties are still to be read from the
  text.
scope_summary: >-
  Employers in California that carry out mass layoffs, relocations or terminations caused by AI systems.
who_it_applies_to: Employers giving notice of mass layoffs, relocations or terminations.
