summary_plain: >-
  Adds a chapter to the Business and Professions Code requiring social media platforms to give California
  account holders a way to report sexually explicit digital identity theft, including AI-generated or altered
  intimate images of an identifiable person shared without consent. The platform must confirm receipt within 48
  hours, decide within 30 days whether the report is valid, and remove the material from public view where there
  is a reasonable basis for the report.
scope_summary: >-
  Social media platforms with California account holders, for reported sexually explicit digital identity theft
  content.
who_it_applies_to: Social media platforms serving California users.
key_dates_summary: Approved and chaptered 19 September 2024.
what_organizations_must_do: >-
  Provide a reporting mechanism for sexually explicit digital identity theft, acknowledge reports within 48
  hours, determine them within 30 days and remove qualifying material from public view.
