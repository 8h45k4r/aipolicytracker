summary_plain: >-
  Adds a new part to the Labor Code that limits how employers use workplace surveillance tools. Employers may not
  use such tools to monitor or surveil employees inside a workplace bathroom unless a court order directs it, and
  employees may leave surveillance tools they carry behind before going into a bathroom. It is a general
  surveillance law rather than an AI law, but it covers the tools that AI monitoring systems run on.
scope_summary: >-
  Employers in California that use workplace surveillance tools on their employees.
who_it_applies_to: Employers using workplace surveillance tools; enforced by the Labor Commissioner.
key_dates_summary: Approved by the Governor and chaptered 30 September 2026.
penalties_summary: >-
  Civil penalty of up to $500 for each violation, enforced by the Labor Commissioner (search extracts also mention
  public prosecutors).
what_organizations_must_do: >-
  Do not monitor or surveil employees inside workplace bathrooms with a workplace surveillance tool unless a court
  order directs it, and let employees leave surveillance tools on their person behind before entering one.
