summary_plain: >-
  The Government Operations Agency must, by 1 January 2028, set up a process to designate and oversee independent verification
  organisations that assess AI models and applications. The law does not require any developer to use one.
scope_summary: >-
  Organisations seeking designation as independent AI verifiers in California; voluntary for developers.
who_it_applies_to: Prospective AI verification organisations and the Government Operations Agency.
key_dates_summary: Chaptered 9 September 2026; designation process due by 1 January 2028.
