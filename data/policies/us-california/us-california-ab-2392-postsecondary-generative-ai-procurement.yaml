summary_plain: >-
  Requires the California Community Colleges and California State University chancellors' offices to convene a
  working group (the University of California is asked to join) to draft generative AI procurement standards and
  responsible-use training, with recommendations due by 1 January 2028. Students, faculty and staff must receive the
  training, and until standards are adopted the two systems must report to the Legislature after signing any
  systemwide generative AI contract.
scope_summary: >-
  The California Community Colleges and California State University systems, and the University of California if it
  takes part, when buying and using generative AI systems.
who_it_applies_to: Public postsecondary systems in California and the vendors they buy generative AI from.
key_dates_summary: Approved by the Governor and chaptered 30 September 2026; working group recommendations due by 1 January 2028.
what_organizations_must_do: >-
  Community colleges and CSU: convene the working group, provide and review the training at least once each academic
  year, keep completion records for at least four years, and report to the Legislature within 60 days of a
  systemwide generative AI contract until standards are adopted.
