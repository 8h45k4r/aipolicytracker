summary_plain: >-
  Covered providers of generative AI systems must offer a free AI-detection tool and embed disclosures and provenance data
  in AI-generated content. AB 853 (Chapter 674, Statutes of 2025) moved the operative date to 2 August 2026 and added duties
  for large online platforms and generative-AI hosting platforms.
scope_summary: >-
  Covered providers of generative AI systems used in California; from 2027, large online platforms and hosting platforms under
  AB 853.
who_it_applies_to: >-
  Large generative-AI providers, and from 2027 large online platforms and generative-AI hosting platforms.
key_dates_summary: >-
  AB 853 approved 13 October 2025; provider duties operative 2 August 2026; platform duties operative 1 January 2027; one
  further section operative 1 January 2028.
