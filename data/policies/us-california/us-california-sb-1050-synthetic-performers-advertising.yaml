summary_plain: >-
  Requires a clear disclosure on video and audio advertisements that use AI-generated synthetic performers to sell a
  product or service, and bars continued use of an advertisement found to break the rule. The Governor's office
  presented it as protecting both consumers and performers.
scope_summary: >-
  Those who create or publish video or audio advertisements in California that feature synthetic performers.
who_it_applies_to: Advertisers and others who create or publish advertisements using synthetic performers.
