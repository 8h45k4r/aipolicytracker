summary_plain: >-
  Operators must carry out a documented, child-focused risk assessment before releasing a new or substantially modified companion
  chatbot, from 1 July 2027, and commission child-safety audits by 1 January 2029 or before first public release if later.
  The Attorney General must set up a public incident-reporting mechanism by 1 January 2028.
scope_summary: Companion chatbots made available to users in California.
