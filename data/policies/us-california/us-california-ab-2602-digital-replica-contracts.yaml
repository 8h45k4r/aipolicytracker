summary_plain: >-
  Adds Labor Code section 927. For new performances fixed on or after 1 January 2025, a contract term that lets
  a digital replica of a person's voice or likeness be created or used in place of work the person would
  otherwise perform is unenforceable where it lacks a reasonably specific description of the intended uses and
  the person was not represented by legal counsel or a labour union in negotiating it. The rest of the contract
  stays in effect.
scope_summary: >-
  Contracts for personal or professional services, including performer and voice contracts, that allow digital
  replicas of the individual to be made or used.
who_it_applies_to: >-
  Studios, producers, employers and others contracting for personal or professional services involving digital
  replicas.
key_dates_summary: >-
  Approved and chaptered 17 September 2024; effective 1 January 2025 for new performances fixed on or after that
  date.
what_organizations_must_do: >-
  Organisations contracting for services must describe the intended uses of any digital replica with reasonable
  specificity and ensure the individual is represented by counsel or a labour union, or the digital replica term
  may be unenforceable.
