summary_plain: >-
  Requires manufacturers of benchtop nucleic acid synthesis equipment, and providers of certain synthetic nucleic
  acids, to follow the federal screening framework for synthetic nucleic acids (as revised in September 2024) as a
  condition of operating in or selling into California, and to attest publicly that they comply. It is a biosecurity
  law, not an AI law; the Governor announced it alongside the 2026 AI bills.
scope_summary: >-
  Manufacturers of benchtop nucleic acid synthesis equipment and providers of synthetic nucleic acids that operate
  in or sell into California.
who_it_applies_to: Gene synthesis equipment manufacturers and synthetic nucleic acid providers; enforced by the Attorney General.
key_dates_summary: Approved by the Governor and chaptered 30 September 2026.
