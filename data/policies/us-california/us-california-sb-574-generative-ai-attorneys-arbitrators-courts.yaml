summary_plain: >-
  This law sets rules for generative AI in legal work in California. Attorneys may not hand the practice of law over to
  generative AI; those who use it must keep confidential information out of tools that do not restrict access, check
  outputs for accuracy and correct errors, and court filings may not cite authorities the responsible attorney has not
  personally checked. Arbitrators may not delegate any part of their decision-making to a generative AI tool, and the
  Judicial Council must publicly revisit its standard on judicial use of generative AI.
scope_summary: >-
  Attorneys practising in California and their court filings, arbitrators, judicial officers, the Judicial Council,
  and certified alternative dispute resolution providers overseen by the State Bar.
who_it_applies_to: Attorneys, arbitrators, judicial officers, the Judicial Council and certified dispute resolution providers.
key_dates_summary: 'Approved by the Governor 30 September 2026 (Chapter 858); operative date not established.'
what_organizations_must_do: >-
  Law practices must keep client confidential information out of open generative AI tools, verify AI output and every
  citation before filing, and correct errors; arbitration providers must keep decision-making with the arbitrator.
