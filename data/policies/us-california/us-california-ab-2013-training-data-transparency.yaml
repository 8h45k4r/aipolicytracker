summary_plain: >-
  Developers of generative AI systems made available to Californians must post documentation of the data used to train them
  on their websites, including summaries of the datasets, whether they include copyrighted material, whether they were purchased
  or licensed, and whether they include personal information.
scope_summary: >-
  Generative AI systems or services released on or after 1 January 2022 and made available to Californians; certain security,
  aircraft and national-security systems are exempt.
who_it_applies_to: Developers of generative AI systems and services offered to people in California.
key_dates_summary: Chaptered 28 September 2024; effective 1 January 2025; documentation due by 1 January 2026.
