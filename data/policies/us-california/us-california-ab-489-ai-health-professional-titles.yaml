summary_plain: >-
  Extends California's protected health care titles to AI. A person or entity that develops or deploys an AI or
  generative AI system may not use, in its advertising or functionality, terms, letters or phrases that indicate
  or imply that the care or advice offered comes from a licensed or certified health care professional when it
  does not. Each prohibited use is a separate violation, and the relevant licensing board or enforcement agency
  may act, including by seeking an injunction.
scope_summary: >-
  Developers and deployers of AI and generative AI tools in California whose advertising or functionality uses
  terms reserved for licensed health care professions under Division 2 of the Business and Professions Code.
who_it_applies_to: Developers and deployers of AI health tools, chatbots and advice services.
key_dates_summary: Approved and chaptered 11 October 2025; operative 1 January 2026.
penalties_summary: >-
  Each prohibited use is a separate violation, subject to the appropriate health care licensing board or
  enforcement agency, which may seek an injunction or restraining order.
what_organizations_must_do: >-
  Do not present an AI system, in advertising or in the product itself, as a licensed or certified health care
  professional, or imply that its advice comes from one.
