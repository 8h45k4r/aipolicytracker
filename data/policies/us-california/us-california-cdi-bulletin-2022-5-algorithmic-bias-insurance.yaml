issuing_body: California Department of Insurance
summary_plain: >-
  The Insurance Commissioner reminds insurers that California law prohibits unfair discrimination in marketing,
  rating, underwriting and claims, including discrimination produced by algorithms, models and big data that use
  apparently neutral characteristics as proxies for protected ones. Insurers must give specific reasons for
  adverse decisions even when a complex algorithm is involved, and the Department says it may audit their
  algorithms and models and take disciplinary action.
scope_summary: >-
  Insurers and licensees doing business in California that use algorithms, models or consumer data in marketing,
  rating, underwriting or claims.
who_it_applies_to: Insurers and other licensees of the California Department of Insurance.
