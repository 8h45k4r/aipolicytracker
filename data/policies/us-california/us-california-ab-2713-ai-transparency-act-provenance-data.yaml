summary_plain: >-
  Amends the California AI Transparency Act duties of large online platforms. Platforms must detect provenance data
  attached to content, show users whether it marks the content as AI-generated or substantially altered, and let
  users inspect it by display, by a link or by download. Knowingly stripping system provenance data or digital
  signatures remains prohibited where technically feasible, and data that does not follow widely adopted standards
  need not be acted on.
scope_summary: >-
  Large online platforms that distribute content in California, under the California AI Transparency Act.
who_it_applies_to: Large online platforms.
key_dates_summary: Approved by the Governor and chaptered 30 September 2026; the platform section is operative from 1 January 2027.
what_organizations_must_do: >-
  Detect provenance data on content, disclose to users whether it indicates AI generation or substantial alteration,
  give users a way to inspect it, and do not knowingly remove provenance data or digital signatures.
