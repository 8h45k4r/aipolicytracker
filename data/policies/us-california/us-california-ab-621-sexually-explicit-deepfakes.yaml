summary_plain: >-
  Amends Civil Code section 1708.86, the civil action for sexually explicit digitised depictions made or shared
  without consent. The action now covers people who were minors when the material was made and anyone who
  knowingly facilitates or recklessly aids the conduct. A provider of services that enable a deepfake
  pornography service is presumed to be facilitating it if it does not stop those services within 30 days of
  receiving evidence. Statutory damages rise and certain public attorneys may sue.
scope_summary: >-
  Creators and distributors of non-consensual sexually explicit deepfakes, and service providers that enable
  deepfake pornography services, in California.
who_it_applies_to: >-
  Deepfake creators and distributors, and providers of services to deepfake pornography sites or apps.
key_dates_summary: Approved and chaptered 13 October 2025; amended section effective 1 January 2026.
penalties_summary: >-
  Statutory damages raised to USD 50,000, or USD 250,000 where the violation was malicious, as described in the
  extracts; confirm against the text.
what_organizations_must_do: >-
  Providers of services that enable a deepfake pornography service must stop providing them within 30 days of
  receiving evidence of a violation, or be presumed to facilitate it.
