summary_plain: >-
  Revises the California AI Transparency Act (SB 942, as amended by AB 853). It removes the user-count threshold
  from the definition of covered provider, renames the AI detection tool a disclosure verification tool, removes
  the option of a manifest disclosure and requires latent disclosures to state whether the system created or
  altered the content. It also delays the Act for AI systems that are assistive technology and bars providers
  from falsely claiming that a system is one.
scope_summary: >-
  Providers of generative AI systems publicly accessible in California that are covered by the California AI
  Transparency Act.
who_it_applies_to: Generative AI providers covered by the California AI Transparency Act.
key_dates_summary: Approved and chaptered 30 September 2026 as an urgency statute.
what_organizations_must_do: >-
  Covered providers must embed latent disclosures that state whether content was created or altered by the
  system and offer a disclosure verification tool, as revised by this Act.
