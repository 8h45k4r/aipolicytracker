summary_plain: >-
  Adds a chapter to the Business and Professions Code on clinical decision support systems, meaning AI systems that
  help with decisions on the timing of care, diagnosis or treatment. Developers must make reasonable efforts to
  reduce known or reasonably foreseeable risks of biased impacts, and deployers must monitor the systems and take
  proportionate steps against those risks. Complying is not a defence to a discrimination claim.
scope_summary: >-
  Developers and deployers of AI clinical decision support systems used in health care in California.
who_it_applies_to: Developers and deployers of clinical decision support systems.
key_dates_summary: Signed by the Governor 30 September 2026.
what_organizations_must_do: >-
  Developers: make reasonable efforts to mitigate known or reasonably foreseeable risks of biased impacts.
  Deployers: monitor clinical decision support systems and take reasonable, proportionate mitigation steps.
