summary_plain: >-
  The Government Operations Agency must set up an AI Auditor Registry by 1 January 2029, and from that date
  anyone who offers or conducts a covered AI audit must be registered. The law sets independence and integrity
  standards for registered auditors, protects whistleblowers, and exempts certain licensed California certified
  public accountants and accounting firms from some of its requirements.
scope_summary: >-
  Persons offering or conducting covered AI audits in California, and the Government Operations Agency.
who_it_applies_to: AI auditors and assurance providers, and the Government Operations Agency.
key_dates_summary: >-
  Approved and chaptered 9 September 2026; registry and registration duty from 1 January 2029.
what_organizations_must_do: >-
  From 1 January 2029, organisations offering or conducting covered AI audits must register with the AI Auditor
  Registry and meet its independence and integrity standards.
