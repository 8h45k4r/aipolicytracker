summary_plain: >-
  Adds Labor Code provisions that stop employers from using AI-based workplace surveillance tools on workers to
  infer their emotional state or to collect their neural data. Public employers are covered too. There are
  exceptions for detecting immediate workplace hazards such as fatigue or impairment, and for certain aerospace,
  national-security and defence work where federal rules or contracts require the use.
scope_summary: >-
  Private and public employers in California that use AI-based surveillance tools on employees, in particular for
  emotion inference or neural data.
who_it_applies_to: Employers, including government employers; enforced by the Labor Commissioner or a public prosecutor.
key_dates_summary: Approved by the Governor and chaptered 30 September 2026.
penalties_summary: >-
  Civil penalty of up to $500 for each violation, enforced by the Labor Commissioner or a public prosecutor.
what_organizations_must_do: >-
  Do not use AI-based workplace surveillance tools to infer employees' emotional states or to collect their neural
  data, except within the safety and federal-requirement exemptions in the law.
