summary_plain: >-
  Adds a chapter to the Business and Professions Code on AI in health care and amends the Confidentiality of Medical
  Information Act. Health facilities, clinics, physician offices and group practices must take reasonable steps so
  that licensed providers keep their independent professional judgment when clinical decision support tools inform
  care, and may not use AI tools to direct unlicensed staff in work that needs a licence. Businesses that offer
  health care chatbots are treated as providers of health care under the medical privacy law.
scope_summary: >-
  Health facilities, clinics, physician offices and group practices using clinical decision support or other AI
  tools, and businesses offering health care chatbots in California.
who_it_applies_to: Health care providers and facilities, and businesses offering health care chatbots.
key_dates_summary: Approved by the Governor and chaptered 30 September 2026.
