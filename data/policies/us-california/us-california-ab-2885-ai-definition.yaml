summary_plain: >-
  Places one definition of artificial intelligence in Government Code section 11546.45.5: an engineered or
  machine-based system that varies in its level of autonomy and can, for explicit or implicit objectives, infer
  from its input how to generate outputs that can influence physical or virtual environments. Existing
  provisions of the Business and Professions, Education and Government Codes, including the one on the state
  inventory of high-risk automated decision systems, now use it. It does not create new duties for private
  organisations.
scope_summary: >-
  California statutes that refer to artificial intelligence, and the state agencies that apply them.
who_it_applies_to: >-
  State agencies and anyone applying California statutes that use the term artificial intelligence.
