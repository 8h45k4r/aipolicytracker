summary_plain: >-
  Operators of companion chatbots must disclose that the chatbot is AI and maintain a protocol for responding to suicidal
  ideation and self-harm that refers users to crisis services. Users known to be minors get break reminders and protection
  from sexual content. Annual reports to the Office of Suicide Prevention begin 1 July 2027, and a person injured by a violation
  can bring a civil action.
