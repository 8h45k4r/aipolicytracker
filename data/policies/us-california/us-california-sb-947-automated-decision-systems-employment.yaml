summary_plain: >-
  Employers may not rely only on an AI or automated decision system when deciding to discipline or dismiss a worker,
  so that a person reviews those decisions. The Governor's office announced it as one of four worker protection
  bills signed on 30 September 2026; the detailed duties are still to be read from the text.
scope_summary: >-
  Employers in California that use automated decision systems in disciplinary or termination decisions.
who_it_applies_to: Employers using automated decision systems on workers.
