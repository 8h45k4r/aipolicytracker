issuing_body: California State Legislature
summary_plain: >-
  This law makes clear that AI systems, autonomous agents and robots are not a "person", "member of the public" or
  similar participant under the California Public Records Act, the Brown Act, the Bagley-Keene Open Meeting Act and
  several related statutes. Agencies may use a disclosure verification tool meeting the criteria in Business and
  Professions Code section 22757.2 to check whether AI is behind a request or comment. Knowingly using AI to make it
  look as though a real person engaged with a government agency is prohibited, while people may still use AI or
  assistive technology for their own participation at an ordinary volume.
scope_summary: >-
  State and local agencies receiving public records requests, public comments and other participation, and anyone who
  uses AI to submit or misrepresent engagement with a governmental agency in California.
who_it_applies_to: State and local agencies, and people or organisations using AI to engage with them.
key_dates_summary: 'Approved by the Governor 30 September 2026 (Chapter 863); operative date not established.'
what_organizations_must_do: >-
  Organisations must not knowingly use AI to represent falsely that a natural person appeared before, submitted
  information to or otherwise engaged with a governmental agency.
