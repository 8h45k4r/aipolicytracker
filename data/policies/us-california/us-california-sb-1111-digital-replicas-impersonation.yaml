summary_plain: >-
  This law brings digital replicas into two existing California rules. In the civil statute on commercial use of a
  person's name, voice or likeness (Civil Code section 3344), a voice or likeness is treated as including a
  computer-generated, highly realistic digital replica of it. In the Penal Code, using a digital replica with intent to
  impersonate someone counts as false impersonation wherever that is an element of an offence.
scope_summary: >-
  Commercial uses in California of a living person's voice or likeness through a digital replica, and criminal
  offences in the Penal Code that turn on false impersonation, including impersonation carried out with a replica.
who_it_applies_to: Anyone who uses a digital replica of a person's voice or likeness commercially or to impersonate them.
