summary_plain: >-
  Egypt's first national AI strategy framed AI as a tool for the country's sustainable development goals and for
  positioning Egypt as an active contributor to AI in Africa and the Arab region. It covered AI for government,
  development, capacity building and international activities. It has been superseded by the 2025-2030 second edition.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by National Council for Artificial Intelligence,
  Ministry of Communications and Information Technology. Oversight: NCAI coordinates implementation across ministries.
  Stated purpose: Leverage AI for sustainable development and regional leadership.
