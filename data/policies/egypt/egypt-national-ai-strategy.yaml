title: National AI Strategy - Second Edition 2025-2030
short_title: National AI Strategy
instrument_type: strategy
status: adopted
status_note: >-
  MCIT lists the publication month as January 2025 only, so the first of the month is used; media reported a presidential
  launch on 22 January 2025. Milestone 2 date is also month-only.
is_binding: false
featured: false
published: true
issuing_body: >-
  National Council for Artificial Intelligence (NCAI), Ministry of Communications and Information Technology
summary_plain: >-
  The second edition updates Egypt's 2021 strategy for 2025-2030 around six pillars: governance, data, infrastructure,
  technology, talent and ecosystem. It sets targets for AI specialists, startups and ICT's contribution to GDP,
  and includes plans for national foundational models and expanded regional and international cooperation.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by National Council for Artificial Intelligence
  (NCAI), Ministry of Communications and Information Technology. Oversight: NCAI (chaired by the ICT Minister) oversees
  implementation across ministries. Stated purpose: Move from AI adoption to large-scale, sovereign AI capability
  supporting Digital Egypt.
key_dates_summary: >-
  2025-01-01: Second edition published by MCIT (January 2025); 2026-01-01: NCAI mandate expanded to AI, Quantum
  Computing and Emerging Technologies (January 2026)
