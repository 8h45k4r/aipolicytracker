summary_plain: >-
  Restricts how Montana state and local government bodies and state officers may use artificial intelligence. They
  may not use it for cognitive behavioural manipulation, for classifying people in ways that lead to unlawful
  discrimination, for malicious purposes or, with narrow exceptions, for surveillance of public spaces. Published
  material made by AI and not reviewed by a suitably trained person must say so, and so must public-facing interfaces
  that use AI; certain AI recommendations must be reviewed by a responsible human.
scope_summary: >-
  State and local government entities and state officers in Montana that use AI systems, including for public-facing
  services and published material.
who_it_applies_to: Montana state agencies, local governments and state officers.
key_dates_summary: Enacted in the 2025 session as Chapter 427; signing and effective dates not established.
what_organizations_must_do: >-
  Public bodies in scope must not use AI for the prohibited purposes in section 2-21-102 MCA, must disclose AI use in
  public-facing interfaces and in published material not reviewed by a qualified person (section 2-21-103 MCA, with
  an exemption for some criminal investigations), and must have certain AI outputs reviewed by a person in an
  appropriate responsible position.
