issuing_body: Indiana General Assembly
summary_plain: >-
  A campaign communication in Indiana that contains fabricated media depicting a candidate must carry a disclaimer saying
  that elements of the media have been digitally altered or artificially generated, in addition to the usual paid-for
  disclaimer. The act sets how the disclaimer appears in print, audio and video; in video it must stay on screen for the
  whole communication. Fabricated media includes misleadingly altered recordings and AI-generated imitations of a person.
  A candidate who is depicted can bring a civil action against those responsible.
scope_summary: >-
  Campaign communications in Indiana that include fabricated or digitally altered media depicting a candidate, including
  holders of elected office.
who_it_applies_to: People who pay for, sponsor or disseminate campaign communications in Indiana.
key_dates_summary: Signed 12 March 2024; effective on passage.
penalties_summary: >-
  A depicted candidate may sue and, on clear and convincing evidence, recover actual damages, an injunction, court costs
  and attorney's fees.
what_organizations_must_do: >-
  Add the prescribed disclaimer to campaign communications that contain fabricated media of a candidate, in the format
  the act sets for each medium.
