issuing_body: Indiana General Assembly
summary_plain: >-
  Insurers in Indiana may not use an automated process or tool, including artificial intelligence, as the only basis for
  downcoding a claim on grounds of medical necessity unless an employee or contractor has reviewed the patient's medical
  record. Insurers must disclose clearly when AI is used to make an adverse prior authorisation decision or to downcode a
  claim. The enrolled text also bars downcoding based only on a diagnosis code, requires notice and reasons for
  downcoding and an appeal window, and restricts providers from submitting claims through such tools without human
  review. It does not apply to the Medicaid programme.
scope_summary: >-
  Insurers paying health claims in Indiana, and providers submitting them, outside the Medicaid programme.
who_it_applies_to: Health insurers and health care providers in Indiana (Medicaid excluded).
key_dates_summary: >-
  Signed by the Governor on 4 March 2026 (Public Law 88); effective 1 July 2026 per the enrolled text and fiscal note.
what_organizations_must_do: >-
  Have a person review the medical record before any medical-necessity downcode made with an automated tool, and disclose
  AI use in adverse prior authorisation decisions and downcoding.
