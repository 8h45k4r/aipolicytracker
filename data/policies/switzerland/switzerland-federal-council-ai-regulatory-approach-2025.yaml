slug: switzerland-federal-council-ai-regulatory-approach-2025
jurisdiction: switzerland
title: >-
  Federal Council decision on the regulation of artificial intelligence: ratification of the Council of Europe Convention
  and sector-specific adjustments
short_title: Federal Council AI regulatory approach (2025)
instrument_type: policy
status: adopted
is_binding: false
featured: false
published: true
issuing_body: Swiss Federal Council
summary_plain: >-
  On 12 February 2025 the Federal Council decided how Switzerland will regulate AI: it will ratify the Council of Europe
  Framework Convention on AI and implement it mainly through targeted changes to existing law where needed (for example
  transparency, data protection and non-discrimination), avoid a horizontal AI act, and complement legislation with non-binding
  measures such as self-regulation and agreements with industry. Federal departments were tasked to prepare a consultation
  draft by the end of 2026.
scope_summary: >-
  Sets direction for federal law-making; creates no obligations until implementing legislation is adopted.
