summary_plain: >-
  Adopted in November 2020, seven guidelines steer the use of AI by the federal administration: putting people at the centre,
  conditions for development and use, transparency and explainability, accountability, security, active participation in
  AI governance, and involvement of stakeholders.
scope_summary: Applies to the federal administration of Switzerland when it develops, procures or uses AI systems; cantons and private organisations are not bound.
