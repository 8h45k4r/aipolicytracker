summary_plain: >
  Nepal's National AI Policy sets the government's direction for developing and using artificial intelligence.
  Based on the published summaries, it aims to build AI infrastructure and skills, promote ethical and responsible
  AI, strengthen data governance, establish institutional arrangements for AI oversight, and prepare legal and
  regulatory measures. It is a policy framework, not a law, and does not itself create enforceable obligations on
  private organisations.
scope_summary: >
  Government ministries and agencies implementing the policy; indirectly the private sector, academia and
  development partners engaged in AI in Nepal. Specific measures, timelines and institutions must be confirmed
  from the official text.
who_it_applies_to: Government of Nepal bodies (primary); AI developers and deployers in Nepal through future rules.
key_dates_summary: Concept paper on AI published by MoCIT in 2024; National AI Policy approved by the Council of Ministers in 2025 (month to be confirmed).
penalties_summary: None; policy document.
what_organizations_must_do: >
  No mandatory duties yet. Organisations should monitor MoCIT for implementing legislation, standards and
  procurement rules, and ensure compliance with the Individual Privacy Act 2075 when using personal data.
