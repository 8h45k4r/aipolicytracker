title: "Individual Privacy Act, 2075 (2018) — Nepal"
short_title: Nepal Privacy Act 2075
instrument_type: act
status: in_force
is_binding: true
published: true
issuing_body: Federal Parliament of Nepal
summary_plain: >
  The Individual Privacy Act 2075 gives effect to the constitutional right to privacy in Nepal. It regulates the
  collection, storage, processing, use and disclosure of personal information by public bodies and private
  entities, requires consent for collection and use of personal data subject to exceptions, restricts sensitive
  data, and provides remedies and penalties. It is the main binding law affecting AI systems that process personal
  data in Nepal. The Individual Privacy Regulation 2077 (2020) provides implementing rules.
scope_summary: >
  Public bodies and private entities in Nepal that collect or process personal information, including through
  electronic means. It does not address AI specifically.
who_it_applies_to: Any organisation collecting or processing personal information of individuals in Nepal.
key_dates_summary: Enacted 2018 (2075 BS); Individual Privacy Regulation 2077 adopted in 2020.
penalties_summary: The Act provides for fines and imprisonment for violations, with amounts set in the Act (reviewer to confirm).
what_organizations_must_do: >
  Obtain consent before collecting personal information, use it only for the stated purpose, keep it secure,
  and respect restrictions on sensitive data and on disclosure.
