    summary: >
      Personal information may be collected only by authorised persons for a lawful purpose with the individual's
      consent, and must not be used or disclosed for other purposes without consent, subject to statutory
      exceptions. AI systems trained on or processing personal data of people in Nepal must respect these limits.
    practical_action: Document consent and purpose for any Nepal personal data used in AI training or inference.
