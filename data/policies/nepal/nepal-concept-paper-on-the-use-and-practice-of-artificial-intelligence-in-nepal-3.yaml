summary_plain: >-
  A concept paper prepared by a ministry-appointed committee that surveys the state of AI use in Nepal, its opportunities
  and risks, and the gaps in existing law and infrastructure. It recommends formulating a national AI policy and
  strategy, addressing data protection, privacy and cybersecurity, and building governance structures. The paper
  was published for public suggestions and is cited in the 2025 policy as its precursor.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Ministry of Communication and Information Technology.
  Oversight: MoCIT technical committee. Stated purpose: Assess Nepal's AI readiness and lay the groundwork for a
  national AI policy and law.
