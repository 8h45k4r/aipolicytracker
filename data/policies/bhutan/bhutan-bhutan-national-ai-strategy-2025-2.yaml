summary_plain: >-
  A national strategy framed around the vision of AI rooted in Gross National Happiness. It identifies eight focus
  areas (agriculture and livestock, tourism, green energy, education, health, public service delivery, natural resources
  and biodiversity, and culture and language) and seven enablers such as infrastructure, governance and regulation,
  cybersecurity, skills, research, collaboration and funding. It aims to raise Bhutan's AI maturity by the end of
  the 13th Five Year Plan and includes monitoring, evaluation and risk-mitigation provisions.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by GovTech Agency, Royal Government of Bhutan. Oversight:
  GovTech Agency with annual action-plan reviews and a five-year strategy review. Stated purpose: Apply AI to national
  development in line with Gross National Happiness values.
