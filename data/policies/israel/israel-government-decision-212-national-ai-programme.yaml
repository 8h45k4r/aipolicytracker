issuing_body: Government of Israel; Ministry of Innovation, Science and Technology
summary_plain: >-
  An Israeli government decision on innovation and high-tech growth that, among other things, tasked the Minister of
  Innovation, Science and Technology with drafting a national AI programme, with reference to internationally accepted
  legal and ethical principles such as the 2019 OECD AI principles. It approved the first phase of the TELEM framework
  for AI and data science, with a budget of about NIS 550 million for 2021 to 2023. The work started under this decision
  later fed into the 2023 AI regulation and ethics policy.
scope_summary: >-
  Government ministries and public bodies charged with planning and funding AI research, infrastructure and policy in
  Israel; it creates no duties for private organisations.
who_it_applies_to: Israeli government ministries and agencies (policy and funding).
key_dates_summary: Government decision of 1 August 2021; first-phase budget covers 2021 to 2023.
