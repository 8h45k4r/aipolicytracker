status_note: >-
  Recorded on 26 November 2026 from search-engine extracts of the official pages listed; the official text could not be
  opened from the research environment, so every date and duty here is pending review against it. A State Comptroller
  report of November 2024 found that a comprehensive national AI programme had still not been approved, beyond two
  phases of the TELEM plan. A later Government Decision 4255 (2026) set up a new National Programme to accelerate AI led
  by the National AI Directorate; it is a separate instrument not covered by this record.
