issuing_body: Ministry of Innovation, Science and Technology and Ministry of Justice
summary_plain: >-
  Adopted in December 2023 after public consultation, the policy sets Israel's approach: sector-specific regulation by existing
  regulators, a risk-based approach, preference for soft tools (standards, self-regulation, sandboxes) over binding rules
  at this stage, alignment with OECD principles, and common ethical principles (growth and sustainable development, human-centricity,
  equality, transparency, safety, accountability, privacy). It establishes an AI policy coordination centre and an expert
  advisory forum.
scope_summary: Guidance to government ministries and regulators; no direct obligations on organisations.
