summary_plain: >-
  Makes it a primary duty of a person conducting a business or undertaking to ensure that workers' health and safety is not
  put at risk by "digital work systems" (an algorithm, AI, automation or online platform), and lets WHS entry-permit holders
  ask to inspect those systems.
scope_summary: Persons conducting a business or undertaking in New South Wales.
who_it_applies_to: NSW employers and other businesses or undertakings that use digital work systems.
key_dates_summary: >-
  Passed 12 February 2026; assented 18 February 2026. Only some provisions commenced on assent; the rest commence on dates
  to be announced, mostly no earlier than a month after SafeWork NSW publishes guidelines.
