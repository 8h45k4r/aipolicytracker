summary_plain: >-
  Replaces the NSW AI Ethics Policy and adopts Australia's AI Ethics Principles. Agencies must use the NSW AI Assessment Framework
  and give NSW GovAI a signed annual attestation by 31 October each year, the first due by 31 October 2027.
