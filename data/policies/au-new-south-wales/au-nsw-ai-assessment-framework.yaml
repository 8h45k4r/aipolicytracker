summary_plain: >-
  A risk-triage self-assessment across the AI lifecycle that replaced the NSW AI Assurance Framework. High- or critical-risk
  systems go to the AI Review Committee; using the assessment platform is mandatory for agencies under Circular DCS-2026-02.
