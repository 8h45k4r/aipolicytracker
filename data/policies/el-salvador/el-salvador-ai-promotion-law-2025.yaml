title: >-
  Ley para el Fomento de la Inteligencia Artificial y Tecnologías Emergentes (Decreto Legislativo, febrero de 2025)
short_title: Law for the Promotion of AI and Emerging Technologies
instrument_type: act
status: in_force
is_binding: true
featured: false
published: true
issuing_body: Asamblea Legislativa de El Salvador
summary_plain: >-
  Approved by the Legislative Assembly in February 2025, the law promotes AI development and investment, creates the National
  Agency for Artificial Intelligence (ANIA) as regulator, defines rights and principles (human oversight, transparency,
  non-discrimination, data protection), sets registration and sandbox mechanisms and limits liability of developers who
  act in good faith under the law, alongside data-processing rules for AI training.
scope_summary: >-
  Developers, providers and users of AI systems in El Salvador and public bodies; ANIA issues implementing regulations.
