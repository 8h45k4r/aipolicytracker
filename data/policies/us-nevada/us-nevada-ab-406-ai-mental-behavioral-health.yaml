summary_plain: >-
  Nevada limits the use of artificial intelligence in mental and behavioural health care. Public schools may not use
  AI to carry out the mental health duties of school counsellors, psychologists or social workers, and the Department
  of Education must set a policy on AI use by those staff. AI providers may not offer systems programmed to deliver
  professional mental or behavioural health care or claim that a system can do so. Licensed providers may not use AI
  to deliver that care directly to patients, but may use it for administrative tasks such as scheduling, billing and
  records, checking its output themselves.
scope_summary: >-
  Public schools and charter schools in Nevada, developers and providers of AI systems offered in Nevada, unlicensed
  persons, and licensed providers of mental and behavioural health care.
who_it_applies_to: Nevada public schools, AI system providers, and licensed mental and behavioural health care providers.
key_dates_summary: >-
  Enacted in the 2025 session as Chapter 283; official listings disagree on effective dates (1 July 2025 and 1 July 2026
  by section, or 1 October 2025).
penalties_summary: >-
  A breach of the provisions on AI systems and on holding out as qualified to provide care carries a civil penalty of
  up to 15,000 US dollars per violation.
what_organizations_must_do: >-
  AI providers must not offer or market systems as able to provide professional mental or behavioural health care;
  licensed providers must keep AI to administrative support and review AI-generated material themselves.
