  Act, Act No. 20676)
short_title: >-
  Framework Act on the Development of Artificial Intelligence and Establishment of a Foundation for Trust
instrument_type: act
status: in_force
status_note: >-
  Official page is in Korean; law number, promulgation date (2025-01-21) and enforcement date (2026-01-22) were
  confirmed from it. The 26 December 2024 plenary passage date comes from search results rather than the fetched
  page. English title is the commonly used translation; an official English text was not fetched.
is_binding: true
featured: false
published: true
issuing_body: National Assembly of the Republic of Korea; competent ministry Ministry of Science and ICT
summary_plain: >-
  Korea's AI Basic Act is a comprehensive framework statute combining industrial promotion with trust and safety
  rules. It gives a legal basis for a national AI master plan every three years and the National AI Committee, supports
  R&D, data, standardisation and SMEs, and imposes duties on operators of high-impact AI (risk management, explanation,
  human oversight) and transparency duties to notify users of generative AI output. Foreign operators above a threshold
  must designate a domestic representative. It was promulgated in January 2025 and took effect on 22 January 2026
  after a one-year grace period.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by National Assembly of the Republic of Korea; competent
  ministry Ministry of Science and ICT. Oversight: Ministry of Science and ICT as competent authority; presidential
  National AI Committee; AI Safety Institute. Stated purpose: Promote the AI industry while establishing trust obligations
  for high-impact and generative AI.
key_dates_summary: >-
  2024-12-26: Passed by the National Assembly plenary; 2025-01-21: Promulgated as Act No. 20676; 2026-01-22: Act
  enters into force
adopted_on: '2025-01-21'
date_notes: >-
