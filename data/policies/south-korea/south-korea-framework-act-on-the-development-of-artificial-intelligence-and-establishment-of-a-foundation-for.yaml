- slug: south-korea-ai-basic-act-art-34-high-impact-ai-user-protection-and-documentation
  title: Operators of high-impact AI must prepare user-protection measures and keep records of their safety and trust measures
  category: governance_accountability
  source_reference: "Article 34(1)"
  is_binding: true
  applies_from: 2026-01-22
  actors: [provider, deployer, public_authority]
  sectors: [cross_sector, healthcare, employment, financial_services, public_services, education]
  use_cases: [health, hiring_and_hr, finance_and_credit, public_services, education]
  summary: >
    Operators of high-impact AI must prepare and implement a plan to protect users, and must prepare and keep
    documents describing the measures they take to secure the AI's safety and reliability, so that they can be
    shown to the Ministry of Science and ICT on request. Further items may be added by Presidential Decree, and
    the ministry may publish guidelines on how to meet these duties.
  practical_action: >
    Write a user-protection plan for each high-impact system and keep a dated file of the safety and trust measures applied to it.
  applicability:
    description: AI business operators providing high-impact AI or products and services based on it.
    actors: [provider, deployer, public_authority]
    risk_categories: [high_risk]
    source_reference: "Article 34(1)"
