- slug: south-korea-ai-basic-act-art-34-high-impact-ai-human-oversight
  title: Operators of high-impact AI must ensure human management and supervision
  category: human_oversight
  source_reference: "Article 34(1)"
  is_binding: true
  applies_from: 2026-01-22
  actors: [provider, deployer, public_authority]
  sectors: [cross_sector, healthcare, employment, financial_services, public_services, critical_infrastructure]
  use_cases: [health, hiring_and_hr, finance_and_credit, public_services, safety_critical]
  summary: >
    Operators of high-impact AI must ensure that the AI is subject to human management and supervision, so that
    people remain able to monitor its operation and intervene in or override its outputs where those outputs may
    affect life, physical safety or fundamental rights.
  practical_action: >
    Assign accountable supervisors for each high-impact system and design the interface so they can pause, correct or overrule outputs.
  applicability:
    description: AI business operators providing high-impact AI or products and services based on it.
    actors: [provider, deployer, public_authority]
    risk_categories: [high_risk]
    source_reference: "Article 34(1)"
  evidence_examples:
