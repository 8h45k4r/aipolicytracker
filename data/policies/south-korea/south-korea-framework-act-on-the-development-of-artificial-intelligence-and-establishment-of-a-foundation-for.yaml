    - { framework: iso_42001, reference: "Annex A.8.2, A.7.3", note: "System documentation and data documentation.", confidence_level: low }
  controls:
    - { control: decision-explanation-and-appeal-route, relationship: satisfies, note: "Explanation of results and criteria to affected people.", confidence_level: medium }
    - { control: technical-documentation-and-model-cards, relationship: supports, note: "Training-data overview and decision logic documented.", confidence_level: high }
