- slug: south-korea-ai-basic-act-art-36-domestic-representative
  title: Foreign AI business operators above the threshold must designate a domestic representative in Korea
  category: governance_accountability
  source_reference: "Article 36"
  is_binding: true
  applies_from: 2026-01-22
  actors: [provider, gpai_provider, authorized_representative]
  sectors: [cross_sector]
  use_cases: [generative_ai, customer_service]
  summary: >
    An AI business operator without an address or place of business in Korea, whose user numbers or revenue meet
    the thresholds set by Presidential Decree, must designate in writing a domestic representative with an address
    in Korea. The representative handles the operator's duties under the Act, including submitting the Article 32
    safety results, supporting high-impact AI confirmation and cooperating with fact-finding investigations, and
    the operator is treated as responsible for the representative's acts.
  practical_action: >
    Check user and revenue figures against the decree thresholds and appoint a Korean representative by written designation before the duty bites.
  applicability:
    description: AI business operators established outside Korea that exceed the Presidential Decree user or revenue thresholds.
    actors: [provider, gpai_provider, authorized_representative]
    risk_categories: [systemic_risk, high_risk, unclassified]
    source_reference: "Article 36"
  evidence_examples:
    - { title: Written designation of domestic representative, artifact_type: document }
  framework_mappings:
    - { framework: iso_42001, reference: "Clause 5.3; Annex A.10.2", note: "Allocation of responsibilities to an external party.", confidence_level: medium }
    - { framework: nist_ai_rmf, reference: "GOVERN 2.1", note: "Roles and responsibilities.", confidence_level: low }
  controls:
    - { control: contractual-allocation-of-ai-duties, relationship: satisfies, note: "The written designation and the representative's task list.", confidence_level: high }
