- slug: south-korea-ai-basic-act-art-31-generative-output-labelling-and-deepfake-notice
  title: AI business operators must label generative AI output and clearly flag realistic synthetic media
  category: transparency
  source_reference: "Article 31(2) and 31(3)"
  is_binding: true
  applies_from: 2026-01-22
  actors: [provider, deployer]
  sectors: [media_information, cross_sector, consumer_retail]
  use_cases: [generative_ai, content_moderation]
  summary: >
    An AI business operator that provides generative AI or a product or service using it must indicate that the
    output was generated by generative AI. Where the operator provides content such as virtual sound, images or
    video that is hard to distinguish from reality, it must clearly notify users that the content is AI-generated,
    in a manner that does not impair a work's artistic or creative expression where that applies. Detailed methods
    are left to Presidential Decree and ministry guidance.
  practical_action: >
    Apply visible labels and, where feasible, embedded provenance marks to generated audio, image and video, and track the decree's technical specifications.
  applicability:
    description: Providers of generative AI and of products or services built on it that deliver output to users in Korea.
    actors: [provider, deployer]
    risk_categories: [transparency_risk]
    source_reference: "Article 31(2)–(3)"
  evidence_examples:
    - { title: Output labelling design and samples, artifact_type: record }
    - { title: Synthetic media labelling standard, artifact_type: document }
  framework_mappings:
    - { framework: nist_ai_rmf, reference: "MEASURE 2.7, MANAGE 4.1", note: "Content provenance as described in NIST AI 600-1.", confidence_level: medium }
    - { framework: iso_42001, reference: "Annex A.8.2, A.8.5", note: "System documentation and information for interested parties.", confidence_level: low }
  controls:
    - { control: synthetic-content-labelling-and-provenance, relationship: satisfies, note: "Labels and provenance marks on generated output and realistic synthetic media.", confidence_level: high }
  official_source_url: https://www.law.go.kr/lsInfoP.do?lsiSeq=268543
  review_status: verified
  reviewed_by: AI Policy Tracker
  last_verified_at: '2026-09-26'
  last_checked_at: '2026-09-26'
  confidence_level: medium
- slug: south-korea-ai-basic-act-art-32-safety-measures-for-high-performance-ai
  title: Operators of AI above the compute threshold must run lifecycle risk management and report safety results
  category: safety_testing
  source_reference: "Article 32"
  is_binding: true
  applies_from: 2026-01-22
  actors: [provider, gpai_provider]
  sectors: [cross_sector]
  use_cases: [generative_ai]
  summary: >
    An AI business operator whose AI system's cumulative training computation exceeds the threshold set by
    Presidential Decree must identify, assess and mitigate risks across the system's life cycle, build a risk
    management system to monitor and respond to safety incidents caused by the AI, and submit the results of
    these measures to the Minister of Science and ICT. The threshold and reporting form are set in the Decree.
  practical_action: >
    Track training compute against the decree threshold and prepare a safety report covering risk identification, mitigation and incident monitoring for submission to the ministry.
  applicability:
    description: Operators of AI systems whose cumulative training compute exceeds the Presidential Decree threshold, in practice frontier-scale model developers.
    actors: [provider, gpai_provider]
    risk_categories: [systemic_risk]
    source_reference: "Article 32"
  evidence_examples:
    - { title: Lifecycle risk assessment and mitigation record, artifact_type: report }
    - { title: Safety measures report submitted to the ministry, artifact_type: report }
  framework_mappings:
    - { framework: nist_ai_rmf, reference: "MAP 5.1, MEASURE 2.6, MANAGE 1.3, MANAGE 4.3", note: "Safety evaluation, risk treatment and incident response.", confidence_level: medium }
    - { framework: iso_42001, reference: "Clause 6.1.2, 6.1.3, 9.1", note: "Risk assessment, treatment and monitoring.", confidence_level: medium }
  controls:
    - { control: frontier-model-safety-framework, relationship: satisfies, note: "Compute tracking, lifecycle risk assessment and reporting to the authority.", confidence_level: medium }
    - { control: ai-incident-management-and-reporting, relationship: supports, note: "Incident monitoring and response arm of the risk management system.", confidence_level: medium }
    - { control: genai-red-team-testing, relationship: supports, note: "Evidence for the risk identification step.", confidence_level: medium }
  official_source_url: https://www.law.go.kr/lsInfoP.do?lsiSeq=268543
  review_status: verified
  reviewed_by: AI Policy Tracker
  last_verified_at: '2026-09-26'
  last_checked_at: '2026-09-26'
  confidence_level: medium
- slug: south-korea-ai-basic-act-art-34-high-impact-ai-risk-management-plan
  title: Operators of high-impact AI must establish and operate a risk management plan
  category: risk_management
  source_reference: "Article 34(1)"
  is_binding: true
  applies_from: 2026-01-22
  actors: [provider, deployer, public_authority]
  sectors: [cross_sector, healthcare, employment, financial_services, public_services, critical_infrastructure, education]
  use_cases: [health, hiring_and_hr, finance_and_credit, public_services, education, safety_critical, biometrics]
  summary: >
    An AI business operator that provides high-impact AI, or a product or service using it, must establish and
    operate a plan for managing the risks of that AI. High-impact AI is AI used in areas such as energy, drinking
    water, health care and medical devices, nuclear safety, biometric analysis for criminal investigation,
    decisions on recruitment or loans, transport, public services and education, where it may materially affect
    life, safety or fundamental rights.
  practical_action: >
    Classify systems against the high-impact areas and write a risk management plan for each one before launch.
  applicability:
    description: AI business operators providing high-impact AI or products and services based on it; operators may ask the ministry to confirm whether a system is high-impact under Article 33.
    actors: [provider, deployer, public_authority]
    risk_categories: [high_risk]
    source_reference: "Article 34(1)"
  evidence_examples:
    - { title: High-impact AI risk management plan, artifact_type: document }
    - { title: High-impact classification record, artifact_type: record }
  framework_mappings:
    - { framework: iso_42001, reference: "Clause 6.1.2, 6.1.3, 8.1", note: "Risk assessment, treatment and operational planning.", confidence_level: medium }
    - { framework: nist_ai_rmf, reference: "MAP 1.5, MANAGE 1.3", note: "Risk tolerance and treatment.", confidence_level: medium }
  controls:
    - { control: ai-risk-assessment, relationship: satisfies, note: "Per-system risk plan with identified risks and treatments.", confidence_level: high }
    - { control: ai-system-inventory, relationship: supports, note: "Classification of systems against the high-impact list.", confidence_level: high }
