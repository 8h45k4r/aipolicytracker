- slug: south-korea-ai-basic-act-art-31-advance-notice-of-high-impact-and-generative-ai
  title: AI business operators must notify users in advance that a product or service runs on high-impact or generative AI
  category: transparency
  source_reference: "Article 31(1)"
  is_binding: true
  applies_from: 2026-01-22
  actors: [provider, deployer]
  sectors: [cross_sector, consumer_retail, public_services]
  use_cases: [generative_ai, customer_service, public_services]
  summary: >
    An AI business operator that provides a product or service operated by high-impact AI or by generative AI
    must notify users in advance that the product or service is based on such AI. The notice is owed before use
    and is the entry point of the Act's transparency chapter; failure to give it can attract an administrative
    fine after a corrective order.
  practical_action: >
    Add a plain-language AI notice at onboarding or first use for any product that relies on high-impact or generative AI.
  applicability:
    description: AI business operators, meaning developers and providers of AI products or services in Korea, where the product uses high-impact or generative AI.
    actors: [provider, deployer]
    risk_categories: [high_risk, transparency_risk]
    source_reference: "Article 31(1)"
  evidence_examples:
    - { title: User notice copy and placement record, artifact_type: document }
  framework_mappings:
    - { framework: nist_ai_rmf, reference: "GOVERN 5.1, MANAGE 4.1", note: "Transparency to end users.", confidence_level: medium }
    - { framework: iso_42001, reference: "Annex A.8.5", note: "Information for interested parties.", confidence_level: medium }
  controls:
    - { control: ai-interaction-and-use-disclosure, relationship: satisfies, note: "Advance user notice of AI-based service.", confidence_level: high }
    - { control: ai-system-inventory, relationship: supports, note: "Classification identifies which products are high-impact or generative.", confidence_level: medium }
  official_source_url: https://www.law.go.kr/lsInfoP.do?lsiSeq=268543
