- slug: south-korea-ai-basic-act-art-35-high-impact-ai-impact-assessment
  title: Operators of high-impact AI should assess its impact on fundamental rights before use
  category: impact_assessment
  source_reference: "Article 35"
  is_binding: false
  applies_from: 2026-01-22
  actors: [provider, deployer, public_authority]
  sectors: [cross_sector, public_services, healthcare, employment, financial_services]
  use_cases: [public_services, health, hiring_and_hr, finance_and_credit]
  summary: >
    An AI business operator that provides high-impact AI, or a product or service using it, is to make efforts to
    assess in advance the impact the AI may have on people's fundamental rights. The provision is drafted as an
    endeavour duty rather than a hard requirement, but public bodies procuring high-impact AI are directed to give
    preference to products that have undergone such an assessment, and the ministry may set assessment methods.
  practical_action: >
    Run a fundamental-rights impact assessment for each high-impact system, particularly where public-sector procurement is in view.
  applicability:
    description: AI business operators providing high-impact AI; the assessment is an effort obligation with procurement incentives for public bodies.
    actors: [provider, deployer, public_authority]
    risk_categories: [high_risk]
    source_reference: "Article 35"
  evidence_examples:
    - { title: Fundamental-rights impact assessment for high-impact AI, artifact_type: report }
  framework_mappings:
