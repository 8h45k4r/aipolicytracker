- slug: south-korea-ai-basic-act-art-34-high-impact-ai-explanation-measures
  title: Operators of high-impact AI must be able to explain outputs and the main criteria behind them
  category: transparency
  source_reference: "Article 34(1)"
  is_binding: true
  applies_from: 2026-01-22
  actors: [provider, deployer, public_authority]
  sectors: [cross_sector, healthcare, employment, financial_services, public_services, education]
  use_cases: [health, hiring_and_hr, finance_and_credit, public_services, education]
  summary: >
    Operators of high-impact AI must put in place measures to explain the AI's final results, the main criteria
    used to reach them, and an overview of the training data, to the extent that this is technically feasible.
    The duty targets explainability of the system's decisions to users and affected people rather than full
    disclosure of the model.
  practical_action: >
    Document the decision criteria and training-data overview for each high-impact system and prepare a user-facing explanation format.
  applicability:
    description: AI business operators providing high-impact AI or products and services based on it.
    actors: [provider, deployer, public_authority]
    risk_categories: [high_risk]
    source_reference: "Article 34(1)"
  evidence_examples:
    - { title: Explanation method and decision-criteria documentation, artifact_type: document }
  framework_mappings:
