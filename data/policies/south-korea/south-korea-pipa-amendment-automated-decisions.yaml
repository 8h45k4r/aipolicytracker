summary_plain: >-
  The 2023 amendment to Korea's general privacy law added Article 37-2, which gives people rights over decisions made
  by fully automated systems, including AI, that significantly affect their rights or duties. A person may refuse such
  a decision or ask for an explanation of it; the controller must then stop applying the decision unless there is a
  compelling reason, or take other steps such as having a human re-examine it and explaining it. Controllers must also
  make public the standards and procedures they use for automated decisions. The Enforcement Decree sets out the
  procedure for refusals and explanation requests.
scope_summary: >-
  Personal information controllers, in the public and private sectors, that make final decisions affecting individuals
  through fully automated processing of personal information; certain decisions based on legal grounds under Article
  15(1) are excluded from the right to refuse.
who_it_applies_to: Organisations and public bodies in Korea that make significant fully automated decisions about individuals.
key_dates_summary: Amending Act promulgated 14 March 2023; Enforcement Decree amended 12 March 2024; automated-decision provisions in force 15 March 2024.
what_organizations_must_do: >-
  Identify decisions made without meaningful human involvement that affect people's rights or duties, publish the
  standards and procedures used, and set up a process to handle refusals and explanation requests, including human
  re-examination where needed.
adopted_on: '2023-03-14'
