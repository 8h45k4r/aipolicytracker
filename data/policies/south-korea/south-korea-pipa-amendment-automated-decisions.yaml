date_notes: >-
  The extracts state that the amending Act was promulgated on 14 March 2023 and that the automated-decision provisions
  apply from 15 March 2024. The Enforcement Decree amendment (Presidential Decree No. 34309) was approved by the Cabinet
  on 6 March 2024 and promulgated on 12 March 2024, with Articles 44-2 to 44-4 in force on 15 March 2024. Other parts of
  the 2023 amendment had their own commencement dates, which were not established here.
