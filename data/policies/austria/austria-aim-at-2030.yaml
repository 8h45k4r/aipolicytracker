title: >-
  Strategie der Bundesregierung für Künstliche Intelligenz – Artificial Intelligence Mission Austria 2030 (AIM AT 2030)
short_title: AIM AT 2030 (AI strategy)
instrument_type: strategy
status: adopted
is_binding: false
featured: false
published: true
issuing_body: Federal Government of Austria
summary_plain: >-
  Adopted in August 2021, AIM AT 2030 sets three objectives: broad use of AI oriented to the common good and fundamental
  rights, Austria as a research and innovation location, and competitiveness of the Austrian technology and business location.
  It lists fields of action including trustworthy AI, public administration, skills, data and infrastructure, with an implementation
  and monitoring structure.
scope_summary: Government programme; no obligations on private organisations.
