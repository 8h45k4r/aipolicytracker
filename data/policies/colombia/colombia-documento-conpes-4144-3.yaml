summary_plain: >-
  CONPES 4144, approved on 14 February 2025, is Colombia's national AI policy and roadmap through 2030. It sets
  objectives on governance and ethics, data and infrastructure, research and talent, and adoption across the public
  and private sectors, backed by an action plan of more than 100 actions with assigned entities and an indicative
  budget. The DNP, MinTIC, Minciencias and several line ministries share responsibility for its execution and monitoring.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Consejo Nacional de Política Económica y Social
  (CONPES) / Departamento Nacional de Planeación (DNP). Oversight: DNP steers the policy; MinTIC and Minciencias
  lead technical implementation with other ministries. Stated purpose: Promote ethical, sustainable AI adoption
  and close capability gaps to 2030.
