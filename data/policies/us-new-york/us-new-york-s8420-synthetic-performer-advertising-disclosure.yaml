summary_plain: >-
  This law requires anyone who produces or creates an advertisement to disclose when it includes a synthetic performer,
  meaning a performer generated by AI rather than a real person. Its purpose is to let viewers know whether a product is
  being promoted by a real person or by a computer-generated figure.
scope_summary: >-
  Advertisements shown in New York that include AI-generated synthetic performers, and the persons who produce or create
  them.
who_it_applies_to: Persons who produce or create advertisements that include AI-generated synthetic performers.
