status_note: >-
  Recorded on 26 November 2026 from search-engine extracts of the official pages listed; the official text could not be
  opened from the research environment, so every date and duty here is pending review against it. The Senate bill page
  records that S 5959-D was signed as Chapter 304 on 30 November 2020, and the Governor announced the signing. Section
