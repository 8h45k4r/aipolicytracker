summary_plain: >-
  This law created a right of publicity in New York that continues for 40 years after death, covering commercial use
  of a deceased person's name, picture, voice or signature, with a public registry run by the Secretary of State where
  successors can give notice of their rights. It also set rules for digital replicas of deceased performers, meaning
  newly created computer-generated performances they never gave, with exceptions for uses such as news, commentary and
  documentaries. A separate new section (Civil Rights Law section 52-c) gave people a right to sue over the
  dissemination of sexually explicit depictions of them created through digitization.
scope_summary: >-
  Commercial uses in New York of the name, likeness or voice of deceased individuals, digital replicas of deceased
  performers in new works, and sexually explicit digitized depictions of identifiable people.
who_it_applies_to: Producers, advertisers and others using a deceased person's persona or a digital replica in New York.
key_dates_summary: 'Signed 30 November 2020 (Chapter 304); in effect from 29 May 2021 (180 days after enactment).'
