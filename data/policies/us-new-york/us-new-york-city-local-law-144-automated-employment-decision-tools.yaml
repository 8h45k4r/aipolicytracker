- slug: us-new-york-city-local-law-144-candidate-notice
  title: Employers and employment agencies must notify candidates and employees before an automated tool is used
  category: transparency
  source_reference: "NYC Administrative Code Section 20-871(b)(1) and (b)(2); 6 RCNY Section 5-303"
  is_binding: true
  applies_from: 2023-07-05
  actors: [deployer]
  sectors: [employment]
  use_cases: [hiring_and_hr]
  summary: >
    Candidates and employees who reside in New York City must be told, at least ten business days before an
    automated employment decision tool is used to assess them, that such a tool will be used in the hiring or
    promotion decision, and which job qualifications and characteristics the tool will assess. The DCWP rules
    allow the notice to be given on the careers page, in the job posting, or by mail or email, and require that it
    reach the person before the tool is applied.
  practical_action: >
    Insert the tool notice and the assessed qualifications into job postings and application confirmations at least ten business days before screening.
  applicability:
    description: Employers and employment agencies assessing New York City residents with an automated employment decision tool.
    actors: [deployer]
    risk_categories: [high_risk]
    source_reference: "NYC Administrative Code Section 20-871(b)"
  evidence_examples:
    - { title: Candidate notice text and delivery record, artifact_type: document }
    - { title: Notice timing log per requisition, artifact_type: record }
  framework_mappings:
    - { framework: nist_ai_rmf, reference: "GOVERN 5.1, MANAGE 4.1", note: "Transparency to affected individuals.", confidence_level: medium }
    - { framework: iso_42001, reference: "Annex A.8.5", note: "Information for interested parties.", confidence_level: medium }
  controls:
    - { control: ai-interaction-and-use-disclosure, relationship: satisfies, note: "Advance notice to candidates with the assessed criteria.", confidence_level: high }
  official_source_url: https://www.nyc.gov/site/dca/about/automated-employment-decision-tools.page
