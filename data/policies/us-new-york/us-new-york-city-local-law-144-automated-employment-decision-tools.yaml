- slug: us-new-york-city-local-law-144-data-policy-disclosure
  title: Employers and employment agencies must disclose the data collected and their retention policy for the tool
  category: privacy_data_protection
  source_reference: "NYC Administrative Code Section 20-871(b)(3); 6 RCNY Section 5-303"
  is_binding: true
  applies_from: 2023-07-05
  actors: [deployer]
  sectors: [employment]
  use_cases: [hiring_and_hr]
  summary: >
    Unless already disclosed on the website, an employer or employment agency must provide, within 30 days of a
    written request from a candidate or employee, information about the type of data the automated employment
    decision tool collects, the source of that data, and the employer's or agency's data retention policy. The
    DCWP rules allow this information to be posted publicly instead of answered case by case.
  practical_action: >
    Publish a short data notice for the tool covering data types, sources and retention, or set up a 30-day response process for written requests.
  applicability:
    description: Employers and employment agencies using an automated employment decision tool for New York City residents.
    actors: [deployer]
    risk_categories: [high_risk]
    source_reference: "NYC Administrative Code Section 20-871(b)(3)"
  evidence_examples:
    - { title: Data collection and retention notice for the tool, artifact_type: document }
    - { title: Request response log, artifact_type: register }
  framework_mappings:
    - { framework: nist_ai_rmf, reference: "MAP 2.2, MEASURE 2.10", note: "Data documentation and privacy transparency.", confidence_level: medium }
    - { framework: iso_42001, reference: "Annex A.7.2, A.8.5", note: "Data management and information for interested parties.", confidence_level: medium }
  controls:
