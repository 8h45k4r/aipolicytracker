- slug: us-new-york-city-local-law-144-publish-audit-summary
  title: Employers and employment agencies must publish a summary of the bias audit results
  category: transparency
  source_reference: "NYC Administrative Code Section 20-871(a)(2); 6 RCNY Section 5-302"
  is_binding: true
  applies_from: 2023-07-05
  actors: [deployer]
  sectors: [employment]
  use_cases: [hiring_and_hr]
  summary: >
    Before using an automated employment decision tool, the employer or employment agency must make a summary of
    the most recent bias audit results and the distribution date of the tool publicly available on the employment
    section of its website. Under the DCWP rules the summary states the audit date, the data source and type, the
    number of applicants or candidates in each category, and the selection or scoring rates and impact ratios,
    and must remain posted for at least six months after the tool was last used.
  practical_action: >
    Post the audit summary and distribution date on the careers page before go-live and refresh it with each annual audit.
  applicability:
    description: Employers and employment agencies using an automated employment decision tool for New York City residents.
    actors: [deployer]
    risk_categories: [high_risk]
    source_reference: "NYC Administrative Code Section 20-871(a)(2)"
  evidence_examples:
    - { title: Published bias audit summary with distribution date, artifact_type: document }
  framework_mappings:
    - { framework: nist_ai_rmf, reference: "GOVERN 4.2, MEASURE 2.11", note: "Public transparency of fairness results.", confidence_level: medium }
    - { framework: iso_42001, reference: "Annex A.8.3, A.8.5", note: "External reporting and information for interested parties.", confidence_level: medium }
  controls:
    - { control: ai-interaction-and-use-disclosure, relationship: satisfies, note: "Public posting of audit results is a disclosure to candidates.", confidence_level: medium }
    - { control: accuracy-robustness-security-testing, relationship: supports, note: "Produces the results being summarised.", confidence_level: high }
