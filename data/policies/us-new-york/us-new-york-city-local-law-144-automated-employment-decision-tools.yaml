- slug: us-new-york-city-local-law-144-alternative-process-request
  title: Employers and employment agencies must let candidates request an alternative selection process or accommodation
  category: human_oversight
  source_reference: "NYC Administrative Code Section 20-871(b)(1); 6 RCNY Section 5-303"
  is_binding: true
  applies_from: 2023-07-05
  actors: [deployer]
  sectors: [employment]
  use_cases: [hiring_and_hr]
  summary: >
    The advance notice to candidates and employees must allow them to request an alternative selection process or
    a reasonable accommodation. The DCWP rules make clear that the law itself does not require the employer to
    provide an alternative process, but the request route must exist and accommodation requests remain governed by
    disability and human-rights law. Instructions for making the request must be included in the notice.
  practical_action: >
    Provide a request mechanism in the candidate notice and record how each request was handled under the accommodation policy.
  applicability:
    description: Employers and employment agencies giving the Section 20-871(b) notice.
    actors: [deployer]
    risk_categories: [high_risk]
    source_reference: "NYC Administrative Code Section 20-871(b)(1)"
  evidence_examples:
    - { title: Alternative-process and accommodation request log, artifact_type: register }
  framework_mappings:
    - { framework: nist_ai_rmf, reference: "GOVERN 5.1, MANAGE 4.1", note: "Recourse route for affected individuals.", confidence_level: medium }
    - { framework: iso_42001, reference: "Annex A.9.2", note: "Processes for responsible use.", confidence_level: low }
  controls:
