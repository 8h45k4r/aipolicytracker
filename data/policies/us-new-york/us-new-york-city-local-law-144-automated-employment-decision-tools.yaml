- slug: us-new-york-city-local-law-144-bias-audit
  title: Employers and employment agencies must obtain an independent bias audit before using an automated employment decision tool
  category: accuracy_robustness_security
  source_reference: "NYC Administrative Code Section 20-871(a)(1); 6 RCNY Section 5-301"
  is_binding: true
  applies_from: 2023-07-05
  actors: [deployer]
  sectors: [employment]
  use_cases: [hiring_and_hr]
  summary: >
    An automated employment decision tool may not be used to screen candidates or employees for hiring or promotion
    in New York City unless it has been the subject of a bias audit by an independent auditor within the year before
    use. The audit calculates selection rates and impact ratios by sex, race/ethnicity and their intersections, and
    scoring-rate comparisons for tools that score rather than select, using the employer's historical data or,
    where insufficient, test data as the DCWP rules allow.
  practical_action: >
    Commission an annual independent bias audit for each tool, supplying historical outcome data by protected category, and calendar the twelve-month expiry.
  applicability:
    description: Employers and employment agencies using an automated employment decision tool for candidates or employees who reside in New York City; vendors are not directly liable but commonly supply the audit.
    actors: [deployer]
    risk_categories: [high_risk]
    source_reference: "NYC Administrative Code Section 20-871(a)"
  evidence_examples:
