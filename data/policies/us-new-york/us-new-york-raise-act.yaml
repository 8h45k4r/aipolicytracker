jurisdiction: us-new-york
title: New York Responsible AI Safety and Education (RAISE) Act (S.6953-B / A.6453-B, signed December 2025)
short_title: New York RAISE Act (frontier model safety)
instrument_type: act
status: adopted
status_note: >-
  Signed by the Governor in December 2025 with chapter amendments agreed to align with California SB 53; effective date
  reported as 1 January 2027. Confirm the final text and date on the Senate website before relying on it.
is_binding: true
featured: false
published: true
issuing_body: New York State Legislature
summary_plain: >-
  The RAISE Act requires large developers of frontier AI models (defined by training compute and revenue thresholds) to
  publish and follow a safety and security protocol, report critical safety incidents to the state within a set period,
  not deploy models that create unreasonable risk of critical harm, and submit to Attorney General enforcement with civil
  penalties; the chapter amendments create a state oversight office and align definitions with California's Transparency
  in Frontier AI Act.
scope_summary: >-
  Large frontier-model developers whose models are available in New York; not deployers of ordinary AI systems.
key_dates_summary: >-
  2025-06-12: passed Legislature; 2025-12-19: signed with agreed chapter amendments; 2027-01-01: reported effective date.
