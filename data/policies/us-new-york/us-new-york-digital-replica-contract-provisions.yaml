summary_plain: >-
  This law adds section 5-302 to the General Obligations Law. A contract term that lets a digital replica of a person's
  voice or likeness stand in for work they would otherwise do in person is void and unenforceable if it does not
  describe the intended uses with reasonable specificity and the person was not represented, either by a lawyer who
  negotiated the replica rights in a separate written agreement or by a union whose agreement covers those uses. It
  applies to contracts made or changed from 1 January 2025.
scope_summary: >-
  Contracts entered into or modified on or after 1 January 2025 for personal or professional services that allow a
  digital replica of an individual's voice or likeness to replace work the individual would otherwise perform.
who_it_applies_to: Studios, producers and other organisations contracting for performers' or individuals' services.
key_dates_summary: 'Signed 13 December 2024 (Chapter 581); effective 1 January 2025 for contracts made or modified from then.'
what_organizations_must_do: >-
  Organisations that want digital replica rights must describe the intended uses with reasonable specificity and make
  sure the individual is represented by counsel or covered by a collective agreement, or the term will not bind.
