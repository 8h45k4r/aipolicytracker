status_note: >-
  Recorded on 26 November 2026 from search-engine extracts of the official pages listed; the official text could not be
  opened from the research environment, so every date and duty here is pending review against it. The Attorney General
  stated that the Act took effect on 10 November 2025 and has since written to at least one company about compliance.
  Later bills would amend or replace section 349-a (for example A 9349 / S 8623, and the One Fair Price Act passed by
  the Legislature in June 2026); none of them was confirmed as enacted, so this record describes the section as added
  in 2025.
