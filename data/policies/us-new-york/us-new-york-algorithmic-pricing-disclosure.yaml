date_notes: >-
  The effective date of 10 November 2025 comes from search extracts of the Attorney General's release of 5 November
  2025. The section was added by section 1 of Part X of Chapter 58 of the Laws of 2025 (the FY2026 budget), as cited in
  later amending bills; one sponsor memo gives the year as 2023, which appears to be an error. The date the budget bill
  was signed, and the effective-date clause of Part X itself, were not established, so adopted_on is left empty.
