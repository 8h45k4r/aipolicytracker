issuing_body: New York State Legislature
summary_plain: >-
  This law requires businesses that set prices for New York consumers using personalised algorithmic pricing based on
  those consumers' personal data to say so. Wherever such a price is advertised, displayed or offered, it must carry a
  clear and conspicuous notice that the price was set by an algorithm using the consumer's personal data. The Attorney
  General enforces it and can seek civil penalties.
scope_summary: >-
  Businesses offering goods or services to consumers in New York whose prices are set by algorithms drawing on the
  individual consumer's personal data, online and in other advertising or price displays.
who_it_applies_to: Retailers, platforms and other businesses that personalise prices for New York consumers by algorithm.
key_dates_summary: 'In effect from 10 November 2025, per the Attorney General.'
penalties_summary: >-
  The Attorney General describes civil penalties of up to 1,000 US dollars per violation, with injunctive relief
  available against businesses that continue after a cease-and-desist letter.
what_organizations_must_do: >-
  Organisations must place a clear and conspicuous disclosure, close to any algorithmically personalised price, that
  the price was set by an algorithm using the consumer's personal data.
