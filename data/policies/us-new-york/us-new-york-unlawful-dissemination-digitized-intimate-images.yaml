status_note: >-
  Recorded on 26 November 2026 from search-engine extracts of the official pages listed; the official text could not be
  opened from the research environment, so every date and duty here is pending review against it. The Senate and
  Assembly action logs show the bill delivered to the Governor on 19 September 2023 and signed as Chapter 513 on
  29 September 2023, with effect on the 60th day after it became law, so it is in force. Civil Rights Law section 52-c
