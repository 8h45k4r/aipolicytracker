summary_plain: >-
  This law extends New York's offence of unlawful dissemination or publication of an intimate image (Penal Law section
  245.15) to images created or altered by digitization. Digitization means realistically altering an image using images
  of someone other than the person shown or computer-generated images, which brings sexually explicit deepfakes of an
  identifiable person within the offence. The law also repealed former subdivision 2-a of the section.
scope_summary: >-
  Anyone in New York who shares or publishes, without consent, an intimate image of an identifiable person that was
  created or altered through digitization, including computer-generated imagery.
who_it_applies_to: Individuals who disseminate or publish digitized intimate images of others without consent.
key_dates_summary: 'Signed 29 September 2023 (Chapter 513); takes effect on the 60th day after it became law.'
