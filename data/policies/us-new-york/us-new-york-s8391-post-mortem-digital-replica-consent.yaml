summary_plain: >-
  This law changes New York's post-mortem right of publicity so that anyone who wants to use a deceased person's name,
  image, likeness or voice for commercial purposes, including a digital replica of a deceased performer in films, video
  games, sound recordings or live musical performances, must first obtain consent from the heirs or executors. Under
  the previous rule a disclaimer was enough for expressive works as long as the depiction was not likely to deceive the
  public. Online service providers are given a limited shield unless they fail to act on a good-faith notice.
scope_summary: >-
  Commercial uses in New York of a deceased individual's name, image, likeness or voice, including digital replicas of
  deceased performers in audiovisual works, sound recordings and live performances.
who_it_applies_to: >-
  Producers, distributors and others who use a deceased person's likeness or digital replica commercially; online
  service providers on notice.
