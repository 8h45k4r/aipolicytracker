summary_plain: >-
  This advisory warns organisations regulated by the New York Department of Financial Services that some frontier AI
  models can make finding software vulnerabilities and building exploits faster and easier for attackers. It urges them
  to improve their security before such models are widely released, chiefly by identifying and fixing vulnerabilities
  quickly, and points to the companion guidance on heightened threat environments for detailed measures.
scope_summary: >-
  NYDFS-regulated individuals and entities and their information systems, in relation to attacks made faster or larger
  by frontier AI models.
who_it_applies_to: NYDFS-regulated individuals and entities (banking, insurance and financial services).
key_dates_summary: 'Issued 21 May 2026.'
what_organizations_must_do: >-
  The advisory asks regulated entities to confirm they comply fully with 23 NYCRR Part 500, review and update risk
  assessments for frontier AI models, consider faster vulnerability management, check whether logging and security
  alerting are adequate, consider replacing end-of-life or legacy systems, and alert staff to social-engineering
  campaigns.
