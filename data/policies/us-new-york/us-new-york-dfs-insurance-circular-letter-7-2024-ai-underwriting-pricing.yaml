summary_plain: >-
  This circular letter sets out the Department's expectations for insurers that use AI systems or external consumer data
  in underwriting and pricing. Insurers should have governance and risk-management frameworks for these tools, test
  them for unfair or unlawful discrimination, be able to show they are actuarially sound, remain responsible for tools
  bought from vendors, and tell consumers when such data or systems are used.
scope_summary: >-
  Underwriting and pricing of insurance policies and annuity contracts in New York that use external consumer data,
  AI systems or other predictive models, including vendor-supplied tools.
who_it_applies_to: >-
  Insurers authorised to write insurance in New York State, Article 43 corporations, health maintenance organisations,
  licensed fraternal benefit societies and the New York State Insurance Fund.
key_dates_summary: 'Proposed 17 January 2024; issued 11 July 2024.'
what_organizations_must_do: >-
  Insurers should assess whether these tools produce disproportionate adverse effects on similarly situated people or
  protected classes, avoid using data or models based on classes protected under Insurance Law Article 26, document an
  actuarial link to the risk priced, oversee vendors, and disclose to applicants the use of these tools and any threshold
  criteria. The Department notes it can examine this use under Insurance Law sections 308 and 309, and that inadequate
  disclosure may be an unfair trade practice under Article 24.
