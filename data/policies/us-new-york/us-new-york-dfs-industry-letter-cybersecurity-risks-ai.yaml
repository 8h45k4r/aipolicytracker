summary_plain: >-
  This industry letter explains how organisations regulated by the New York Department of Financial Services should use
  the existing cybersecurity regulation (23 NYCRR Part 500) to deal with risks created by AI. It describes threats such
  as AI-generated deepfakes used in phishing, voice and video calls to obtain credentials or payments, and the theft of
  biometric data to get past multi-factor authentication. It also encourages firms to consider how AI can strengthen
  their own cybersecurity tools.
scope_summary: >-
  Covered entities under the DFS cybersecurity regulation, including their own AI use, AI used by their third-party
  service providers and vendors, and vulnerabilities in AI applications.
who_it_applies_to: Banks, insurers and other financial services entities regulated by NYDFS under 23 NYCRR Part 500.
key_dates_summary: 'Issued 16 October 2024.'
what_organizations_must_do: >-
  The letter recommends that risk assessments take account of deepfakes and other AI-enabled threats; that
  authentication avoid SMS, voice or video factors that deepfakes can imitate in favour of factors such as digital
  certificates and physical security keys; and that annual social-engineering training include deepfake scenarios.
