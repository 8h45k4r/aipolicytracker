summary_plain: >-
  This circular letter sets out what New York law requires of life insurers that use external consumer data, meaning
  information not directly tied to an applicant's medical condition, together with algorithms and predictive models in
  underwriting. Insurers must be able to show that such data and models do not rely on protected characteristics, are
  not unfairly discriminatory and rest on sound actuarial principles, and they cannot rely on a vendor's assurance or
  the proprietary nature of a vendor's process.
scope_summary: >-
  Life underwriting by insurers authorised to write life insurance in New York that use external data sources,
  algorithms or predictive models, including those supplied by vendors.
who_it_applies_to: Insurers authorised to write life insurance in New York State.
key_dates_summary: 'Issued 18 January 2019.'
what_organizations_must_do: >-
  Insurers should not use an external source to collect information they could not lawfully collect directly, must be
  able to justify external data and models actuarially and show they are not unfairly discriminatory, and should tell an
  applicant the reasons for an adverse underwriting decision, including the specific external source relied on.
