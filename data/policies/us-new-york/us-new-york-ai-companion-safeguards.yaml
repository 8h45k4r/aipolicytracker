obligations:
  - slug: us-new-york-gbl-1701-self-harm-protocol
    aipt_id: AIPT-OBL-0128
    short_title: "Self-harm and suicide protocol"
    title: Offer an AI companion only if it contains a protocol to detect suicidal ideation or self-harm and refer users to crisis services
    category: risk_management
    section: "§ 1701"
    source_reference: "N.Y. Gen. Bus. Law § 1701"
    official_source_url: "https://www.nysenate.gov/legislation/laws/GBS/1701"
    is_binding: true
    applies_from: null
    actors: [deployer, provider]
    sectors: [consumer_retail]
    use_cases: [customer_service, health]
    summary: >
      It is unlawful for an operator to operate or provide an AI companion to a user unless the AI companion contains a
      protocol for taking reasonable efforts to detect and address suicidal ideation or expressions of self-harm by the user.
      The protocol must at least detect such expressions and, when it does, notify the user with a referral to crisis
      service providers, such as the 9-8-8 suicide prevention and behavioral health crisis hotline, a crisis text line or
      other appropriate crisis services. The Attorney General may seek an injunction and civil penalties of up to 15,000
      dollars per day for a violation (section 1703).
    practical_action: >-
      Build detection of suicidal ideation and self-harm into the AI companion and, on detection, show the user a referral
      naming 988 and a crisis text line; document the protocol and test that it fires.
    evidence_examples:
      - { title: "The written protocol, with its detection approach and the referral message shown to users" }
      - { title: "Test results showing detection triggers the 988 and crisis-line referral" }
    controls:
      - { control: genai-red-team-testing, relationship: supports, note: "Testing that expressions of suicidal ideation or self-harm are detected and answered with a referral.", confidence_level: medium }
      - { control: ai-incident-management-and-reporting, relationship: supports, note: "An escalation path for crisis events detected by the protocol.", confidence_level: low }
    review_status: pending_review
    confidence_level: high
  - slug: us-new-york-gbl-1702-ai-notification
    aipt_id: AIPT-OBL-0129
    short_title: "Notice that the user is not talking to a human"
    title: Tell users at the start of an AI companion interaction, and at least every three hours, that they are not communicating with a human
    category: transparency
    section: "§ 1702"
    source_reference: "N.Y. Gen. Bus. Law § 1702"
    official_source_url: "https://www.nysenate.gov/legislation/laws/GBS/1702"
    is_binding: true
    applies_from: null
    actors: [deployer, provider]
    sectors: [consumer_retail]
    use_cases: [customer_service]
    summary: >
      An operator must give the user a clear and conspicuous notification, spoken or written, that the user is not
      communicating with a human. It is given at the beginning of any AI companion interaction, which the text says need not
      happen more than once a day, and at least every three hours during a continuing interaction. The Attorney General may
      seek an injunction and civil penalties of up to 15,000 dollars per day for a violation (section 1703).
    practical_action: >-
      Show a prominent not-human notice when an interaction starts (at least once a day) and repeat it on a timer of three
      hours or less while the conversation continues, in voice as well as text products.
    evidence_examples:
      - { title: "Screenshots or recordings of the opening notice and the repeated notice, with the timer setting" }
    controls:
      - { control: ai-interaction-and-use-disclosure, relationship: satisfies, note: "The start-of-interaction and three-hourly notice that the user is not talking to a human.", confidence_level: high }
    review_status: pending_review
    confidence_level: high
