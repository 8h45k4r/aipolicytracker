issuing_body: New York State Legislature
summary_plain: >-
  Operators of AI companions must have a protocol to detect and respond to suicidal ideation and self-harm, and must tell
  users they are talking to AI at the start of a session and at least every three hours.
scope_summary: AI companion products offered to users in New York.
who_it_applies_to: Operators of AI companion products.
key_dates_summary: Enacted in the FY2026 budget; effective 5 November 2025.
