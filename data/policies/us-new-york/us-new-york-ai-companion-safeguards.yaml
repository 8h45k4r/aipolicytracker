date_notes: >-
  The consolidated text read on 12 November 2026 states no effective date and no enacting chapter or budget bill number, so
  the obligations carry no applies_from; the in-force date of 5 November 2025 still rests on the Governor's announcement and
  is unchanged. The Senate site lists revisions of the article dated 16 May 2025 and 7 November 2025; these are database
  revision dates, not effective dates. Enforcement is set out in section 1703: the Attorney General may sue for an
  injunction and civil penalties of up to 15,000 dollars per day for a violation of section 1701 or 1702.
