status_note: >-
  Recorded on 26 November 2026 from search-engine extracts of the official pages listed; the official text could not be
  opened from the research environment, so every date and duty here is pending review against it. The Department
  describes the guidance as non-binding best practice that sets no new legal requirements and leaves 23 NYCRR Part 500
  unchanged. It is a general cybersecurity instrument; it is recorded because it names the release of frontier AI
  models as an example of a development that can create a heightened threat environment.
