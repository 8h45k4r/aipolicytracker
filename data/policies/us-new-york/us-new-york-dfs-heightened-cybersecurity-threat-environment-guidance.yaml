issuing_body: New York State Department of Financial Services
summary_plain: >-
  This guidance sets out a non-exhaustive list of cybersecurity practices that organisations regulated by the New York
  Department of Financial Services may adopt when the threat environment worsens, for example after geopolitical events
  or technological changes such as the release of frontier AI models. The practices fall under three headings: reducing
  the attack surface, improving detection and readiness, and strengthening resilience and response.
scope_summary: >-
  Individuals and entities regulated by NYDFS, choosing measures according to their own threats, information systems,
  supply-chain dependencies and sector risks.
who_it_applies_to: NYDFS-regulated individuals and entities (banking, insurance and financial services).
key_dates_summary: 'Issued 21 May 2026, the same day as the companion advisory on frontier AI models.'
what_organizations_must_do: >-
  Examples in the guidance include promptly identifying and fixing known exploited vulnerabilities, especially in
  internet-facing systems (using sources such as the CISA Known Exploited Vulnerabilities Catalog), and testing incident
  response and business continuity plans so that critical functions and nonpublic information can be restored.
