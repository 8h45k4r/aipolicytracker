status_note: >-
  Recorded on 26 November 2026 from search-engine extracts of the official pages listed; the official text could not be
  opened from the research environment, so every date and duty here is pending review against it. The Department says
  the guidance imposes no new obligations and clarifies existing requirements under 23 NYCRR Part 500. It is a general
