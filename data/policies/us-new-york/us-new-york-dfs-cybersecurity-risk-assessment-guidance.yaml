summary_plain: >-
  This guidance explains how organisations covered by the New York cybersecurity regulation for financial services
  should carry out and use the risk assessments that regulation requires. It says assessments should consider whether
  emerging technologies or threats, such as the adoption of AI, quantum computing, software supply-chain attacks and new
  ransomware techniques, materially change an entity's risk profile.
scope_summary: >-
  Covered entities under 23 NYCRR Part 500 and the risk assessments they must review and update at least annually and
  after material changes.
who_it_applies_to: Covered entities under the NYDFS cybersecurity regulation (23 NYCRR Part 500).
key_dates_summary: 'Issued 10 September 2026.'
what_organizations_must_do: >-
  Covered entities are reminded that risk assessments must be reviewed and updated as reasonably necessary and at least
  annually, and the guidance gives developments such as the release of frontier AI models as examples of changes that
  can call for an update.
