summary_plain: >-
  Chile updated its 2021 National AI Policy in 2024, keeping the ten-year horizon to 2031 but reorienting it around
  ethics, governance and inclusion after a participatory process across the country's regions. The accompanying
  action plan lists 177 initiatives coordinated by 14 ministries under axes covering enabling factors, development
  and adoption, and governance and ethics, with periodic progress reporting. The update was presented on 2 May 2024
  together with the announcement of a government bill to regulate AI systems.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Ministerio de Ciencia, Tecnología, Conocimiento
  e Innovación (MinCiencia). Oversight: MinCiencia leads; interministerial coordination with semi-annual monitoring
  of the action plan. Stated purpose: Steer ethical, inclusive AI development and prepare the ground for regulation.
key_dates_summary: >-
