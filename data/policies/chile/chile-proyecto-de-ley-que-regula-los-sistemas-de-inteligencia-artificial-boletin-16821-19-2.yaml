summary_plain: >-
  Introduced by presidential message in May 2024 and merged with an earlier parliamentary motion (Boletín 15869-19),
  the bill classifies AI system uses into unacceptable, high, limited and no-evident-risk categories, prohibits
  certain practices, and sets obligations, incident reporting and sanctions. It creates a Technical Advisory Council
  on AI to advise MinCiencia and proposes periodic review of the law. The Chamber of Deputies approved the text
  in October 2025 and it is now in second constitutional stage before the Senate's Future Challenges, Science, Technology
  and Innovation Committee.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Presidencia de la República (Mensaje) / Congreso
  Nacional (Cámara de Diputadas y Diputados; Senado). Oversight: Bill assigns oversight to MinCiencia with a Technical
  Advisory Council on AI and sanctioning powers for supervisory agencies. Stated purpose: Risk-based regulation
  of AI uses to protect fundamental rights.
key_dates_summary: >-
