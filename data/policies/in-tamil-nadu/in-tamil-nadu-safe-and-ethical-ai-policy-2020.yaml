summary_plain: >-
  Recommends a six-dimension framework (TAM-DEF: transparency and audit, accountability and legal issues, misuse protection,
  digital divide and data deficit, ethics and fairness, equity) and a DEEP-MAX scorecard for deploying AI in government, with
  AI procurement guidelines.
