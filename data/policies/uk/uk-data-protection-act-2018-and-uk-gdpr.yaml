date_notes: >-
  23 May 2018 is the date at the head of the Act on legislation.gov.uk (taken as Royal Assent; confirm).
  Commencement annotations show provisions brought into force on 25 May 2018 by S.I. 2018/625; not every section
  was checked. Schedule 6 paragraph 5 of the Data (Use and Access) Act 2025, substituting UK GDPR Articles 22A
  to 22D, and the omission of section 14 of the 2018 Act, came into force on 5 February 2026 by S.I. 2026/82.
  Whether regulations under the new Article 22D on meaningful human involvement have been made was not
  established.
