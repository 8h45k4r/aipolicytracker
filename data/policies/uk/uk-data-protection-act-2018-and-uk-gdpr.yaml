summary_plain: >-
  The UK GDPR and the Data Protection Act 2018 together form the UK's general data protection law. Most
  processing of personal data is subject to the UK GDPR, which Part 2 of the Act supplements; the Act also
  covers law enforcement processing and processing outside the UK GDPR. They are not AI laws, but they apply
  whenever AI systems use personal data. Since 5 February 2026, decisions based solely on automated processing
  have been governed by new Articles 22A to 22D, inserted by the Data (Use and Access) Act 2025.
scope_summary: >-
  Controllers and processors handling personal data in the UK, including organisations that develop or use AI
  systems with personal data.
who_it_applies_to: Public and private controllers and processors of personal data in the UK.
key_dates_summary: >-
  Act dated 23 May 2018; main provisions in force 25 May 2018; new automated decision-making rules in force 5
  February 2026.
