summary_plain: >-
  The AI Opportunities Action Plan is an independent report by Matt Clifford commissioned by the government, containing
  50 recommendations organised under three aims: laying foundations (compute, data, skills and regulation), driving
  AI adoption across the public and private sectors, and securing homegrown frontier AI capability. The government
  published a response accepting the recommendations and treats the plan as its roadmap for AI-led growth.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Department for Science, Innovation and Technology.
  Oversight: DSIT leads delivery across government; recommendations adopted via the government response. Stated
  purpose: Use AI to drive economic growth, public-service improvement and sovereign UK AI capability.
