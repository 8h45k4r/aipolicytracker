date_notes: >-
  Publication and effective dates are from the Bank of England SS1/23 page (PS6/23 is the related policy
  statement). The PRA's 2024/25 annual report says the statement became effective in May 2023, which conflicts
  with the SS1/23 page and the 2025/26 annual report; the later date is used. LIAF01/26 (23 April 2026)
  clarified that the expectations are not conditions for internal model approval and gave firms newly granted
  such approval 12 months to comply.
