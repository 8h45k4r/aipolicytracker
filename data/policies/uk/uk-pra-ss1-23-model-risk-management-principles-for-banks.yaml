summary_plain: >-
  SS1/23 sets out the PRA's expectations for how banks manage the risk that their models are wrong or misused.
  It rests on five principles: model identification and risk classification, governance, development and
  implementation, independent validation, and risk mitigants. It covers models built in-house or bought from
  vendors, whatever the technology, so it reaches AI and machine-learning models, and it treats explainability
  and interpretability as factors in judging a model's complexity.
scope_summary: >-
  Banks, building societies and PRA-designated investment firms with internal model approval for credit, market
  or counterparty credit risk.
who_it_applies_to: >-
  UK banks, building societies and PRA-designated investment firms with internal model approval.
key_dates_summary: >-
  Published 17 May 2023; effective 17 May 2024; amended by LIAF01/26 effective 23 April 2026.
