summary_plain: >-
  The Online Safety Act sets up a regulatory framework, enforced by Ofcom, to make internet services used in the
  UK safer. Providers of user-to-user and search services in scope must assess the risk of illegal content, take
  proportionate steps to stop users encountering it and remove it quickly once they know of it, with further
  duties to protect children. It is not an AI law, but it applies to in-scope services however their content is
  generated or moderated.
scope_summary: >-
  Providers of user-to-user services, search services and pornographic content services with links to the UK.
who_it_applies_to: Online service providers in scope of the Act, and Ofcom as regulator.
key_dates_summary: >-
  Illegal content risk assessments due by 16 March 2025; illegal content codes of practice in force 17 March
  2025; pornographic content duties (section 81) in force 17 January 2025.
penalties_summary: >-
  Ofcom can impose fines of up to 10% of qualifying worldwide revenue and, in the most serious cases, apply to
  the courts to block a service.
what_organizations_must_do: >-
  Providers in scope must carry out a suitable and sufficient illegal content risk assessment, take
  proportionate measures against illegal content, remove it swiftly once aware of it, and keep records.
