summary_plain: >-
  The AI Playbook is official guidance for UK public-sector organisations on selecting, buying, building and deploying
  AI. It sets ten principles covering legality, security, human oversight, transparency and accountability, and
  explains AI capabilities, limitations and risks in plain terms. It expands and replaces the January 2024 Generative
  AI Framework for HMG to cover a broader range of AI technologies.
scope_summary: >-
