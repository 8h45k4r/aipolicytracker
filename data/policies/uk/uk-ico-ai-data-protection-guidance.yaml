slug: uk-ico-ai-data-protection-guidance
jurisdiction: uk
title: "ICO Guidance on AI and data protection"
short_title: ICO AI guidance
instrument_type: guidance
status: guidance
is_binding: false
published: true
issuing_body: Information Commissioner's Office
summary_plain: >
  The ICO's guidance explains how UK GDPR and the Data Protection Act 2018 apply when organisations develop or use AI
  that processes personal data. It covers accountability and governance, lawfulness and fairness, transparency,
  data minimisation, security, individual rights, and automated decision-making. The guidance is not itself law,
  but it reflects how the regulator interprets binding obligations and is the reference point in ICO enforcement.
scope_summary: >
  Any controller or processor using personal data in AI systems in the UK, at any lifecycle stage. It does not
  apply to AI that processes no personal data.
who_it_applies_to: Controllers and processors under UK GDPR, including developers and deployers of AI.
key_dates_summary: >
  First published July 2020, updated March 2023. Consultations on generative AI and data protection ran in 2024.
  The Data (Use and Access) Act 2025 changed the rules on automated decision-making, so a reviewer should confirm
  the current version.
penalties_summary: >
  Underlying UK GDPR breaches can attract fines up to GBP 17.5 million or 4 % of global annual turnover.
what_organizations_must_do: >
  Complete a data protection impact assessment for high-risk AI, document lawful bases, provide meaningful
  information about automated decisions, implement safeguards for solely automated decisions with legal or
  similarly significant effects, and test for bias and accuracy.
actors: [provider, deployer, public_authority]
