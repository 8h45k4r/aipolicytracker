obligations:
  - slug: uk-ico-dpia-for-ai
    title: Carry out a data protection impact assessment for high-risk AI processing
    category: impact_assessment
    source_reference: "UK GDPR Article 35; ICO guidance, accountability and governance section"
    is_binding: true
    actors: [provider, deployer, public_authority]
    sectors: [cross_sector]
    use_cases: [hiring_and_hr, finance_and_credit, biometrics]
    summary: >
      Where AI processing of personal data is likely to result in a high risk to individuals, UK GDPR requires a
      DPIA before processing begins. The ICO treats most AI involving profiling, large-scale processing or novel
      technology as meeting this threshold.
    practical_action: >
      Use the ICO's DPIA template and add AI-specific sections on bias, explainability and human oversight.
    applicability:
      description: Controllers using personal data in AI where processing is likely high risk.
      actors: [provider, deployer, public_authority]
    evidence_examples:
      - { title: Data protection impact assessment, artifact_type: report }
    framework_mappings:
      - { framework: iso_42001, reference: "Clause 6.1.4 AI system impact assessment", note: "Original editorial mapping.", confidence_level: high }
      - { framework: nist_ai_rmf, reference: "MAP 5.1", note: "Impact assessment.", confidence_level: medium }
  - slug: uk-ico-automated-decision-safeguards
    title: Apply safeguards to solely automated decisions with significant effects
    category: human_oversight
    source_reference: "UK GDPR Article 22 as amended by the Data (Use and Access) Act 2025"
    is_binding: true
    actors: [deployer, public_authority]
    sectors: [cross_sector, financial_services, employment]
    use_cases: [finance_and_credit, hiring_and_hr, public_services]
    summary: >
      Individuals have rights in relation to solely automated decisions that produce legal or similarly significant
      effects, including being told about the decision, obtaining human intervention, and contesting it. The
      Data (Use and Access) Act 2025 amended these rules; the reviewer must confirm the current wording.
    practical_action: >
      Map every significant automated decision, add a human-review route and a notice to affected people.
    applicability:
      description: Any controller making solely automated decisions with legal or similarly significant effects.
      actors: [deployer, public_authority]
    evidence_examples:
      - { title: Automated decision register and review procedure, artifact_type: register }
    framework_mappings:
      - { framework: nist_ai_rmf, reference: "GOVERN 5.x, MANAGE 4.x", note: "Recourse mechanisms.", confidence_level: medium }
