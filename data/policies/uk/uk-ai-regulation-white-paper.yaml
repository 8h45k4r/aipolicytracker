slug: uk-ai-regulation-white-paper
jurisdiction: uk
title: "A pro-innovation approach to AI regulation (white paper and government response)"
short_title: UK AI regulation framework
instrument_type: policy
status: guidance
status_note: >
  Non-statutory framework implemented by existing regulators. The government response of 6 February 2024 confirmed
  the approach and asked regulators to publish their AI plans; a reviewer should confirm no statutory duty on
  regulators has since been introduced.
is_binding: false
featured: true
published: true
issuing_body: Department for Science, Innovation and Technology
summary_plain: >
  The UK white paper sets out a principles-based, context-specific approach to regulating AI. Instead of a single
  AI law, it asks existing regulators to interpret and apply five cross-cutting principles within their remits:
  safety, security and robustness; appropriate transparency and explainability; fairness; accountability and
  governance; and contestability and redress. Central government provides coordination, monitoring and guidance.
scope_summary: >
  Applies to UK regulators and, through them, to organisations developing or using AI in regulated activities in
  the UK. It creates no direct legal obligations on businesses; obligations arise from the existing laws each
  regulator enforces.
who_it_applies_to: >
  UK regulators (primary audience), and indirectly any organisation whose AI use falls within a regulator's remit.
key_dates_summary: >
  White paper published 29 March 2023; consultation closed 21 June 2023; government response published
  6 February 2024, with regulators asked to publish their AI strategies by 30 April 2024.
penalties_summary: None directly; penalties arise under the underlying laws enforced by each regulator.
what_organizations_must_do: >
  Map your AI uses to the regulators that cover them, read those regulators' AI guidance, and evidence how you meet
  the five principles through your existing compliance programmes (data protection, equality, consumer, sector).
adopted_on: 2023-03-29
published_on: 2023-03-29
in_force_on: null
applies_from: null
actors: [provider, deployer, public_authority]
ai_system_types: [general_purpose_ai_model, automated_decision_system, generative_ai]
sectors: [cross_sector]
risk_categories: [unclassified]
use_cases: [generative_ai, hiring_and_hr, finance_and_credit, public_services]
related_policies: [eu-ai-act, uk-ico-ai-data-protection-guidance]
related_frameworks: [nist_ai_rmf, iso_42001]
sections:
  - { reference: "Part 3", title: "Framework principles", summary: "The five cross-cutting principles for regulators." }
  - { reference: "Part 4", title: "Central functions", summary: "Monitoring, risk assessment, coordination and sandbox support from central government." }
obligations:
  - slug: uk-principles-safety-security-robustness
    title: Ensure AI systems are safe, secure and robust throughout their lifecycle
    category: risk_management
    section: "Part 3"
    source_reference: "Principle 1, Part 3"
    is_binding: false
    actors: [provider, deployer]
    sectors: [cross_sector]
    use_cases: [safety_critical, generative_ai]
    summary: >
      Regulators are asked to ensure AI systems function in a robust, secure and safe way, with risks continually
      identified, assessed and managed. In practice this is enforced through existing safety, security and
      data-protection law rather than a new duty.
    practical_action: >
      Run lifecycle risk assessments and keep security testing evidence that you can show a regulator.
    applicability:
      description: Non-binding expectation for all AI developers and deployers in regulated activities.
      actors: [provider, deployer]
    evidence_examples:
      - { title: AI risk assessment, artifact_type: report }
    framework_mappings:
      - { framework: nist_ai_rmf, reference: "MEASURE 2.5–2.7", note: "Original editorial mapping.", confidence_level: medium }
      - { framework: iso_42001, reference: "Clause 6.1 and Annex A risk controls", note: "Original editorial mapping.", confidence_level: medium }
    controls:
      - { control: ai-risk-assessment, relationship: satisfies, note: "Lifecycle identification and management of risks.", confidence_level: medium }
      - { control: accuracy-robustness-security-testing, relationship: satisfies, note: "Security and robustness evidence to show a regulator.", confidence_level: medium }
  - slug: uk-principles-transparency-explainability
    title: Provide appropriate transparency and explainability
    category: transparency
    section: "Part 3"
    source_reference: "Principle 2, Part 3"
    is_binding: false
    actors: [provider, deployer]
    sectors: [cross_sector]
    use_cases: [hiring_and_hr, finance_and_credit, public_services]
    summary: >
      Organisations should communicate when and how AI is used and provide explanations proportionate to the
      risk, so that people can understand decisions affecting them. For personal data, UK GDPR transparency and
      automated decision-making rights make this binding in practice.
    practical_action: >
      Publish AI use notices and keep explainability documentation for decisions about individuals.
    applicability:
      description: All AI uses; binding where UK GDPR applies.
      actors: [provider, deployer]
    evidence_examples:
      - { title: AI transparency notice, artifact_type: document }
    framework_mappings:
      - { framework: nist_ai_rmf, reference: "GOVERN 4.x, MAP 1.x", note: "Original editorial mapping.", confidence_level: medium }
    controls:
      - { control: ai-interaction-and-use-disclosure, relationship: satisfies, note: "Public AI use notices.", confidence_level: medium }
      - { control: decision-explanation-and-appeal-route, relationship: supports, note: "Explanations of decisions about individuals.", confidence_level: high }
      - { control: technical-documentation-and-model-cards, relationship: supports, note: "Explainability documentation.", confidence_level: medium }
  - slug: uk-principles-fairness
    title: Use AI in ways that are fair and do not discriminate unlawfully
    category: governance_accountability
    section: "Part 3"
    source_reference: "Principle 3, Part 3"
    is_binding: false
    actors: [provider, deployer]
    sectors: [cross_sector, employment, financial_services]
    use_cases: [hiring_and_hr, finance_and_credit]
    summary: >
      AI systems should not undermine legal rights, discriminate unfairly or create unfair market outcomes.
      The Equality Act 2010 and UK GDPR fairness principle make key parts of this binding.
    practical_action: >
      Test for disparate outcomes across protected characteristics before and after deployment.
    applicability:
      description: All AI uses affecting people; binding under equality and data-protection law.
      actors: [provider, deployer]
    evidence_examples:
      - { title: Bias and fairness testing report, artifact_type: report }
    framework_mappings:
      - { framework: nist_ai_rmf, reference: "MEASURE 2.11", note: "Fairness and bias evaluation.", confidence_level: medium }
    controls:
      - { control: accuracy-robustness-security-testing, relationship: satisfies, note: "Disparate-outcome testing across protected characteristics before and after deployment.", confidence_level: medium }
      - { control: ai-impact-assessment, relationship: supports, note: "Identifies groups at risk of unfair treatment.", confidence_level: medium }
      - { control: data-governance-and-dataset-documentation, relationship: supports, note: "Bias checks on training data.", confidence_level: medium }
  - slug: uk-principles-accountability-governance
    title: Establish accountability and governance for AI
    category: governance_accountability
    section: "Part 3"
    source_reference: "Principle 4, Part 3"
    is_binding: false
    actors: [provider, deployer]
    sectors: [cross_sector]
    use_cases: [generative_ai, public_services]
    summary: >
      Governance measures should ensure effective oversight of AI supply and use with clear lines of
      accountability across the lifecycle.
    practical_action: >
      Name an accountable owner for each AI system and record decisions in a governance log.
    applicability:
      description: All organisations developing or deploying AI.
      actors: [provider, deployer]
    evidence_examples:
      - { title: AI governance policy and RACI, artifact_type: document }
    framework_mappings:
      - { framework: iso_42001, reference: "Clause 5 Leadership", note: "Original editorial mapping.", confidence_level: high }
      - { framework: nist_ai_rmf, reference: "GOVERN 2.1", note: "Roles and responsibilities.", confidence_level: high }
    controls:
      - { control: ai-governance-policy-and-accountability, relationship: satisfies, note: "Clear lines of accountability and a governance decision log.", confidence_level: high }
      - { control: ai-system-inventory, relationship: supports, note: "Named owner for each AI system.", confidence_level: high }
  - slug: uk-principles-contestability-redress
    title: Provide routes to contest AI outcomes and seek redress
    category: human_oversight
    section: "Part 3"
    source_reference: "Principle 5, Part 3"
    is_binding: false
    actors: [deployer, public_authority]
    sectors: [cross_sector]
    use_cases: [public_services, finance_and_credit, hiring_and_hr]
    summary: >
      Affected people should be able to contest harmful AI decisions or outcomes and obtain redress, through
      existing complaint routes and regulators.
    practical_action: >
      Add an AI-decision challenge route to customer complaint procedures.
    applicability:
      description: Organisations whose AI produces decisions or outcomes affecting people.
      actors: [deployer, public_authority]
    evidence_examples:
      - { title: Contest and redress procedure, artifact_type: document }
    framework_mappings:
      - { framework: nist_ai_rmf, reference: "GOVERN 5.1, MANAGE 4.x", note: "Feedback and recourse mechanisms.", confidence_level: medium }
    controls:
      - { control: decision-explanation-and-appeal-route, relationship: satisfies, note: "An AI-decision challenge path within complaint procedures.", confidence_level: high }
