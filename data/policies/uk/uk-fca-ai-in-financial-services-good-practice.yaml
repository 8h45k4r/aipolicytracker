summary_plain: >-
  The FCA shares examples of good practice and areas for improvement in how regulated firms adopt AI, drawn from
  industry engagement, supervisory work and its AI Lab. The examples are grouped under consumer outcomes,
  governance and accountability, and operational resilience, and include cases of firms deploying AI tools
  before setting clear governance. The FCA says the examples are illustrative and will evolve, and that the
  publication creates no new requirements and prescribes no single governance model.
scope_summary: FCA-regulated firms that develop, buy or use AI in financial services in the UK.
who_it_applies_to: FCA-regulated firms using AI.
key_dates_summary: >-
