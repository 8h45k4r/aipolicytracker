summary_plain: >-
  Nebraska's Ensuring Transparency in Prior Authorization Act sets rules for how health insurers and their utilization
  review agents handle prior authorisation, including published requirements, a uniform request form and decision
  timelines. An artificial intelligence-based algorithm may not be the only basis for a decision to deny, delay or
  modify care on medical-necessity grounds. Agents that use or will use such algorithms in utilization review must
  disclose it to the Department of Insurance, to network providers, to enrollees and on their public website.
scope_summary: >-
  Health insurers and utilization review agents making prior authorisation and medical-necessity decisions for
  enrollees in Nebraska, and health care providers submitting prior authorisation requests.
who_it_applies_to: Utilization review agents and health insurers operating in Nebraska, and providers using the uniform request form.
key_dates_summary: >-
  Passed on final reading 30 May 2025; approved by the Governor on 4 June 2025; sections 1 to 5 and 7 to 13 operative
  1 January 2026.
what_organizations_must_do: >-
  Keep AI-based algorithms from being the sole basis for denying, delaying or modifying care on medical-necessity
  grounds; disclose AI use in utilization review to the Department, network providers, enrollees and on the website.
