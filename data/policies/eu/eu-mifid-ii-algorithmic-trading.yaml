summary_plain: >-
  MiFID II is the EU framework for investment services and trading venues, applied through national law. Its
  Article 17 covers investment firms that trade using computer algorithms that automatically set order
  parameters. Such firms must have effective systems and risk controls that keep their trading systems resilient
  and prevent disorderly trading, must notify the competent authorities of their home Member State and of the
  trading venue, and must keep records; further duties apply to market-making strategies and high-frequency
  techniques.
scope_summary: >-
  Investment firms engaged in algorithmic trading in financial instruments, including high-frequency trading and
  algorithmic market making.
who_it_applies_to: >-
  Investment firms that engage in algorithmic trading, and the national competent authorities supervising them.
key_dates_summary: >-
  National measures apply from 3 January 2018 (transposition deadline 3 July 2017), after Directive (EU)
  2016/1034 postponed the original dates by a year.
what_organizations_must_do: >-
  Firms in scope must keep effective systems and risk controls for their algorithmic trading, notify the
  competent authorities of their home Member State and of the trading venue, and keep records, including
  time-sequenced order records for high-frequency techniques. Commission Delegated Regulation (EU) 2017/589 sets
  out the detailed organisational requirements.
