summary_plain: >-
  The Digital Services Act sets EU rules for providers of intermediary services, such as online platforms and
  search engines, on how they deal with illegal content and the risks their services create. The heaviest duties
  fall on very large online platforms and very large online search engines, which were subject to the rules
  before the general application date. It is not an AI law, but it covers services whose content moderation and
  ranking often rely on automated systems.
scope_summary: >-
  Providers of intermediary services offered to users in the EU, with additional duties for very large online
  platforms and search engines.
who_it_applies_to: >-
  Intermediary service providers, online platforms, very large online platforms and search engines, and Member
  State coordinators.
key_dates_summary: >-
  Signed 19 October 2022; published in OJ L 277 on 27 October 2022; some provisions from 16 November 2022;
  generally applies from 17 February 2024.
adopted_on: '2022-10-19'
