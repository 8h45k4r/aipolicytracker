applies_from: '2024-02-17'
date_notes: >-
  Signature, publication and general application dates are in EUR-Lex extracts (Article 93). Entry into force is
  the twentieth day after publication, which gives 16 November 2022, the date from which parts of Articles 24,
  33, 37, 40 and 43 and Sections 4 to 6 of Chapter IV applied. Very large platforms and search engines
  designated earlier were covered from four months after notification of their designation. Member States had to
  designate Digital Services Coordinators by 17 February 2024.
