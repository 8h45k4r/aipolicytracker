summary_plain: >-
  The GDPR is the EU's general law on the processing of personal data. It is not written for AI, but it applies
  whenever an AI system is trained on, or used to make decisions about people with, personal data. Organisations
  in scope must process personal data lawfully under the Regulation's principles and respect the rights it gives
  individuals. It replaced Directive 95/46/EC and applies directly in every Member State without national
  transposition.
scope_summary: >-
  Controllers and processors handling personal data in the EU, including organisations that develop or deploy AI
  systems that use personal data.
who_it_applies_to: >-
  Public and private controllers and processors of personal data, including AI developers and deployers.
key_dates_summary: >-
  Adopted 27 April 2016; published in OJ L 119 on 4 May 2016; in force 24 May 2016; applies from 25 May 2018.
