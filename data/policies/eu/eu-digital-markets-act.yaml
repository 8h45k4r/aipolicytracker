date_notes: >-
  Adoption, publication and general application dates are in EUR-Lex extracts. Entry into force is the twentieth
  day after publication, which gives 1 November 2022, consistent with EUR-Lex stating that Article 3(6) and (7)
  and Articles 40 and 46 to 50 apply from that date. Articles 42 and 43 apply from 25 June 2023. A corrigendum
  was published on 10 January 2025.
