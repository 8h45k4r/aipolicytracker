summary_plain: >-
  The Digital Markets Act aims to keep digital markets in the EU contestable and fair. It applies to large
  online platforms designated as gatekeepers for their core platform services, which must meet a set of
  obligations and prohibitions in how they operate those services. It is not an AI law, but it governs services
  that often rely on algorithmic systems.
scope_summary: >-
  Undertakings designated as gatekeepers that provide core platform services to business users or end users in
  the EU.
who_it_applies_to: Designated gatekeepers providing core platform services in the EU.
key_dates_summary: >-
  Adopted 14 September 2022; published in OJ L 265 on 12 October 2022; some provisions from 1 November 2022;
  generally applies from 2 May 2023.
