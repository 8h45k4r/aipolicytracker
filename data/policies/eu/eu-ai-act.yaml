  - slug: eu-ai-act-art-50-2-synthetic-content-marking
    title: Providers of generative AI must mark synthetic output as artificially generated in a machine-readable way
    category: transparency
    section: "Article 50"
    source_reference: "Article 50(2)"
    is_binding: true
    applies_from: 2027-12-02
    actors: [provider, gpai_provider]
    sectors: [media_information, cross_sector, consumer_retail]
    use_cases: [generative_ai, content_moderation]
    summary: >
      Providers of AI systems, including general-purpose AI systems, that generate synthetic audio, image, video or
      text must ensure the output is marked in a machine-readable format and detectable as artificially generated or
      manipulated. The technical solution must be effective, interoperable, robust and reliable as far as the state
      of the art allows, taking account of content type and cost. Systems that only perform assistive editing or do
      not substantially alter the input, and law-authorised criminal-detection uses, are outside the duty.
    practical_action: >
      Implement watermarking or content credentials on generated output and keep test evidence that the mark survives common transformations.
    applicability:
      description: Providers of systems that generate synthetic media or text, whatever the risk tier; codes of practice under Article 50(7) will detail acceptable techniques.
      actors: [provider, gpai_provider]
