  - slug: eu-ai-act-art-25-value-chain-becoming-provider
    title: Deployers, distributors and importers must assume provider duties when they rebrand or substantially modify high-risk AI
    category: governance_accountability
    section: "Articles 16–27"
    source_reference: "Article 25(1) and 25(2)"
    is_binding: true
    applies_from: 2027-12-02
    actors: [deployer, distributor, importer, provider]
    sectors: [cross_sector]
    use_cases: [hiring_and_hr, finance_and_credit, safety_critical]
    summary: >
      A distributor, importer, deployer or other third party is treated as the provider of a high-risk AI system,
      with all Article 16 duties, if it puts its own name or trademark on a system already on the market, makes a
      substantial modification to a high-risk system that stays high-risk, or changes the intended purpose of a
      system so that it becomes high-risk. The original provider then ceases to be provider for that system but must
      cooperate and supply the information and access needed for the new provider to comply.
    practical_action: >
      Add a reclassification check to change control so that white-labelling, fine-tuning or repurposing a high-risk system triggers the provider workstream.
    applicability:
      description: Any organisation in the value chain that rebrands, substantially modifies or repurposes a high-risk AI system; original providers owe the cooperation duty.
