  - slug: eu-ai-act-art-55-systemic-risk-cybersecurity
    title: Providers of systemic-risk GPAI models must secure the model and its infrastructure
    category: accuracy_robustness_security
    section: "Articles 51–56"
    source_reference: "Article 55(1)(d)"
    is_binding: true
    applies_from: 2025-08-02
    actors: [gpai_provider]
    sectors: [cross_sector]
    use_cases: [generative_ai]
    summary: >
      Providers of general-purpose AI models with systemic risk must ensure an adequate level of cybersecurity
      protection for the model and for the physical infrastructure it runs on, which in practice covers protection of
      model weights, training and inference environments, and access controls against theft, tampering and
      unauthorised release. Codes of practice and harmonised standards may be used to show compliance.
    practical_action: >
      Apply a documented security standard to weight storage, training clusters and inference endpoints, with penetration tests and insider-risk controls.
    applicability:
      description: Providers of general-purpose AI models classified as having systemic risk under Article 51.
      actors: [gpai_provider]
