  - slug: eu-ai-act-art-55-systemic-risk-incident-reporting
    title: Providers of systemic-risk GPAI models must track and report serious incidents to the AI Office
    category: incident_handling
    section: "Articles 51–56"
    source_reference: "Article 55(1)(c)"
    is_binding: true
    applies_from: 2025-08-02
    actors: [gpai_provider]
    sectors: [cross_sector]
    use_cases: [generative_ai]
    summary: >
      Providers of general-purpose AI models with systemic risk must keep track of, document and report without undue
      delay to the AI Office and, where relevant, to national competent authorities the relevant information about
      serious incidents and the possible corrective measures to address them. The General-Purpose AI Code of Practice
      sets out timelines and content that providers may follow to demonstrate compliance.
    practical_action: >
      Define serious-incident criteria for the model, a tracking log and an AI Office notification template with owner and clock.
    applicability:
