faq:
  - question: What is the EU AI Act?
    answer: >
      Regulation (EU) 2024/1689 is a binding EU law that sets risk-based rules for AI systems and general-purpose
      AI models placed on the EU market or used in the EU. It bans a few practices, imposes detailed requirements
      on high-risk systems, adds transparency duties for chatbots and synthetic content, and regulates
      general-purpose models.
  - question: When do the EU AI Act requirements apply?
    answer: >
      In phases under Article 113: prohibitions and AI literacy from 2 February 2025, general-purpose AI and
      governance rules from 2 August 2025, general application from 2 August 2026, and Annex I product-embedded
      high-risk AI from 2 August 2027. The 2025 Digital Omnibus proposal may change some high-risk dates; check
      the official sources.
  - question: Who does the EU AI Act apply to?
    answer: >
      Providers, deployers, importers, distributors and authorised representatives of AI systems, product
      manufacturers, and providers of general-purpose AI models, including organisations outside the EU whose
      systems or outputs are used in the EU.
  - question: What are the penalties under the EU AI Act?
    answer: >
      Up to EUR 35 million or 7 % of worldwide annual turnover for prohibited practices, up to EUR 15 million or
      3 % for most other infringements, and up to EUR 7.5 million or 1 % for incorrect information, with lower
      caps for SMEs (Article 99).
