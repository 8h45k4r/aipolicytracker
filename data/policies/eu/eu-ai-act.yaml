slug: eu-ai-act
jurisdiction: eu
title: "Regulation (EU) 2024/1689 — Artificial Intelligence Act"
short_title: EU AI Act
instrument_type: regulation
status: partially_applicable
status_note: >
  Dates below follow Article 113 of the adopted text. The European Commission proposed a "Digital Omnibus"
  package in November 2025 that would adjust the application dates for some high-risk obligations; a reviewer
  must confirm whether that proposal has been adopted and update the deadlines accordingly.
is_binding: true
featured: true
published: true
issuing_body: European Parliament and Council of the European Union
summary_plain: >
  The EU AI Act is a binding regulation that sets rules for developing, placing on the market and using AI systems
  in the European Union. It bans a small set of practices considered unacceptable, imposes detailed requirements
  on "high-risk" AI systems used in areas such as employment, education, credit, essential services, law
  enforcement and safety-critical products, requires transparency for chatbots and synthetic content, and creates
  separate duties for providers of general-purpose AI models. Obligations apply in phases between 2025 and 2027.
scope_summary: >
  Applies to providers placing AI systems or general-purpose AI models on the EU market or putting them into service,
  to deployers established in the EU, and to providers and deployers in third countries where the system's output is
  used in the EU (Article 2). Excludes AI used exclusively for military, defence or national-security purposes, and
  activities of purely personal non-professional use. Free and open-source models get partial relief unless they are
  general-purpose models with systemic risk.
who_it_applies_to: >
  Providers (developers), deployers (organisations using AI under their authority), importers, distributors,
  authorised representatives of non-EU providers, product manufacturers integrating AI, and providers of
  general-purpose AI models. Public authorities are covered as deployers and have extra duties for
  fundamental-rights impact assessments.
key_dates_summary: >
  Entry into force 1 August 2024. Prohibitions and AI literacy from 2 February 2025. General-purpose AI model
  duties, governance and penalties from 2 August 2025. General application, including Annex III high-risk
  systems and Article 50 transparency, from 2 August 2026. High-risk AI that is a safety component of Annex I
  products from 2 August 2027. Adjustments proposed in the 2025 Digital Omnibus are not reflected until verified.
penalties_summary: >
  Article 99 sets administrative fines of up to EUR 35 million or 7 % of worldwide annual turnover for prohibited
  practices, up to EUR 15 million or 3 % for most other obligations, and up to EUR 7.5 million or 1 % for supplying
  incorrect information, with the lower amount applying to SMEs. Article 101 allows the Commission to fine
  general-purpose AI model providers up to EUR 15 million or 3 %.
what_organizations_must_do: >
  Inventory AI systems and determine your role for each; screen against prohibited practices now; classify
  systems against Annex I and Annex III; for high-risk systems build a risk-management system, data-governance
  controls, technical documentation, logging, human-oversight measures and a quality-management system, then
  complete conformity assessment and register in the EU database before placing on the market; deployers must
  use systems as instructed, assign trained human oversight, keep logs and, where required, complete a
  fundamental-rights impact assessment; label AI interactions and synthetic content under Article 50; general-purpose
  model providers must publish training-content summaries, maintain documentation and a copyright policy.
adopted_on: 2024-06-13
published_on: 2024-07-12
in_force_on: 2024-08-01
applies_from: 2026-08-02
date_notes: >
  "applies_from" shows the general application date in Article 113 of the adopted text. Earlier and later dates
  apply to specific chapters; see the deadlines table. NOT CURRENT: secondary reporting indicates that Article 113
  was amended during 2026 and that the high-risk application dates moved, which would make the 2026-08-02 and
  2027-08-02 entries below wrong. The amending act has not been read against the Official Journal by a reviewer
  here, so no date has been changed: this record is marked needs_update and its confidence lowered rather than
  restated from second-hand sources. Open the official source before relying on any date on this page.
