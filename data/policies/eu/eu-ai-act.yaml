  - slug: eu-ai-act-art-26-10-post-remote-biometric-identification-authorisation
    title: Law-enforcement deployers must obtain authorisation for post-remote biometric identification and report annually
    category: governance_accountability
    section: "Articles 16–27"
    source_reference: "Article 26(10)"
    is_binding: true
    applies_from: 2027-12-02
    actors: [deployer, public_authority]
    sectors: [law_enforcement]
    use_cases: [law_enforcement, biometrics]
    summary: >
      A deployer using a high-risk post-remote biometric identification system in a criminal investigation must
      request authorisation from a judicial or independent administrative authority in advance or within 48 hours,
      unless the use is only the initial identification of a potential suspect on objective and verifiable facts.
      Use is limited to a targeted search; if authorisation is refused, use stops and the data is deleted. No
      adverse legal decision may rest solely on the output, each use is documented, and the deployer reports
      annually to the market surveillance and data protection authorities.
    practical_action: >
      Build the authorisation request, 48-hour clock and deletion step into the investigation workflow and schedule the annual report.
    applicability:
      description: Law enforcement authorities deploying post-remote biometric identification in criminal investigations; real-time use is governed by Article 5.
