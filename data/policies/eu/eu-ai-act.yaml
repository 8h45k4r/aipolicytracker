    summary: >
      A deployer of an emotion recognition system or a biometric categorisation system must inform the natural
      persons exposed to it that the system is operating and must process their personal data in line with the GDPR,
      the Law Enforcement Directive and the EU institutions data protection regulation. Systems permitted by law to
      detect, prevent or investigate criminal offences are excepted, subject to safeguards. Use in workplaces and
      schools is separately banned by Article 5 except for medical or safety reasons.
    practical_action: >
      Place a visible notice at the point of capture and confirm a lawful basis for the biometric processing before switch-on.
    applicability:
      description: Deployers of emotion recognition or biometric categorisation systems that are not prohibited under Article 5.
      actors: [deployer, public_authority]
      risk_categories: [transparency_risk, high_risk]
      source_reference: "Article 50(3)"
    evidence_examples:
      - { title: Exposure notice and signage, artifact_type: document }
      - { title: Lawful-basis record for biometric processing, artifact_type: record }
    framework_mappings:
      - { framework: iso_42001, reference: "Annex A.8.5", note: "Information for interested parties.", confidence_level: medium }
      - { framework: nist_ai_rmf, reference: "GOVERN 5.1, MEASURE 2.10", note: "Communication and privacy risk.", confidence_level: medium }
    controls:
      - { control: ai-interaction-and-use-disclosure, relationship: satisfies, note: "Notice to persons exposed to the system.", confidence_level: high }
      - { control: privacy-and-data-protection-for-ai, relationship: supports, note: "Lawful basis and safeguards for biometric data.", confidence_level: high }
      - { control: prohibited-use-screening-gate, relationship: supports, note: "Confirms the use is not banned by Article 5.", confidence_level: medium }
