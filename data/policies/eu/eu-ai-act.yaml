  - slug: eu-ai-act-art-50-4-deepfake-and-public-interest-text-disclosure
    title: Deployers must disclose deepfakes and AI-generated text published on matters of public interest
    category: transparency
    section: "Article 50"
    source_reference: "Article 50(4)"
    is_binding: true
    applies_from: 2027-12-02
    actors: [deployer, public_authority]
    sectors: [media_information, cross_sector]
    use_cases: [generative_ai, content_moderation]
    summary: >
      A deployer that generates or manipulates image, audio or video content that is a deep fake must disclose that
      the content has been artificially generated or manipulated, with lighter treatment for evidently artistic,
      creative, satirical or fictional works so that the disclosure does not spoil the work. A deployer that
      publishes AI-generated text to inform the public on matters of public interest must disclose this unless the
      text passed human review or editorial control and someone holds editorial responsibility. The disclosure
      must reach people clearly at the latest at first exposure.
    practical_action: >
      Adopt a labelling standard for published synthetic media and a newsroom rule that AI-drafted public-interest text is either labelled or editorially signed off.
    applicability:
      description: Any organisation publishing deepfakes or AI-generated public-interest text, including media, marketing and public bodies.
      actors: [deployer, public_authority]
      risk_categories: [transparency_risk]
      source_reference: "Article 50(4) and 50(5)"
    evidence_examples:
      - { title: Synthetic media labelling standard, artifact_type: document }
      - { title: Editorial sign-off record for AI-drafted text, artifact_type: record }
    framework_mappings:
      - { framework: iso_42001, reference: "Annex A.9.2, A.8.5", note: "Responsible-use processes and information to interested parties.", confidence_level: low }
      - { framework: nist_ai_rmf, reference: "GOVERN 5.1, MANAGE 4.1", note: "Transparency to end users; NIST AI 600-1 content provenance.", confidence_level: medium }
    controls:
      - { control: synthetic-content-labelling-and-provenance, relationship: satisfies, note: "User-facing labels on deepfakes and public-interest text.", confidence_level: high }
      - { control: human-oversight-and-override, relationship: supports, note: "Editorial control that lifts the text-disclosure duty.", confidence_level: medium }
    official_source_url: "https://eur-lex.europa.eu/eli/reg/2024/1689/oj"
    review_status: pending_review
    confidence_level: high
  - slug: eu-ai-act-art-52-systemic-risk-notification
    title: Providers of GPAI models must notify the Commission within two weeks of meeting the systemic-risk threshold
    category: governance_accountability
    section: "Articles 51–56"
    source_reference: "Article 52(1)"
    is_binding: true
    applies_from: 2025-08-02
    actors: [gpai_provider]
    sectors: [cross_sector]
    use_cases: [generative_ai]
    summary: >
      A provider whose general-purpose AI model meets the Article 51(1)(a) high-impact capability condition, which
      is presumed once cumulative training compute exceeds 10^25 floating-point operations, must notify the
      Commission without delay and in any event within two weeks of the condition being met or of learning that it
      will be met. The notification may include arguments that the model nonetheless does not present systemic
      risk; the Commission decides and keeps a public list of designated models.
    practical_action: >
      Track cumulative training compute per model against the threshold and pre-draft the notification and any rebuttal arguments.
    applicability:
      description: Providers of general-purpose AI models approaching or exceeding the compute threshold, including during training.
      actors: [gpai_provider]
      risk_categories: [systemic_risk]
      source_reference: "Article 52(1)–(2)"
    evidence_examples:
      - { title: Training compute tracking record, artifact_type: register }
      - { title: Notification to the Commission, artifact_type: document }
    framework_mappings:
      - { framework: iso_42001, reference: "Clause 4.2; Annex A.8.3", note: "Interested-party requirements and external reporting.", confidence_level: low }
      - { framework: nist_ai_rmf, reference: "GOVERN 1.1, MAP 1.1", note: "Legal requirement tracking and system context.", confidence_level: medium }
    controls:
      - { control: frontier-model-safety-framework, relationship: satisfies, note: "Compute tracking and threshold notification are part of the framework.", confidence_level: high }
    official_source_url: "https://eur-lex.europa.eu/eli/reg/2024/1689/oj"
    review_status: pending_review
    confidence_level: high
  - slug: eu-ai-act-art-53-gpai-technical-and-downstream-documentation
    title: Providers of GPAI models must maintain technical documentation and inform downstream providers
    category: technical_documentation
    section: "Articles 51–56"
    source_reference: "Article 53(1)(a) and 53(1)(b); Annexes XI and XII"
    is_binding: true
    applies_from: 2025-08-02
    actors: [gpai_provider]
    sectors: [cross_sector]
    use_cases: [generative_ai]
    summary: >
      Providers of general-purpose AI models must draw up and keep up to date technical documentation covering the
      training and testing process and evaluation results, as set in Annex XI, and supply it to the AI Office or
      national authorities on request. They must also keep current the Annex XII information for providers that
      integrate the model into their own AI systems, so those providers understand its capabilities and limitations
      and can meet their own duties. Free and open-source models without systemic risk are exempt from both duties.
    practical_action: >
      Maintain a model card and technical file aligned to Annexes XI and XII with version control tied to each model release.
    applicability:
      description: Providers placing general-purpose AI models on the EU market, other than free and open-source models that do not present systemic risk.
      actors: [gpai_provider]
      risk_categories: [systemic_risk, minimal_risk]
      conditions: Models placed on the market before 2 August 2025 have until 2 August 2027 under Article 111(3).
      source_reference: "Article 53(1)(a)–(b), 53(2)"
    evidence_examples:
      - { title: Annex XI technical documentation, artifact_type: document }
      - { title: Annex XII downstream integration documentation, artifact_type: document }
    framework_mappings:
      - { framework: iso_42001, reference: "Annex A.6.2.7, A.8.2, A.10.4", note: "Technical documentation, system documentation and information for customers.", confidence_level: high }
      - { framework: nist_ai_rmf, reference: "GOVERN 1.4, MAP 2.2, MEASURE 2.1", note: "Documentation of design, testing and evaluation.", confidence_level: medium }
    controls:
      - { control: technical-documentation-and-model-cards, relationship: satisfies, note: "Model card and technical file structured to Annexes XI and XII.", confidence_level: high }
      - { control: model-release-and-change-management-gate, relationship: supports, note: "Release requires the documentation to be current.", confidence_level: medium }
