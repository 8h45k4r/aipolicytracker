    actors: [provider, deployer]
    sectors: [cross_sector, media_information, consumer_retail]
    use_cases: [generative_ai, customer_service, content_moderation]
    summary: >
      Providers must ensure AI systems intended to interact with people inform them they are dealing with AI
      unless obvious; providers of systems generating synthetic audio, image, video or text must mark output in a
      machine-readable, detectable format; deployers of emotion-recognition or biometric-categorisation systems
      must inform exposed persons; deployers must disclose deepfakes and AI-generated text published to inform the
      public on matters of public interest, subject to exceptions.
