  - slug: eu-ai-act-art-86-right-to-explanation
    title: Deployers must explain individual decisions taken with high-risk AI on request
    category: transparency
    section: "Chapter IX — Remedies"
    source_reference: "Article 86"
    is_binding: true
    applies_from: 2027-12-02
    actors: [deployer, public_authority]
    sectors: [cross_sector, employment, financial_services, education, public_services]
    use_cases: [hiring_and_hr, finance_and_credit, education, public_services]
    summary: >
      A person affected by a decision that a deployer took on the basis of the output of an Annex III high-risk AI
      system, other than critical-infrastructure systems, which produces legal effects or similarly significantly
      affects them in a way they consider adverse to their health, safety or fundamental rights, has the right to
      obtain from the deployer clear and meaningful explanations of the role the system played in the decision and
      the main elements of the decision. The right does not apply where Union or national law provides an exception.
    practical_action: >
      Set up a request channel and an explanation template that names the system's role, the key inputs and the human decision points for each affected process.
    applicability:
      description: Deployers using Annex III high-risk systems for decisions with legal or similarly significant effects on individuals; overlaps with GDPR Article 22 rights.
      actors: [deployer, public_authority]
      risk_categories: [high_risk]
      source_reference: "Article 86(1)–(3)"
    evidence_examples:
