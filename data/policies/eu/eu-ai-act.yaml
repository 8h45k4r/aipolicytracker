      - { title: Register of explanation requests and responses, artifact_type: register }
    framework_mappings:
      - { framework: iso_42001, reference: "Annex A.8.5, A.9.2", note: "Information for interested parties and responsible-use processes.", confidence_level: medium }
      - { framework: nist_ai_rmf, reference: "GOVERN 5.1, MANAGE 4.1", note: "Recourse and communication for affected individuals.", confidence_level: medium }
    controls:
      - { control: decision-explanation-and-appeal-route, relationship: satisfies, note: "Request channel and explanation of the system's role and main decision elements.", confidence_level: high }
      - { control: record-keeping-and-logging, relationship: supports, note: "Logs supply the inputs cited in the explanation.", confidence_level: medium }
