  - slug: eu-ai-act-art-26-5-deployer-monitoring-and-suspension
    title: Deployers must monitor high-risk AI, suspend use on risk and report serious incidents
    category: post_market_monitoring
    section: "Articles 16–27"
    source_reference: "Article 26(5)"
    is_binding: true
    applies_from: 2027-12-02
    actors: [deployer, public_authority]
    sectors: [cross_sector, employment, financial_services, public_services]
    use_cases: [hiring_and_hr, finance_and_credit, public_services, safety_critical]
    summary: >
      Deployers must monitor a high-risk AI system's operation against the provider's instructions and feed
      observations to the provider under Article 72. If they have reason to think the system as used may present a
      risk to health, safety or fundamental rights, they must inform the provider or distributor and the market
      surveillance authority without undue delay and suspend use. On a serious incident, they must immediately inform
      the provider, then the importer or distributor and the authorities. Financial institutions meet this through
      their internal governance rules.
    practical_action: >
      Give each high-risk system an operational owner with a kill-switch authority and a written escalation route to the provider and the authority.
    applicability:
      description: Deployers of high-risk AI systems; the incident-reporting leg is aligned with Article 73.
      actors: [deployer, public_authority]
      risk_categories: [high_risk]
      source_reference: "Article 26(5)"
    evidence_examples:
      - { title: Operational monitoring log, artifact_type: record }
      - { title: Suspension and escalation procedure, artifact_type: document }
    framework_mappings:
