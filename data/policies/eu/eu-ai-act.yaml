  - slug: eu-ai-act-art-54-gpai-authorised-representative
    title: Non-EU providers of GPAI models must appoint an EU authorised representative
    category: governance_accountability
    section: "Articles 51–56"
    source_reference: "Article 54"
    is_binding: true
    applies_from: 2025-08-02
    actors: [gpai_provider, authorized_representative]
    sectors: [cross_sector]
    use_cases: [generative_ai]
    summary: >
      Before placing a general-purpose AI model on the Union market, a provider established in a third country must
      appoint, by written mandate, an authorised representative established in the Union. The representative checks
      that the Annex XI documentation exists and the Article 53 duties are met, keeps a copy of the documentation and
      the provider's contact details for ten years after market placement, provides information to the AI Office on
      request, cooperates with authorities, and must end the mandate if the provider breaches the Regulation.
      Open-source models without systemic risk are exempt.
    practical_action: >
      Appoint an EU representative under a written mandate covering document retention and AI Office liaison before the model reaches EU users.
    applicability:
      description: Providers of general-purpose AI models established outside the EU, unless the model is free and open-source and not of systemic risk.
      actors: [gpai_provider, authorized_representative]
      risk_categories: [systemic_risk, minimal_risk]
      source_reference: "Article 54(1)–(6)"
    evidence_examples:
