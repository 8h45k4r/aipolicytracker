summary_plain: >-
  The Apply AI Strategy is a Commission communication that sets out how the EU intends to speed up use of AI across
  ten strategic sectors (such as healthcare, manufacturing, energy, mobility and defence) and in public administration.
  It combines sectoral flagship initiatives with cross-cutting support such as AI Factories, testing facilities
  and skills measures, and creates an Apply AI Alliance to coordinate industry, academia and public bodies. It sits
  within the broader AI Continent Action Plan and was presented together with a companion AI in Science strategy.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by European Commission (DG CONNECT). Oversight:
  European Commission, coordinated through the Apply AI Alliance stakeholder forum. Stated purpose: Accelerate AI
  adoption in EU industry and the public sector to boost competitiveness and technological sovereignty.
