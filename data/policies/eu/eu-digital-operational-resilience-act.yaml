summary_plain: >-
  DORA sets uniform rules on the security of network and information systems for financial entities in the EU,
  such as banks, insurers and investment firms. It applies directly in every Member State without national
  transposition. It is not an AI law, but because it covers information and communication technology risk
  generally, it is relevant to financial entities that rely on AI systems or on outside providers of them.
scope_summary: >-
  Financial entities in the EU, including banks, insurers and investment firms, and their management of ICT
  risk.
who_it_applies_to: >-
  EU financial entities and, for oversight purposes, ICT third-party service providers to them.
key_dates_summary: >-
  Published in OJ L 333 on 27 December 2022; in force 16 January 2023; applies from 17 January 2025.
