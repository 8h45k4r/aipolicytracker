summary_plain: >-
  These guidelines set out how banks and other institutions should govern the granting and monitoring of credit
  over the whole life of a loan, including how they assess a borrower's creditworthiness. They expressly allow
  automated models in credit decisions and creditworthiness assessment, and set governance requirements for
  those models, including monitoring and back-testing. They replaced the EBA's 2015 guidelines on
  creditworthiness assessment (EBA/GL/2015/11).
scope_summary: >-
  Institutions granting credit facilities in the EU, including where they use automated models for credit
  decisions and creditworthiness assessment.
who_it_applies_to: >-
  Credit institutions and other lenders supervised by EU national competent authorities.
key_dates_summary: >-
  Issued 29 May 2020; applies from 30 June 2021; existing loans needing renegotiation from 30 June 2022; data
  gaps to be closed by 30 June 2024.
what_organizations_must_do: >-
  Institutions using automated models for credit decisions or creditworthiness assessment must apply the
  guidelines' model governance requirements, including monitoring and back-testing of the models.
