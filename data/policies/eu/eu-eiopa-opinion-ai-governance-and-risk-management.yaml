summary_plain: >-
  EIOPA's Opinion tells national insurance supervisors how it expects insurers' use of AI to be governed under
  existing sectoral law, using a risk-based and proportionate approach. It covers data governance,
  record-keeping, fairness, cyber security, explainability and human oversight. It does not create new
  requirements or change the scope of the AI Act, and it leaves out AI systems the AI Act classes as prohibited
  or high-risk. It builds on earlier work, including the June 2021 report on AI governance principles by EIOPA's
  Consultative Expert Group on Digital Ethics in insurance.
scope_summary: >-
  Insurance undertakings and intermediaries using AI systems not classed as prohibited or high-risk under the AI
  Act, as supervised by national authorities.
who_it_applies_to: >-
  National insurance supervisors, and through them insurers and intermediaries using AI.
key_dates_summary: >-
  Draft consulted on from 12 February to 12 May 2025; Opinion published 6 August 2025. Earlier expert-group
  report published 17 June 2021.
