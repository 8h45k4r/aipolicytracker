summary_plain: >-
  A continental framework that guides AU member states on harnessing AI for development while managing risks. It
  is organised around five focus areas: capturing AI benefits, building capabilities, minimising risks, stimulating
  investment, and fostering cooperation. It is non-binding and intended to inform national strategies and regional
  harmonisation.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by African Union Commission (endorsed by the AU
  Executive Council). Oversight: AU Commission coordinates; member states implement nationally. Stated purpose:
  Africa-centric, development-focused AI adoption aligned with Agenda 2063.
