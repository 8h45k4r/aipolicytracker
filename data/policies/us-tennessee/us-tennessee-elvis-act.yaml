jurisdiction: us-tennessee
title: Ensuring Likeness, Voice, and Image Security (ELVIS) Act of 2024 (Tennessee Public Chapter 588)
short_title: Tennessee ELVIS Act
instrument_type: act
status: in_force
is_binding: true
featured: false
published: true
issuing_body: Tennessee General Assembly
summary_plain: >-
  Signed 21 March 2024 and effective 1 July 2024, the ELVIS Act updates Tennessee's Personal Rights Protection Act to add
  voice to the protected attributes of name, photograph and likeness, prohibits publishing or making available an individual's
  voice or likeness without authorisation, and creates liability for distributing or making available an algorithm, software
  or tool whose primary purpose is producing an individual's voice or likeness without authorisation. It provides civil
  actions for individuals and licensees and criminal penalties.
scope_summary: >-
  Anyone producing, publishing or distributing unauthorised AI-generated voice or likeness of individuals in Tennessee,
  and providers of tools primarily for that purpose.
