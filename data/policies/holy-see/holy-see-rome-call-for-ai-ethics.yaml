issuing_body: Pontifical Academy for Life (RenAIssance Foundation)
summary_plain: >-
  A declaration of six principles for the ethical development of AI (transparency, inclusion, responsibility, impartiality,
  reliability, security and privacy), first signed in February 2020 by the Pontifical Academy for Life, Microsoft, IBM,
  FAO and the Italian government, and since joined by other religious leaders, universities and companies. It calls for
  "algor-ethics" and human-centred design and is used as a reference in faith-based and corporate AI ethics commitments.
scope_summary: Voluntary declaration for signatory organisations; no legal obligations.
