summary_plain: >-
  Mexico's National AI Plan, prepared by the ATDT and presented in April 2026, organises federal AI efforts around
  three pillars: an ethical and legal framework, talent and public software, and strategic compute infrastructure.
  It includes a public AI training centre aiming to certify tens of thousands of people, a government 'Fábrica de
  IA' developing solutions for public services, and the Coatlicue supercomputer, with 2026 milestones and 2030 targets
  for citizen-facing AI services.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Agencia de Transformación Digital y Telecomunicaciones
  (ATDT). Oversight: ATDT coordinates implementation across federal government. Stated purpose: Technological sovereignty
  and public-service AI capacity.
