summary_plain: >-
  This initiative, signed by a bloc of Morena and PVEM deputies and published in the Gaceta Parlamentaria on 30
  April 2025, would create Mexico's first general federal AI law. It proposes principles of legality, transparency,
  human oversight and precaution, a risk 'traffic light' classification with prohibited uses, a National AI Council
  and an algorithmic audit platform. It was referred to committee and remains under consideration in Congress.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Cámara de Diputados (LXVI Legislatura) – deputies
  of Morena and PVEM. Oversight: Bill proposes a National AI Council and a National Algorithmic Audit Platform.
  Stated purpose: Comprehensive federal AI framework grounded in human rights and technological sovereignty.
