summary_plain: >-
  The first part of a working paper from a DPIIT committee on how copyright law should treat the use of protected works
  to train generative AI. It proposes a hybrid model: a mandatory blanket licence letting AI developers train on all
  lawfully accessed works, paired with a statutory right for rights holders to be paid. Royalties would fall due only
  once an AI tool is commercialised, at rates set by a government-appointed committee and open to judicial review, and
  would be collected and shared out through a central body.
scope_summary: >-
  Developers that train AI models on copyright-protected works in India, and copyright holders whose works are used.
who_it_applies_to: AI developers and copyright holders, if the proposal is taken forward.
key_dates_summary: Part 1 published by DPIIT in December 2025 for a 30-day consultation.
