summary_plain: >-
  SEBI consulted on draft guidelines for how market participants use AI and machine learning, based on the work of a
  SEBI working group. The draft rests on core principles such as safety and reliability, fairness and
  non-discrimination, privacy and security and transparency, and proposes guardrails, continuous monitoring and human
  oversight across the development and deployment of models. It covers model governance with a senior management owner,
  disclosure to investors, testing, bias, data privacy and cyber security, and periodic sharing of model accuracy
  results with SEBI.
scope_summary: >-
  SEBI-regulated market participants, including intermediaries and market infrastructure institutions, that use AI or
  machine learning in securities-market business or investor-facing products.
who_it_applies_to: SEBI-regulated entities using AI/ML in Indian securities markets (draft).
