summary_plain: >-
  An advisory from India's IT ministry telling online intermediaries and platforms how to meet their existing due
  diligence duties when they offer AI models, software or algorithms. Under-tested or unreliable AI should be made
  available to users in India only with a label explaining that its output may be fallible or unreliable, for example
  through a consent pop-up. Platforms should also ensure their AI does not enable unlawful content, bias or
  discrimination, or threats to the integrity of elections.
scope_summary: >-
  Intermediaries and platforms in India that use or offer AI models, large language models, generative AI, software or
  algorithms to users.
who_it_applies_to: Intermediaries and platforms offering or using AI tools for users in India.
key_dates_summary: Advisory dated 15 March 2024; it revised an advisory of 1 March 2024 and followed one of 26 December 2023.
what_organizations_must_do: >-
  Intermediaries in scope are advised to label under-tested or unreliable AI output as possibly fallible, inform users of
  this, and keep their AI from facilitating unlawful content, bias or threats to electoral integrity.
