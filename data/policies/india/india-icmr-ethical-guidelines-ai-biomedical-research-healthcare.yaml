summary_plain: >-
  National ethical guidance from the Indian Council of Medical Research on developing, deploying and adopting AI tools in
  biomedical research and healthcare. It sets out ethical principles for AI in health, guiding principles for the people
  and organisations involved, and expectations for ethics committee review, governance and informed consent.
scope_summary: >-
  AI-based tools used in biomedical and health research and applications that involve human participants or their
  biological data.
who_it_applies_to: Researchers, developers, clinicians, healthcare organisations and ethics committees working with AI in health.
