issuing_body: Ministry of Electronics and Information Technology
summary_plain: >
  The India AI Governance Guidelines set out a principle-based, pro-innovation approach to governing AI in India.
  They articulate guiding principles (such as trust, people-first design, fairness, accountability, safety and
  transparency), propose an institutional framework including an AI governance group and an AI Safety Institute
  role, favour applying existing laws over a new AI statute, and recommend voluntary commitments, techno-legal
  measures, risk-based oversight and incident reporting for AI systems.
scope_summary: >
  Non-binding guidance addressed to government bodies, industry and developers deploying AI in India. It does not
  create legal obligations; it signals regulatory expectations and possible future measures.
who_it_applies_to: Indian government agencies, AI developers, deployers and platforms operating in India (voluntary).
key_dates_summary: Consultation on draft guidelines in 2025; final guidelines released November 2025 (to be confirmed).
penalties_summary: None; non-binding.
what_organizations_must_do: >
  Nothing mandatory. Organisations can align governance programmes to the guidelines' principles and prepare for
  voluntary commitments and incident reporting mechanisms they describe.
