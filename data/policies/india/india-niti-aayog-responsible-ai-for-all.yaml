summary_plain: >-
  A two-part approach paper on responsible AI in India. The first part sets out seven broad ethics principles for the
  design, development and deployment of AI, grounded in the Constitution and Indian law, covering among other things
  safety and reliability, inclusivity and non-discrimination, equality, privacy and security, transparency and
  accountability. The second part looks at the institutional mechanisms needed to put those principles into practice
  across government, the private sector and research bodies, with government expected to take the lead.
scope_summary: >-
  Government bodies, private-sector organisations and research institutions that design, develop or deploy AI in
  India; the papers are advisory and address policy makers as well as industry.
who_it_applies_to: Organisations and public bodies designing, developing or deploying AI in India (advisory only).
key_dates_summary: Part 1 published February 2021; Part 2 published August 2021 (exact days not confirmed).
