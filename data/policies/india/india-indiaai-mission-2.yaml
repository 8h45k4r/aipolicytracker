issuing_body: Ministry of Electronics and Information Technology (Union Cabinet approval)
summary_plain: >-
  A five-year national programme approved by the Union Cabinet with an outlay of about INR 10,372 crore. It funds
  shared public AI compute (10,000+ GPUs), an innovation centre for indigenous foundation models, a datasets platform,
  application development for public problems, skilling programmes, startup financing and work on safe and trusted
  AI. Implementation is handled by the IndiaAI division of Digital India Corporation.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Ministry of Electronics and Information Technology
  (Union Cabinet approval). Oversight: IndiaAI Independent Business Division under Digital India Corporation, MeitY.
  Stated purpose: Build sovereign AI compute, data and model capacity and fund the domestic AI ecosystem.
key_dates_summary: >-
  2024-03-07: Cabinet approves IndiaAI Mission with INR 10,371.92 crore outlay; 2025-11-05: MeitY releases India
  AI Governance Guidelines under the IndiaAI Mission
