obligations:
  - slug: india-dpdp-consent-and-notice
    title: Process personal data only with valid consent or a legitimate use, after notice
    category: privacy_data_protection
    source_reference: "Sections 4 to 7"
    is_binding: true
    actors: [provider, deployer]
    sectors: [cross_sector]
    use_cases: [generative_ai, finance_and_credit]
    summary: >
      Personal data may be processed only for a lawful purpose with the individual's free, specific, informed and
      unambiguous consent, or for certain legitimate uses listed in the Act. A notice must describe the data,
      purpose, and how to exercise rights and complain.
    practical_action: Inventory training and inference data sources and document the consent or legitimate use for each.
    applicability:
      description: All Data Fiduciaries.
      actors: [provider, deployer]
    evidence_examples:
      - { title: Consent records and notices, artifact_type: record }
    framework_mappings:
      - { framework: iso_42001, reference: "Annex A controls on data for AI systems", note: "Original editorial mapping.", confidence_level: medium }
    controls:
      - { control: privacy-and-data-protection-for-ai, relationship: satisfies, note: "Legal basis and notice recorded for each training and inference data source.", confidence_level: high }
      - { control: data-governance-and-dataset-documentation, relationship: supports, note: "Dataset documentation records consent status per source.", confidence_level: medium }
  - slug: india-dpdp-security-and-breach-notification
    title: Implement reasonable security safeguards and notify breaches
    category: incident_handling
    source_reference: "Section 8(5) and 8(6); DPDP Rules on breach intimation"
    is_binding: true
    actors: [provider, deployer]
    sectors: [cross_sector]
    use_cases: [generative_ai, health]
    summary: >
      Data Fiduciaries must protect personal data with reasonable security safeguards and, on a personal data
      breach, inform the Data Protection Board and each affected individual in the form and manner prescribed by
      the Rules.
    practical_action: Extend incident response to cover AI training data and model outputs that reveal personal data.
    applicability:
      description: All Data Fiduciaries.
      actors: [provider, deployer]
    evidence_examples:
      - { title: Breach notification procedure, artifact_type: document }
    framework_mappings:
      - { framework: iso_27001, reference: "Annex A incident management controls", note: "Original editorial mapping.", confidence_level: medium }
    controls:
      - { control: ai-incident-management-and-reporting, relationship: satisfies, note: "Breach notification to the Board and individuals within the incident process.", confidence_level: medium }
      - { control: privacy-and-data-protection-for-ai, relationship: supports, note: "Breach handling extended to model outputs and training data.", confidence_level: medium }
      - { control: accuracy-robustness-security-testing, relationship: supports, note: "Reasonable security safeguards evidenced by testing.", confidence_level: medium }
  - slug: india-dpdp-significant-data-fiduciary-duties
    title: Significant Data Fiduciaries must appoint a DPO and run impact assessments and audits
    category: impact_assessment
    source_reference: "Section 10"
    is_binding: true
    actors: [provider, deployer]
    sectors: [cross_sector]
    use_cases: [generative_ai, finance_and_credit]
    summary: >
      Entities notified as Significant Data Fiduciaries, based on factors such as volume and sensitivity of data
      and risk to individuals, must appoint a Data Protection Officer based in India, an independent data auditor,
      and periodically undertake data protection impact assessments and audits.
    practical_action: Assess whether your AI data processing could trigger SDF designation and prepare DPIA tooling.
    applicability:
      description: Entities notified as Significant Data Fiduciaries.
      actors: [provider, deployer]
    evidence_examples:
