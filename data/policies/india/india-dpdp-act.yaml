slug: india-dpdp-act
jurisdiction: india
title: "Digital Personal Data Protection Act, 2023 and DPDP Rules, 2025"
short_title: India DPDP Act
instrument_type: act
status: partially_applicable
status_note: >
  The Act received Presidential assent on 11 August 2023 and comes into force on dates notified by the Central
  Government. The DPDP Rules 2025 were notified in November 2025 with phased commencement (some provisions at
  once, most substantive obligations after 12 to 18 months). A reviewer must confirm the exact commencement dates.
is_binding: true
featured: true
published: true
issuing_body: Parliament of India; Ministry of Electronics and Information Technology (Rules)
summary_plain: >
  The DPDP Act is India's cross-sector personal-data law. It applies to digital personal data processed in India
  and to processing outside India connected with offering goods or services to people in India. It requires a lawful
  basis (consent or specified legitimate uses), notice, purpose limitation, data accuracy, security safeguards,
  breach notification to the Data Protection Board and affected individuals, and grants rights of access,
  correction, erasure and grievance redress. Significant Data Fiduciaries face extra duties such as impact
  assessments and audits. The Act does not mention AI specifically, but it governs the personal data used to train
  and operate AI systems.
scope_summary: >
  Data Fiduciaries (controllers) and Data Processors handling digital personal data of individuals in India,
  including foreign entities offering goods or services to India. Excludes personal or domestic use and publicly
  available data made public by the individual or under law.
who_it_applies_to: Any organisation processing digital personal data of individuals in India, including AI developers and deployers using such data.
key_dates_summary: Assent 11 August 2023; DPDP Rules notified November 2025 with phased commencement; core obligations expected to apply about 18 months after notification (to be confirmed).
penalties_summary: >
  The Data Protection Board may impose monetary penalties up to INR 250 crore per instance for failure to take
  reasonable security safeguards, with lower caps for other breaches, as set out in the Schedule to the Act.
what_organizations_must_do: >
  Map personal data flows into AI systems, obtain valid consent or identify a legitimate use, publish notices,
  implement security safeguards and breach-notification processes, honour data-principal rights, and, if
  designated a Significant Data Fiduciary, appoint a Data Protection Officer, run data protection impact
  assessments and audits.
