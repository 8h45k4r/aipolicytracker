summary_plain: >-
  A committee set up by the Reserve Bank of India proposes a framework for the responsible and ethical use of AI in the
  Indian financial sector. It sets out seven guiding principles ("sutras") and 26 recommendations grouped under six
  pillars, treating innovation and risk control as goals that should work together. Among the recommendations,
  regulated entities would adopt a board-approved AI policy, extend product approval and consumer protection processes
  to AI, strengthen cyber security and incident reporting, govern AI across its lifecycle and tell customers when they
  are dealing with AI.
scope_summary: >-
  Entities regulated by the Reserve Bank of India, such as banks and other financial institutions, that develop, buy
  or use AI; the recommendations are addressed to the Reserve Bank and to those entities.
who_it_applies_to: RBI-regulated entities using AI (recommendations, not yet binding as recorded here).
key_dates_summary: Committee constituted 26 December 2024; report released 13 August 2025.
