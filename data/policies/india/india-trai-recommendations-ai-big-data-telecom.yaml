summary_plain: >-
  The telecom regulator's recommendations to the Government on using AI and big data in telecommunications, made at the
  request of the Department of Telecommunications. TRAI urges the Government to adopt a regulatory framework for
  responsible AI that applies across all sectors, with binding obligations for high-risk uses that directly affect
  people. It also restates its 2018 recommendations on privacy, security and ownership of data in the telecom sector.
scope_summary: >-
  Addressed to the Government of India; the proposed framework would reach organisations in all sectors that develop or
  use AI, with telecom service providers as the immediate context.
who_it_applies_to: Government of India (recommendations); would affect AI developers and users across sectors if adopted.
