summary_plain: >-
  A discussion paper that set out India's first national approach to artificial intelligence. It prioritises five
  sectors (healthcare, agriculture, education, smart cities and infrastructure, and smart mobility) and proposes
  research institutions, data ecosystems and skilling measures to support adoption. It also flags privacy, fairness
  and explainability as issues needing attention and recommends institutional structures for responsible AI.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by NITI Aayog. Oversight: NITI Aayog (policy think
  tank of the Government of India). Stated purpose: Position India as an AI leader while using AI for inclusive
  social and economic growth.
key_dates_summary: >-
