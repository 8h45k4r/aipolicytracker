summary_plain: >-
  A market study by India's competition regulator, carried out through the Management Development Institute Society,
  that maps AI markets and their supply chain and identifies competition concerns. These include concentration in the AI
  value chain, ecosystem lock-in, collusion risks from pricing algorithms, self-preferencing and AI-enabled price
  discrimination. It recommends that businesses self-audit their AI systems for competition compliance.
scope_summary: >-
  AI markets and ecosystems in India, and businesses that develop or use AI systems, including pricing algorithms, in
  ways that may affect competition.
who_it_applies_to: Businesses developing or deploying AI in India, and the Competition Commission itself.
key_dates_summary: Report released 6 October 2025; the study was launched with a request for proposals in April 2024.
