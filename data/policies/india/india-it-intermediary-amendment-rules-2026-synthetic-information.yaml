issuing_body: Ministry of Electronics and Information Technology (MeitY)
summary_plain: >-
  Amendments to India's 2021 IT Rules that bring AI-made or AI-altered audio, image and video content that looks real,
  such as deepfakes, under a defined term, synthetically generated information. Intermediaries that offer tools able to
  create such content must use technical measures against prohibited synthetic content and label permitted synthetic
  content with a visible notice and embedded provenance data. Significant social media intermediaries must ask users to
  declare synthetic content, check those declarations and label confirmed cases. The rules also shorten some takedown
  and grievance timelines.
scope_summary: >-
  Intermediaries in India, in particular those offering tools that create or alter synthetic audio-visual content and
  significant social media intermediaries.
who_it_applies_to: Intermediaries and significant social media intermediaries operating in India.
key_dates_summary: Notified as G.S.R. 120(E) on 10 February 2026; in force from 20 February 2026.
what_organizations_must_do: >-
  Intermediaries in scope must deploy technical measures against prohibited synthetic content, label permitted synthetic
  content with a visible notice and embedded metadata or provenance markers, and, for significant social media
  intermediaries, obtain and technically verify user declarations on whether content is synthetic.
