summary_plain: >-
  An investment and adoption policy that targets about ₹10,000 crore of investment and 1.5 lakh jobs by 2031, with a Maharashtra
  AI Mission, an AI-adoption subsidy for MSMEs, an AI start-up venture fund, incubators, centres of excellence and AI innovation
  cities.
