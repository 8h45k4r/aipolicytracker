summary_plain: >-
  Adds a crime of digital forgery to Pennsylvania's Crimes Code. It covers creating or distributing a forged digital
  likeness, meaning a computer-generated image, video or audio of a real, identifiable person that materially changes
  how they look, speak or behave and is likely to deceive, made without their consent and passed off as genuine. Using
  one in a scheme to defraud, coerce or steal money or property is a more serious offence. Satire, parody, commentary,
  matters of public interest and law enforcement duties are excepted.
scope_summary: >-
  Any person who creates or distributes computer-generated likenesses of real people in Pennsylvania with intent to
  defraud or injure.
who_it_applies_to: Individuals and organisations that create or distribute synthetic likenesses of real people.
key_dates_summary: Approved on 7 July 2025 as Act 35 (P.L. 120); effective 60 days after enactment.
penalties_summary: >-
  A misdemeanour of the first degree for the base offence; a felony of the third degree where the forgery is part of a
  scheme to defraud, coerce or commit theft of money or property.
