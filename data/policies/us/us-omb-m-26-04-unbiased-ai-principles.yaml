summary_plain: >-
  M-26-04 turns the two Unbiased AI Principles of Executive Order 14319, truth-seeking and ideological neutrality, into
  procurement requirements for large language models bought by federal agencies. Agencies must put compliance terms in
  their LLM contracts, collect enough information from vendors to judge whether a model meets the principles, and give
  agency users a way to report outputs that appear to breach them. The memo treats these requirements as material to
  contract eligibility and payment.
scope_summary: >-
  Federal agencies procuring large language models, whatever the later deployment or modification, and the vendors that
  supply them. Agencies weigh listed factors before applying the principles to models built in-house or to AI that is
  not an LLM.
who_it_applies_to: Federal agencies buying large language models, and LLM vendors to the federal government.
key_dates_summary: Issued 11 December 2025; agency procurement policies to be updated by 11 March 2026; lapses two years after issue.
what_organizations_must_do: >-
  Agencies must update procurement policies so that LLM contracts address compliance with the principles and include a
  process for users to report non-compliant outputs. Vendors should be ready to supply the information agencies ask for
  to assess compliance.
