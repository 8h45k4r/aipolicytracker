issuing_body: Consumer Financial Protection Bureau
summary_plain: >-
  Two interpretive circulars from the US consumer finance regulator on how lenders explain credit refusals when they
  rely on algorithmic or machine-learning models. Circular 2022-03 said that the duty to give specific, accurate
  reasons for an adverse credit decision applies whatever technology is used, so a creditor cannot use a model it
  cannot explain. Circular 2023-03 added that ticking the closest reason on the sample forms in Regulation B is not
  enough when that reason is not what actually drove the decision. Both were withdrawn in May 2025.
scope_summary: >-
  Creditors subject to the Equal Credit Opportunity Act and Regulation B that take adverse action on applications or
  existing accounts using complex or opaque models; the circulars addressed ECOA and Regulation B only, not the Fair
  Credit Reporting Act.
who_it_applies_to: Creditors using algorithmic credit models (guidance now withdrawn).
key_dates_summary: >-
  Circular 2022-03 dated 26 May 2022 (Federal Register 14 June 2022); Circular 2023-03 issued 19 September 2023
  (Federal Register 17 April 2024); both withdrawn 12 May 2025.
