status_note: >-
  Both circulars were withdrawn by the Consumer Financial Protection Bureau on 12 May 2025, in a Federal Register
  notice that withdrew a large set of guidance documents and said the withdrawal was subject to further review. The
  ECOA and Regulation B duties the circulars interpreted remain in force. Recorded on 26 November 2026 from
  search-engine extracts of the official pages listed; the official text could not be opened from the research
  environment, so every date and duty here is pending review against it.
