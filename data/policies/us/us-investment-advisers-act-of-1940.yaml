status_note: >-
  A general federal law, not specific to AI, that governs investment advisers however they use technology. The SEC's
  2023 proposal on conflicts of interest from predictive data analytics under this Act (file S7-12-23) was withdrawn
  on 12 June 2025 (notice published 17 June 2025, 90 FR 25531). Recorded on 26 November 2026 from search-engine
  extracts of the official pages listed; the official text could not be opened from the research environment, so
  every date and duty here is pending review against it.
