summary_plain: >-
  The federal statute that regulates investment advisers, administered by the Securities and Exchange Commission. It
  covers registration, advisory contracts, custody of client assets and anti-fraud rules, and the SEC enforces it.
  Advisers that use AI or other analytics to give advice or deal with clients stay subject to the same anti-fraud
  provisions and fiduciary obligations.
scope_summary: >-
  Investment advisers as defined in the Act, subject to its exclusions and registration exemptions, including advisers
  that use AI or predictive analytics in advice or client interactions.
who_it_applies_to: Investment advisers subject to the Act and SEC oversight.
key_dates_summary: In force; SEC's 2023 predictive data analytics proposal under the Act withdrawn 12 June 2025.
