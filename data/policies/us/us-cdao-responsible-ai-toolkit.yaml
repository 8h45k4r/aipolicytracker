summary_plain: >-
  A voluntary self-assessment resource from the Defense Department's Chief Digital and Artificial Intelligence Office
  that helps teams check an AI project, at any stage of its life, against the department's AI ethical principles and
  responsible AI practice. It is meant to be worked through jointly by programme managers, developers, acquisition and
  legal staff and end users. It builds on the Defense Innovation Unit's Responsible AI Guidelines and worksheets and
  on the NIST AI Risk Management Framework, and was delivered under the department's 2022 Responsible AI Strategy and
  Implementation Pathway.
scope_summary: >-
  Defense Department teams and their industry partners developing, acquiring or deploying AI capabilities who want a
  structured responsible-AI assessment; use is voluntary.
who_it_applies_to: DoD AI project teams, programme managers, acquisition staff and their contractors (voluntary).
