issuing_body: U.S. Department of the Treasury, with the AI Executive Oversight Group (FBIIC and FSSCC)
summary_plain: >-
  A voluntary framework that adapts the NIST AI Risk Management Framework to the operational, regulatory and
  consumer-protection concerns of financial services. It gives financial institutions practical tools to assess AI use
  cases, manage risk across the AI lifecycle and build accountability and transparency into deployment decisions, and
  is meant to scale to institutions of different size and complexity. The Treasury released it in early 2026 alongside
  a common AI lexicon.
scope_summary: >-
  Banks, insurers and other financial institutions of any size that develop, buy or use AI and choose to apply the
  framework; it is not a rule and creates no legal duties.
who_it_applies_to: Financial institutions using or developing AI (voluntary).
