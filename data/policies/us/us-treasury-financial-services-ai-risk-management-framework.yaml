status_note: >-
  Announced by the Treasury together with a shared AI Lexicon as the first of a series of deliverables from the AI
  Executive Oversight Group, a public-private group of Treasury, the Financial and Banking Information Infrastructure
  Committee and the Financial Services Sector Coordinating Council. The framework document itself appears to be
  published by an industry body (the Cyber Risk Institute), not on a government host; that is pending review.
  Recorded on 26 November 2026 from search-engine extracts of the official pages listed; the official text could not
  be opened from the research environment, so every date and duty here is pending review against it.
