date_notes: >-
  The issue date of 4 April 2011 is stated in SR 26-2, which supersedes SR 11-7. The supersession date of 17 April
  2026 is the date of SR 26-2. The FDIC adopted the guidance in 2017 (FIL-22-2017, rescinded in 2026); the exact FDIC
  adoption date was not established.
