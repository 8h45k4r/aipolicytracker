summary_plain: >-
  Supervisory guidance from 2011 that set US bank supervisors' expectations for managing the risk of relying on
  quantitative models in decision-making. It covered sound model development and use,
  independent validation, and governance and controls, and said model risk should be managed like other risks and
  grows with complexity, uncertain inputs, breadth of use and potential impact. It was replaced in April 2026.
scope_summary: >-
  Banking organisations supervised by the Federal Reserve and the OCC (and later adopted by the FDIC) that use models
  in decision-making, until replaced by the 2026 guidance.
who_it_applies_to: Supervised banking organisations using models (guidance now superseded).
key_dates_summary: Issued 4 April 2011; superseded 17 April 2026 by SR 26-2 / OCC Bulletin 2026-13.
