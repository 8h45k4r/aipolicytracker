issuing_body: Federal Communications Commission
summary_plain: >-
  The FCC confirmed that the Telephone Consumer Protection Act's limits on calls using an "artificial or prerecorded
  voice" cover AI technologies that generate human voices, whether they simulate a voice entirely or clone a real
  person's voice from a recording. Callers using such voices therefore need the called party's prior express consent
  unless an exemption applies, and must follow the identification and opt-out rules for prerecorded calls. The ruling
  also gives state attorneys general a firmer basis to act against voice-cloning robocall scams.
scope_summary: >-
  Anyone who makes or initiates outbound telephone calls to consumers using AI-generated or cloned voices, under the
  TCPA and the FCC's implementing rules.
who_it_applies_to: Callers and telemarketers using AI-generated voices in calls to consumers.
key_dates_summary: Adopted 2 February 2024; released and effective 8 February 2024.
what_organizations_must_do: >-
  Organisations placing calls with AI-generated voices must have the called party's prior express consent (unless an
  exemption applies) and must meet the identification and opt-out requirements for artificial or prerecorded calls.
penalties_summary: >-
  Violations fall under the TCPA's existing enforcement and remedies; the FCC later issued a USD 6 million forfeiture
  order and reached a USD 1 million settlement over AI voice-cloned robocalls (pending review, not recorded as events).
