status_note: >-
  A declaratory ruling of the Federal Communications Commission interpreting the Telephone Consumer Protection Act and
  the Commission's rules; it took effect on release. Further AI proposals in the same docket (FCC 24-84, August 2024)
  are separate and their outcome was not checked. Recorded on 26 November 2026 from search-engine extracts of the
  official pages listed; the official text could not be opened from the research environment, so every date and duty
  here is pending review against it.
