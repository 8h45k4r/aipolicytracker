obligations:
  - slug: us-omb-m-25-21-high-impact-ai-practices
    title: Apply minimum risk-management practices to high-impact AI
    category: risk_management
    source_reference: "Section 4"
    is_binding: true
    actors: [public_authority]
    sectors: [public_services]
    use_cases: [public_services, government_procurement]
    summary: >
      For AI whose output serves as a principal basis for decisions with significant effects on rights, safety or
      access to services, agencies must complete pre-deployment testing, an AI impact assessment, ongoing
      monitoring, operator training, human oversight and a mechanism for affected people to seek remedy, or stop
      using the AI.
    practical_action: Vendors should prepare test evidence and documentation that agencies can reuse in impact assessments.
    applicability:
      description: Federal agencies using high-impact AI; indirectly their vendors.
      actors: [public_authority, provider]
    evidence_examples:
      - { title: AI impact assessment, artifact_type: report }
      - { title: Pre-deployment test results, artifact_type: report }
    framework_mappings:
      - { framework: nist_ai_rmf, reference: "MAP, MEASURE, MANAGE", note: "The memo is aligned with the AI RMF vocabulary.", confidence_level: medium }
    controls:
      - { control: accuracy-robustness-security-testing, relationship: supports, note: "Pre-deployment test evidence agencies can reuse.", confidence_level: medium }
      - { control: ai-impact-assessment, relationship: supports, note: "AI impact assessment content.", confidence_level: medium }
      - { control: human-oversight-and-override, relationship: supports, note: "Human oversight and operator arrangements.", confidence_level: medium }
  - slug: us-omb-m-25-21-use-case-inventory
    title: Publish an annual AI use-case inventory
    category: transparency
    source_reference: "Section 3"
    is_binding: true
    actors: [public_authority]
    sectors: [public_services]
    use_cases: [public_services]
    summary: >
      Agencies must inventory their AI use cases annually and publish the inventory, identifying high-impact uses,
      with limited exclusions.
    practical_action: Agencies maintain the inventory; vendors may be asked for use-case descriptions.
    applicability:
      description: Federal agencies.
      actors: [public_authority]
    evidence_examples:
      - { title: AI use-case inventory, artifact_type: register }
    framework_mappings:
      - { framework: nist_ai_rmf, reference: "GOVERN 1.6", note: "Inventory of AI systems.", confidence_level: medium }
    controls:
      - { control: public-sector-ai-use-case-register, relationship: satisfies, note: "Annual collection, review and publication of use cases with high-impact flags.", confidence_level: high }
      - { control: ai-system-inventory, relationship: supports, note: "Vendor-side register supplies the use-case descriptions agencies ask for.", confidence_level: medium }
procurement_rules:
  - title: Federal acquisition of AI must follow OMB M-25-22
    summary: >
      The companion memorandum M-25-22 sets requirements for agencies buying AI, including protecting government
      data and avoiding vendor lock-in, performance-based contracting, and requiring vendors to support the
      documentation and testing agencies need for high-impact AI.
