slug: us-omb-m-25-21
jurisdiction: us
title: "OMB Memorandum M-25-21: Accelerating Federal Use of AI through Innovation, Governance, and Public Trust"
short_title: OMB M-25-21
instrument_type: guidance
status: in_force
status_note: >
  Binding on federal agencies as OMB policy; issued together with M-25-22 on federal acquisition of AI. Replaced
  M-24-10 and M-24-18. Deadlines in the memo run from its issue date; a reviewer should confirm current status.
is_binding: true
published: true
issuing_body: Office of Management and Budget, Executive Office of the President
summary_plain: >
  M-25-21 directs US federal agencies on how to govern and use AI. It requires agencies to designate Chief AI
  Officers, maintain AI governance boards, publish AI use-case inventories, and apply minimum risk-management
  practices to "high-impact" AI, including pre-deployment testing, AI impact assessments, ongoing monitoring,
  human oversight and training, and remedies for affected individuals. It replaced the 2024 memoranda with a
  greater emphasis on adoption and innovation while retaining core risk practices.
scope_summary: >
  Applies to federal executive agencies' development, acquisition and use of AI, with exceptions for national
  security systems and certain research. It does not bind private organisations but sets the expectations
  vendors must meet to sell AI to federal agencies.
who_it_applies_to: Federal agencies, their Chief AI Officers, and by extension AI vendors and contractors.
key_dates_summary: Issued 3 April 2025 with staggered compliance deadlines for governance, inventories and high-impact AI practices.
penalties_summary: None; internal executive-branch policy.
what_organizations_must_do: >
  Agencies must implement the governance and high-impact practices; vendors should be able to supply documentation,
  test results and monitoring support that agencies need for high-impact use cases.
