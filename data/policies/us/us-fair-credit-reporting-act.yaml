status_note: >-
  General consumer-reporting law that also applies where consumer reports or credit scores feed automated or AI-based
  decisions; implemented for most persons by the CFPB's Regulation V (12 CFR Part 1022). Recorded on 26 November 2026
  from search-engine extracts of the official pages listed; the official text could not be opened from the research
  environment, so every date and duty here is pending review against it.
