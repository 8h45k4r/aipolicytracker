issuing_body: United States Congress
summary_plain: >-
  The Fair Credit Reporting Act governs how consumer reporting agencies collect and share information about people
  and how others use consumer reports. Organisations that take adverse action based wholly or partly on a consumer
  report must tell the person, and where a credit score was used they must disclose the score and the key factors
  that hurt it. It is a general law, not written for AI, but it reaches scoring and decision models that rely on
  consumer report data.
scope_summary: >-
  Consumer reporting agencies and users of consumer reports, such as creditors, including when the reports or credit
  scores derived from them are used in automated decisions.
who_it_applies_to: Consumer reporting agencies and users of consumer reports.
key_dates_summary: Enacted 26 October 1970 (Public Law 91-508, title VI); effective 25 April 1971.
what_organizations_must_do: >-
  Users that take adverse action based on a consumer report must send an adverse action notice; where a credit score
  was used, the notice must give the score and generally up to four key factors that adversely affected it (five if
  the number of inquiries is one of them). Risk-based pricing notices apply where credit is offered on materially less
  favourable terms.
