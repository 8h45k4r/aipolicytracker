date_notes: >-
  Enactment on 26 October 1970 as title VI of Public Law 91-508 is shown in the US Code notes and FTC compilation. The
  statute provided that title VI takes effect 180 days after enactment; the CFPB examination procedures state the
  effective date as 25 April 1971. Later amendments are not dated here.
