title: 'Equal Credit Opportunity Act (15 U.S.C. 1691 et seq.) and Regulation B (12 CFR Part 1002)'
short_title: ECOA and Regulation B
title_native: null
instrument_type: act
status: in_force
status_note: >-
  General anti-discrimination credit law that also governs credit decisions made with algorithmic or AI models. A CFPB
  final rule amending Regulation B, published in the Federal Register on 22 April 2026 and effective 21 July 2026,
  removed the effects test from the regulation and its commentary, stated the Bureau's view that ECOA does not provide
  for disparate-impact liability, narrowed the discouragement provision and limited the characteristics for-profit
  special purpose credit programs may use; it applies prospectively. Recorded on 26 November 2026 from search-engine
  extracts of the official pages listed; the official text could not be opened from the research environment, so
  every date and duty here is pending review against it.
