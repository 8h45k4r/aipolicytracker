issuing_body: United States Congress; Consumer Financial Protection Bureau (Regulation B)
summary_plain: >-
  The Equal Credit Opportunity Act forbids creditors from discriminating against applicants on protected grounds such
  as race, colour, religion, national origin, sex, marital status, age and receipt of public assistance. Regulation B
  implements it and requires creditors to notify applicants of adverse action and to give the specific principal
  reasons, which applies equally when the decision comes from a scoring or machine-learning model. It is a general
  law, not written for AI, but it is a main constraint on automated credit decisions in the United States.
scope_summary: >-
  Creditors in credit transactions, covering decisions on new applications and adverse action on existing accounts,
  whatever the technology used to make the decision.
who_it_applies_to: Creditors making credit decisions, including with scoring or AI models.
key_dates_summary: >-
  Enacted 28 October 1974 (Public Law 93-495, title V); Regulation B amendments published 22 April 2026, effective
  21 July 2026.
what_organizations_must_do: >-
  Creditors must not discriminate on a prohibited basis and, when they take adverse action, must send a notice within
  the regulation's time limits that states the principal reasons actually used (or tells the applicant how to request
  them); reasons must relate to the factors the model actually scored.
adopted_on: '1974-10-28'
published_on: null
