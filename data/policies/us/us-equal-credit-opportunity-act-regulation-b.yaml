applies_from: null
date_notes: >-
  Enactment on 28 October 1974 as title V of Public Law 93-495 (adding title VII to the Consumer Credit Protection Act)
  is confirmed by the Statutes at Large and US Code notes. The original effective date was not established from the
  extracts and is left empty. The 2026 Regulation B rule was published on 22 April 2026 with an effective date of
  21 July 2026 (90 days after publication) per the Federal Register and the CFPB final-rule page. The separate
  small business lending (section 1071) rule under Regulation B is not covered here.
