status_note: >-
  Issued jointly by the Federal Reserve, the OCC and the FDIC on 17 April 2026. It replaces SR 11-7 and SR 21-8, OCC
  Bulletins 2011-12 and 2021-19, and FDIC FIL-22-2017 and FIL-27-2021. The agencies state that it sets no enforceable
  standards and that non-compliance will not itself lead to supervisory criticism. Generative and agentic AI models are
  stated to be outside its scope. Recorded on 26 November 2026 from search-engine extracts of the official pages
  listed; the official text could not be opened from the research environment, so every date and duty here is pending
  review against it.
