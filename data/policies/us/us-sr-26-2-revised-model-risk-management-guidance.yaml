issuing_body: >-
  Board of Governors of the Federal Reserve System; Office of the Comptroller of the Currency; Federal Deposit
  Insurance Corporation
summary_plain: >-
  Revised guidance from the three US federal banking agencies on how banking organisations should manage the risk of
  relying on quantitative models in decision-making. It takes a risk-based approach in
  which the depth of oversight, validation and monitoring follows each model's materiality, judged by its purpose and
  exposure. It excludes simple deterministic tools and, for now, generative and agentic AI models.
scope_summary: >-
  Banking organisations supervised by the three agencies, with the guidance expected to be most relevant to those with
  more than 30 billion US dollars in total assets; it generally does not apply to smaller organisations unless they
  have significant model risk exposure.
who_it_applies_to: Supervised banking organisations, chiefly those with over USD 30 billion in assets.
key_dates_summary: Issued 17 April 2026.
what_organizations_must_do: >-
  Organisations in scope are expected to scale model governance, validation (generally before first use) and ongoing
  performance monitoring to each model's materiality, with clear policies and assigned responsibilities across the
  model lifecycle.
