title: >-
  CMS Innovation Center WISeR (Wasteful and Inappropriate Service Reduction) Model: technology-enabled prior
  authorisation in Original Medicare
short_title: CMS WISeR Model
title_native: null
instrument_type: policy
status: in_force
status_note: >-
  Recorded on 26 November 2026 from search-engine extracts of the official pages listed; the official text could not be
  opened from the research environment, so every date and duty here is pending review against it. The model began on
  1 January 2026 and runs to 31 December 2031. A Federal Register notice of 6 April 2026 postponed prior authorisation
  and pre-payment review for deep brain stimulation (NCD 160.24) and percutaneous image-guided lumbar decompression
  (NCD 150.13) until a date to be announced in a later notice; a correction notice was published the same day.
is_binding: true
ai_specific: false
featured: false
published: true
issuing_body: Centers for Medicare & Medicaid Services (CMS Innovation Center)
summary_plain: >-
  WISeR is a six-year CMS Innovation Center model that tests prior authorisation for a list of selected items and
  services in Original Medicare in six states. Technology companies with experience of technology-enhanced prior
  authorisation for other payers, described by CMS as using tools such as AI, act as model participants; they must have
  clinicians available for medical review. Providers may ask for prior authorisation or instead have their claims for
  those services sent for pre-payment medical review. CMS says coverage and payment rules and appeal rights are
  unchanged.
scope_summary: >-
  Model participants (technology companies selected by CMS), and providers and suppliers furnishing the selected items
  and services to Original Medicare beneficiaries in Arizona, New Jersey, Ohio, Oklahoma, Texas and Washington.
who_it_applies_to: WISeR participants and Medicare providers and suppliers in the six WISeR states.
key_dates_summary: >-
  Notice published 1 July 2025; model runs 1 January 2026 to 31 December 2031; prior authorisation requests accepted from
  5 January 2026 for services from 15 January 2026; two services postponed on 6 April 2026.
penalties_summary: null
what_organizations_must_do: >-
  Providers and suppliers in the WISeR states may submit prior authorisation requests for the listed services; claims
  for services on or after 15 January 2026 without one are suspended and reviewed before payment by the WISeR
  participant. Participants must make medical review by clinicians with relevant expertise available when they use
  technology to support coverage determinations.
adopted_on: null
published_on: '2025-07-01'
in_force_on: '2026-01-01'
applies_from: '2026-01-15'
date_notes: >-
  Federal Register notice date (1 July 2025), model start (1 January 2026), end (31 December 2031), the 5 January 2026
  start for requests and the 15 January 2026 start for services are taken from extracts of the notice and CMS's WISeR
  FAQ and operational guide. The delay notice is dated 6 April 2026; no new date for the two postponed services was
  found. Skin substitutes are included only in WISeR states with an active skin substitute LCD.
