summary_plain: >-
  The White House set out what it wants Congress to put into a single national AI law. The recommendations cover six
  areas: protecting children (including age-assurance duties for AI services minors are likely to use), shielding
  households from data-centre electricity costs and easing permits for on-site power, intellectual property and
  creators, free speech, innovation through regulatory sandboxes, and workforce training. They ask Congress to preempt
  state AI laws that impose undue burdens, with carve-outs, and not to create a new federal AI regulator.
scope_summary: >-
  Addressed to Congress as proposals for federal legislation. If enacted, the proposals would affect AI developers and
  deployers across sectors, and would limit state regulation of AI development while keeping state laws of general
  application such as child protection, fraud and consumer protection.
who_it_applies_to: Congress (as recommendations); prospectively AI developers, deployers and states.
