summary_plain: >-
  The 2024 final rule revises the federal confidentiality rules for records of substance use disorder treatment
  (42 CFR Part 2) to bring them closer to HIPAA. Patients can give one consent covering
  future uses and disclosures for treatment, payment and health care operations, and HIPAA covered entities and
  business associates that receive records under that consent may redisclose them under HIPAA rules. Counselling
  session notes need their own consent, records still cannot be used against the patient in proceedings without
  consent or a court order, and HIPAA-style breach notification and enforcement now apply.
scope_summary: >-
  Federally assisted substance use disorder treatment programs, and the lawful holders and recipients of their patient
  records, including HIPAA covered entities and business associates that receive Part 2 records.
who_it_applies_to: Part 2 programs and other persons who hold or receive Part 2 substance use disorder treatment records.
key_dates_summary: >-
  Published 16 February 2024; effective 16 April 2024; compliance with the applicable requirements required by
  16 February 2026.
penalties_summary: >-
  The rule replaces Part 2's former criminal-only penalties with the civil and criminal enforcement authorities that
  apply to HIPAA violations (Social Security Act sections 1176 and 1177). HHS's Office for Civil Rights began taking
  Part 2 complaints and breach notifications on 16 February 2026.
what_organizations_must_do: >-
  Organisations in scope must handle Part 2 records under the revised consent rules, obtain separate consent for SUD
  counselling notes, notify breaches of Part 2 records as the HIPAA Breach Notification Rule requires, and update patient
  notices (Part 2 programs) and notices of privacy practices (HIPAA covered entities) by 16 February 2026.
