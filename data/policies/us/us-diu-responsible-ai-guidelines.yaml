summary_plain: >-
  Step-by-step guidelines and worksheets from the Defense Innovation Unit that turn the Defense Department's AI ethical
  principles into practice for its commercial prototyping and acquisition programmes. They take a project from planning
  through development to deployment, and were drafted with researchers at Carnegie Mellon University's Software
  Engineering Institute after consultation with government, industry and academia. They later became one of the
  foundations of the department's Responsible AI Toolkit.
scope_summary: >-
  Defense Innovation Unit programmes and the commercial companies that build AI prototypes for them; other teams may
  use them voluntarily.
who_it_applies_to: Defense Innovation Unit programme teams and the vendors on its AI prototype projects.
