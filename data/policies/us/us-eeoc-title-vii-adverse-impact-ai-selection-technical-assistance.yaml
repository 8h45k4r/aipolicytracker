summary_plain: >-
  Non-binding technical assistance in which the EEOC explained how Title VII's disparate-impact rules apply when
  employers use software, algorithms or AI to make or inform hiring, promotion and other selection decisions. It
  pointed employers to the 1978 Uniform Guidelines on Employee Selection Procedures for assessing adverse impact and
  noted that the four-fifths rule is only a rule of thumb. It was issued under the EEOC's AI and algorithmic fairness
  initiative and was later taken off the agency's website.
scope_summary: >-
  Employers covered by Title VII that use automated or AI-based tools in employment selection, including tools
  supplied by vendors.
who_it_applies_to: Employers using algorithmic or AI selection tools (guidance no longer published).
key_dates_summary: Issued 18 May 2023; reported removed from the EEOC website in January 2025 (date pending review).
