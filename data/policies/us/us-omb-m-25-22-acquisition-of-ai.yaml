summary_plain: >-
  M-25-22 is the Office of Management and Budget's direction to federal agencies on how to buy AI systems and services.
  It asks agencies to keep AI purchasing competitive, avoid becoming locked in to a single vendor, settle data ownership
  and intellectual property rights in their contracts, and track how acquired AI performs. Agencies are also told to
  review their internal acquisition procedures. It was issued alongside M-25-21 on federal use of AI and carries out
  Executive Order 14179.
scope_summary: >-
  Federal executive agencies acquiring AI systems or services, and through their contracts the vendors that sell AI to
  them. AI bought as a component of a national security system and elements of the intelligence community are outside
  its scope.
who_it_applies_to: Federal executive agencies and, through contract terms, their AI vendors.
key_dates_summary: Memorandum dated 3 April 2025; contract requirements apply to later solicitations (start date pending review).
what_organizations_must_do: >-
  Agencies must revisit their AI acquisition procedures, including how contracts treat data ownership and intellectual
  property rights. Vendors should expect contract terms on use of government data, portability and performance tracking.
