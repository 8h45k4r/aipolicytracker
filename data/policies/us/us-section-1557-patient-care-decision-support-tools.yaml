status_note: >-
  Recorded on 26 November 2026 from search-engine extracts of the official pages listed; the official text could not be
  opened from the research environment, so every date and duty here is pending review against it. Courts stayed,
  enjoined and, on 22 October 2025 (Tennessee v. Kennedy, S.D. Miss.), partly vacated the 2024 rule to the extent it
  treats gender-identity discrimination as sex discrimination; HHS's notice of 2 June 2026 says the other provisions
