summary_plain: >-
  The 2024 Section 1557 rule implements the Affordable Care Act's ban on discrimination in federally funded health
  programs. Section 92.210 applies that ban to patient care decision support tools, automated or not, including AI and
  clinical algorithms used to support care decisions. Covered entities must not discriminate on the basis of race,
  colour, national origin, sex, age or disability through these tools, must make reasonable efforts to identify tools
  whose inputs measure those characteristics, and must make reasonable efforts to reduce the risk of discrimination
  from each tool identified.
scope_summary: >-
  Covered entities under Section 1557, such as health care providers and health insurance issuers receiving federal
  financial assistance, that use patient care decision support tools in their health programs or activities. Tools
  used only for administrative or billing functions unrelated to clinical decisions are outside 92.210.
who_it_applies_to: Section 1557 covered entities that use patient care decision support tools.
key_dates_summary: >-
  Published 6 May 2024; effective 5 July 2024; identification and mitigation duties in 92.210(b) and (c) apply from
  1 May 2025.
penalties_summary: null
what_organizations_must_do: >-
  Organisations in scope must not discriminate through decision support tools; must make ongoing reasonable efforts to
  identify tools that use race, colour, national origin, sex, age or disability as input variables or factors; and must
  make reasonable efforts to mitigate the risk of discrimination from each tool so identified. HHS expects due
  diligence when tools are acquired and used, but does not require entities to obtain developers' training data or to
  notify patients about the tools used.
