summary_plain: >-
  The CMS AI Playbook is the agency's internal handbook for planning, governing and running AI projects. Version 4 moves
  from general background on AI to guidance and tools specific to CMS for leadership, project teams and IT and security
  staff. Its six chapters cover an introduction, an AI primer, AI use at CMS and the agency's maturity, governance, a
  step-by-step guide to running an AI project, and emerging technologies, and it supplies templates used to document
  risk mitigation and ongoing monitoring.
scope_summary: >-
  CMS staff and teams, including leadership, project teams and IT and security roles, who plan, build, buy or oversee
  AI initiatives within the agency.
who_it_applies_to: Centers for Medicare & Medicaid Services staff and AI project teams.
key_dates_summary: Version 4.0 dated 12 September 2025.
penalties_summary: null
what_organizations_must_do: >-
  Nothing binding. CMS teams are pointed to the playbook's templates when documenting mitigation plans for identified
  AI risks and the procedures for ongoing monitoring and ethical review.
