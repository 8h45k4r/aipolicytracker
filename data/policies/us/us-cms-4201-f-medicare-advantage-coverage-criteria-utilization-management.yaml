published: true
issuing_body: Centers for Medicare & Medicaid Services
summary_plain: >-
  This final rule tightens how Medicare Advantage plans decide whether care is medically necessary and how they run
  prior authorisation and other utilisation management. Plans must base medical necessity decisions on the coverage
  criteria in 42 CFR 422.101(b) and (c) and the Medicare reasonable-and-necessary standard, and must have a utilisation
  management committee review their policies every year. CMS guidance of February 2024 says plans may use algorithms or
  AI to help, but remain responsible for compliance, and may not rely on a tool that decides on wider data sets rather
  than the individual patient's circumstances.
scope_summary: >-
  Medicare Advantage organisations making coverage and medical necessity determinations for basic and supplemental
  benefits, including through prior authorisation and other utilisation management tools.
who_it_applies_to: Medicare Advantage organisations and the plans they offer.
key_dates_summary: >-
  Published 12 April 2023; effective 5 June 2023; applicable to coverage beginning 1 January 2024. CMS FAQ memo on the
  coverage and UM provisions issued 6 February 2024.
penalties_summary: null
what_organizations_must_do: >-
  Organisations in scope must make medical necessity determinations on the permitted coverage criteria and the
  individual enrollee's circumstances; publish any internal coverage criteria; set up a utilisation management
  committee led by the plan's medical director that reviews and approves all UM policies at least once a year (no UM
  policy may be used from 1 January 2024 without that approval); and, per the CMS FAQ, ensure that any algorithm or
  AI tool follows these rules, is checked for bias before use, and is not the sole basis for ending post-acute care or
  denying or downgrading an inpatient admission.
