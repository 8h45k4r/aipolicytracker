title: >-
  CMS-4201-F: Contract Year 2024 Medicare Advantage final rule, coverage criteria and utilization management
  (42 CFR 422.101(b)(6) and 422.137)
short_title: Medicare Advantage coverage criteria and UM rule (CMS-4201-F)
title_native: null
instrument_type: regulation
status: in_force
status_note: >-
  Recorded on 26 November 2026 from search-engine extracts of the official pages listed; the official text could not be
  opened from the research environment, so every date and duty here is pending review against it. The rule is general
  Medicare Advantage regulation; its link to AI comes from the CMS FAQ memo of 6 February 2024, which explains how the
  coverage rules apply when plans use algorithms or AI. A later rule (April 2024) added health equity requirements to
  section 422.137 and a subsequent CMS rulemaking proposed removing them; the current text of 422.137 should be checked
  on eCFR.
