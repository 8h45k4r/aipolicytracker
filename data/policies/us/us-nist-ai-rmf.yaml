slug: us-nist-ai-rmf
jurisdiction: us
title: "NIST AI Risk Management Framework (AI RMF 1.0) and Generative AI Profile"
short_title: NIST AI RMF
instrument_type: framework
status: voluntary_standard
is_binding: false
featured: true
published: true
issuing_body: National Institute of Standards and Technology (US Department of Commerce)
summary_plain: >
  The NIST AI Risk Management Framework is a voluntary framework for managing risks to individuals, organisations and
  society from AI. It organises practices into four functions: Govern, Map, Measure and Manage, and describes
  characteristics of trustworthy AI such as validity, safety, security, accountability, explainability, privacy and
  fairness. The July 2024 Generative AI Profile (NIST AI 600-1) adds risks and suggested actions specific to
  generative AI. Many US procurement requirements and state laws reference the framework as a recognised approach.
scope_summary: >
  Voluntary and sector-agnostic; usable by any organisation designing, developing, deploying or evaluating AI systems.
  It creates no legal obligations, but Colorado SB 24-205 and federal procurement guidance treat conformity with the
  framework as evidence of reasonable care.
who_it_applies_to: Any organisation that chooses to adopt it; referenced by regulators, state laws and customers.
key_dates_summary: AI RMF 1.0 released 26 January 2023; Generative AI Profile (NIST AI 600-1) released 26 July 2024.
penalties_summary: None; voluntary.
what_organizations_must_do: >
  Nothing is mandatory. Organisations adopting it typically establish governance (Govern), document context and
  impacts (Map), test and monitor (Measure), and prioritise and respond to risks (Manage), using the Playbook.
