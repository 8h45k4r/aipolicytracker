faq:
  - question: Is the NIST AI RMF mandatory?
    answer: >
      No. It is voluntary. Some laws and procurement rules reference it, and Colorado's AI Act treats compliance
      with a recognised framework such as the AI RMF as relevant to the "reasonable care" defence.
  - question: How does the NIST AI RMF relate to ISO/IEC 42001?
    answer: >
      Both are voluntary. The AI RMF is a risk-management framework with four functions; ISO/IEC 42001 is a
      certifiable management-system standard. Organisations often use the AI RMF as the practice catalogue inside
      an ISO/IEC 42001 management system.
