obligations:
  - slug: us-nist-ai-rmf-govern
    title: Establish AI governance policies, roles and accountability (Govern)
    category: governance_accountability
    section: "Part 2: Core"
    source_reference: "GOVERN function"
    is_binding: false
    actors: [provider, deployer]
    sectors: [cross_sector]
    use_cases: [generative_ai, hiring_and_hr]
    summary: >
      Govern covers policies and procedures for AI risk, roles and responsibilities, workforce diversity and
      training, organisational culture, stakeholder engagement, and third-party risk management. It is the
      cross-cutting function that supports the other three.
    practical_action: Adopt an AI policy, assign owners, and set a risk-tolerance statement approved by leadership.
    applicability:
      description: Voluntary; any organisation adopting the framework.
      actors: [provider, deployer]
    evidence_examples:
      - { title: AI governance policy, artifact_type: document }
    framework_mappings:
      - { framework: iso_42001, reference: "Clauses 4–5 and 7", note: "Original editorial mapping: leadership, context and support.", confidence_level: high }
    controls:
      - { control: ai-governance-policy-and-accountability, relationship: satisfies, note: "Policy, roles, risk tolerance and culture map to the Govern outcomes.", confidence_level: high }
      - { control: ai-literacy-and-role-based-training, relationship: supports, note: "Workforce training outcomes.", confidence_level: high }
      - { control: third-party-ai-due-diligence, relationship: supports, note: "Third-party risk management outcomes.", confidence_level: high }
  - slug: us-nist-ai-rmf-map
    title: Map context, intended use and potential impacts (Map)
    category: impact_assessment
    section: "Part 2: Core"
    source_reference: "MAP function"
    is_binding: false
    actors: [provider, deployer]
    sectors: [cross_sector]
    use_cases: [generative_ai, public_services]
    summary: >
      Map establishes the context: intended purposes, users, deployment settings, legal requirements, risk
      categorisation, benefits and costs, and impacts on individuals, groups, communities and society.
    practical_action: Produce a system card or context document before development starts.
    applicability:
      description: Voluntary; any organisation adopting the framework.
      actors: [provider, deployer]
    evidence_examples:
      - { title: AI system context and impact document, artifact_type: document }
    framework_mappings:
      - { framework: iso_42001, reference: "Clause 6.1.4 AI system impact assessment", note: "Original editorial mapping.", confidence_level: high }
    controls:
      - { control: ai-impact-assessment, relationship: satisfies, note: "Context, affected people and impact analysis produced before development.", confidence_level: medium }
      - { control: ai-system-inventory, relationship: supports, note: "Intended purpose, users and settings recorded at intake.", confidence_level: high }
      - { control: ai-risk-assessment, relationship: supports, note: "Risk categorisation and benefit-cost analysis.", confidence_level: medium }
  - slug: us-nist-ai-rmf-measure
    title: Measure and test trustworthiness characteristics (Measure)
    category: safety_testing
    section: "Part 2: Core"
    source_reference: "MEASURE function"
    is_binding: false
    actors: [provider]
    sectors: [cross_sector]
    use_cases: [generative_ai, safety_critical, biometrics]
    summary: >
      Measure covers selecting metrics and test methods, evaluating validity, safety, security, resilience,
      explainability, privacy, fairness and bias, and monitoring these over time, including through independent
      review and red-teaming for generative AI.
    practical_action: Define a test plan with metrics for each trustworthiness characteristic and record results.
    applicability:
      description: Voluntary; any organisation adopting the framework.
      actors: [provider]
    evidence_examples:
      - { title: Evaluation and red-team reports, artifact_type: report }
    framework_mappings:
      - { framework: iso_42001, reference: "Clause 9 Performance evaluation; Annex A verification controls", note: "Original editorial mapping.", confidence_level: medium }
    controls:
      - { control: accuracy-robustness-security-testing, relationship: satisfies, note: "Metrics and test methods for each trustworthiness characteristic.", confidence_level: medium }
      - { control: genai-red-team-testing, relationship: supports, note: "Red-teaming and independent review for generative AI.", confidence_level: high }
      - { control: post-market-monitoring-and-drift-detection, relationship: supports, note: "Tracking metrics over time.", confidence_level: high }
  - slug: us-nist-ai-rmf-manage
    title: Prioritise, respond to and monitor AI risks (Manage)
    category: risk_management
    section: "Part 2: Core"
    source_reference: "MANAGE function"
    is_binding: false
    actors: [provider, deployer]
    sectors: [cross_sector]
    use_cases: [generative_ai, finance_and_credit]
    summary: >
      Manage allocates resources to mapped and measured risks, plans responses including decommissioning,
      manages third-party risks, and documents post-deployment monitoring, incident response and communication.
    practical_action: Maintain a risk-treatment plan and an incident and monitoring log per system.
    applicability:
      description: Voluntary; any organisation adopting the framework.
      actors: [provider, deployer]
    evidence_examples:
      - { title: Risk treatment and monitoring plan, artifact_type: document }
    framework_mappings:
      - { framework: iso_42001, reference: "Clauses 8 and 10", note: "Operation and improvement.", confidence_level: medium }
    controls:
      - { control: ai-risk-assessment, relationship: satisfies, note: "Risk treatment planning and resource allocation for mapped and measured risks.", confidence_level: medium }
      - { control: ai-incident-management-and-reporting, relationship: supports, note: "Incident response and communication outcomes.", confidence_level: high }
      - { control: third-party-ai-due-diligence, relationship: supports, note: "Third-party risk management outcomes.", confidence_level: medium }
