slug: us-executive-order-14179
jurisdiction: us
title: "Executive Order 14179: Removing Barriers to American Leadership in Artificial Intelligence"
short_title: EO 14179
instrument_type: executive_order
status: in_force
status_note: >
  Revoked Executive Order 14110 (Safe, Secure, and Trustworthy AI, October 2023) had already been rescinded by
  Executive Order 14148 on 20 January 2025. EO 14179 directs development of an AI Action Plan, published in
  July 2025. Executive orders bind federal agencies, not private organisations directly.
is_binding: true
published: true
issuing_body: President of the United States
summary_plain: >
  Executive Order 14179, signed 23 January 2025, sets US federal policy to sustain and enhance American AI dominance,
  directs the development of an AI Action Plan within 180 days, and orders agencies to review and revise or rescind
  actions taken under the revoked Executive Order 14110 that are inconsistent with the new policy. It also called
  for revision of the OMB memoranda governing federal agency use and procurement of AI, which OMB replaced in
  April 2025 with M-25-21 and M-25-22.
scope_summary: >
  Binds executive departments and agencies of the US federal government. It does not itself impose obligations on
  private companies, but it shapes federal procurement, agency guidance and enforcement priorities.
who_it_applies_to: Federal executive departments and agencies; indirectly federal contractors and AI vendors.
key_dates_summary: Signed 23 January 2025; AI Action Plan delivered 23 July 2025; OMB memoranda issued 3 April 2025.
penalties_summary: None; executive-branch policy.
what_organizations_must_do: >
  Private organisations have no direct duties. Federal vendors should track the AI Action Plan and OMB memoranda
  for procurement expectations.
