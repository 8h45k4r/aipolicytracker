summary_plain: >-
  America's AI Action Plan is the federal AI strategy mandated by Executive Order 14179. It lists more than 90 policy
  actions grouped under three pillars: accelerating innovation (including removing regulatory barriers), building
  AI infrastructure such as data centres and chip fabrication with streamlined permitting, and leading internationally
  through AI exports and security measures. It was released with accompanying executive orders on federal procurement,
  data-centre permitting and AI exports.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by The White House (Office of Science and Technology
  Policy). Oversight: OSTP coordinates; implementation assigned to federal departments and agencies. Stated purpose:
  Secure US leadership in AI through deregulation, infrastructure build-out and export of American AI.
