issuing_body: Office of the National Coordinator for Health Information Technology (ONC), U.S. Department of Health and Human Services
summary_plain: >-
  HTI-1 updates the ONC Health IT Certification Program and replaced the clinical decision support criterion with a new
  decision support interventions (DSI) criterion at 170.315(b)(11). Health IT developers certifying to it must let users
  review technical performance and quality information ("source attributes") about evidence-based and predictive
  decision support, including AI models, used through their software, and must manage risks of predictive DSIs they
  develop. From 2025 only the new criterion satisfies the Base EHR definition that certified products rely on.
scope_summary: >-
  Developers of health IT seeking or holding certification under the ONC Health IT Certification Program, in
  particular Health IT Modules certified to the decision support interventions criterion, and indirectly the providers
  who use certified health IT.
who_it_applies_to: Certified health IT developers (Health IT Modules certified to 45 CFR 170.315(b)(11)).
key_dates_summary: >-
  Published 9 January 2024; effective 11 March 2024 (corrected from 8 February 2024); only the DSI criterion meets the
  Base EHR definition from 1 January 2025.
penalties_summary: null
what_organizations_must_do: >-
  Developers in scope must support source attribute fields (ONC guidance lists 13 for evidence-based and 31 for
  predictive DSIs), let users access and modify them, show "Unknown" where information is not available, and apply
  risk management practices to predictive DSIs they develop; developers relying on the Base EHR definition had to
  update to 170.315(b)(11) by the end of 2024.
adopted_on: null
