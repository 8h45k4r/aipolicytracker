status_note: >-
  Recorded on 26 November 2026 from search-engine extracts of the official pages listed; the official text could not be
  opened from the research environment, so every date and duty here is pending review against it. A later ONC final
  rule (Federal Register, 28 October 2026, 2026-21943, "ONC Deregulatory Actions To Unleash Prosperity") removes the
  source attribute, attribute access and modification, and predictive DSI risk management requirements of
  170.315(b)(11). That rule is effective 28 December 2026, except certain amendatory instructions effective
  1 January 2027; which date governs the DSI changes was not established. Until then the HTI-1 requirements recorded
  here stand.
is_binding: true
