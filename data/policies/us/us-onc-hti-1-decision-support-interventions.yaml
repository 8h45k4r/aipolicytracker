date_notes: >-
  Publication on 9 January 2024 is from the Federal Register extract. The rule originally stated an effective date of
  8 February 2024; a correction published on 8 February 2024 moved it to 11 March 2024 (extract of the govinfo
  correction). ONC fact sheets say either the old CDS criterion or the DSI criterion met the Base EHR definition up to
  31 December 2024, and only the DSI criterion from 1 January 2025. The signature date was not established.
