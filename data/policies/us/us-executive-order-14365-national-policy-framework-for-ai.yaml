issuing_body: The White House
summary_plain: >-
  Directs the Attorney General to set up an AI Litigation Task Force to challenge state AI laws, asks the Commerce Department
  to identify "onerous" state AI laws (with non-deployment broadband (BEAD) funds tied to that list), and asks the FTC for
  a policy statement on AI outputs. It does not itself pre-empt any state law; that would take legislation or a court ruling.
scope_summary: Federal agencies; aimed at state AI laws such as those recorded under each state.
who_it_applies_to: Federal agencies; indirectly, states with AI laws and organisations relying on them.
key_dates_summary: >-
  Signed 11 December 2025; published in the Federal Register 16 December 2025 (2025-23092); DOJ task force memo 9 January
  2026; FTC policy statement 7 July 2026.
