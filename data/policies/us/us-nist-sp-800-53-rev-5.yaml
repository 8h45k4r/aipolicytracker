summary_plain: >-
  SP 800-53 Revision 5 is NIST's catalogue of security and privacy controls for information systems and the
  organisations that run them. Revision 5 merged security and privacy controls into one catalogue, added a supply chain
  risk management control family and wrote controls as outcomes rather than tying them to a system or organisation.
  The baselines for choosing controls moved to the companion publication SP 800-53B. It is general guidance that also
  applies to systems that use AI.
scope_summary: >-
  Federal information systems and the organisations that operate them, and any other organisation that adopts the
  catalogue to protect information systems, including those that develop or run AI.
who_it_applies_to: Federal agencies and their contractors; other organisations voluntarily.
key_dates_summary: Revision 5 published 23 September 2020; release 5.2.0 issued 27 August 2025.
