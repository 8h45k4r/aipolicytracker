issuing_body: National Association of Insurance Commissioners
summary_plain: >-
  A model bulletin that state insurance regulators can issue to set common expectations for insurers' use of AI. It
  reminds insurers that decisions affecting consumers that are made or supported by AI systems must still comply with
  existing insurance law, including the rules on unfair trade practices and unfair discrimination. Insurers are
  expected to keep a written programme for the responsible use of AI systems in regulated insurance practices, drawing
  on the NAIC's 2020 AI Principles and, where useful, the NIST AI Risk Management Framework.
scope_summary: >-
  Insurers authorised in a state that has issued the bulletin, for AI systems that make or support decisions in
  regulated insurance practices, including systems obtained from third parties.
who_it_applies_to: Insurers in states that adopt the bulletin.
key_dates_summary: Approved by the NAIC (H) Committee 1 December 2023; adopted by the membership 4 December 2023.
what_organizations_must_do: >-
  In adopting states, insurers are expected to develop, implement and maintain a written AI systems programme (an
  "AIS Program") for the responsible use of AI that makes or supports decisions in regulated insurance practices.
