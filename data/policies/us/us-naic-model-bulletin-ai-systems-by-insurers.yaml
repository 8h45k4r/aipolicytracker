status_note: >-
  A model bulletin adopted by the National Association of Insurance Commissioners for individual state insurance
  regulators to issue; it binds insurers only in a state that adopts it, and adoption is state by state. Recorded on
  26 November 2026 from search-engine extracts of the official pages listed; the official text could not be opened
  from the research environment, so every date and duty here is pending review against it.
