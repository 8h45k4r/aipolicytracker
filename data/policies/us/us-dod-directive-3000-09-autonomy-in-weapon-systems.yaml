issuing_body: U.S. Department of Defense (Office of the Under Secretary of Defense for Policy)
summary_plain: >-
  An internal Department of Defense directive that sets policy and assigns responsibilities for developing and using
  autonomous and semi-autonomous functions in weapon systems. Systems must be designed so that commanders and operators
  can exercise appropriate levels of human judgement over the use of force, and must pass rigorous verification,
  validation, test and evaluation. Most autonomous weapon systems need senior-level approval before formal development
  and again before fielding, and AI capabilities in them are expected to follow the department's AI ethical principles.
scope_summary: >-
  DoD components that design, develop, acquire, test, field or use autonomous and semi-autonomous weapon systems,
  including remotely operated and crewed armed platforms with such functions.
who_it_applies_to: Department of Defense components responsible for weapon systems with autonomous functions.
key_dates_summary: Issued 25 January 2023, replacing the 21 November 2012 version.
what_organizations_must_do: >-
  Components must design systems to allow appropriate human judgement over the use of force, test and re-test them
  (including after changes to algorithms, missions or environments), and obtain approval from the Under Secretaries of
  Defense for Policy and for Research and Engineering and the Vice Chairman of the Joint Chiefs of Staff before formal
  development and before fielding, unless an exemption applies. The directive also sets up an Autonomous Weapon Systems
  Working Group.
