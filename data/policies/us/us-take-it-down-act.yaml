date_notes: >-
  Congress.gov actions in the extracts show Senate passage by unanimous consent on 13 February 2025, House passage
  409-2 on 28 April 2025, and signature on 19 May 2025 as Public Law 119-12. The Congressional Research Service extract
  says the criminal prohibition took effect on enactment and platforms had one year (to 19 May 2026) to set up the
  removal process; FTC pages say enforcement started then. All dates pending review against the enrolled text.
