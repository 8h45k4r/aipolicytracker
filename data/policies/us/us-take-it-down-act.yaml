summary_plain: >-
  The TAKE IT DOWN Act makes it a federal crime to knowingly publish intimate images of a person without consent,
  including AI-generated "digital forgeries". It also requires covered online platforms to run a notice-and-removal
  process: a plain-language explanation of how to ask for removal, removal of the depiction within 48 hours of a valid
  request, and reasonable efforts to remove known identical copies. The Federal Trade Commission enforces the platform
  duties as violations of a rule on unfair or deceptive practices.
scope_summary: >-
  Individuals who publish non-consensual intimate depictions, real or AI-generated, and covered platforms: public
  websites, online services and apps that mainly host user-generated content or that regularly publish or host
  non-consensual intimate depictions in the course of business.
who_it_applies_to: Individuals who publish intimate depictions; websites and apps that host user-generated content.
key_dates_summary: Signed into law 19 May 2025; platform notice-and-removal process required from 19 May 2026.
penalties_summary: >-
  Criminal penalties for knowing publication. Failure by a platform to reasonably comply with the removal duties is
  enforced by the FTC; the FTC states civil penalties of up to $53,088 per violation may apply.
what_organizations_must_do: >-
  Covered platforms must publish a plain-language removal process that people without an account can also use, remove
  a depiction no later than 48 hours after a valid request, and make reasonable efforts to remove known identical copies.
  Good-faith removal of apparently unlawful material is shielded from liability.
