summary_plain: >-
  This NIST report gives a shared vocabulary and classification for attacks on machine-learning systems and the
  defences against them. It sorts attacks by the kind of system targeted, predictive or generative AI, and by the
  attacker's goal, such as disrupting availability, undermining integrity, extracting private data or misusing the
  system, and it includes a glossary. Organisations can use it to describe and plan for AI security threats in a
  consistent way; it creates no legal duties.
scope_summary: >-
  Voluntary reference for organisations that build, deploy, test or secure predictive and generative AI systems, and
  for researchers and standards developers working on AI security.
who_it_applies_to: AI developers, deployers and security teams (voluntary).
