summary_plain: >-
  Sets the framework for how the Galician administration and regional public sector design, procure, deploy and use AI. It
  creates a Galician AI Office, a Galician AI Council and AI commissioners within departments, and provides for a regulatory
  sandbox and support for start-ups.
scope_summary: >-
  The Xunta de Galicia and its regional public sector, with promotion measures for businesses and researchers.
who_it_applies_to: The Galician regional administration and public sector bodies.
key_dates_summary: >-
  Published in the Diario Oficial de Galicia (No. 66) on 4 April 2025; in force 24 April 2025, twenty days after publication.
