summary_plain: >-
  Promotes AI innovation, prefers open-source and open models in public AI projects, and gives people rights over automated
  decisions, including information, contestation and human review on appeal. It creates an AI ethics and innovation advisory
  body, a permanent state AI sandbox and an annual AI prize.
scope_summary: The Goiás state executive and public sector, and the state innovation ecosystem.
