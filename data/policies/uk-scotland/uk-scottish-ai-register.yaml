summary_plain: >-
  A public register of AI systems in use or in development in the Scottish public sector. The government announced in March
  2024 that registration would become mandatory, starting with its own departments, but a 2025 freedom-of-information response
  describes the register as voluntary with an expectation that public bodies use it.
scope_summary: AI systems used or developed by Scottish public bodies.
who_it_applies_to: Scottish public sector bodies.
key_dates_summary: Launched March 2023; mandatory registration announced 28 March 2024.
