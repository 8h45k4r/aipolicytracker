status: in_force
is_binding: true
featured: false
published: true
issuing_body: Hellenic Parliament
summary_plain: >-
  Law 4961/2022, published in July 2022, contains a chapter on artificial intelligence: public-sector bodies must carry
  out an algorithmic impact assessment and publish information before deploying AI systems that affect people, keep a register
  of AI systems, and ensure the Hellenic Data Protection Authority's oversight; medium and large private companies must
  inform workers about AI systems used in employment decisions and maintain an ethical-use policy. It also regulates IoT,
  3D printing, blockchain and unmanned aircraft.
scope_summary: >-
  Public-sector bodies deploying AI in Greece and medium/large private employers using AI in employment; complements the
  EU AI Act.
