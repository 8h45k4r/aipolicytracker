slug: china-measures-for-labeling-artificial-intelligence-generated-and-synthetic-content-2
jurisdiction: china
title: Measures for Labeling Artificial Intelligence-Generated and Synthetic Content
short_title: Measures for Labeling Artificial Intelligence-Generated and Synthetic Content
instrument_type: regulation
status: in_force
is_binding: true
featured: false
published: true
issuing_body: Cyberspace Administration of China with MIIT, Ministry of Public Security and NRTA
summary_plain: >-
  These measures require providers of AI generation and synthesis services to attach explicit labels (visible text,
  audio or graphic notices) and implicit labels (embedded metadata) to generated text, images, audio, video and
  virtual scenes. Platforms distributing content must check for and preserve labels, users must declare AI-generated
  material, and removing or forging labels is prohibited. Compliance is checked during algorithm filing and security
  assessments. The measures took effect on 1 September 2025.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Cyberspace Administration of China with MIIT,
  Ministry of Public Security and NRTA. Oversight: Cyberspace Administration of China coordinates; enforced through
  algorithm filing and security assessment processes. Stated purpose: Make AI-generated content identifiable to
  counter misinformation and misuse.
