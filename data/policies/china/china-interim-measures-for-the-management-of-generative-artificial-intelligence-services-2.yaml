title: Interim Measures for the Management of Generative Artificial Intelligence Services
short_title: Interim Measures for the Management of Generative Artificial Intelligence Services
instrument_type: regulation
status: in_force
status_note: >-
  Document is dated 10 July 2023 and was published on the CAC site on 13 July 2023; the publication date is used
  as the announcement date.
is_binding: true
featured: false
published: true
issuing_body: >-
  Cyberspace Administration of China with NDRC, Ministry of Education, MOST, MIIT, Ministry of Public Security and
  NRTA
summary_plain: >-
  These measures govern generative AI services offered to the public in China, whether producing text, images, audio
  or video. Providers must use lawfully sourced training data, take steps against discrimination, protect personal
  information, label generated content, handle user complaints and ensure outputs comply with content rules. Services
  with public-opinion or social-mobilisation capacity must complete security assessments and algorithm filing. The
  measures took effect on 15 August 2023.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Cyberspace Administration of China with NDRC,
  Ministry of Education, MOST, MIIT, Ministry of Public Security and NRTA. Oversight: Cyberspace Administration
  of China leads; sectoral ministries supervise within their remits. Stated purpose: Regulate public-facing generative
  AI to control content risks while supporting industry development.
key_dates_summary: >-
  2023-07-13: Measures published (Order No. 15, dated 10 July 2023); 2023-08-15: Measures enter into force
