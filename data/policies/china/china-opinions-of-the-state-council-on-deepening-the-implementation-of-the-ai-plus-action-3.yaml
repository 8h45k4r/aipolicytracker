summary_plain: >-
  This State Council policy document (Guofa [2025] No. 11) sets national targets for AI adoption: broad integration
  in six priority areas and over 70 percent penetration of intelligent terminals and agents by 2027, over 90 percent
  by 2030, and a fully intelligent economy and society by 2035. It directs actions in science and technology, industry,
  consumption, public welfare, governance and international cooperation, backed by measures on models, data, computing
  infrastructure, talent, law and safety. It succeeds the 2017 New Generation AI Development Plan as the current
  headline national AI strategy.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by State Council of the People's Republic of China.
  Oversight: State Council; implemented by NDRC and line ministries with local governments. Stated purpose: Diffuse
  AI across the economy, public services and governance to drive growth.
