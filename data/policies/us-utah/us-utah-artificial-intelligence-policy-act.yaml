title: Utah Artificial Intelligence Policy Act (SB 149, 2024, as amended by SB 226 and SB 332 in 2025)
short_title: Utah Artificial Intelligence Policy Act (SB 149)
instrument_type: act
status: in_force
is_binding: true
featured: false
published: true
issuing_body: Utah State Legislature
summary_plain: >-
  Effective 1 May 2024, the Act requires a person using generative AI to interact with a consumer in a consumer transaction
  to disclose clearly that the consumer is interacting with AI when asked (as amended in 2025, when the interaction is high-risk
  or on request), and requires providers of regulated occupations (for example health and legal services) to disclose generative-AI
  use proactively. It states that using AI is no defence to consumer-protection violations, created the Office of Artificial
  Intelligence Policy and an AI learning laboratory allowing regulatory mitigation agreements, and originally sunset in
  2025, extended to 2027.
scope_summary: >-
  Businesses using generative AI in consumer transactions in Utah and regulated occupations; enforced by the Division of
  Consumer Protection.
key_dates_summary: >-
  2024-03-13: signed; 2024-05-01: effective; 2025-05-07: SB 226 and SB 332 amendments effective; sunset extended to 2027.
penalties_summary: >-
  Administrative fines of up to USD 2,500 per violation under the Consumer Sales Practices Act, plus court remedies.
