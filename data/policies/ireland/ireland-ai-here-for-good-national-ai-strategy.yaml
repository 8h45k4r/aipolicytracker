summary_plain: >-
  Ireland's national AI strategy, first published in July 2021 and refreshed in November 2024 to reflect the EU AI Act and
  generative AI, is organised around building public trust, leveraging AI for economic and societal benefit, and enablers
  such as data, infrastructure, skills and governance. The refresh sets out Ireland's AI Act implementation model, public-sector
  AI guidelines and an AI advisory council.
