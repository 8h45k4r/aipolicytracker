summary_plain: >-
  Published in October 2023, the roadmap sets a two-stage, bottom-up approach: first voluntary instruments (white paper,
  general and sector recommendations, a self-assessment tool, a code of conduct and regulatory sandboxes) to help businesses
  prepare, then a law on AI harmonised with the EU AI Act, timed with Ukraine's EU accession path.
