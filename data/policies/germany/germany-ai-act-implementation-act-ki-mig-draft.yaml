title: >-
  Entwurf eines Gesetzes zur Durchführung der KI-Verordnung (KI-Marktüberwachungs- und Innovationsförderungsgesetz, KI-MIG)
short_title: AI Act implementation act (KI-MIG, draft)
instrument_type: bill
status: proposed
status_note: >-
  Draft act published for consultation in 2025; parliamentary adoption not confirmed from an official source at the time
  of checking.
is_binding: true
featured: false
published: true
issuing_body: Federal Ministry for Digital and State Modernisation
summary_plain: >-
  The draft implementation act designates the Bundesnetzagentur as the central market-surveillance authority and single
  point of contact under the EU AI Act, keeps sector regulators (financial supervision, data protection for law-enforcement
  uses) competent in their fields, sets the national penalty framework within the Regulation's ranges and creates a national
  AI regulatory sandbox and an AI service desk for companies.
scope_summary: >-
  Applies to providers, deployers, importers and distributors of AI systems in Germany as far as the EU AI Act reaches them;
  it allocates supervision rather than adding new substantive duties.
date_notes: Draft stage; dates to be confirmed once adopted.
