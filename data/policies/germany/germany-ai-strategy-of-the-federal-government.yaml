summary_plain: >-
  The federal AI strategy, adopted in November 2018 and updated in December 2020, sets out how Germany intends to make AI
  research, transfer and use competitive while anchoring AI in fundamental rights and the common good. The 2020 update raised
  planned federal funding to around EUR 5 billion to 2025 and added priorities on pandemic response, sustainability, health,
  mobility and AI in the public sector. It commits to a European approach to AI regulation and to trustworthy-AI standards.
scope_summary: >-
  Applies to federal government action: research funding, transfer programmes, skills, infrastructure and public-sector
  use. It creates no obligations for private organisations.
