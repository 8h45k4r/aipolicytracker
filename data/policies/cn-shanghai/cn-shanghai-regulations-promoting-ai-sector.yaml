summary_plain: >-
  Promotes the AI industry and names the economy and informatization department as lead regulator; sets up a strategy advisory
  committee and an AI ethics expert committee; bans certain uses such as discrimination and algorithmic price discrimination;
  applies list-based compliance review to high-risk AI products and disclosure with after-the-fact control to lower-risk ones;
  and allows sandbox supervision.
scope_summary: Government bodies and AI market actors in Shanghai.
who_it_applies_to: AI developers, providers and users in Shanghai, and municipal authorities.
