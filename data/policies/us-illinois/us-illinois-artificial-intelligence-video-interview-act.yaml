title: Illinois Artificial Intelligence Video Interview Act (820 ILCS 42)
short_title: Illinois AI Video Interview Act
instrument_type: act
status: in_force
is_binding: true
featured: false
published: true
issuing_body: Illinois General Assembly
summary_plain: >-
  In force since 1 January 2020, the Act requires employers that use AI to analyse video interviews of applicants for Illinois-based
  positions to notify applicants, explain how the AI works and what characteristics it evaluates, obtain consent, limit
  sharing of videos, and delete videos on request within 30 days; a 2022 amendment requires employers relying solely on
  AI to decide who gets an in-person interview to report demographic data annually.
scope_summary: Employers using AI analysis of video interviews for positions based in Illinois.
