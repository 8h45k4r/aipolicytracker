summary_plain: >-
  No one may provide therapy or psychotherapy in Illinois, including through AI, unless it is delivered by a licensed professional.
  AI may be used only for administrative and supplementary support, with notice to and consent from the client. The Department
  of Financial and Professional Regulation enforces it.
scope_summary: Therapy and psychotherapy services offered to people in Illinois, including AI-based services.
who_it_applies_to: >-
  Providers of therapy or psychotherapy services, including AI products marketed as therapy, and licensed professionals who
  use AI tools.
key_dates_summary: Approved and effective 1 August 2025.
penalties_summary: Fines of up to $10,000, per the Department's announcement.
