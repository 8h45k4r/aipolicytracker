summary_plain: >-
  This act amends the bullying-prevention section of the Illinois School Code (105 ILCS 5/27-23.7). From the 2026-2027
  school year, cyberbullying also covers posting or distributing an unauthorised digital replica of a person by
  electronic means where it has any of the effects that define bullying. An unauthorised digital replica is one used
  without the depicted person's consent, with "digital replica" taking its meaning from the Digital Voice and Likeness
  Protection Act. Schools apply the definition through their existing bullying policies.
scope_summary: >-
  Illinois schools and school districts covered by the School Code's bullying-prevention section, and their students.
who_it_applies_to: Illinois school districts and schools covered by 105 ILCS 5/27-23.7.
key_dates_summary: >-
  Approved by the Governor on 15 August 2025; effective 1 July 2026; digital replica provision applies from the 2026-2027
  school year.
