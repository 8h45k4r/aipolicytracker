summary_plain: >-
  Illinois's frontier-AI safety and transparency law, built on the model of California SB 53: large frontier developers must
  publish a frontier AI framework and update it every year, publish a transparency report when they deploy a new or substantially
  modified frontier model, report critical safety incidents to the Illinois Emergency Management Agency and Office of Homeland
  Security, and protect whistleblowing employees. Unlike the California and New York laws, it also requires annual independent
  third-party audits, with a published summary.
scope_summary: >-
  A "frontier model" is a foundation model trained with more than 10^26 operations, counting fine-tuning and other material
  modifications; a "large frontier developer" also had more than $500 million in annual gross revenue in the prior year, with
  affiliates. Ordinary deployers of AI systems are not covered.
who_it_applies_to: Large frontier-model developers whose models are made available in Illinois.
key_dates_summary: >-
  Became Public Act 104-0538 on 6 July 2026 (bill status page); reported effective 1 January 2027; third-party audits from
  1 January 2028, or 90 days after a developer first qualifies, whichever is later.
penalties_summary: >-
  Civil penalties of up to $1,000,000 for a first violation, per extracts of the enacted text; a higher cap for later violations
  appears only in secondary reporting.
