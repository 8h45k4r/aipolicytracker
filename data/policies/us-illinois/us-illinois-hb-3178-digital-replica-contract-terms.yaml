issuing_body: Illinois General Assembly
summary_plain: >-
  This act amends Section 10 of the Illinois Digital Voice and Likeness Protection Act (815 ILCS 550/10). For new
  performances fixed on or after 1 January 2026, a contract term allowing a digital replica of a person's voice or
  likeness to be made and used in place of work they would have done in person is unenforceable where it lacks a
  reasonably specific description of the intended uses and the person had neither legal counsel nor union representation
  covering digital replicas. A missing description does not void the term where the uses match the contract and the
  fundamental character of the recording or performance.
scope_summary: >-
  Contracts in Illinois that permit the creation and use of digital replicas of an individual's voice or likeness for new
  performances.
who_it_applies_to: Organisations that contract with performers and other individuals for digital replicas of their voice or likeness.
key_dates_summary: Approved by the Governor on 15 August 2025; effective 1 January 2026.
what_organizations_must_do: >-
  Describe the intended uses of a digital replica with reasonable specificity in contracts, unless the individual is
  represented by counsel or by a union whose collective agreement covers digital replicas.
