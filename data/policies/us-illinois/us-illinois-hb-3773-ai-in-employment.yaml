slug: us-illinois-hb-3773-ai-in-employment
jurisdiction: us-illinois
title: >-
  Illinois Public Act 103-0804 (HB 3773): Artificial intelligence in employment decisions – amendment to the Illinois Human
  Rights Act
short_title: Illinois HB 3773 (AI in employment, Human Rights Act amendment)
instrument_type: act
status: in_force
is_binding: true
featured: false
published: true
issuing_body: Illinois General Assembly
summary_plain: >-
  Signed 9 August 2024 and effective 1 January 2026, the Act makes it a civil-rights violation for an employer to use artificial
  intelligence in recruitment, hiring, promotion, discipline, discharge or other terms of employment in a way that subjects
  employees to discrimination on the basis of protected classes, or to use zip codes as a proxy for protected classes. Employers
  must notify employees when AI is used for such decisions; the Department of Human Rights is to adopt rules on notice.
scope_summary: >-
  Employers covered by the Illinois Human Rights Act using AI in employment decisions affecting Illinois employees and applicants.
