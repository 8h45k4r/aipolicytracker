- slug: us-texas-responsible-ai-governance-act-traiga-health-care-ai-disclosure
  title: Health-care providers must disclose the use of AI in patient services
  category: transparency
  source_reference: "Business and Commerce Code Section 551.051"
  is_binding: true
  applies_from: 2026-01-01
  actors: [deployer]
  sectors: [healthcare]
  use_cases: [health, customer_service]
  summary: >
    A person who provides health-care services or treatment and uses an AI system in relation to those services
    must disclose that use to the patient, or to the patient's personal representative or guardian, no later than
    the date the service or treatment is first provided, with an exception for emergencies where the disclosure
    is made as soon as reasonably possible. The disclosure must be clear, conspicuous and in plain language.
  practical_action: >
    Add an AI-use statement to intake and consent materials for services that use AI, with an emergency-follow-up rule.
  applicability:
    description: Health-care service and treatment providers in Texas that use AI in relation to patient services.
    actors: [deployer]
    risk_categories: [transparency_risk, high_risk]
    source_reference: "Business and Commerce Code Section 551.051"
  evidence_examples:
    - { title: Patient AI-use disclosure in intake or consent documents, artifact_type: document }
  framework_mappings:
    - { framework: nist_ai_rmf, reference: "GOVERN 5.1, MANAGE 4.1", note: "Transparency to affected individuals.", confidence_level: medium }
    - { framework: iso_42001, reference: "Annex A.8.5", note: "Information for interested parties.", confidence_level: medium }
  controls:
    - { control: ai-interaction-and-use-disclosure, relationship: satisfies, note: "Patient-facing disclosure before first service.", confidence_level: high }
    - { control: ai-system-inventory, relationship: supports, note: "Identifies clinical and administrative systems that use AI.", confidence_level: medium }
  official_source_url: https://capitol.texas.gov/BillLookup/History.aspx?LegSess=89R&Bill=HB149
