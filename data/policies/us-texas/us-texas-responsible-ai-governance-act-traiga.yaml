faq:
- question: Does TRAIGA require impact assessments like Colorado?
  answer: >-
    No. TRAIGA focuses on prohibited intents and government disclosure rather than a duty of care for high-risk systems;
    the earlier draft with broader duties was narrowed before enactment.
