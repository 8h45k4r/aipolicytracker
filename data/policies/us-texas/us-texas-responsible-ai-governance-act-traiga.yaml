- slug: us-texas-responsible-ai-governance-act-traiga-government-biometric-identification-prohibition
  title: Governmental entities must not use AI for biometric identification from public data without consent where it infringes rights
  category: prohibited_practice
  source_reference: "Business and Commerce Code Section 551.054"
  is_binding: true
  applies_from: 2026-01-01
  actors: [public_authority]
  sectors: [public_services, law_enforcement]
  use_cases: [biometrics, law_enforcement]
  summary: >
    A governmental entity may not develop or deploy an AI system for the purpose of uniquely identifying a specific
    individual using biometric data, or of gathering images or other media from the internet or another public
    source without the individual's consent, where doing so would infringe a right guaranteed under the United
    States or Texas constitutions or violate state or federal law. The Act preserves lawful uses that comply with
    existing biometric-privacy law.
  practical_action: >
    Require legal sign-off on lawful basis and constitutional review before any agency biometric-matching or public-image scraping project.
  applicability:
    description: Texas governmental entities using AI for biometric identification or collection of public images.
    actors: [public_authority]
    risk_categories: [prohibited, high_risk]
    source_reference: "Business and Commerce Code Section 551.054"
  evidence_examples:
    - { title: Legal review of biometric AI use, artifact_type: record }
  framework_mappings:
    - { framework: nist_ai_rmf, reference: "GOVERN 1.1, MEASURE 2.10", note: "Legal requirements and privacy risk.", confidence_level: medium }
    - { framework: iso_42001, reference: "Annex A.5.2, A.7.3", note: "Impact assessment and data acquisition.", confidence_level: medium }
  controls:
