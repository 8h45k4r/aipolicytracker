- slug: us-texas-responsible-ai-governance-act-traiga-government-agency-ai-interaction-disclosure
  title: Government agencies must disclose to consumers that they are interacting with an AI system
  category: transparency
  source_reference: "Business and Commerce Code Section 551.051"
  is_binding: true
  applies_from: 2026-01-01
  actors: [public_authority, deployer]
  sectors: [public_services]
  use_cases: [public_services, customer_service, generative_ai]
  summary: >
    A governmental agency that makes an AI system available to interact with consumers must disclose to each
    consumer, before or at the time of the interaction, that they are interacting with an AI system. The
    disclosure is owed even where the AI nature of the interaction would be obvious, must be clear and
    conspicuous, written in plain language and may not use a dark pattern; a hyperlink to the disclosure is
    acceptable for online services.
  practical_action: >
    Put a plain-language AI notice at the entry point of every public-facing chatbot, voice line or automated service and keep a screenshot record.
  applicability:
    description: Texas state agencies and other governmental agencies that offer consumer-facing AI systems.
    actors: [public_authority, deployer]
    risk_categories: [transparency_risk]
    source_reference: "Business and Commerce Code Section 551.051"
  evidence_examples:
