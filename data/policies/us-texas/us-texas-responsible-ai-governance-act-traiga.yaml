- slug: us-texas-responsible-ai-governance-act-traiga-government-social-scoring-prohibition
  title: Governmental entities must not use AI for social scoring
  category: prohibited_practice
  source_reference: "Business and Commerce Code Section 551.053"
  is_binding: true
  applies_from: 2026-01-01
  actors: [public_authority]
  sectors: [public_services, law_enforcement]
  use_cases: [public_services, law_enforcement]
  summary: >
    A governmental entity may not develop or deploy an AI system that evaluates or classifies natural persons or
    groups on the basis of their social behaviour or personal characteristics, with the intent to calculate or
    assign a social score or similar valuation that leads to detrimental or unfavourable treatment unrelated to the
    context in which the data was collected, or that is unjustified or disproportionate to the behaviour.
  practical_action: >
    Screen agency scoring, eligibility and risk-ranking tools for social-scoring characteristics before procurement or build.
  applicability:
    description: Texas governmental entities developing or deploying AI that scores or classifies people.
    actors: [public_authority]
    risk_categories: [prohibited]
    source_reference: "Business and Commerce Code Section 551.053"
  evidence_examples:
