- slug: us-texas-responsible-ai-governance-act-traiga-unlawful-discrimination-prohibition
  title: Developers and deployers must not use AI with the intent to unlawfully discriminate against a protected class
  category: prohibited_practice
  source_reference: "Business and Commerce Code Section 551.056"
  is_binding: true
  applies_from: 2026-01-01
  actors: [provider, deployer, public_authority]
  sectors: [cross_sector, employment, financial_services, public_services]
  use_cases: [hiring_and_hr, finance_and_credit, public_services]
  summary: >
    A person may not develop or deploy an AI system with the intent to unlawfully discriminate against a protected
    class in violation of state or federal law. A disparate impact on a protected class is not, by itself,
    sufficient to show an intent to discriminate, and insurers and financial institutions acting under their own
    regulatory regimes are treated separately.
  practical_action: >
    Document the non-discriminatory purpose of each decision system and keep fairness testing evidence that shows there was no intent to discriminate.
  applicability:
    description: Any person developing or deploying AI systems affecting Texas residents; intent, not effect, is the test.
    actors: [provider, deployer, public_authority]
    risk_categories: [prohibited]
    source_reference: "Business and Commerce Code Section 551.056"
  evidence_examples:
    - { title: Purpose statement and fairness testing record, artifact_type: record }
  framework_mappings:
