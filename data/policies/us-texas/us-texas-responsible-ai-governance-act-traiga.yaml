- slug: us-texas-responsible-ai-governance-act-traiga-sexual-content-and-csam-prohibition
  title: Developers and distributors must not build AI intended to produce child sexual abuse material or unlawful sexual deepfakes
  category: prohibited_practice
  source_reference: "Business and Commerce Code Section 551.057"
  is_binding: true
  applies_from: 2026-01-01
  actors: [provider, distributor, deployer]
  sectors: [cross_sector, media_information]
  use_cases: [generative_ai, content_moderation]
  summary: >
    A person may not develop or distribute an AI system with the sole intent of producing, assisting or aiding in
    producing, or distributing child pornography or unlawful deep-fake videos or images, including sexually
    explicit deepfakes of a person without consent, or of engaging in sexually explicit text-based conversations
    while impersonating or imitating a child, in violation of the Texas Penal Code.
  practical_action: >
    Enforce content-safety filters and abuse-detection on generative products and record the intended purpose of any image or chat model at release.
  applicability:
    description: Developers and distributors of generative AI systems available in Texas.
    actors: [provider, distributor, deployer]
    risk_categories: [prohibited]
    source_reference: "Business and Commerce Code Section 551.057"
  evidence_examples:
    - { title: Content-safety policy and filter test results, artifact_type: report }
    - { title: Prohibited-use screening record, artifact_type: record }
