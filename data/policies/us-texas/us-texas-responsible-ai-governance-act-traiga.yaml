- slug: us-texas-responsible-ai-governance-act-traiga-manipulation-prohibition
  title: Developers and deployers must not use AI to incite self-harm, harm to others or crime
  category: prohibited_practice
  source_reference: "Business and Commerce Code Section 551.052"
  is_binding: true
  applies_from: 2026-01-01
  actors: [provider, deployer]
  sectors: [cross_sector, media_information, consumer_retail]
  use_cases: [generative_ai, content_moderation, customer_service]
  summary: >
    A person may not develop or deploy an AI system in a manner that intentionally aims to incite or encourage a
    person to commit physical self-harm, including suicide, to harm another person, or to engage in criminal
    activity. The prohibition turns on the developer's or deployer's intent rather than on the system's effects,
    which is the pattern followed throughout the Act's prohibited-use provisions.
  practical_action: >
    Record the intended purpose of each system at design review and add safety testing for self-harm and violence content in conversational products.
  applicability:
    description: Any person developing or deploying AI systems in Texas or for Texas residents.
    actors: [provider, deployer]
    risk_categories: [prohibited]
    source_reference: "Business and Commerce Code Section 551.052"
  evidence_examples:
    - { title: Intended-purpose statement and prohibited-use screening record, artifact_type: record }
    - { title: Safety evaluation for self-harm and violence content, artifact_type: report }
  framework_mappings:
    - { framework: nist_ai_rmf, reference: "GOVERN 1.1, MAP 1.1, MEASURE 2.6", note: "Legal requirements, intended purpose and safety evaluation.", confidence_level: medium }
    - { framework: iso_42001, reference: "Annex A.9.4, A.6.1.2", note: "Intended use and system objectives.", confidence_level: medium }
  controls:
