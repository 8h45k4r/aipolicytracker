jurisdiction: us-texas
title: Texas Responsible Artificial Intelligence Governance Act (HB 149, 89th Legislature)
short_title: Texas Responsible AI Governance Act (TRAIGA)
instrument_type: act
status: in_force
is_binding: true
featured: true
published: true
issuing_body: Texas Legislature
summary_plain: >-
  Signed on 22 June 2025 and effective 1 January 2026, TRAIGA bans developing or deploying AI systems intended to manipulate
  people into self-harm or crime, government social scoring, biometric identification by government from public data without
  consent, intentional unlawful discrimination against protected classes, and production of child sexual abuse material
  or unlawful sexual deepfakes. State agencies and health-care providers must disclose AI interactions. It creates a 36-month
  regulatory sandbox administered by the Department of Information Resources, a Texas Artificial Intelligence Council, and
  gives the Attorney General exclusive enforcement with civil penalties after a 60-day cure period; disparate impact alone
  does not prove intent to discriminate.
scope_summary: >-
  Persons doing business in Texas, producing products used by Texans, or developing or deploying AI systems in Texas, plus
  state agencies; no private right of action.
who_it_applies_to: >-
  Developers and deployers of AI systems in Texas; state agencies; health-care providers using AI with patients.
key_dates_summary: '2025-06-22: signed by the Governor; 2026-01-01: effective date.'
penalties_summary: >-
  Civil penalties of USD 10,000 to 12,000 per curable violation, 80,000 to 200,000 per uncurable violation and 2,000 to
  40,000 per day for continuing violations, enforced by the Attorney General after notice and a 60-day cure period.
what_organizations_must_do: >-
  Screen AI uses against the prohibited-intent categories, add disclosure where the entity is a state agency or health-care
  provider, document intent and testing to use the statutory defences (NIST AI RMF alignment, red-teaming, cure), and consider
  the sandbox for novel uses.
