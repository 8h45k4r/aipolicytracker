summary_plain: >-
  Sets out what the Texas Department of Insurance expects of every entity it regulates that develops, buys or uses
  artificial intelligence. Decisions supported by AI must meet the same legal standards as any other decision, so they
  must not be inaccurate, arbitrary, capricious or unfairly discriminatory under unfair trade practice law. The
  department expects a person to review and agree with consequential AI decisions before action is taken, encourages
  testing for errors and bias, and points to the insurance commissioners' 2020 AI principles as a guide.
scope_summary: >-
  All entities regulated by the Texas Department of Insurance, and third parties working with them, that develop,
  acquire or use AI.
who_it_applies_to: Insurers and other TDI-regulated entities, and their third-party AI suppliers.
key_dates_summary: Issued on 12 June 2026; the bulletin page shows a later update on 16 July 2026.
what_organizations_must_do: >-
  The department expects organisations in scope to govern their AI use so that decisions comply with existing
  insurance law, to have a person review and agree with consequential AI decisions before acting on them, and to test
  AI for errors and bias.
