summary_plain: >-
  Stops utilization review agents in Texas from using an automated decision system, including artificial
  intelligence, to make an adverse determination about health care in whole or in part. The Insurance Commissioner may
  audit and inspect how agents use these systems at any time. Algorithms and AI used for administrative support or for
  fraud detection are outside the ban.
scope_summary: >-
  Utilization review agents reviewing care under health benefit plans delivered, issued or renewed in Texas on or
  after 1 January 2026.
who_it_applies_to: Utilization review agents and the health benefit plans that use them in Texas.
key_dates_summary: >-
  Signed on 20 June 2025; effective 1 September 2025; applies to plans delivered, issued or renewed on or after
  1 January 2026.
what_organizations_must_do: >-
  Organisations in scope must not use an automated decision system to make, wholly or partly, an adverse
  determination in utilization review, and must make their use of such systems available for audit and inspection by
  the Insurance Commissioner.
