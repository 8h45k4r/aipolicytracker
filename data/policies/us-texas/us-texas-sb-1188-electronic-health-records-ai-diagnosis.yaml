summary_plain: >-
  A general law on electronic health records that also deals with artificial intelligence. It requires records holding
  patient information to be kept physically in the United States, limits what may be collected in them and adds a
  biological sex field. Health care practitioners may use AI for diagnostic purposes, such as suggesting a diagnosis
  or course of treatment from a patient's record, if they are licensed for that care and the use is otherwise lawful,
  and they must tell their patients that they use it.
scope_summary: >-
  Health care practitioners and other covered entities in Texas that maintain electronic health records, including
  practitioners who use AI for diagnosis.
who_it_applies_to: Texas health care practitioners and covered entities holding electronic health records.
key_dates_summary: Signed by the Governor on 20 June 2025; effective 1 September 2025.
what_organizations_must_do: >-
  Practitioners who use AI for diagnostic purposes must act within the scope of their licence and other law and must
  disclose that use to their patients; whether AI-created records must also be reviewed is described differently in
  the extracts and needs checking against the enrolled text.
