slug: russia-federal-law-123-fz-moscow-ai-experimental-regime
jurisdiction: russia
title: >-
  Federal Law No. 123-FZ of 24 April 2020 on an experiment to establish special regulation to create the conditions for
  the development and implementation of AI technologies in Moscow
short_title: Federal Law 123-FZ (Moscow AI experimental regime)
instrument_type: act
status: in_force
is_binding: true
featured: false
published: true
issuing_body: Federal Assembly of the Russian Federation
summary_plain: >-
  Establishes a five-year experimental legal regime in Moscow (from 1 July 2020) allowing participants to develop and deploy
  AI technologies under special rules, including processing of anonymised personal data for AI purposes, coordinated by
  the Moscow government with a register of participants. It was accompanied by amendments to the personal-data law.
scope_summary: Registered participants of the experiment in the city of Moscow.
