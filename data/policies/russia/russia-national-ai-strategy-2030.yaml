summary_plain: >-
  The national strategy sets goals for AI research, compute, data, talent and adoption across the economy and public administration
  to 2030, with the 2024 amendment adding targets on domestic compute capacity, large generative models, share of organisations
  using AI, and trusted-AI requirements for the public sector. It is implemented through the federal "Artificial Intelligence"
  project.
