summary_plain: >-
  Disposición 2/2023 approves a set of recommendations for trustworthy AI addressed to projects designed, developed
  or adopted by the national public sector, together with a diagram of the stages of an AI project. Aligned with
  the UNESCO Recommendation on the Ethics of AI, it emphasises human-centred design, transparency, human oversight,
  non-discrimination, data protection and accountability across the project lifecycle. It is guidance rather than
  a binding regulatory regime.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Subsecretaría de Tecnologías de la Información,
  Jefatura de Gabinete de Ministros. Oversight: Public-sector bodies apply the recommendations to their own AI projects.
  Stated purpose: Ethical guidance for AI projects in the national public administration.
