title: >-
  Decisión Administrativa 899/2024 – Mesa Interministerial sobre Inteligencia Artificial (Administrative Decision
  899/2024 – Interministerial Board on Artificial Intelligence)
short_title: Decisión Administrativa 899/2024
instrument_type: regulation
status: in_force
status_note: >-
  Signed 20 September 2024, published 24 September 2024. The original 2023 administrative decision creating the
  board was not separately fetched.
is_binding: true
featured: false
published: true
issuing_body: Jefatura de Gabinete de Ministros
summary_plain: >-
  This administrative decision restructures the Interministerial Board on AI originally created in 2023, placing
  it under the presidency of the Secretariat of Innovation, Science and Technology and expanding its membership
  to ministries including Defence, Economy, Foreign Affairs, Health, Security, Human Capital, Justice and State
  Deregulation. The board is tasked with coordinating the government's approach to AI adoption across economic and
  social sectors and with developing national strategies. Argentina has not yet adopted a standalone national AI
  strategy or a binding AI law.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Jefatura de Gabinete de Ministros. Oversight:
  Board chaired by the Secretaría de Innovación, Ciencia y Tecnología, co-coordinated with the Secretaría de Asuntos
  Estratégicos, with ministry members. Stated purpose: Coordinate national AI policy across ministries.
