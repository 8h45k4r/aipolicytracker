title: >-
  Strengthening Cyber Security and Building Trust in the Public Sector Act, 2024 (Bill 194), Schedule 1: Enhancing Digital
  Security and Trust Act, 2024
short_title: Ontario Enhancing Digital Security and Trust Act, 2024 (Bill 194)
instrument_type: act
status: adopted
status_note: >-
  Royal assent 25 November 2024; AI provisions come into force by proclamation and depend on regulations that set disclosure,
  accountability and risk-management requirements.
is_binding: true
featured: false
published: true
issuing_body: Legislative Assembly of Ontario
summary_plain: >-
  The Act allows the Ontario government to make regulations governing the use of AI systems by public-sector entities (ministries,
  agencies, hospitals, school boards, municipalities as prescribed): requirements to disclose AI use, to develop and implement
  accountability frameworks, to take steps to manage risks, to have human oversight, and prohibitions on prescribed uses.
  It also addresses cyber security and children's digital information.
scope_summary: Ontario public-sector entities as prescribed by regulation; not private organisations.
