title: >-
  Working for Workers Four Act, 2024 (Bill 149): disclosure of artificial intelligence use in publicly advertised job postings
short_title: Ontario Working for Workers Four Act (AI disclosure in job postings)
instrument_type: act
status: in_force
is_binding: true
featured: false
published: true
issuing_body: Legislative Assembly of Ontario
summary_plain: >-
  Amends the Employment Standards Act, 2000 to require employers with 25 or more employees to disclose in every publicly
  advertised job posting whether artificial intelligence is used to screen, assess or select applicants, alongside new rules
  on salary ranges and Canadian-experience requirements. The AI disclosure requirement is in force from 1 January 2026.
scope_summary: Employers in Ontario with 25 or more employees publishing public job postings.
