summary_plain: >-
  The Commonwealth Office of Technology must create an AI Governance Committee, write AI policy and technology standards,
  and keep a registry of generative and high-risk AI used by state agencies. Agencies must disclose when AI is used in decisions
  about people or businesses and report every year. The act also creates a cause of action over synthetic media in election
  campaigns.
scope_summary: Kentucky state agencies using AI, and synthetic media in election communications.
who_it_applies_to: Kentucky state agencies and the Commonwealth Office of Technology.
