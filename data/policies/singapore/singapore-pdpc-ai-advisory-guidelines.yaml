obligations:
  - slug: singapore-pdpc-consent-or-exception-for-ai-data
    title: Identify consent or an applicable PDPA exception before using personal data in AI
    category: privacy_data_protection
    source_reference: "Advisory guidelines, sections on consent, business improvement and research exceptions"
    is_binding: true
    actors: [provider, deployer]
    sectors: [cross_sector]
    use_cases: [finance_and_credit, customer_service]
    summary: >
      Personal data used to train or operate AI systems requires consent unless an exception applies, such as the
      business improvement exception for improving products and services or the research exception for developing
      models, each subject to conditions.
    practical_action: Map AI data uses to consent or a specific exception and record the conditions met.
    applicability:
      description: PDPA-regulated organisations using personal data in AI systems.
      actors: [provider, deployer]
    evidence_examples:
      - { title: Legal basis assessment for AI personal data, artifact_type: record }
    framework_mappings:
      - { framework: iso_42001, reference: "Annex A controls on data for AI systems", note: "Original editorial mapping.", confidence_level: medium }
  - slug: singapore-pdpc-ai-notification
    title: Notify individuals about the use of personal data in AI recommendations and decisions
    category: transparency
    source_reference: "Advisory guidelines, section on notification obligation"
    is_binding: true
    actors: [deployer]
    sectors: [cross_sector]
    use_cases: [customer_service, finance_and_credit]
    summary: >
      Organisations should inform individuals that AI systems use their personal data, the purposes, the relevant
      features and how they influence decisions, proportionate to the impact on the individual.
    practical_action: Add AI-specific disclosures to privacy notices and in-product notifications.
    applicability:
      description: Organisations deploying AI recommendation or decision systems using personal data.
      actors: [deployer]
    evidence_examples:
      - { title: AI notification wording, artifact_type: document }
    framework_mappings:
      - { framework: nist_ai_rmf, reference: "GOVERN 4.x", note: "Original editorial mapping.", confidence_level: medium }
