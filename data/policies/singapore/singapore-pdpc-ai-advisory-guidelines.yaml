slug: singapore-pdpc-ai-advisory-guidelines
jurisdiction: singapore
title: "PDPC Advisory Guidelines on Use of Personal Data in AI Recommendation and Decision Systems"
short_title: PDPC AI advisory guidelines
instrument_type: guidance
status: guidance
is_binding: false
published: true
issuing_body: Personal Data Protection Commission Singapore
summary_plain: >
  These advisory guidelines explain how the Personal Data Protection Act applies when organisations use personal
  data to develop, test and deploy AI systems that make recommendations, predictions or decisions. They clarify the
  consent obligation and relevant exceptions (business improvement and research), what to include in notifications
  to individuals, accountability practices such as documenting data provenance and model development, and
  expectations for service providers building bespoke AI systems.
scope_summary: >
  Organisations subject to the PDPA that use personal data in AI recommendation and decision systems, and service
  providers developing such systems for them. Advisory; not legally binding, but reflects how the PDPC interprets
  binding PDPA obligations.
who_it_applies_to: PDPA-regulated organisations and their AI service providers.
key_dates_summary: Issued 1 March 2024 following a 2023 public consultation.
penalties_summary: Underlying PDPA breaches can attract financial penalties up to 10 % of annual turnover in Singapore or SGD 1 million, whichever is higher.
what_organizations_must_do: >
  Identify the legal basis for using personal data in AI (consent or an exception), provide notification about the
  AI's use of personal data, and document data-protection and governance practices across the AI lifecycle.
