summary_plain: >-
  Accredits third-party firms that test AI systems, in benchmarking and red teaming, for 12 months at a time; the first five
  were AIDX Tech, Knovel Engineering, PwC Singapore, Resaro and Vulcan. Accreditation does not certify that a tester is independent
  or that a tested system is safe.
scope_summary: Firms offering AI testing services, and organisations choosing a tester; voluntary.
who_it_applies_to: AI testing firms; organisations commissioning AI tests.
