summary_plain: >-
  Singapore's second national AI strategy, launched under the banner of AI for the public good. It sets goals of
  excellence and empowerment and organises work across three systems, ten enablers and fifteen actions covering
  talent, compute, data, industry adoption, research and governance. A 2026 update set ten refreshed priorities
  and launched sector AI Missions under the new National AI Council.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Smart Nation Group / Ministry of Digital Development
  and Information. Oversight: National AI Council (chaired by the Prime Minister since 2026) with Smart Nation Group
  and MDDI. Stated purpose: Use AI for the public good while building Singapore into a trusted global AI hub.
