summary_plain: >-
  A voluntary framework and open-source toolkit that organisations can use to test their AI systems against 11 AI
  governance principles, including transparency, explainability, robustness, safety, security and fairness, through
  technical tests and process checks. It does not set ethical standards or certify that a system is free of risk; it helps
  an organisation show, in a verifiable way, that its claims about its own system hold. The 2025 update extended it to
  generative AI, with a published mapping to the US NIST Generative AI Profile.
scope_summary: >-
  Developers and owners of AI systems, in Singapore or elsewhere, that choose to self-assess traditional or generative AI
  systems.
who_it_applies_to: Organisations that develop or deploy AI systems and opt to test them; no legal obligation.
key_dates_summary: Launched 25 May 2022; open-sourced June 2023; generative AI update released 29 May 2025.
