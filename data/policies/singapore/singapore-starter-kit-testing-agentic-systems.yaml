faq:
- question: How does Singapore's agentic AI testing starter kit relate to its governance framework?
  answer: >-
    The Model AI Governance Framework for Agentic AI (January 2026) sets out how to govern AI agents and said IMDA was developing testing guidelines for them. The starter kit (October 2026) is that testing guidance: it extends the framework and builds on the earlier starter kit for testing LLM-based applications.
- question: Is Anthropic a partner in Singapore's agentic AI testing starter kit?
  answer: >-
    No source on the kit names Anthropic. On the same day, 14 October 2026, Anthropic signed a separate memorandum of understanding with Singapore's Ministry of Digital Development and Information on AI safety, security and model evaluation. The kit was reported as drawing on more than 20 deployers and testers, with Google, AWS and Resaro named.
