summary_plain: >-
  A practical reference for organisations starting to test AI agents that reason, act on a user's behalf, use tools and access
  data. It sets out four steps (identify risks such as erroneous or unauthorised actions; design and run realistic tests without
  real-world harm; analyse results and operational logs; monitor and retest continuously), tests the agent's whole trajectory
  of reasoning and actions rather than only its output, and suggests metrics such as tool-use accuracy, handoff accuracy and
  human-intervention rates. It extends the agentic AI governance framework and builds on the LLM starter kit.
scope_summary: Organisations testing agentic AI systems; presented as guidance, with no legal force of its own.
