summary_plain: >-
  Voluntary guidelines for testing applications built on large language models against five risks: hallucination and inaccuracy,
  bias in decision-making, undesirable content, data leakage and adversarial prompts. Baseline tests are available on Project
  Moonshot.
scope_summary: Organisations building or deploying LLM-based applications; voluntary.
who_it_applies_to: Developers, deployers and testers of LLM-based applications.
