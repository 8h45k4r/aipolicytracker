summary_plain: >-
  A governance framework for AI agents that reason and act on a user's behalf, in four areas: assessing and bounding risks
  upfront, making humans meaningfully accountable, technical controls across the agent lifecycle, and enabling end-user responsibility.
  IMDA treats it as a living document and has since added case studies and input from more than 50 organisations.
scope_summary: Organisations developing or deploying AI agents; voluntary guidance with no legal force of its own.
who_it_applies_to: Developers and deployers of agentic AI systems in Singapore and elsewhere.
