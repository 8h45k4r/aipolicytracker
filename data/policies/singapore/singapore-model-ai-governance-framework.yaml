obligations:
  - slug: singapore-mgf-internal-governance
    title: Establish internal governance structures and measures for AI
    category: governance_accountability
    source_reference: "Second edition, Part on internal governance structures and measures"
    is_binding: false
    actors: [provider, deployer]
    sectors: [cross_sector]
    use_cases: [generative_ai, finance_and_credit]
    summary: >
      Organisations should adapt existing governance to AI: clear roles and responsibilities, board and senior
      management oversight, risk-management and internal controls, and staff training.
    practical_action: Assign an AI governance owner and add AI risks to the enterprise risk register.
    applicability:
      description: Voluntary for any organisation deploying AI.
      actors: [provider, deployer]
    evidence_examples:
      - { title: AI governance structure document, artifact_type: document }
    framework_mappings:
      - { framework: iso_42001, reference: "Clause 5 Leadership", note: "Original editorial mapping.", confidence_level: high }
      - { framework: nist_ai_rmf, reference: "GOVERN 2.x", note: "Original editorial mapping.", confidence_level: high }
    controls:
      - { control: ai-governance-policy-and-accountability, relationship: satisfies, note: "Roles, board oversight and internal controls for AI.", confidence_level: high }
      - { control: ai-literacy-and-role-based-training, relationship: supports, note: "Staff training component.", confidence_level: medium }
      - { control: ai-risk-assessment, relationship: supports, note: "Adding AI risks to enterprise risk management.", confidence_level: medium }
  - slug: singapore-mgf-human-involvement
    title: Determine the appropriate level of human involvement in AI decisions
    category: human_oversight
    source_reference: "Second edition, Part on human involvement in AI-augmented decision-making"
    is_binding: false
    actors: [deployer]
    sectors: [cross_sector]
    use_cases: [finance_and_credit, customer_service, hiring_and_hr]
    summary: >
      Using a risk-impact matrix (probability and severity of harm), organisations choose human-in-the-loop,
      human-over-the-loop or human-out-of-the-loop designs and document the rationale.
    practical_action: Record the human-involvement choice and rationale for each AI decision point.
    applicability:
      description: Voluntary for any organisation deploying AI for decisions.
      actors: [deployer]
    evidence_examples:
      - { title: Risk-impact assessment and human-involvement decision, artifact_type: record }
    framework_mappings:
      - { framework: nist_ai_rmf, reference: "GOVERN 3.2, MANAGE 2.x", note: "Original editorial mapping.", confidence_level: medium }
    controls:
      - { control: human-oversight-and-override, relationship: satisfies, note: "Records the in-the-loop, over-the-loop or out-of-the-loop choice and rationale.", confidence_level: high }
      - { control: ai-risk-assessment, relationship: supports, note: "Probability and severity of harm drive the involvement level.", confidence_level: medium }
  - slug: singapore-mgf-operations-management
    title: Manage data quality, model development and monitoring across the lifecycle
    category: data_governance
    source_reference: "Second edition, Part on operations management"
    is_binding: false
    actors: [provider, deployer]
    sectors: [cross_sector]
    use_cases: [generative_ai, finance_and_credit]
    summary: >
      Covers data lineage and quality, minimising bias in datasets, model explainability, repeatability, robustness,
      regular tuning and active monitoring after deployment.
    practical_action: Maintain data lineage records and a model monitoring plan.
    applicability:
      description: Voluntary for any organisation building or deploying AI.
      actors: [provider, deployer]
    evidence_examples:
      - { title: Data lineage and model monitoring records, artifact_type: record }
    framework_mappings:
      - { framework: iso_42001, reference: "Clause 8 Operation; Annex A data controls", note: "Original editorial mapping.", confidence_level: medium }
    controls:
      - { control: data-governance-and-dataset-documentation, relationship: satisfies, note: "Data lineage and dataset bias minimisation.", confidence_level: medium }
      - { control: post-market-monitoring-and-drift-detection, relationship: satisfies, note: "Active monitoring and regular tuning after deployment.", confidence_level: medium }
      - { control: accuracy-robustness-security-testing, relationship: supports, note: "Repeatability and robustness evidence before release.", confidence_level: medium }
  - slug: singapore-mgf-genai-incident-reporting-and-provenance
    title: Report incidents and mark AI-generated content (generative AI framework)
    category: transparency
    source_reference: "Generative AI framework, dimensions on incident reporting and content provenance"
    is_binding: false
    actors: [provider, deployer, gpai_provider]
    sectors: [cross_sector, media_information]
    use_cases: [generative_ai, content_moderation]
    summary: >
      The generative-AI framework recommends incident-reporting channels and processes for AI harms, and content
      provenance measures such as digital watermarking and cryptographic provenance so that users can identify
      AI-generated content.
    practical_action: Implement provenance markers for generated media and an AI incident reporting channel.
    applicability:
      description: Voluntary for developers and deployers of generative AI.
      actors: [provider, deployer, gpai_provider]
    evidence_examples:
      - { title: Content provenance implementation record, artifact_type: document }
    framework_mappings:
      - { framework: nist_ai_rmf, reference: "NIST AI 600-1 content provenance and incident disclosure", note: "Original editorial mapping.", confidence_level: medium }
    controls:
      - { control: synthetic-content-labelling-and-provenance, relationship: satisfies, note: "Watermarking and cryptographic provenance for generated media.", confidence_level: medium }
      - { control: ai-incident-management-and-reporting, relationship: satisfies, note: "Incident reporting channel and process.", confidence_level: medium }
