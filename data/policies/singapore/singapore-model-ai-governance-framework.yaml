slug: singapore-model-ai-governance-framework
jurisdiction: singapore
title: "Model AI Governance Framework (Second Edition) and Model AI Governance Framework for Generative AI"
short_title: Singapore Model AI Governance Framework
instrument_type: framework
status: voluntary_standard
is_binding: false
featured: true
published: true
issuing_body: Infocomm Media Development Authority and Personal Data Protection Commission; AI Verify Foundation (generative AI edition)
summary_plain: >
  Singapore's Model AI Governance Framework is a voluntary, sector-agnostic guide for organisations deploying AI. The
  second edition (January 2020) covers four areas: internal governance structures and measures, determining the level
  of human involvement in AI-augmented decision-making, operations management (data, model development, monitoring),
  and stakeholder interaction and communication. The May 2024 Model AI Governance Framework for Generative AI extends
  it with nine dimensions including accountability, data, trusted development and deployment, incident reporting,
  testing and assurance, security, content provenance, safety and alignment research, and AI for the public good.
scope_summary: >
  Voluntary; applicable to any organisation developing or deploying AI in Singapore or wishing to align with
  Singapore's expectations. It is referenced by the PDPC and IMDA and underpins the AI Verify testing framework.
who_it_applies_to: Organisations deploying AI (any sector), and developers of generative AI models and applications.
key_dates_summary: First edition January 2019; second edition 21 January 2020; Generative AI framework 30 May 2024.
penalties_summary: None; voluntary.
what_organizations_must_do: >
  Nothing mandatory. Adopters set up governance structures, choose a human-in/over/out-of-the-loop model based on
  risk, manage data quality and model lifecycle, and communicate with users, with additional generative-AI measures.
