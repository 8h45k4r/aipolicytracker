summary_plain: >-
  A set of principles from the Monetary Authority of Singapore for firms offering financial products and services that use
  AI and data analytics in decisions. They are grouped under fairness, ethics, accountability and transparency, and include
  regular review of data and models to limit unintended bias and avoiding decisions that systematically disadvantage
  people without justification. They are not prescriptive and are meant to strengthen firms' own governance, not replace it.
scope_summary: >-
  Firms providing financial products and services in Singapore that use AI or data analytics to support or replace human
  decisions.
who_it_applies_to: Financial institutions and other firms offering financial products and services in Singapore.
key_dates_summary: Announced by MAS on 12 November 2018; the published document was updated on 7 February 2019.
