status_note: >-
  Exact adoption/launch date not stated on official pages; the MASTIC file is dated 19 Oct 2021 and third-party
  trackers cite adoption on 1 Dec 2021, so 2021-12-01 is used as a month-level date. Superseded in 2026 by the Ministry
  of Digital's AI Nation 2030 direction.
is_binding: false
