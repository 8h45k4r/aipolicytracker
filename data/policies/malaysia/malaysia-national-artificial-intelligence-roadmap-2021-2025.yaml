issuing_body: Ministry of Science, Technology and Innovation (MOSTI)
summary_plain: >-
  Malaysia's five-year AI roadmap developed by MOSTI through a quadruple-helix consultation. It sets strategic thrusts
  on governance, R&D, infrastructure, talent and adoption, and identifies national use cases in five priority sectors:
  agriculture and forestry, healthcare, smart cities and transport, education and public services. It is guided
  by responsible AI principles including fairness, transparency, accountability and privacy.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Ministry of Science, Technology and Innovation
  (MOSTI). Oversight: MOSTI with Malaysia Digital Economy Corporation. Stated purpose: Build a national AI innovation
  ecosystem to raise productivity and competitiveness.
key_dates_summary: >-
