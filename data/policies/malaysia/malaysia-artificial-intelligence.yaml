published: true
issuing_body: Ministry of Digital / National AI Office (NAIO)
summary_plain: >-
  A proposed horizontal AI law announced for stakeholder engagement and public consultation by the Ministry of Digital
  through the National AI Office. It takes a risk-based approach across the AI lifecycle, assigns responsibilities
  according to actors' roles, and is intended to complement existing laws rather than regulate AI outputs directly.
  It encourages incident reporting, safeguards and sandboxes, and the government aims to table it in Parliament.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Ministry of Digital / National AI Office (NAIO).
  Oversight: National AI Office under the Ministry of Digital. Stated purpose: Create Malaysia's first horizontal,
  risk-based statutory framework for AI.
key_dates_summary: >-
  2026-07-10: Ministry of Digital begins engagement and public consultation on the AI Governance Bill
