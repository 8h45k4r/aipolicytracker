summary_plain: >-
  Voluntary national guidelines that set out seven principles for responsible AI: fairness; reliability, safety
  and control; privacy and security; inclusiveness; transparency; accountability; and human-centricity. They give
  tailored guidance to end users, policymakers and AI developers and are meant to build public trust and reduce
  ethical risks while supporting adoption.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Ministry of Science, Technology and Innovation
  (MOSTI). Oversight: MOSTI (guidelines are voluntary). Stated purpose: Promote trustworthy, human-centred AI through
  shared principles for users, policymakers and developers.
