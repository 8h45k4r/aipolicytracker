published: true
issuing_body: Ministry of Economic Affairs and Employment of Finland
summary_plain: >-
  The 2017 report of the steering group appointed by the Minister of Economic Affairs proposed eight key actions to make
  Finland a leader in applying AI: enhancing business competitiveness, using data in all sectors, faster adoption, top-level
  expertise and talent, bold decisions and investments, the best public services, new cooperation models and a human-centred
  approach. It launched the national AI programme continued in the 2019 final report and the AI 4.0 programme.
scope_summary: Government programme; no obligations on private organisations.
