title: >-
  Finland's Age of Artificial Intelligence: Turning Finland into a leading country in the application of AI (objective and
  recommendations for measures)
short_title: Finland's Age of Artificial Intelligence (2017)
instrument_type: strategy
status: adopted
is_binding: false
