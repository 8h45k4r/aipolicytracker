issuing_body: Parliament of Canada (sponsored by the Minister of Innovation, Science and Industry)
summary_plain: >-
  The Artificial Intelligence and Data Act (AIDA) was proposed as Part 3 of Bill C-27 and would have required organisations
  designing, developing or deploying high-impact AI systems to assess and mitigate risks of harm and bias, keep
  records and publish information, with enforcement by an AI and Data Commissioner and penalties for serious offences.
  The bill passed second reading in the House of Commons in April 2023 and was studied in committee through 2024
  but never advanced to report stage. It lapsed when the 44th Parliament ended in early 2025 without the bill being
  passed.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Parliament of Canada (sponsored by the Minister
  of Innovation, Science and Industry). Oversight: Proposed AI and Data Commissioner within Innovation, Science
  and Economic Development Canada. Stated purpose: Regulate high-impact AI systems to prevent harm and biased output
  in the private sector.
