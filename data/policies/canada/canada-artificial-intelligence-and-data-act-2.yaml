  LEGISinfo still displays 'At consideration in committee' as the last recorded stage and does not itself state
  that the bill died. The 'cancelled' status reflects that the 44th Parliament was prorogued in January 2025 and
  dissolved in March 2025, which terminates unpassed bills; this was not confirmed on the fetched page.
