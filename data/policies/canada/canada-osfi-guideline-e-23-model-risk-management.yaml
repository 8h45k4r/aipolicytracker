issuing_body: Office of the Superintendent of Financial Institutions (OSFI)
summary_plain: >-
  A principles-based prudential guideline setting OSFI's expectations for how federally regulated financial
  institutions identify, manage and oversee the risks of the models they use. Its definition of a model is deliberately
  broad and covers AI and machine-learning methods as well as traditional statistical and actuarial models. It does not
  ban particular modelling approaches, and it adds expectations on explainability and on self-learning models.
scope_summary: >-
  Federally regulated financial institutions in Canada and all models they use, whatever the technology, across the
  model lifecycle.
who_it_applies_to: Federally regulated financial institutions supervised by OSFI.
key_dates_summary: Final guideline dated 11 September 2025; effective 1 May 2027.
what_organizations_must_do: >-
  Institutions in scope are expected to manage model risk across the whole model lifecycle, set internal criteria for
  when a self-learning model has materially changed, and apply OSFI Guideline B-10 principles to third-party models.
