summary_plain: >-
  The Pan-Canadian AI Strategy is Canada's national AI strategy, first funded in Budget 2017 with $125 million and
  delivered largely through CIFAR and three national AI institutes. A second phase from 2021 added funding for commercialisation,
  standards and computing capacity, with further support in the 2024 Fall Economic Statement. It focuses on attracting
  and retaining researchers, translating research into industry adoption and promoting responsible AI.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Innovation, Science and Economic Development
  Canada. Oversight: ISED oversees; CIFAR delivers research and talent pillars with Amii, Mila and the Vector Institute.
  Stated purpose: Build Canadian AI research capacity, talent and commercialisation.
key_dates_summary: >-
  2017-03-22: Strategy funded in Budget 2017 (Phase I, $125 million); 2021-04-19: Phase II announced in Budget 2021
  ($443.8 million)
