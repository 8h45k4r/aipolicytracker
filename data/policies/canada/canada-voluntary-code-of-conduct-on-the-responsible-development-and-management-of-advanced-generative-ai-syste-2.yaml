summary_plain: >-
  This voluntary code asks Canadian developers and managers of advanced generative AI systems to commit to measures
  under six principles: accountability, safety, fairness and equity, transparency, human oversight and monitoring,
  and validity and robustness. Obligations are scaled according to whether a system is made available for general
  public use. It was introduced as a bridge while the Artificial Intelligence and Data Act was before Parliament,
  and lists around fifty signatory organisations.
scope_summary: >-
  Scope is as set out in the official text linked below. Issued by Innovation, Science and Economic Development
  Canada. Oversight: ISED administers; signatory companies self-implement the commitments. Stated purpose: Interim
  voluntary safeguards for generative AI developers pending binding legislation.
