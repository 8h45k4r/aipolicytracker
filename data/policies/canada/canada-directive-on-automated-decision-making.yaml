date_notes: >-
  The official directive text states it took effect on 1 April 2019, with compliance required by 1 April 2020, and that
  systems developed or procured before 24 June 2025 have until 24 June 2026 to meet new or updated requirements. The
  24 June 2025 date is the modification date of the current version. Official pages differ on whether the 2025 changes
  followed the third or the fourth review of the directive, and the 2019 and 2020 dates appeared in extracts that may come
  from an archived version; both points are pending review against the current text.
