summary_plain: >-
  A Government of Canada policy instrument that sets rules for federal institutions that use automated decision
  systems to make, or help make, administrative decisions about clients. Institutions in scope must assess the impact of
  each system and meet the safeguards that match its impact level before and while it is in production. Systems used
  only for research or kept in test environments are excluded.
scope_summary: >-
  Federal institutions covered by Treasury Board policy that use automated decision systems in production to make or
  support administrative decisions or related assessments about clients.
who_it_applies_to: Federal government departments and other institutions subject to the directive, including agents of Parliament.
key_dates_summary: >-
  Took effect 1 April 2019 (compliance by 1 April 2020); amended version dated 24 June 2025; systems developed or
  procured before 24 June 2025 have until 24 June 2026 to meet the new or updated requirements.
what_organizations_must_do: >-
  Institutions in scope must assess each automated decision system before production and apply the requirements that
  match its impact level. A system already in place that is modified in a way that could affect the decision is treated
  as a new system and must comply.
