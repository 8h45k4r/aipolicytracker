summary_plain: >-
  Governs the use of AI in the regional administration, with human review, data protection and transparency; sets up a health-AI
  pilot programme, a voluntary regional register of AI developers and a regional AI Office.
scope_summary: The Calabria regional public administration; registration is voluntary for AI developers.
who_it_applies_to: The Calabria regional administration and, on a voluntary basis, AI developers.
key_dates_summary: >-
  Approved by the Regional Council on 27 January 2026; published in the regional bulletin (BURC No. 22) on 2 February 2026.
