  - { framework: nist_ai_rmf, reference: "GOVERN 1.1; MAP 1.1", confidence_level: medium }
related_controls: [ai-system-inventory, ai-impact-assessment, ai-governance-policy-and-accountability]
review_status: pending_review
confidence_level: medium
