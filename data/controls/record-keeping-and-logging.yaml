slug: record-keeping-and-logging
title: Automatic event logging and record retention
kind: technical
purpose: >
  Captures what an AI system did, when and with what inputs, and keeps those records long enough to
  reconstruct a decision, investigate an incident and demonstrate ongoing monitoring.
description: >
  Engineers define a log schema for each system that covers at minimum the time of use, the version of model
  and configuration, the inputs or their references, the output produced and any human intervention. Logs are
  written automatically, protected against tampering, access-controlled and retained for a period set by the
  strictest applicable rule and the organisation's own needs. Deployers confirm that logs generated under their
  control are retained and can be handed to the provider or an authority. Retention, deletion and access are
  reviewed periodically and the schema is updated when the system changes.
owner_role: Engineering lead
frequency: continuous
risk_subdomains: ["7.4", "6.5", "2.2"]
evidence:
  - { type: access_log, title: AI system event logs, description: "System-generated records of use, versions, inputs, outputs and interventions, retained for the defined period." }
