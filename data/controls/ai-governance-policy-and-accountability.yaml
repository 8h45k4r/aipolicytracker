slug: ai-governance-policy-and-accountability
title: AI governance policy and accountability structure
kind: policy
purpose: >
  Gives the organisation a single approved statement of how it will develop, buy and use AI, and names
  the people who are answerable for it, so that every other AI control has a mandate and an owner.
description: >
  Senior management approves a short AI policy that sets the organisation's risk appetite, the principles it
  commits to, the scope of systems covered and the decisions that must be escalated. The policy is backed by a
  responsibility map: an executive sponsor, a governance lead, system owners and the committee or forum that
  reviews high-risk cases. Meeting cadence, escalation routes and the relationship to existing risk, privacy
  and security functions are written down. The policy is reviewed at least once a year and whenever a new law
  or a material incident changes the picture, and decisions of the governance forum are minuted so that a
  regulator or auditor can trace who decided what and when.
owner_role: Executive sponsor for AI
frequency: annual
risk_subdomains: ["6.5", "5.2"]
evidence:
  - { type: policy_document, title: AI policy, description: "Approved and versioned statement of scope, principles, risk appetite and escalation rules." }
  - { type: approval_record, title: Board or executive approval of the AI policy }
  - { type: meeting_record, title: AI governance forum minutes, description: "Decisions, attendees and actions from each governance meeting." }
  - { type: register_entry, title: AI responsibility map, description: "Named owner for each AI role and for each system." }
