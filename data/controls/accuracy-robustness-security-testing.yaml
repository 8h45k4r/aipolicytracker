slug: accuracy-robustness-security-testing
title: Accuracy, robustness, fairness and security testing
kind: technical
purpose: >
  Verifies before release, and again after material change, that a system performs to declared accuracy
  levels, behaves consistently across groups and conditions, and resists the attacks specific to AI.
description: >
  A test plan defines the metrics, datasets, thresholds and acceptance criteria for each trustworthiness
  property the risk assessment flagged: accuracy and calibration, performance across demographic and
  operational subgroups, resilience to noisy or out-of-distribution input, and security against data and
  model poisoning, evasion and extraction. Tests are run by people independent of the developers where
  practical, results are compared against the criteria and failures block release until fixed or formally
  accepted. Declared performance figures in user documentation are drawn directly from the latest report,
  and the plan is re-run on retraining or a change in operating context.
owner_role: Quality or testing lead
frequency: on_material_change
risk_subdomains: ["7.3", "1.3", "2.2", "1.1"]
evidence:
