slug: data-governance-and-dataset-documentation
title: Data governance and dataset documentation
kind: process
purpose: >
  Makes sure the data used to train, tune, validate and test an AI system is fit for purpose, understood and
  documented, so that quality and bias problems are found in the data before they surface in decisions.
description: >
  Each dataset used in building a system gets a documentation sheet describing where it came from, how it was
  collected and labelled, what it is meant to represent, known gaps and the cleaning and transformation steps
  applied. Data owners check representativeness against the intended population and run bias and quality
  checks before a dataset is approved for use. Access, retention and change control apply to datasets in the
  same way as to code, and the documentation is versioned alongside the model that consumed it. Deployers who
  supply their own input data apply a lighter version of the same checks to confirm relevance.
owner_role: Data governance lead
frequency: per_system
risk_subdomains: ["1.1", "1.3", "7.3", "2.1"]
