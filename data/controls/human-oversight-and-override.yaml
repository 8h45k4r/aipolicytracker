slug: human-oversight-and-override
title: Human oversight design and override procedure
kind: process
purpose: >
  Ensures that competent people can understand, question, correct, stop or decline to use an AI system's
  output, and that the degree of human involvement is chosen deliberately for each decision point.
description: >
  For every decision point the system influences, the owner records whether a person decides with the
  system's help, reviews after the fact, or is only alerted on exceptions, and why that level is proportionate
  to the harm at stake. The interface exposes confidence, limitations and the reasons for an output where
  feasible, and includes a documented way to override, pause or shut the system down. Overseers are named,
  trained against automation bias and given the time and authority to intervene. Override events are logged and
  reviewed so that the oversight design can be tightened if interventions are rare or ineffective.
owner_role: AI system owner
frequency: per_system
risk_subdomains: ["5.1", "5.2", "7.3"]
evidence:
