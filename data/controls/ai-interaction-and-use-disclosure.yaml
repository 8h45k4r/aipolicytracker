slug: ai-interaction-and-use-disclosure
title: AI interaction and use disclosure notices
kind: process
purpose: >
  Tells people, in plain language and at the right moment, that they are interacting with an AI system, that
  AI is being used in a decision about them or that their data feeds an AI system.
description: >
  The organisation keeps a catalogue of the situations in which people meet its AI systems and, for each,
  approves a notice: a conversational banner, a pre-decision statement, a privacy-notice section or a
  product label. Notices say what the system does, what it is for, what it means for the person and where to
  ask questions or opt out where that right exists. Legal, product and accessibility reviewers sign off wording
  and placement, the live text is versioned, and a periodic check confirms that notices still appear where
  the system is used. Public notices about AI use are kept in a single, findable place.
owner_role: Product owner
frequency: on_material_change
risk_subdomains: ["7.4", "4.3", "5.2"]
evidence:
  - { type: disclosure_notice, title: AI interaction or use notice, description: "The approved text and placement shown to people for each interaction or decision point." }
  - { type: register_entry, title: Notice catalogue, description: "Where each notice appears, its version and its owner." }
  - { type: approval_record, title: Notice wording approval }
