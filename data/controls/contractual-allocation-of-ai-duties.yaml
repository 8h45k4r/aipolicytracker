  - { framework: nist_ai_rmf, reference: "GOVERN 6.1; MANAGE 3.1", confidence_level: medium }
related_controls: [third-party-ai-due-diligence, technical-documentation-and-model-cards, ai-system-inventory]
review_status: pending_review
