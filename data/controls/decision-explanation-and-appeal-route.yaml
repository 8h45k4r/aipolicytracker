slug: decision-explanation-and-appeal-route
title: Decision explanation, human review and appeal route
kind: process
purpose: >
  Gives people affected by a significant automated or AI-assisted decision a meaningful explanation, a way to
  correct the data behind it, and a route to have a person reconsider it.
description: >
  For each decision point that has legal or similarly significant effects, the owner defines what the person
  is told after the decision: the main reasons, the data relied on and its sources, and how to challenge the
  outcome. Complaint and customer-service procedures are extended with an AI-decision challenge path staffed by
  people with the authority and information to change the result, and with target response times. Requests,
  outcomes and reversals are logged and reviewed, both to satisfy individual rights and to detect systematic
  problems that should feed back into the model or the oversight design.
owner_role: Customer operations lead
frequency: per_system
risk_subdomains: ["5.2", "1.1", "7.4"]
evidence:
