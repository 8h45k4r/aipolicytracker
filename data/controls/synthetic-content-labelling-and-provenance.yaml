slug: synthetic-content-labelling-and-provenance
title: Synthetic content labelling and provenance marking
kind: technical
purpose: >
  Makes AI-generated or manipulated audio, image, video and text identifiable as such, both to people looking
  at it and to software checking it, so that it cannot easily be passed off as authentic.
description: >
  Generation pipelines attach a machine-readable provenance signal to output, for example a content credential
  manifest, an invisible watermark or metadata, using a method that survives the common ways the content will
  be shared. Where the audience needs to see it, a visible label or spoken notice is added as well. The team
  documents which methods are used for which modality, tests detectability and robustness to editing, and
  keeps a verification tool or endpoint available. Downstream products that display deepfakes or AI-written
  material of public interest apply the label rules set by the organisation's editorial policy.
owner_role: Engineering lead
frequency: continuous
risk_subdomains: ["3.1", "3.2", "4.1", "4.3"]
