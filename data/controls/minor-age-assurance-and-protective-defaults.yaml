slug: minor-age-assurance-and-protective-defaults
aipt_id: AIPT-CTL-0028
title: Age assurance and protective defaults for minors
kind: technical
purpose: >
  Keeps children and teenagers who use a chatbot or AI service on safer settings by finding out,
  proportionately, who is a minor and applying protections to them by default.
description: >
  The service decides how it will tell whether a user is a minor, from self-declaration with checks up to a
  recognised age-assurance method, in line with what the applicable law accepts, and documents why that method
  is proportionate. Users identified as minors, or all users where the age is unknown, get protective
  defaults: no sexual or romantic content, recurring reminders that they are talking to an AI, limits on
  session length and late-night use, no engagement features that reward compulsive use, and no behavioural
  advertising. Only a verified parent or guardian, where the law provides for it, can relax a default. The
  settings are tested and re-checked when the product changes.
owner_role: Product owner
frequency: per_system
risk_subdomains: ["1.2", "5.1", "2.1"]
