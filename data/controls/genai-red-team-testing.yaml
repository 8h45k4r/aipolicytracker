slug: genai-red-team-testing
title: Adversarial and red-team testing for generative AI
kind: technical
purpose: >
  Finds the ways a generative or general-purpose model can be made to produce harmful, deceptive or
  dangerous output before users or attackers do, and feeds the findings back into mitigations.
description: >
  A red team with a mix of security, domain and safety expertise, drawn partly from outside the development
  group, attacks the model and the product around it using scenario libraries that cover prompt injection,
  jailbreaks, data leakage, harmful-capability elicitation, bias provocation and misuse of tools or agents.
  Exercises are scoped and rules of engagement agreed in advance; findings are rated, tracked to closure and
  regression-tested in the next round. For the largest models the programme includes structured evaluations of
  dangerous capabilities and the organisation's mitigations are recorded in the safety framework. Results are
  summarised for governance and, where required, for authorities or downstream integrators.
owner_role: AI security or safety lead
frequency: on_material_change
