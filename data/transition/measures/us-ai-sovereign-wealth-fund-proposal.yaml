slug: us-ai-sovereign-wealth-fund-proposal
title: American A.I. Sovereign Wealth Fund Act (S. 4825, United States)
jurisdiction: us
measure_type: sovereign_wealth_fund
status: introduced
summary: >
  A Senate bill introduced by Senator Bernie Sanders on 18 June 2026 that would levy a one-time tax, payable in
  equity, on AI companies with more than USD 200 million in annual sales, placing the shares in a public trust
  estimated by the sponsor at about USD 7 trillion, managed by an independent commission and paying dividends to
  residents (about USD 1,000 per person a year in the sponsor's estimate) while funding education, health care and
  housing. Recorded from secondary reporting.
mechanism: One-time tax on AI companies above a USD 200 million annual-sales threshold, paid in stock into a public fund.
funding: The fund's shareholdings and their returns.
trigger: null
benefit: Annual dividends to residents and funding for education, health care and housing, per the sponsor's description.
cost: Sponsor's estimate of the fund's size is about USD 7 trillion; no official cost estimate recorded.
