slug: us-ai-excise-tax-bill
title: AI Tax and Work Protection Act (H.R. 10044, United States)
jurisdiction: us
measure_type: ai_tax
status: introduced
summary: >
  A House bill introduced on 6 August 2026 that would impose an excise tax on large AI companies, measured on the
  value of the tokens their models process or on revenue from AI services, whichever yields more, with a rate
  that rises automatically as unemployment climbs, and would create a Work Protection Administration in the
  Department of Labor to fund jobs in housing, infrastructure and care. Recorded from secondary reporting.
mechanism: >
  Excise tax on major AI companies, assessed on token value or AI-service revenue (whichever is higher), with an
  automatic rate escalator tied to the unemployment rate.
funding: Revenue directed to a Work Protection Administration within the Department of Labor to create jobs.
trigger: The rate rises when unemployment climbs; thresholds follow the bill text, which a reviewer must read.
benefit: Publicly funded jobs in housing construction, infrastructure, child care and elder care.
