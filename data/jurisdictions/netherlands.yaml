overview: >-
  The Netherlands applies the EU AI Act and has an unusually developed public-sector algorithm governance practice: a public
  Algorithm Register for government algorithms, the Autoriteit Persoonsgegevens (Dutch DPA) with a dedicated Directorate
  for the Coordination of Algorithms, a government-wide vision on generative AI (January 2024) and an impact assessment
  for fundamental rights and algorithms (IAMA) used by public bodies. The childcare-benefits scandal shaped a strong emphasis
  on non-discrimination and transparency in automated decision-making.
regulatory_status_summary: >-
  EU AI Act applies; Dutch DPA coordinates algorithm supervision; public-sector algorithm register and generative-AI vision
  as policy.
binding_vs_guidance: >-
  Binding: none recorded. Strategy or guidance: Government Algorithm Register; Government-wide vision on generative AI.
current_priorities: >-
  AI Act authority designation (Dutch DPA and Rijksinspectie Digitale Infrastructuur proposed), algorithm register coverage,
  responsible generative-AI use in government.
how_to_use:
- >-
  Start from the EU AI Act record for obligations; use this page for the national authorities, penalties and strategy.
- Open the official source on each instrument before relying on any date or obligation.
- >-
  Check national data-protection, employment and consumer law that applies to AI systems regardless of the AI Act.
