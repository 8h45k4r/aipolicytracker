overview: >-
  An updated national AI roadmap launched by DTI together with the Center for AI Research, building on the 2021
  roadmap and adding generative AI. A national AI strategy proposed by DOST at National Innovation Day 2025, structured
  around five core strategies: infrastructure, workforce, innovation, ethics and policy, and deployment, phased
  from 2024 to 2028.
regulatory_status_summary: >-
  Instruments on record: National AI Strategy Roadmap 2.0 (2024, strategy, adopted); National AI Strategy for the
  Philippines (2025, strategy, proposed). Each is linked to its official source; human verification pending.
binding_vs_guidance: >-
  Binding: none recorded. Strategy or guidance: National AI Strategy Roadmap 2.0, National AI Strategy for the Philippines.
how_to_use:
- Open the official source on each instrument before relying on any date or obligation.
- >-
  Treat strategies and guidance as signals of coming regulation, not as binding requirements.
