overview: >-
  Chile updated its 2021 National AI Policy in 2024, keeping the ten-year horizon to 2031 but reorienting it around
  ethics, governance and inclusion after a participatory process across the country's regions. Introduced by presidential
  message in May 2024 and merged with an earlier parliamentary motion (Boletín 15869-19), the bill classifies AI
  system uses into unacceptable, high, limited and no-evident-risk categories, prohibits certain practices, and
  sets obligations, incident reporting and sanctions.
regulatory_status_summary: >-
