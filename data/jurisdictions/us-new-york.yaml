overview: >-
  New York City's Local Law 144 of 2021 (enforced since 5 July 2023) requires bias audits and notices for automated employment
  decision tools used to hire or promote in the city. At state level, New York enacted the Responsible AI Safety and Education
  (RAISE) Act in December 2025 imposing safety-protocol and incident-reporting duties on developers of frontier models,
  with amendments to align with California's SB 53, and a 2025 law requiring disclosure of AI companion safeguards. The
  Department of Financial Services issued a 2024 letter on AI cybersecurity risks.
regulatory_status_summary: >-
  NYC Local Law 144 enforced since July 2023; RAISE Act enacted December 2025 (effective 2027); DFS guidance for regulated
  entities.
binding_vs_guidance: >-
  Binding: NYC Local Law 144 (automated employment decision tools); New York RAISE Act (frontier model safety). Strategy
  or guidance: none recorded.
how_to_use:
- Open the official source on each instrument before relying on any date or obligation.
- Treat strategies and guidance as signals of coming regulation, not as binding requirements.
- >-
  Check data-protection, consumer, employment and sector law that applies to AI systems regardless of AI-specific instruments.
