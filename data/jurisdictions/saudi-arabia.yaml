overview: >-
  The national strategy, approved by royal decision in July 2020, sets an ambition for Saudi Arabia to be among
  the leading data- and AI-driven economies through phased milestones to 2030. SDAIA's AI Ethics Principles set
  out ethical principles and associated controls for entities developing, deploying or affected by AI systems in
  Saudi Arabia, covering fairness, privacy and security, humanity, social and environmental benefit, reliability
  and safety, transparency, and accountability.
