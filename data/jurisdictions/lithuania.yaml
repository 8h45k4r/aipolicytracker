overview: >-
  Lithuania applies the EU AI Act, adopted a Lithuanian Artificial Intelligence Strategy in 2019 and updated AI measures
  through its 2023–2025 digital agenda; the Communications Regulatory Authority (RRT) has been proposed as market-surveillance
  authority and the Ministry of the Economy and Innovation leads policy.
regulatory_status_summary: EU AI Act applies; AI strategy (2019) as policy; authority designation in progress.
binding_vs_guidance: 'Binding: none recorded. Strategy or guidance: Lithuanian Artificial Intelligence Strategy (2019).'
how_to_use:
- >-
  Start from the EU AI Act record for obligations; use this page for the national authorities, penalties and strategy.
- Open the official source on each instrument before relying on any date or obligation.
- >-
  Check national data-protection, employment and consumer law that applies to AI systems regardless of the AI Act.
