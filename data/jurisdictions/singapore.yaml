overview: >
  Singapore governs AI through voluntary frameworks, sector guidance and existing law rather than an AI statute. The
  Model AI Governance Framework (second edition, 2020) and the Model AI Governance Framework for Generative AI
  (2024) set out practical governance expectations; AI Verify provides a testing framework and toolkit; the
  Personal Data Protection Commission has issued advisory guidelines on personal data in AI systems; and the
  National AI Strategy 2.0 (December 2023) sets national direction. The Monetary Authority of Singapore, IMDA and
  other regulators add sector-specific expectations.
regulatory_status_summary: >
  No binding cross-sector AI law. Binding obligations come from the Personal Data Protection Act 2012, the Online
  Safety framework, sector regulation and consumer law. AI governance frameworks are voluntary but widely referenced.
binding_vs_guidance: >
  Binding: Personal Data Protection Act 2012 (PDPA), Cybersecurity Act, sector rules (for example MAS requirements for
  financial institutions). Guidance / voluntary: Model AI Governance Framework, Generative AI framework, AI Verify,
  PDPC advisory guidelines on AI, MAS FEAT principles and Veritas.
current_priorities: >
  National AI Strategy 2.0 implementation, AI Verify and generative-AI evaluation (Project Moonshot), safety
  guidelines for model developers and app deployers, and international interoperability of AI governance.
how_to_use:
  - Use the Model AI Governance Framework and its generative-AI companion as the governance baseline expected by Singapore regulators and customers.
  - Apply the PDPC advisory guidelines when personal data is used in AI recommendation or decision systems.
  - Consider AI Verify testing to evidence governance claims.
