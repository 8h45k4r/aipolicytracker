faq:
  - question: Does Singapore have an AI law?
    answer: >
      No. Singapore uses voluntary governance frameworks, testing tools and sector guidance, with binding
      obligations arising from the PDPA and sector regulation.
  - question: What is AI Verify?
    answer: >
      AI Verify is a voluntary AI governance testing framework and open-source toolkit developed by IMDA and
      stewarded by the AI Verify Foundation, allowing organisations to test AI systems against internationally
      recognised governance principles.
