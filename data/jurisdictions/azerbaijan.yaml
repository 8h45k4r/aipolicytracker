overview: >-
  Azerbaijan approved the Artificial Intelligence Strategy 2025–2028 by presidential decree in March 2025. General law (data
  protection where enacted, consumer, telecommunications and sector rules) applies to AI systems. This record exists so
  that coverage is complete and honest: it will be expanded when an official AI instrument is published or a reviewer adds
  one with its source.
