overview: >-
  Estonia applies the EU AI Act and pursues AI through its "kratt" programme: successive national AI strategies (2019–2021,
  2022–2023, 2024–2026) focused on AI in public services, the Bürokratt virtual-assistant network and open-source components,
  with the Ministry of Economic Affairs and Communications and the Information System Authority (RIA) leading. Estonia has
  proposed the Consumer Protection and Technical Regulatory Authority (TTJA) as AI Act market-surveillance authority.
regulatory_status_summary: EU AI Act applies; national AI strategy 2024–2026 as policy; authority designation in progress.
binding_vs_guidance: 'Binding: none recorded. Strategy or guidance: National AI strategy 2024–2026.'
how_to_use:
- >-
  Start from the EU AI Act record for obligations; use this page for the national authorities, penalties and strategy.
- Open the official source on each instrument before relying on any date or obligation.
- >-
  Check national data-protection, employment and consumer law that applies to AI systems regardless of the AI Act.
