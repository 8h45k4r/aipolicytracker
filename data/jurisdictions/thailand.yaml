overview: >-
  A cabinet-approved strategy and action plan with five strategies: readiness in ethics, law and regulation; national
  AI infrastructure; human capability and education; AI technology and innovation development; and promotion of
  AI use in public and private sectors. Draft principles for a Thai AI law released for public hearing by MDES and
  ETDA.
regulatory_status_summary: >-
  Instruments on record: Thailand National AI Strategy and Action Plan (2022, strategy, adopted); (Draft) Principles
  of the Law on Artificial Intelligence (2025, consultation, under consultation). Each is linked to its official
  source; human verification pending.
binding_vs_guidance: >-
  Binding: none recorded. Strategy or guidance: Thailand National AI Strategy and Action Plan, (Draft) Principles
  of the Law on Artificial Intelligence.
