overview: >-
  Hong Kong has no AI-specific statute. The Office of the Privacy Commissioner for Personal Data (PCPD) issued the Model
  Personal Data Protection Framework for AI (June 2024) and Guidance on Ethical Development and Use of AI (2021); the Digital
  Policy Office published the Ethical AI Framework for government (updated 2024) and a Generative AI Technical and Application
  Guideline (April 2025); the Securities and Futures Commission and Hong Kong Monetary Authority issued circulars on generative-AI
  use in financial services. The Personal Data (Privacy) Ordinance applies.
regulatory_status_summary: >-
  No AI-specific law; PCPD AI frameworks and Digital Policy Office guidance; financial-regulator circulars.
binding_vs_guidance: >-
  Binding: none recorded. Strategy or guidance: PCPD Model Personal Data Protection Framework for AI (2024); Generative
  AI Technical and Application Guideline (2025).
how_to_use:
- Open the official source on each instrument before relying on any date or obligation.
- Treat strategies and guidance as signals of coming regulation, not as binding requirements.
- >-
  Check data-protection, consumer, employment and sector law that applies to AI systems regardless of AI-specific instruments.
