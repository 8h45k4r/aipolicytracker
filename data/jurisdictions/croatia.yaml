overview: >-
  Croatia applies the EU AI Act; the Central State Office for the Development of the Digital Society prepared a National
  Plan for the Development of AI, and the Croatian Personal Data Protection Agency (AZOP) is the data-protection authority.
  AI Act authority designation is in progress.
regulatory_status_summary: EU AI Act applies; national AI plan in preparation/adopted; authority designation in progress.
binding_vs_guidance: 'Binding: none recorded. Strategy or guidance: National Plan for the Development of AI.'
how_to_use:
- >-
  Start from the EU AI Act record for obligations; use this page for the national authorities, penalties and strategy.
- Open the official source on each instrument before relying on any date or obligation.
- >-
  Check national data-protection, employment and consumer law that applies to AI systems regardless of the AI Act.
