overview: >-
  Ukraine, an EU candidate, adopted a Concept for the Development of AI in 2020 and, through the Ministry of Digital Transformation,
  a 2023 roadmap for AI regulation that follows a "bottom-up" approach: voluntary tools, a code of conduct and sandboxes
  first, with a law aligned to the EU AI Act to follow. Ukraine signed the Council of Europe Framework Convention on AI
  in 2024.
regulatory_status_summary: >-
  AI concept (2020) and regulation roadmap (2023) as policy; AI law in preparation; Council of Europe convention signed.
binding_vs_guidance: 'Binding: none recorded. Strategy or guidance: Roadmap for AI regulation (2023).'
how_to_use:
- Open the official source on each instrument before relying on any date or obligation.
- Treat strategies and guidance as signals of coming regulation, not as binding requirements.
- >-
  Check data-protection, consumer, employment and sector law that applies to AI systems regardless of AI-specific instruments.
