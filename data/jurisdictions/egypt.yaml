overview: >-
  Egypt's first national AI strategy framed AI as a tool for the country's sustainable development goals and for
  positioning Egypt as an active contributor to AI in Africa and the Arab region. The second edition updates Egypt's
  2021 strategy for 2025-2030 around six pillars: governance, data, infrastructure, technology, talent and ecosystem.
