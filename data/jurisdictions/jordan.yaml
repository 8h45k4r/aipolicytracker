overview: >-
  Jordan adopted a Jordanian Artificial Intelligence Strategy and Implementation Roadmap 2023–2027 (August 2023) and a Charter
  of AI Ethics (2022) under the Ministry of Digital Economy and Entrepreneurship, with the Personal Data Protection Law
  No. 24 of 2023 applying to AI processing personal data.
regulatory_status_summary: National AI strategy 2023–2027 and AI ethics charter as policy; data-protection law applies.
binding_vs_guidance: >-
  Binding: none recorded. Strategy or guidance: AI Strategy and Implementation Roadmap 2023–2027; Charter of AI Ethics (2022).
how_to_use:
- Open the official source on each instrument before relying on any date or obligation.
- Treat strategies and guidance as signals of coming regulation, not as binding requirements.
- >-
  Check data-protection, consumer, employment and sector law that applies to AI systems regardless of AI-specific instruments.
