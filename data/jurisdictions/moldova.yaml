overview: >-
  Moldova signed the Council of Europe Framework Convention on AI (2024) and is aligning with the EU acquis as a candidate;
  no adopted AI-specific instrument recorded. General law (data protection where enacted, consumer, telecommunications and
  sector rules) applies to AI systems. This record exists so that coverage is complete and honest: it will be expanded when
  an official AI instrument is published or a reviewer adds one with its source.
