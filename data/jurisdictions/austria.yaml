overview: >-
  Austria applies the EU AI Act and set up an AI service desk (KI-Servicestelle) at the telecoms regulator RTR in 2024 to
  inform companies and the public about the Regulation; an AI advisory board (KI-Beirat) advises the federal government.
  The national strategy "AIM AT 2030" (2021) sets objectives for human-centred, trustworthy AI, and Austria has proposed
  RTR as its market-surveillance authority.
regulatory_status_summary: >-
  EU AI Act applies; RTR AI service desk operating; AIM AT 2030 strategy as policy; authority designation in progress.
binding_vs_guidance: 'Binding: none recorded. Strategy or guidance: AIM AT 2030 (AI strategy).'
how_to_use:
- >-
  Start from the EU AI Act record for obligations; use this page for the national authorities, penalties and strategy.
- Open the official source on each instrument before relying on any date or obligation.
- >-
