overview: >-
  Lebanon's Office of the Minister of State for Administrative Reform (OMSAR) and the Ministry of Telecommunications published
  a National AI Strategy 2024–2030 (2024) with UNESCO and UNDP support, covering governance, skills, public services and
  the digital economy; no AI-specific law exists.
regulatory_status_summary: National AI strategy 2024–2030 as policy; no AI-specific law.
binding_vs_guidance: 'Binding: none recorded. Strategy or guidance: National AI Strategy 2024–2030.'
how_to_use:
- Open the official source on each instrument before relying on any date or obligation.
- Treat strategies and guidance as signals of coming regulation, not as binding requirements.
- >-
  Check data-protection, consumer, employment and sector law that applies to AI systems regardless of AI-specific instruments.
