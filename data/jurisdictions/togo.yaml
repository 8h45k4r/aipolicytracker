overview: >-
  Togo has used AI in social-protection payments (Novissi) and consulted on AI governance; no adopted AI-specific instrument
  recorded. General law (data protection where enacted, consumer, telecommunications and sector rules) applies to AI systems.
  This record exists so that coverage is complete and honest: it will be expanded when an official AI instrument is published
  or a reviewer adds one with its source.
