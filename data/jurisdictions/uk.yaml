faq:
  - question: Does the UK have an AI Act?
    answer: >
      No. As of the last check the UK relies on existing laws applied by sector regulators under five non-statutory
      principles. The government has said it intends to legislate for the most powerful AI models, but no bill has
      been introduced to Parliament.
  - question: What UK laws already apply to AI systems?
    answer: >
      UK GDPR and the Data Protection Act 2018 for personal data and automated decisions, the Equality Act 2010
      for discrimination, consumer and product-safety law, the Online Safety Act 2023 for platforms, and
      sector-specific rules in financial services, health and telecoms.
