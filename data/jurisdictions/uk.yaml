overview: >
  The United Kingdom has not enacted a cross-sector AI statute. Its approach, set out in the March 2023 white paper
  "A pro-innovation approach to AI regulation" and confirmed in the February 2024 government response, asks existing
  regulators to apply five cross-cutting principles within their remits, supported by central functions and the
  AI Security Institute. Binding obligations for AI therefore come mainly from existing law: UK GDPR and the Data
  Protection Act 2018 (as amended by the Data (Use and Access) Act 2025), equality, consumer, financial-services,
  competition and online-safety legislation.
regulatory_status_summary: >
  Principles-based, regulator-led framework; no AI-specific Act in force. The government has signalled a future bill
  targeting the most powerful AI models, but as of the last check no such bill had been introduced. Sector regulators
  (ICO, FCA, CMA, Ofcom, MHRA, EHRC) publish AI guidance and enforce existing law.
binding_vs_guidance: >
  Binding: UK GDPR and Data Protection Act 2018 (including rules on automated decision-making), Equality Act 2010,
  Consumer Rights Act 2015, Online Safety Act 2023, sector rules such as FCA Consumer Duty. Guidance: the AI
  regulation white paper principles, ICO guidance on AI and data protection, DSIT and regulator AI guidance, the
  Algorithmic Transparency Recording Standard for public bodies.
current_priorities: >
  Delivering the AI Opportunities Action Plan (January 2025), AI Growth Zones and compute, the AI Security
  Institute's evaluation work, regulator capacity through the Regulatory Innovation Office, and implementation of
  the Data (Use and Access) Act 2025 changes to automated decision-making rules.
how_to_use:
  - Identify which UK regulators cover your sector and read their AI guidance; that is where enforcement will come from.
  - Treat UK GDPR as the primary binding constraint for AI using personal data, including automated decision-making rules.
  - Check whether you supply the EU as well; the EU AI Act may apply extraterritorially and set the higher bar.
  - Public bodies should use the Algorithmic Transparency Recording Standard for algorithmic tools.
  - Watch for a frontier-AI bill and record the date of every regulator publication you rely on.
