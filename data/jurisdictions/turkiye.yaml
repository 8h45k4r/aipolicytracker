overview: >-
  Türkiye adopted its National Artificial Intelligence Strategy 2021–2025 in August 2021 (Digital Transformation Office
  of the Presidency and Ministry of Industry and Technology) and updated the action plan for 2024–2025. A draft Artificial
  Intelligence Law was submitted to the Grand National Assembly in June 2024 but has not been enacted; the Personal Data
  Protection Authority (KVKK) has issued AI recommendations. Türkiye signed the Council of Europe Framework Convention on
  AI.
regulatory_status_summary: National AI strategy 2021–2025 as policy; draft AI law pending in parliament; KVKK AI guidance.
binding_vs_guidance: >-
  Binding: Draft Artificial Intelligence Law (2024). Strategy or guidance: National AI Strategy 2021–2025.
how_to_use:
- Open the official source on each instrument before relying on any date or obligation.
- Treat strategies and guidance as signals of coming regulation, not as binding requirements.
- >-
  Check data-protection, consumer, employment and sector law that applies to AI systems regardless of AI-specific instruments.
