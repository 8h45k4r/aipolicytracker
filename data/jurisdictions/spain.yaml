faq:
- question: What is AESIA?
  answer: >-
    The Spanish AI Supervision Agency, created by Royal Decree 729/2023 and based in A Coruña. It supervises AI systems,
    runs the national sandbox and is Spain's market-surveillance authority under the EU AI Act.
