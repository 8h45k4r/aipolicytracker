overview: >-
  Spain created the first dedicated national AI supervisory agency in the EU, AESIA, by Royal Decree 729/2023, and ran the
  first AI Act regulatory sandbox under Royal Decree 817/2023. The government approved a draft law on the good use and governance
  of AI in March 2025 to implement the AI Act nationally (authorities, penalties, mandatory labelling of AI-generated content),
  and the 2024 AI Strategy funds compute, language models in Spanish and co-official languages, and public-sector adoption.
regulatory_status_summary: >-
  EU AI Act applies; AESIA operational; national implementation bill proposed (2025); AI Strategy 2024 as policy.
binding_vs_guidance: >-
  Binding: Royal Decree 729/2023 (AESIA statute); Royal Decree 817/2023 (AI regulatory sandbox); Draft law on good use and
  governance of AI. Strategy or guidance: none recorded.
current_priorities: >-
  Passing the AI governance bill, AESIA supervision, the sandbox, Spanish-language foundation models and supercomputing.
how_to_use:
- >-
  Start from the EU AI Act record for obligations; use this page for the national authorities, penalties and strategy.
- Open the official source on each instrument before relying on any date or obligation.
- >-
  Check national data-protection, employment and consumer law that applies to AI systems regardless of the AI Act.
