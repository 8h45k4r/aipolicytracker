overview: >-
  Utah enacted the Artificial Intelligence Policy Act (SB 149) in March 2024, effective 1 May 2024, the first US state law
  on generative-AI disclosure: businesses must tell consumers when they are interacting with generative AI if asked, and
  regulated occupations must disclose proactively. It created the Office of Artificial Intelligence Policy and a learning-laboratory
  (sandbox) programme, amended in 2025 (SB 226 and SB 332) to narrow disclosure to "high-risk" interactions and extend the
  sunset, plus HB 452 on mental-health chatbots.
regulatory_status_summary: >-
  AI Policy Act in force since May 2024 (amended 2025); mental-health chatbot law (2025); Office of AI Policy operating.
binding_vs_guidance: 'Binding: Utah Artificial Intelligence Policy Act (SB 149). Strategy or guidance: none recorded.'
