overview: >-
  Kuwait launched a National Artificial Intelligence Strategy 2025–2028 through the Central Agency for Information Technology
  and the Communication and Information Technology Regulatory Authority, focused on government services, talent, data and
  ethical AI, and CITRA issued guidelines on AI use; the Data Privacy Protection Regulation applies.
regulatory_status_summary: National AI strategy 2025–2028 as policy; CITRA guidelines; no AI-specific law.
binding_vs_guidance: 'Binding: none recorded. Strategy or guidance: National AI Strategy 2025–2028.'
how_to_use:
- Open the official source on each instrument before relying on any date or obligation.
- Treat strategies and guidance as signals of coming regulation, not as binding requirements.
- >-
  Check data-protection, consumer, employment and sector law that applies to AI systems regardless of AI-specific instruments.
