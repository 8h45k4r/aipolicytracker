faq:
  - question: Is there a federal AI law in the United States?
    answer: >
      No comprehensive federal AI statute exists. Federal policy is set by executive orders, OMB memoranda binding
      on agencies, and enforcement of existing laws. Binding AI-specific rules for businesses come mainly from
      state legislation.
  - question: Which US states have AI laws?
    answer: >
      Colorado (SB 24-205, algorithmic discrimination), California (including SB 53 on frontier-model transparency
      and privacy-agency rules on automated decision-making), Texas (HB 149), Utah and others. Effective dates
      and scope differ, and several have been amended; check each record's official source.
