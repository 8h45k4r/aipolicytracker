overview: >
  The United States has no comprehensive federal AI statute. Federal policy is set through executive orders, Office
  of Management and Budget (OMB) memoranda for federal agencies, agency enforcement under existing consumer-protection,
  civil-rights, employment and financial laws, and voluntary frameworks such as the NIST AI Risk Management Framework.
  States have moved faster: Colorado enacted the first cross-sector algorithmic-discrimination law in 2024, and
  California, Texas, Utah and others have adopted AI-specific statutes on transparency, frontier models, chatbots
  and government use. The result is a patchwork that organisations must map state by state and sector by sector.
regulatory_status_summary: >
  Federal: executive-branch policy (Executive Order 14179 of January 2025 and the July 2025 AI Action Plan) plus
  binding OMB requirements for federal agencies' use and procurement of AI; NIST AI RMF is voluntary. States:
  a growing number of binding statutes with 2025–2026 effective dates. A reviewer must confirm the status of
  federal efforts to pre-empt or discourage state AI laws announced in late 2025.
binding_vs_guidance: >
  Binding on the private sector: state statutes (for example Colorado SB 24-205, California SB 53, Texas HB 149),
  sector laws (FCRA, ECOA, Title VII, HIPAA, FTC Act Section 5) as applied to AI. Binding on federal agencies:
  OMB memoranda M-25-21 and M-25-22. Voluntary: NIST AI RMF and its Generative AI Profile.
current_priorities: >
  Federal deregulatory agenda and infrastructure build-out under the AI Action Plan, agency AI use-case inventories
  and procurement rules, state implementation of algorithmic-discrimination and frontier-model transparency laws,
  and litigation and enforcement by state attorneys general and the FTC on deceptive AI claims.
how_to_use:
  - Map the states where your users or employees are located; state law, not federal law, creates most binding AI duties.
  - Treat NIST AI RMF as the common vocabulary for governance evidence that regulators and customers recognise.
  - If you sell to the federal government, align with OMB M-25-21 and M-25-22 requirements for high-impact AI.
  - Apply existing anti-discrimination, consumer-protection and privacy laws to AI decisions; they are enforced today.
  - Check effective dates carefully; several state laws were delayed or amended after enactment.
