overview: >-
  Albania has announced an AI strategy process and uses AI in public services (including an EU-accession document-screening
  tool); no adopted AI-specific law or published national strategy has been recorded. General law (data protection where
  enacted, consumer, telecommunications and sector rules) applies to AI systems. This record exists so that coverage is
  complete and honest: it will be expanded when an official AI instrument is published or a reviewer adds one with its source.
