overview: >-
  Romania applies the EU AI Act and adopted a National Strategy for Artificial Intelligence 2024–2027 by government decision
  in July 2024, coordinated by the Ministry of Research, Innovation and Digitalisation with the Authority for Digitalisation
  of Romania (ADR). The National Supervisory Authority for Personal Data Processing is the data-protection authority; AI
  Act market-surveillance designation is in progress.
regulatory_status_summary: EU AI Act applies; National AI Strategy 2024–2027 adopted; authority designation in progress.
binding_vs_guidance: 'Binding: none recorded. Strategy or guidance: National AI Strategy 2024–2027.'
how_to_use:
- >-
  Start from the EU AI Act record for obligations; use this page for the national authorities, penalties and strategy.
- Open the official source on each instrument before relying on any date or obligation.
- >-
  Check national data-protection, employment and consumer law that applies to AI systems regardless of the AI Act.
