overview: >-
  This initiative, signed by a bloc of Morena and PVEM deputies and published in the Gaceta Parlamentaria on 30
  April 2025, would create Mexico's first general federal AI law. Mexico's National AI Plan, prepared by the ATDT
  and presented in April 2026, organises federal AI efforts around three pillars: an ethical and legal framework,
  talent and public software, and strategic compute infrastructure.
