overview: >-
  Panama's National Authority for Government Innovation (AIG) leads AI policy under the Digital Agenda; a bill to regulate
  AI (2024) was introduced in the National Assembly, and the Personal Data Protection Law 81 of 2019 applies to AI processing
  personal data. UNESCO's readiness assessment informed a national AI strategy process in 2024–2025.
regulatory_status_summary: AI bill under consideration; national AI strategy in development; data-protection law applies.
binding_vs_guidance: 'Binding: none recorded. Strategy or guidance: National AI strategy (in development).'
how_to_use:
- Open the official source on each instrument before relying on any date or obligation.
- Treat strategies and guidance as signals of coming regulation, not as binding requirements.
- >-
  Check data-protection, consumer, employment and sector law that applies to AI systems regardless of AI-specific instruments.
