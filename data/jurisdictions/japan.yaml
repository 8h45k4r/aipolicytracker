overview: >-
  The AI Guidelines for Business consolidate Japan's previous AI R&D, utilisation and governance guidelines into
  a single non-binding document addressed to AI developers, providers and business users. Japan's first AI-specific
  statute establishes basic principles and a governmental framework for promoting AI research, development and use.
  The AI Basic Plan is the national strategy required under Article 18 of the 2025 AI Act.
regulatory_status_summary: >-
  Instruments on record: AI Guidelines for Business (2024, guidance, guidance); Act on Promotion of Research and
  Development, and Utilization of Artificial Intelligence-related Technology (2025, act, in force); Artificial Intelligence
  Basic Plan (2025, strategy, adopted). Each is linked to its official source; human verification pending.
binding_vs_guidance: >-
  Binding: Act on Promotion of Research and Development, and Utilization of Artificial Intelligence-related Technology.
  Strategy or guidance: AI Guidelines for Business, Artificial Intelligence Basic Plan.
how_to_use:
- Open the official source on each instrument before relying on any date or obligation.
- >-
  Treat strategies and guidance as signals of coming regulation, not as binding requirements.
