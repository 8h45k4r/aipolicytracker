overview: >-
  Slovenia applies the EU AI Act, adopted the National Programme for the Promotion of the Development and Use of AI to 2025
  (NpUI) in 2021, hosts the UNESCO International Research Centre on AI (IRCAI) in Ljubljana, and coordinates AI policy through
  the Ministry of Digital Transformation.
regulatory_status_summary: EU AI Act applies; national AI programme (2021) as policy; IRCAI hosted.
binding_vs_guidance: 'Binding: none recorded. Strategy or guidance: National AI Programme to 2025 (NpUI).'
how_to_use:
- >-
  Start from the EU AI Act record for obligations; use this page for the national authorities, penalties and strategy.
- Open the official source on each instrument before relying on any date or obligation.
- >-
  Check national data-protection, employment and consumer law that applies to AI systems regardless of the AI Act.
