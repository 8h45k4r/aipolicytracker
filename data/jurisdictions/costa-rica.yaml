overview: >-
  Costa Rica launched its National Artificial Intelligence Strategy 2024–2027 in October 2024 through the Ministry of Science,
  Innovation, Technology and Telecommunications (MICITT), built on the UNESCO readiness assessment and OECD principles,
  and a draft AI regulation bill (Expediente 23.771) is before the Legislative Assembly. Costa Rica was the first Central
  American country to complete UNESCO's Readiness Assessment Methodology.
regulatory_status_summary: National AI strategy 2024–2027 adopted; AI bill under consideration in the Legislative Assembly.
binding_vs_guidance: 'Binding: none recorded. Strategy or guidance: National AI Strategy 2024–2027.'
how_to_use:
- Open the official source on each instrument before relying on any date or obligation.
- Treat strategies and guidance as signals of coming regulation, not as binding requirements.
- >-
  Check data-protection, consumer, employment and sector law that applies to AI systems regardless of AI-specific instruments.
