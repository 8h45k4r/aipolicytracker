overview: >-
  France applies the EU AI Act and has built its national approach around a national AI strategy launched in 2018 (successive
  phases to 2025), strong involvement of the data-protection authority CNIL, which publishes practical how-to sheets on
  AI and data protection, and the AI Action Summit hosted in Paris in February 2025. France has proposed CNIL, the competition
  and consumer authority (DGCCRF) and ARCOM among its AI Act competent authorities.
regulatory_status_summary: >-
  EU AI Act applies; national AI strategy (phases since 2018) as policy; CNIL AI guidance; competent-authority designation
  in progress.
binding_vs_guidance: 'Binding: none recorded. Strategy or guidance: National AI strategy; CNIL AI how-to sheets.'
current_priorities: >-
  AI Act authority designation, compute and sovereign model investment, public-sector AI use, CNIL guidance on training
  data and GDPR compliance.
how_to_use:
- >-
  Start from the EU AI Act record for obligations; use this page for the national authorities, penalties and strategy.
- Open the official source on each instrument before relying on any date or obligation.
- >-
  Check national data-protection, employment and consumer law that applies to AI systems regardless of the AI Act.
