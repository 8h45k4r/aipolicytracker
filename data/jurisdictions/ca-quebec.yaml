overview: >-
  Quebec's Law 25 (Act to modernize legislative provisions as regards the protection of personal information, 2021) introduced
  Canada's first statutory rules on automated decision-making: from September 2023 organisations must inform individuals
  when a decision is based exclusively on automated processing, on request explain the personal information and principal
  factors used and allow observations, and must conduct privacy impact assessments and give notice of biometric identification
  systems. The Commission d'accès à l'information enforces it with GDPR-scale penalties.
regulatory_status_summary: Law 25 automated-decision and biometric provisions in force since September 2023.
binding_vs_guidance: 'Binding: Quebec Law 25 (automated decisions and biometrics). Strategy or guidance: none recorded.'
