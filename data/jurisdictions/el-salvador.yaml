overview: >-
  El Salvador enacted a Law for the Promotion of Artificial Intelligence and Emerging Technologies in February 2025, one
  of the first AI-specific laws in Latin America, creating an Agency for AI (ANIA) and liability safe harbours for developers
  acting in good faith. General law (data protection where enacted, consumer, telecommunications and sector rules) applies
  to AI systems. This record exists so that coverage is complete and honest: it will be expanded when an official AI instrument
  is published or a reviewer adds one with its source.
