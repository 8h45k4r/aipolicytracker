overview: >-
  Mauritius published one of Africa's first national AI strategies in 2018 (Mauritius Artificial Intelligence Strategy)
  and an AI Council; the Data Protection Act 2017 and the Data Protection Office apply to AI processing personal data, and
  the 2024–2025 digital transformation blueprint updates AI priorities.
regulatory_status_summary: National AI strategy (2018) as policy; data-protection law applies; no AI-specific law.
binding_vs_guidance: 'Binding: none recorded. Strategy or guidance: Mauritius AI Strategy (2018).'
how_to_use:
- Open the official source on each instrument before relying on any date or obligation.
- Treat strategies and guidance as signals of coming regulation, not as binding requirements.
- >-
  Check data-protection, consumer, employment and sector law that applies to AI systems regardless of AI-specific instruments.
- >-
  Use the African Union Continental AI Strategy (2024) as the regional reference where a national instrument is missing.
