overview: >-
  Finland was among the first countries with a national AI programme ("Finland's Age of Artificial Intelligence", 2017)
  and followed with the AI 4.0 programme for industry. It applies the EU AI Act; the government proposed the Finnish Transport
  and Communications Agency (Traficom) as the coordinating market-surveillance authority, with the Data Protection Ombudsman
  and sector authorities in their fields. The Finnish Center for Artificial Intelligence and the free "Elements of AI" course
  are internationally known public-education initiatives.
regulatory_status_summary: EU AI Act applies; national implementing act proposed; AI programmes since 2017 as policy.
binding_vs_guidance: 'Binding: none recorded. Strategy or guidance: Finland''s Age of Artificial Intelligence (2017).'
current_priorities: >-
  AI Act implementation act and Traficom set-up, industrial AI (AI 4.0), public-sector AI and data spaces.
how_to_use:
- >-
  Start from the EU AI Act record for obligations; use this page for the national authorities, penalties and strategy.
- Open the official source on each instrument before relying on any date or obligation.
- >-
  Check national data-protection, employment and consumer law that applies to AI systems regardless of the AI Act.
