overview: >-
  Greece applies the EU AI Act, has an AI Advisory Committee to the Prime Minister that delivered a "Blueprint for Greece's
  AI transformation" in November 2024, and adopted AI provisions in Law 4961/2022 on emerging technologies, which set transparency
  and governance duties for public-sector AI and obligations for large companies using AI in employment. The Hellenic Data
  Protection Authority and the National Cybersecurity Authority are among the proposed AI Act authorities.
regulatory_status_summary: >-
  EU AI Act applies; Law 4961/2022 provisions on AI in the public sector and employment in force; AI blueprint (2024) as
  policy.
binding_vs_guidance: >-
  Binding: Law 4961/2022 (emerging technologies, AI chapter). Strategy or guidance: Blueprint for Greece's AI transformation
  (2024).
how_to_use:
- >-
  Start from the EU AI Act record for obligations; use this page for the national authorities, penalties and strategy.
- Open the official source on each instrument before relying on any date or obligation.
- >-
  Check national data-protection, employment and consumer law that applies to AI systems regardless of the AI Act.
