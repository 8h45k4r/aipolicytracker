faq:
- question: Which international AI instrument is binding?
  answer: >-
    None of the instruments on this page binds organisations directly. The Council of Europe Framework Convention (separate
    page) binds ratifying states; ISO/IEC 42001 becomes binding only through contracts or procurement.
