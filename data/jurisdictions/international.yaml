slug: international
name: International organisations (OECD, UNESCO, UN, G7, ISO)
short_name: International
jurisdiction_type: supranational
region: International
featured: true
published: true
overview: >-
  Cross-border instruments that shape national AI policy without being national law: the OECD Recommendation on AI (2019,
  revised 2024) whose definition of an AI system is used by the EU AI Act; the UNESCO Recommendation on the Ethics of AI
  (2021) adopted by 193 states; the UN General Assembly's first AI resolution (March 2024) and the 2025 resolution creating
  a Global Dialogue on AI Governance and an Independent International Scientific Panel; the G7 Hiroshima Process code of
  conduct for advanced AI developers (2023); the Bletchley Declaration from the first AI Safety Summit (2023); and ISO/IEC
  42001, the certifiable AI management-system standard (2023).
regulatory_status_summary: >-
  Non-binding recommendations, declarations and a voluntary standard; binding effect arises only through national implementation
  or contractual adoption.
binding_vs_guidance: >-
  Binding: none recorded. Strategy or guidance: OECD AI Principles (Recommendation on AI); UNESCO Recommendation on the
  Ethics of AI; UN General Assembly resolution 78/265 on safe, secure and trustworthy AI; G7 Hiroshima AI Process code of
  conduct; Bletchley Declaration (AI Safety Summit 2023); ISO/IEC 42001:2023 AI management system.
how_to_use:
- >-
  Use these instruments to interpret national law and to design governance that will travel across jurisdictions.
- ISO/IEC 42001 is the only certifiable instrument here; treat the rest as principles.
- Open the official source for each instrument; this site does not reproduce standard text.
