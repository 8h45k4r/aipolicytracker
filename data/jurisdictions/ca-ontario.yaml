overview: >-
  Ontario enacted the Enhancing Digital Security and Trust Act, 2024 (Bill 194), which lets the government regulate public-sector
  use of AI (disclosure, accountability frameworks, risk management, prohibited uses) and the Working for Workers Four Act,
  2024, which from 1 January 2026 requires employers with 25 or more employees to state in publicly advertised job postings
  whether AI is used to screen, assess or select applicants.
regulatory_status_summary: >-
  Public-sector AI framework act (2024) with regulations to follow; job-posting AI disclosure in force from January 2026.
binding_vs_guidance: >-
  Binding: Ontario Enhancing Digital Security and Trust Act, 2024 (Bill 194); Ontario Working for Workers Four Act (AI disclosure
  in job postings). Strategy or guidance: none recorded.
how_to_use:
- Open the official source on each instrument before relying on any date or obligation.
- Treat strategies and guidance as signals of coming regulation, not as binding requirements.
- >-
  Check data-protection, consumer, employment and sector law that applies to AI systems regardless of AI-specific instruments.
