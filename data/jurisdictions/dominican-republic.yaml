overview: >-
  The Dominican Republic adopted a National Artificial Intelligence Strategy (ENIA) in 2023 through the Government Office
  of Information and Communication Technologies (OGTIC), positioning the country as a regional AI hub with priorities in
  public services, talent and ethics, and joined the Latin American AI index and UNESCO readiness processes.
regulatory_status_summary: National AI strategy (2023) as policy; no AI-specific law.
binding_vs_guidance: 'Binding: none recorded. Strategy or guidance: National AI Strategy (ENIA).'
how_to_use:
- Open the official source on each instrument before relying on any date or obligation.
- Treat strategies and guidance as signals of coming regulation, not as binding requirements.
- >-
  Check data-protection, consumer, employment and sector law that applies to AI systems regardless of AI-specific instruments.
