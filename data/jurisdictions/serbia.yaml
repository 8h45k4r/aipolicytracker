overview: >-
  Serbia, an EU candidate, adopted the first AI development strategy in the Western Balkans in 2019 (2020–2025), ethical
  guidelines for AI in 2023, and a new AI Development Strategy 2025–2030 in 2025, and has been drafting a law on artificial
  intelligence aligned with the EU AI Act. The Office for IT and eGovernment and the Institute for AI Research and Development
  of Serbia lead implementation.
regulatory_status_summary: >-
  AI strategy 2025–2030 adopted; ethical guidelines (2023); AI law in preparation; EU AI Act alignment as a candidate country.
binding_vs_guidance: >-
  Binding: none recorded. Strategy or guidance: AI Development Strategy 2025–2030; Ethical guidelines for trustworthy AI
  (2023).
how_to_use:
- Open the official source on each instrument before relying on any date or obligation.
- Treat strategies and guidance as signals of coming regulation, not as binding requirements.
- >-
  Check data-protection, consumer, employment and sector law that applies to AI systems regardless of AI-specific instruments.
