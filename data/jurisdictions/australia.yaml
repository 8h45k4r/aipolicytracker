faq:
  - question: Does Australia have an AI Act?
    answer: >
      No. Australia consulted on mandatory guardrails for high-risk AI in 2024, but the December 2025 National AI
      Plan indicated reliance on existing laws. A Voluntary AI Safety Standard is available and federal agencies
      follow a binding government AI policy.
