overview: >
  Australia has no AI-specific statute. After the 2023 "Safe and responsible AI in Australia" consultation and the
  January 2024 interim response, the government published a Voluntary AI Safety Standard and a proposals paper for
  mandatory guardrails in high-risk settings in September 2024. In December 2025 the government released a National
  AI Plan indicating it would rely on strengthening existing laws rather than a standalone AI Act. Federal agencies
  are bound by the Digital Transformation Agency's policy for responsible use of AI in government. Binding
  obligations for business come from the Privacy Act 1988 (including 2024 amendments on automated decisions),
  consumer law, anti-discrimination law and sector regulation.
regulatory_status_summary: >
  No binding cross-sector AI law; mandatory guardrails were consulted on in 2024 but the December 2025 National AI
  Plan signalled an existing-law approach. Voluntary AI Safety Standard available. Government agencies follow a
  binding whole-of-government AI policy. A reviewer must confirm the current status of the mandatory-guardrails
  proposal.
binding_vs_guidance: >
  Binding: Privacy Act 1988 and Privacy and Other Legislation Amendment Act 2024 (automated decision transparency
  provisions with delayed commencement), Australian Consumer Law, anti-discrimination Acts, sector rules (APRA,
  ASIC, TGA); the DTA AI policy for federal agencies. Guidance / voluntary: Voluntary AI Safety Standard, AI Ethics
  Principles, OAIC guidance on AI and privacy.
current_priorities: >
  National AI Plan delivery, AI Safety Institute establishment, reform of the Privacy Act, guidance from the OAIC
  and eSafety Commissioner, and government AI assurance.
how_to_use:
  - Use the Voluntary AI Safety Standard's ten guardrails as the baseline expected by Australian regulators and buyers.
  - Apply the Privacy Act, including the new automated-decision transparency provisions, to AI using personal information.
  - If you supply the federal government, align with the DTA policy for responsible use of AI in government.
