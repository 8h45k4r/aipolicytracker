overview: >-
  Illinois regulates AI in employment through two laws: the Artificial Intelligence Video Interview Act (2020), which requires
  notice, explanation and consent before AI analyses video interviews, and HB 3773 (Public Act 103-0804, signed August 2024,
  effective 1 January 2026), which amends the Illinois Human Rights Act to make it a civil-rights violation for employers
  to use AI that has a discriminatory effect on protected classes or to use zip codes as a proxy, and requires notice to
  employees when AI is used in employment decisions. The Biometric Information Privacy Act (BIPA, 2008) remains the strictest
  US biometric consent law.
regulatory_status_summary: >-
  AI Video Interview Act in force (2020); HB 3773 employment-AI amendments effective 1 January 2026; BIPA applies to biometric
  AI.
binding_vs_guidance: >-
  Binding: Illinois HB 3773 (AI in employment, Human Rights Act amendment); Illinois AI Video Interview Act. Strategy or
  guidance: none recorded.
how_to_use:
- Open the official source on each instrument before relying on any date or obligation.
- Treat strategies and guidance as signals of coming regulation, not as binding requirements.
- >-
  Check data-protection, consumer, employment and sector law that applies to AI systems regardless of AI-specific instruments.
