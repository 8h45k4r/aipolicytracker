overview: >-
  The Holy See is the home of the Rome Call for AI Ethics (2020) promoted by the Pontifical Academy for Life, and issued
  the doctrinal note "Antiqua et Nova" on AI and human intelligence (January 2025); Vatican City State adopted guidelines
  on AI use in 2024. General law (data protection where enacted, consumer, telecommunications and sector rules) applies
  to AI systems. This record exists so that coverage is complete and honest: it will be expanded when an official AI instrument
  is published or a reviewer adds one with its source.
