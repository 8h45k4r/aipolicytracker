overview: >
  California regulates AI through a set of targeted statutes and privacy rules rather than one AI act. Senate Bill 53,
  the Transparency in Frontier Artificial Intelligence Act signed in September 2025, requires large frontier-model
  developers to publish safety frameworks and report critical safety incidents. The California Privacy Protection
  Agency has adopted regulations on automated decision-making technology under the CCPA, and earlier laws cover
  AI-generated content disclosure, training-data transparency (AB 2013) and AI in healthcare communications.
regulatory_status_summary: >
  Several binding statutes in force or with 2026 effective dates; SB 53 operative from 1 January 2026. The state's
  privacy regulator also enforces automated-decision-making rules. A reviewer must confirm current effective
  dates and any federal pre-emption disputes.
binding_vs_guidance: >
  Binding: SB 53 (frontier models), AB 2013 (training-data transparency), CCPA and CPPA regulations on automated
  decision-making technology, and sector laws. Guidance: Attorney General advisories on AI and existing law.
current_priorities: Frontier-model safety transparency, automated decision-making rules under the CCPA, and AI-generated content provenance.
how_to_use:
  - Check whether you meet SB 53 thresholds for a "large frontier developer".
  - If you process Californians' personal data with automated decision-making technology, review the CPPA regulations.
  - Review disclosure duties for generative-AI outputs and training data.
