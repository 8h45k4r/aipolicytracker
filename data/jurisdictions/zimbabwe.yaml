overview: >-
  Zimbabwe's Ministry of ICT, Postal and Courier Services approved a National AI Policy (2025) under the Smart Zimbabwe
  2030 agenda, and the Cyber and Data Protection Act 2021 with POTRAZ as data-protection authority applies to AI processing
  personal data.
regulatory_status_summary: National AI policy (2025) as policy; data-protection law applies; no AI-specific law.
binding_vs_guidance: 'Binding: none recorded. Strategy or guidance: National AI Policy (2025).'
how_to_use:
- Open the official source on each instrument before relying on any date or obligation.
- Treat strategies and guidance as signals of coming regulation, not as binding requirements.
- >-
  Check data-protection, consumer, employment and sector law that applies to AI systems regardless of AI-specific instruments.
- >-
  Use the African Union Continental AI Strategy (2024) as the regional reference where a national instrument is missing.
