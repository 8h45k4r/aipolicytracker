overview: >-
  Cyprus applies the EU AI Act and adopted a National AI Strategy in 2020, updated with an AI action plan in 2024 under
  the Deputy Ministry of Research, Innovation and Digital Policy; the Commissioner for Personal Data Protection is the data-protection
  authority.
regulatory_status_summary: EU AI Act applies; national AI strategy (2020) and action plan (2024) as policy.
binding_vs_guidance: 'Binding: none recorded. Strategy or guidance: National AI Strategy (2020, action plan 2024).'
how_to_use:
- >-
  Start from the EU AI Act record for obligations; use this page for the national authorities, penalties and strategy.
- Open the official source on each instrument before relying on any date or obligation.
- >-
  Check national data-protection, employment and consumer law that applies to AI systems regardless of the AI Act.
