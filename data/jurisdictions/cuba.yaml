overview: >-
  Cuba adopted a national strategy for the development and use of artificial intelligence and, in 2024, a Ministry of Communications
  resolution on AI ethics and use in the public sector; implementation is led by the Ministry of Communications and the
  University of Informatics Sciences.
regulatory_status_summary: National AI strategy and ministerial resolution (2024) as policy.
binding_vs_guidance: 'Binding: none recorded. Strategy or guidance: National AI strategy (2024).'
how_to_use:
- Open the official source on each instrument before relying on any date or obligation.
- Treat strategies and guidance as signals of coming regulation, not as binding requirements.
- >-
  Check data-protection, consumer, employment and sector law that applies to AI systems regardless of AI-specific instruments.
