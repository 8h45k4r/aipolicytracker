overview: >-
  A prime ministerial decision promulgating Vietnam's national AI strategy to 2030. Vietnam's first dedicated AI
  statute, with eight chapters and 35 articles governing the research, development, provision, deployment and use
  of AI systems.
regulatory_status_summary: >-
  Instruments on record: National Strategy on Research, Development and Application of Artificial Intelligence to
  2030 (2021, strategy, adopted); Law on Artificial Intelligence (2025, act, in force). Each is linked to its official
  source; human verification pending.
