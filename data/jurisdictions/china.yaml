overview: >-
  These measures govern generative AI services offered to the public in China, whether producing text, images, audio
  or video. These measures require providers of AI generation and synthesis services to attach explicit labels (visible
  text, audio or graphic notices) and implicit labels (embedded metadata) to generated text, images, audio, video
  and virtual scenes. This State Council policy document (Guofa [2025] No.
regulatory_status_summary: >-
  Instruments on record: Interim Measures for the Management of Generative Artificial Intelligence Services (2023,
  regulation, in force); Measures for Labeling Artificial Intelligence-Generated and Synthetic Content (2025, regulation,
  in force); Opinions of the State Council on Deepening the Implementation of the 'AI Plus' Action (2025, strategy,
  adopted). Each is linked to its official source; human verification pending.
binding_vs_guidance: >-
  Binding: Interim Measures for the Management of Generative Artificial Intelligence Services, Measures for Labeling
  Artificial Intelligence-Generated and Synthetic Content. Strategy or guidance: Opinions of the State Council on
  Deepening the Implementation of the 'AI Plus' Action.
