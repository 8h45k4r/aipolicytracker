overview: >-
  PL 2338/2023 is Brazil's flagship AI bill, introduced in the Senate in May 2023 and approved by the Senate plenary
  on 10 December 2024 after extensive amendment. The PBIA is a four-year national plan that commits around R$23
  billion to AI infrastructure, skills, public-sector applications, business innovation and governance.
