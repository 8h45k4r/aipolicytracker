overview: >-
  Bulgaria applies the EU AI Act and adopted a "Concept for the development of artificial intelligence in Bulgaria until
  2030" in December 2020, coordinated by the Ministry of Transport, Information Technology and Communications (now the Ministry
  of e-Government). The Commission for Personal Data Protection is the data-protection authority; AI Act authority designation
  is in progress.
regulatory_status_summary: EU AI Act applies; AI concept to 2030 (2020) as policy.
binding_vs_guidance: 'Binding: none recorded. Strategy or guidance: Concept for the development of AI until 2030.'
how_to_use:
- >-
  Start from the EU AI Act record for obligations; use this page for the national authorities, penalties and strategy.
- Open the official source on each instrument before relying on any date or obligation.
- >-
  Check national data-protection, employment and consumer law that applies to AI systems regardless of the AI Act.
