overview: >-
  Ecuador's National Assembly has been considering an Organic Law for the Regulation and Promotion of Artificial Intelligence
  (introduced 2024) that would set a risk-based framework, and the Ministry of Telecommunications published an AI policy
  framework in 2025; the Personal Data Protection Law (2021) and its Superintendency apply to AI processing personal data.
regulatory_status_summary: AI bill under consideration; data-protection law applies; national AI policy in development.
binding_vs_guidance: 'Binding: Draft Organic Law on AI. Strategy or guidance: none recorded.'
how_to_use:
- Open the official source on each instrument before relying on any date or obligation.
- Treat strategies and guidance as signals of coming regulation, not as binding requirements.
- >-
  Check data-protection, consumer, employment and sector law that applies to AI systems regardless of AI-specific instruments.
