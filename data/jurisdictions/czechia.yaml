overview: >-
  Czechia applies the EU AI Act, has adopted a National AI Strategy 2030 (July 2024) replacing the 2019 strategy, and has
  proposed the Czech Telecommunication Office (ČTÚ) as the AI Act market-surveillance authority with the Office for Personal
  Data Protection and sector bodies in their fields.
regulatory_status_summary: EU AI Act applies; National AI Strategy 2030 (2024); authority designation in progress.
binding_vs_guidance: 'Binding: none recorded. Strategy or guidance: National AI Strategy 2030.'
how_to_use:
- >-
  Start from the EU AI Act record for obligations; use this page for the national authorities, penalties and strategy.
- Open the official source on each instrument before relying on any date or obligation.
- >-
  Check national data-protection, employment and consumer law that applies to AI systems regardless of the AI Act.
