overview: >-
  Poland applies the EU AI Act and has drafted a national implementing act creating a new Commission for the Development
  and Safety of Artificial Intelligence (Komisja Rozwoju i Bezpieczeństwa Sztucznej Inteligencji) as market-surveillance
  authority. The 2020 "Policy for the development of AI in Poland from 2020" is the national strategy; the Ministry of Digital
  Affairs leads implementation.
regulatory_status_summary: EU AI Act applies; national implementing bill proposed (2024–2025); AI development policy (2020).
binding_vs_guidance: >-
  Binding: Draft act on AI systems (AI Act implementation). Strategy or guidance: Policy for the development of AI in Poland
  (2020).
how_to_use:
- >-
  Start from the EU AI Act record for obligations; use this page for the national authorities, penalties and strategy.
- Open the official source on each instrument before relying on any date or obligation.
- >-
  Check national data-protection, employment and consumer law that applies to AI systems regardless of the AI Act.
