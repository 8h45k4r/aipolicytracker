overview: >-
  Malta applies the EU AI Act and adopted the "Malta: The Ultimate AI Launchpad" strategy and vision for 2030 in 2019, with
  the Malta Digital Innovation Authority (MDIA) running a voluntary AI certification framework and proposed as national
  AI Act authority.
regulatory_status_summary: EU AI Act applies; AI strategy 2030 (2019) as policy; MDIA certification voluntary.
binding_vs_guidance: 'Binding: none recorded. Strategy or guidance: Malta AI Strategy and Vision 2030.'
how_to_use:
- >-
  Start from the EU AI Act record for obligations; use this page for the national authorities, penalties and strategy.
- Open the official source on each instrument before relying on any date or obligation.
- >-
  Check national data-protection, employment and consumer law that applies to AI systems regardless of the AI Act.
