overview: >-
  Israel published its national AI regulation and ethics policy in December 2023 (Ministry of Innovation, Science and Technology
  with the Ministry of Justice), choosing a sector-based, risk-based and voluntary approach with common ethical principles,
  soft regulation tools and a government AI policy coordination centre rather than a horizontal AI law. The Privacy Protection
  Authority issued guidance on AI and privacy, and Israel signed the Council of Europe Framework Convention.
regulatory_status_summary: >-
  National AI policy (2023) as policy; sector regulators act within existing law; no horizontal AI statute.
binding_vs_guidance: 'Binding: none recorded. Strategy or guidance: AI regulation and ethics policy (2023).'
how_to_use:
- Open the official source on each instrument before relying on any date or obligation.
- Treat strategies and guidance as signals of coming regulation, not as binding requirements.
- >-
  Check data-protection, consumer, employment and sector law that applies to AI systems regardless of AI-specific instruments.
