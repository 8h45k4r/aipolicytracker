overview: >-
  Malaysia's five-year AI roadmap developed by MOSTI through a quadruple-helix consultation. Voluntary national
  guidelines that set out seven principles for responsible AI: fairness; reliability, safety and control; privacy
  and security; inclusiveness; transparency; accountability; and human-centricity. A proposed horizontal AI law
  announced for stakeholder engagement and public consultation by the Ministry of Digital through the National AI
  Office.
regulatory_status_summary: >-
  Instruments on record: National Artificial Intelligence Roadmap 2021-2025 (2021, strategy, adopted); The National
  Guidelines on AI Governance & Ethics (2024, guidance, guidance); Artificial Intelligence (2026, bill, proposed).
  Each is linked to its official source; human verification pending.
binding_vs_guidance: >-
  Binding: none recorded. Strategy or guidance: National Artificial Intelligence Roadmap 2021-2025, The National
  Guidelines on AI Governance & Ethics, Artificial Intelligence.
how_to_use:
- Open the official source on each instrument before relying on any date or obligation.
