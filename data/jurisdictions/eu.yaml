overview: >
  The European Union has the world's first comprehensive, binding, cross-sector AI law: Regulation (EU) 2024/1689,
  the Artificial Intelligence Act. It entered into force on 1 August 2024 and applies in phases between February
  2025 and August 2027. The AI Act sits alongside the GDPR, product-safety law, the Digital Services Act and
  sector rules, all of which continue to apply to AI systems. The European Commission's AI Office supervises
  general-purpose AI models, while national market-surveillance authorities supervise most other obligations.
regulatory_status_summary: >
  Binding regulation in force and partially applicable. Prohibited practices and AI-literacy duties apply since
  2 February 2025; general-purpose AI model obligations and the governance and penalties chapters since
  2 August 2025; most remaining obligations, including Annex III high-risk requirements, are scheduled from
  2 August 2026, with high-risk AI embedded in Annex I regulated products from 2 August 2027. A Commission
  "Digital Omnibus" proposal published in November 2025 would adjust some high-risk application dates; its
  adoption status must be checked against the official sources linked below.
binding_vs_guidance: >
  Binding: the AI Act, the GDPR, the Product Liability Directive (as revised in 2024), and sector legislation.
  Non-binding but official: Commission guidelines on prohibited practices and on general-purpose AI, the
  General-Purpose AI Code of Practice, and harmonised standards being drafted by CEN-CENELEC JTC 21.
current_priorities: >
  Harmonised standards for high-risk AI, guidance on high-risk classification, the AI Office's supervision
  of general-purpose models, designation of national competent authorities and notified bodies, regulatory
  sandboxes in every Member State, and the legislative debate on the Digital Omnibus timing adjustments.
how_to_use:
  - Confirm whether you are a provider, deployer, importer, distributor or authorised representative for each AI system you sell or use in the EU.
  - Screen every AI use against the Article 5 prohibited practices, which already apply.
  - Map each system to the Annex III high-risk areas and Annex I product legislation to decide which obligations and dates apply.
  - Check whether you place a general-purpose AI model on the EU market; if so, Chapter V obligations already apply.
  - Track the Digital Omnibus proposal and Commission guidelines, because they can change the practical timeline.
  - Record the official source and date for every conclusion, and have counsel review high-risk classifications.
