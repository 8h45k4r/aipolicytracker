faq:
  - question: Is the EU AI Act already in force?
    answer: >
      Yes. It entered into force on 1 August 2024, but its obligations apply in stages. Prohibited practices and
      AI-literacy duties have applied since 2 February 2025, general-purpose AI model duties since 2 August 2025,
      and most other obligations are scheduled from 2 August 2026 under Article 113 of the adopted text.
  - question: Does the EU AI Act apply to companies outside the EU?
    answer: >
      It can. Article 2 covers providers that place AI systems or general-purpose models on the EU market or put
      them into service in the EU, regardless of where they are established, and providers and deployers in third
      countries where the output of the system is used in the EU.
  - question: Which EU rules apply to AI besides the AI Act?
    answer: >
      The GDPR applies whenever personal data is processed, including Article 22 on automated decisions. Product
      safety, consumer, non-discrimination, copyright and sector laws (for example for medical devices or financial
      services) continue to apply, and the Digital Services Act covers online platforms.
