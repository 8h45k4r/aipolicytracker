overview: >-
  Latvia applies the EU AI Act; the Ministry of Environmental Protection and Regional Development coordinates digital and
  AI policy, and the government approved an informational report on AI development in 2020 followed by AI measures in the
  Digital Transformation Guidelines 2021–2027. A national AI centre (2025) and the designation of AI Act authorities are
  in progress.
regulatory_status_summary: EU AI Act applies; AI development report (2020) and digital transformation guidelines as policy.
binding_vs_guidance: 'Binding: none recorded. Strategy or guidance: Informational report on AI development (2020).'
how_to_use:
- >-
  Start from the EU AI Act record for obligations; use this page for the national authorities, penalties and strategy.
- Open the official source on each instrument before relying on any date or obligation.
- >-
  Check national data-protection, employment and consumer law that applies to AI systems regardless of the AI Act.
