overview: >-
  Paraguay's Ministry of Information and Communication Technologies (MITIC) presented a National Artificial Intelligence
  Policy in 2024 based on UNESCO's readiness assessment, and bills on AI have been introduced in Congress; the Personal
  Data Protection Law (2024) applies to AI processing personal data.
regulatory_status_summary: National AI policy (2024) as policy; AI bills under consideration.
binding_vs_guidance: 'Binding: none recorded. Strategy or guidance: National AI Policy (2024).'
how_to_use:
- Open the official source on each instrument before relying on any date or obligation.
- Treat strategies and guidance as signals of coming regulation, not as binding requirements.
- >-
  Check data-protection, consumer, employment and sector law that applies to AI systems regardless of AI-specific instruments.
