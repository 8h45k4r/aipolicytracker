overview: >-
  Tanzania's Ministry of Information, Communication and Information Technology has been preparing a National AI Strategy
  and issued AI guidelines for the public sector (2024–2025); the Personal Data Protection Act 2022 and the Personal Data
  Protection Commission apply.
regulatory_status_summary: National AI strategy in development; data-protection law applies; no AI-specific law.
binding_vs_guidance: 'Binding: none recorded. Strategy or guidance: National AI strategy (in development).'
how_to_use:
- Open the official source on each instrument before relying on any date or obligation.
- Treat strategies and guidance as signals of coming regulation, not as binding requirements.
- >-
  Check data-protection, consumer, employment and sector law that applies to AI systems regardless of AI-specific instruments.
- >-
  Use the African Union Continental AI Strategy (2024) as the regional reference where a national instrument is missing.
