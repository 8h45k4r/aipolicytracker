overview: >-
  Disposición 2/2023 approves a set of recommendations for trustworthy AI addressed to projects designed, developed
  or adopted by the national public sector, together with a diagram of the stages of an AI project. This administrative
  decision restructures the Interministerial Board on AI originally created in 2023, placing it under the presidency
  of the Secretariat of Innovation, Science and Technology and expanding its membership to ministries including
  Defence, Economy, Foreign Affairs, Health, Security, Human Capital, Justice and State Deregulation.
