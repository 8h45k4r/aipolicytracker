overview: >-
  Iceland, an EEA member, will incorporate the EU AI Act through the EEA Agreement. The government adopted an AI policy
  in 2021 and an AI action plan for 2024–2026 focused on public services, the Icelandic language, skills and ethics; the
  Ministry of Higher Education, Science and Innovation leads.
regulatory_status_summary: EU AI Act to be incorporated via the EEA; AI policy (2021) and action plan 2024–2026 as policy.
binding_vs_guidance: 'Binding: none recorded. Strategy or guidance: AI action plan 2024–2026.'
how_to_use:
- Open the official source on each instrument before relying on any date or obligation.
- Treat strategies and guidance as signals of coming regulation, not as binding requirements.
- >-
  Check data-protection, consumer, employment and sector law that applies to AI systems regardless of AI-specific instruments.
