overview: >-
  Kazakhstan adopted a Law on Artificial Intelligence in November 2025, the first dedicated AI law in Central Asia, setting
  principles, a risk-based classification, obligations for owners and operators of AI systems, transparency for AI-generated
  content and a national AI platform, implemented by the Ministry of Artificial Intelligence and Digital Development. It
  follows the Concept for AI development 2024–2029 (July 2024).
regulatory_status_summary: Law on AI adopted (2025); AI development concept 2024–2029 as policy.
binding_vs_guidance: >-
  Binding: Law on Artificial Intelligence (2025). Strategy or guidance: Concept for AI development 2024–2029.
how_to_use:
- Open the official source on each instrument before relying on any date or obligation.
- Treat strategies and guidance as signals of coming regulation, not as binding requirements.
- >-
  Check data-protection, consumer, employment and sector law that applies to AI systems regardless of AI-specific instruments.
