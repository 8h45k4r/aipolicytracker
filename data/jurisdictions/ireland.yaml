overview: >-
  Ireland applies the EU AI Act and hosts the European headquarters of many large AI and platform companies, which gives
  the Irish Data Protection Commission a central role in GDPR enforcement affecting AI training. The national AI strategy
  "AI – Here for Good" (2021, refreshed 2024) frames a people-centred approach; the government designated an initial set
  of competent authorities for the AI Act in 2024–2025 and is establishing a national AI office within the Department of
  Enterprise.
regulatory_status_summary: EU AI Act applies; competent authorities designated in phases; national AI strategy refreshed
  2024.
binding_vs_guidance: 'Binding: none recorded. Strategy or guidance: AI – Here for Good (National AI Strategy).'
current_priorities: >-
  Setting up the national AI office and distributed supervision model, public-sector AI guidelines, GDPR enforcement on
  AI training data.
how_to_use:
- >-
  Start from the EU AI Act record for obligations; use this page for the national authorities, penalties and strategy.
- Open the official source on each instrument before relying on any date or obligation.
- >-
  Check national data-protection, employment and consumer law that applies to AI systems regardless of the AI Act.
