overview: >-
  The Council of Europe adopted the first legally binding international treaty on AI, the Framework Convention on Artificial
  Intelligence and Human Rights, Democracy and the Rule of Law (CETS No. 225), on 17 May 2024; it opened for signature in
  Vilnius on 5 September 2024 and has been signed by the EU, the United Kingdom, the United States, Canada, Japan, Israel
  and others. It requires parties to adopt measures so that AI activities are consistent with human rights, democracy and
  the rule of law, using a risk- and impact-based approach, and is supplemented by the HUDERIA risk and impact assessment
  methodology (2024).
regulatory_status_summary: >-
  Framework Convention adopted and open for signature; entry into force depends on ratifications; HUDERIA methodology adopted.
binding_vs_guidance: >-
  Binding: Framework Convention on AI (CETS 225). Strategy or guidance: HUDERIA risk and impact assessment methodology.
how_to_use:
- >-
  Use the Convention to anticipate obligations that signatory states will implement through national law; it binds states,
  not companies directly.
- >-
  Open the treaty office page to check current signatures and ratifications before citing entry into force.
- Use HUDERIA as a reference methodology for human-rights impact assessment of AI systems.
