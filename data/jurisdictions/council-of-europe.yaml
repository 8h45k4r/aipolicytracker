faq:
- question: Is the Council of Europe AI Convention binding on companies?
  answer: >-
    It binds the states (and the EU) that ratify it; they must implement its principles through domestic measures. Companies
    feel it through national law, including the EU AI Act which the EU treats as its implementation.
