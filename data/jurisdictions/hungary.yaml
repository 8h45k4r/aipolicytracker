overview: >-
  Hungary applies the EU AI Act and adopted a national AI Strategy in 2020 coordinated by the AI Coalition and the Ministry
  for Innovation and Technology (now the Ministry for National Economy and the Digital Hungary Agency). The National Authority
  for Data Protection and Freedom of Information (NAIH) is the data-protection authority; AI Act authority designation is
  in progress.
regulatory_status_summary: EU AI Act applies; national AI strategy (2020) as policy.
binding_vs_guidance: 'Binding: none recorded. Strategy or guidance: AI Strategy 2020–2030.'
how_to_use:
- >-
  Start from the EU AI Act record for obligations; use this page for the national authorities, penalties and strategy.
- Open the official source on each instrument before relying on any date or obligation.
- >-
  Check national data-protection, employment and consumer law that applies to AI systems regardless of the AI Act.
