overview: >-
  Switzerland is outside the EU and does not apply the AI Act. In February 2025 the Federal Council decided its approach:
  ratify the Council of Europe Framework Convention on AI, make targeted sector-specific legal changes (transparency, data
  protection, non-discrimination) rather than a horizontal AI law, and rely on non-binding measures such as industry self-regulation;
  a consultation draft was due by the end of 2026. The 2020 guidelines on AI for the Federal Administration and the Competence
  Network for AI (CNAI) guide public-sector use.
regulatory_status_summary: >-
  No horizontal AI law; Federal Council approach (2025): Council of Europe convention plus sector rules; federal AI guidelines
  (2020).
binding_vs_guidance: >-
  Binding: none recorded. Strategy or guidance: Federal Council AI regulatory approach (2025); Guidelines on AI for the
  Federal Administration (2020).
current_priorities: >-
  Drafting the ratification and sector-law package, transparency and data-protection rules for AI, CNAI coordination.
how_to_use:
- Open the official source on each instrument before relying on any date or obligation.
- Treat strategies and guidance as signals of coming regulation, not as binding requirements.
- >-
  Check data-protection, consumer, employment and sector law that applies to AI systems regardless of AI-specific instruments.
