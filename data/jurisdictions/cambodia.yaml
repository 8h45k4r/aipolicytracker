overview: >-
  Cambodia's Ministry of Post and Telecommunications and the Ministry of Industry, Science, Technology and Innovation have
  prepared a national AI strategy and AI ethics guidance (2024–2025) with UNESCO and ASEAN support; no AI-specific law exists
  and the ASEAN guides apply as regional reference.
regulatory_status_summary: National AI strategy in preparation; ASEAN guides as reference; no AI-specific law.
binding_vs_guidance: 'Binding: none recorded. Strategy or guidance: National AI strategy (in preparation).'
how_to_use:
- Open the official source on each instrument before relying on any date or obligation.
- Treat strategies and guidance as signals of coming regulation, not as binding requirements.
- >-
  Check data-protection, consumer, employment and sector law that applies to AI systems regardless of AI-specific instruments.
