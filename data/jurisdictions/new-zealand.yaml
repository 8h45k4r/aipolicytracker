overview: >-
  New Zealand released its first national AI Strategy in July 2025 (Ministry of Business, Innovation and Employment), taking
  a light-touch, principles-based approach that relies on existing law rather than a dedicated AI act, alongside Responsible
  AI Guidance for Businesses. Public-sector use is guided by the Algorithm Charter for Aotearoa New Zealand (2020) and the
  Public Service AI Framework (2025); the Privacy Act 2020 and the Office of the Privacy Commissioner's AI guidance apply
  to personal data.
regulatory_status_summary: >-
  National AI Strategy (2025) and responsible-AI guidance as policy; Algorithm Charter for government agencies; no AI-specific
  law.
binding_vs_guidance: >-
  Binding: none recorded. Strategy or guidance: New Zealand AI Strategy (2025); Algorithm Charter for Aotearoa New Zealand.
current_priorities: >-
  Adoption in small businesses and the public sector, skills, privacy-compliant use of generative AI, international interoperability.
how_to_use:
- Open the official source on each instrument before relying on any date or obligation.
- Treat strategies and guidance as signals of coming regulation, not as binding requirements.
- >-
  Check data-protection, consumer, employment and sector law that applies to AI systems regardless of AI-specific instruments.
