overview: >-
  Taiwan's Executive Yuan approved a draft Artificial Intelligence Basic Act in July 2024 setting principles (sustainability,
  human autonomy, privacy, security, transparency, fairness, accountability) and tasking the National Science and Technology
  Council to lead, with a risk-classification framework and sector regulation to follow; the Legislative Yuan's consideration
  continued into 2025. The Personal Data Protection Act and its new independent commission apply, and the Financial Supervisory
  Commission issued generative-AI guidelines for the financial sector.
regulatory_status_summary: >-
  AI Basic Act adopted by the Executive Yuan (2024) and under legislative process; sector guidance from financial regulators.
binding_vs_guidance: 'Binding: Artificial Intelligence Basic Act (draft). Strategy or guidance: none recorded.'
how_to_use:
- Open the official source on each instrument before relying on any date or obligation.
- Treat strategies and guidance as signals of coming regulation, not as binding requirements.
- >-
  Check data-protection, consumer, employment and sector law that applies to AI systems regardless of AI-specific instruments.
