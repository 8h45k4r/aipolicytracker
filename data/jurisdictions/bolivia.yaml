overview: >-
  Bolivia's e-government agency has published AI ethics guidance for the public sector; no AI-specific law recorded. General
  law (data protection where enacted, consumer, telecommunications and sector rules) applies to AI systems. This record
  exists so that coverage is complete and honest: it will be expanded when an official AI instrument is published or a reviewer
  adds one with its source.
