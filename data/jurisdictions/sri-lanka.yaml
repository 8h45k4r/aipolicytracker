overview: >-
  Sri Lanka published a National AI Strategy in 2024 through the Ministry of Digital Economy (formerly Technology) with
  a task force and a proposed national AI centre, following UNESCO's readiness assessment; the Personal Data Protection
  Act No. 9 of 2022 and its Data Protection Authority apply to AI processing personal data.
regulatory_status_summary: National AI strategy (2024) as policy; data-protection law applies; no AI-specific law.
binding_vs_guidance: 'Binding: none recorded. Strategy or guidance: National AI Strategy (2024).'
how_to_use:
- Open the official source on each instrument before relying on any date or obligation.
- Treat strategies and guidance as signals of coming regulation, not as binding requirements.
- >-
  Check data-protection, consumer, employment and sector law that applies to AI systems regardless of AI-specific instruments.
