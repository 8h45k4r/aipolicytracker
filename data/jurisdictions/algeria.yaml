overview: >-
  Algeria created a National AI Council and adopted a national AI strategy (2025) through the Ministry of Knowledge Economy,
  Start-ups and Micro-enterprises and the Ministry of Higher Education, with a national AI school opened in 2021; Law 18-07
  on personal data applies.
regulatory_status_summary: National AI strategy (2025) as policy; National AI Council; no AI-specific law.
binding_vs_guidance: 'Binding: none recorded. Strategy or guidance: National AI strategy (2025).'
how_to_use:
- Open the official source on each instrument before relying on any date or obligation.
- Treat strategies and guidance as signals of coming regulation, not as binding requirements.
- >-
  Check data-protection, consumer, employment and sector law that applies to AI systems regardless of AI-specific instruments.
- >-
  Use the African Union Continental AI Strategy (2024) as the regional reference where a national instrument is missing.
