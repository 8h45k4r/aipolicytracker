faq:
  - question: Does Nepal have an AI law or policy?
    answer: >
      Nepal has a National AI Policy approved by the Council of Ministers in 2025 and a 2024 concept paper from
      MoCIT, but no AI-specific legislation. Existing privacy, electronic-transaction and cyber-security law applies.
