overview: >-
  Germany applies the EU AI Act directly and is putting national implementation in place through a draft market-surveillance
  and innovation act that makes the Federal Network Agency (Bundesnetzagentur) the central market surveillance authority.
  The federal government has run a national AI strategy since 2018 (updated 2020) and the Federal Network Agency operates
  an AI service desk for companies. General law applies alongside: the Federal Data Protection Act, product safety, non-discrimination
  and works-council co-determination rules on algorithmic tools at work.
regulatory_status_summary: >-
  EU AI Act applies; national implementing act (KI-Marktüberwachungs- und Innovationsförderungsgesetz) proposed; national
  AI strategy in force as policy.
binding_vs_guidance: >-
  Binding: AI Act implementation act (KI-MIG, draft). Strategy or guidance: AI Strategy of the Federal Government.
current_priorities: >-
  Adopting the AI Act implementation act, staffing the Bundesnetzagentur as coordinating market-surveillance authority,
  regulatory sandboxes and AI compute capacity.
how_to_use:
- >-
  Start from the EU AI Act record for obligations; use this page for the national authorities, penalties and strategy.
- Open the official source on each instrument before relying on any date or obligation.
- >-
  Check national data-protection, employment and consumer law that applies to AI systems regardless of the AI Act.
