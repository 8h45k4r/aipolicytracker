overview: >-
  Norway is not an EU member but is in the European Economic Area and is incorporating the EU AI Act through the EEA Agreement,
  with the Norwegian Communications Authority (Nkom) proposed as coordinating market-surveillance authority. The 2020 National
  Strategy for AI, the Norwegian Digitalisation Agency's guidance and the Data Protection Authority's regulatory sandbox
  for responsible AI shape practice; a new national AI strategy is being prepared.
regulatory_status_summary: >-
  EU AI Act being incorporated via the EEA; national AI strategy (2020) as policy; DPA sandbox operating.
binding_vs_guidance: 'Binding: none recorded. Strategy or guidance: National Strategy for AI (2020).'
how_to_use:
- Open the official source on each instrument before relying on any date or obligation.
- Treat strategies and guidance as signals of coming regulation, not as binding requirements.
- >-
  Check data-protection, consumer, employment and sector law that applies to AI systems regardless of AI-specific instruments.
