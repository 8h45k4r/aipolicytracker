overview: >-
  Portugal applies the EU AI Act and adopted the "AI Portugal 2030" strategy in 2019 within the INCoDe.2030 digital-skills
  initiative, followed by a 2025 national AI agenda focused on public administration, language models in Portuguese and
  computing. The government has proposed the national communications regulator ANACOM and sector authorities for AI Act
  supervision, with the CNPD as data-protection authority.
regulatory_status_summary: >-
  EU AI Act applies; AI Portugal 2030 (2019) and 2025 AI agenda as policy; authority designation in progress.
binding_vs_guidance: 'Binding: none recorded. Strategy or guidance: AI Portugal 2030.'
how_to_use:
- >-
  Start from the EU AI Act record for obligations; use this page for the national authorities, penalties and strategy.
- Open the official source on each instrument before relying on any date or obligation.
- >-
  Check national data-protection, employment and consumer law that applies to AI systems regardless of the AI Act.
