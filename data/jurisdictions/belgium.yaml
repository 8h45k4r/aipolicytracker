overview: >-
  Belgium applies the EU AI Act and coordinates AI policy through the AI4Belgium coalition and the 2022 National Convergence
  Plan for AI, which aligns federal and regional (Flanders, Wallonia, Brussels) AI programmes. The federal government has
  proposed the FPS Economy as market-surveillance authority, with the Data Protection Authority and sector regulators in
  their fields; regional strategies fund research and adoption.
regulatory_status_summary: >-
  EU AI Act applies; national convergence plan (2022) and regional strategies as policy; authority designation in progress.
binding_vs_guidance: 'Binding: none recorded. Strategy or guidance: National Convergence Plan for AI (2022).'
how_to_use:
- >-
  Start from the EU AI Act record for obligations; use this page for the national authorities, penalties and strategy.
- Open the official source on each instrument before relying on any date or obligation.
- >-
  Check national data-protection, employment and consumer law that applies to AI systems regardless of the AI Act.
