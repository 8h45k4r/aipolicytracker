overview: >
  The United Arab Emirates governs AI mainly through national strategy and principles rather than a dedicated AI
  statute. The UAE National Strategy for Artificial Intelligence 2031, overseen by the Minister of State for AI,
  sets the direction; the AI Ethics Principles and Guidelines and the 2024 UAE Charter for the Development and Use
  of AI set out expectations; and the Federal Decree-Law No. 45 of 2021 on Personal Data Protection provides
  binding rules for personal data, including automated decision-making. Financial free zones (DIFC and ADGM) have
  their own data-protection regimes with specific provisions on autonomous and semi-autonomous systems.
regulatory_status_summary: >
  No binding federal AI law; national AI strategy and ethics guidance in place; binding personal-data rules at
  federal level and in the DIFC and ADGM free zones. A reviewer must confirm the current status of any AI-specific
  regulation announced by the UAE's regulatory intelligence office or the Regulations Lab.
binding_vs_guidance: >
  Binding: Federal Decree-Law No. 45 of 2021 (PDPL) and its executive regulations when issued, DIFC Data Protection
  Law and Regulation 10 (autonomous systems), ADGM Data Protection Regulations, sector rules (Central Bank, TDRA).
  Guidance: National AI Strategy 2031, AI Ethics Principles and Guidelines, UAE AI Charter, AI adoption guidelines.
current_priorities: >
  AI adoption across government, AI in education, sovereign compute and models, a regulatory framework through
  the Regulations Lab, and international AI partnerships.
how_to_use:
  - Apply the federal PDPL and, where relevant, DIFC or ADGM data-protection rules to AI using personal data.
  - Align governance with the UAE AI Ethics Principles and the AI Charter when working with government entities.
  - Track announcements from the Minister of State for AI office and the Regulations Lab for AI-specific rules.
