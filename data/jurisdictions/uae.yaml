faq:
  - question: Does the UAE have an AI law?
    answer: >
      Not a dedicated federal AI statute as of the last check. AI is governed through the National AI Strategy
      2031, ethics principles and the AI Charter, with binding obligations from the federal Personal Data
      Protection Law and free-zone data-protection regimes.
