overview: >-
  ASEAN has chosen voluntary, regionally harmonised guidance rather than binding regulation: the ASEAN Guide on AI Governance
  and Ethics (February 2024) sets principles and a governance framework for member states and organisations, and the Expanded
  ASEAN Guide on AI Governance and Ethics – Generative AI (January 2025) addresses generative-AI risks. Member states retain
  their own instruments; Singapore's Model AI Governance Framework strongly influenced the guide.
regulatory_status_summary: Voluntary regional guides (2024, 2025); no binding ASEAN AI regulation.
binding_vs_guidance: >-
  Binding: none recorded. Strategy or guidance: ASEAN Guide on AI Governance and Ethics (2024); Expanded ASEAN Guide on
  AI Governance and Ethics – Generative AI (2025).
how_to_use:
- Use the ASEAN guides as the regional baseline, then check each member state's own instruments.
- The guides are voluntary; obligations arise from national data-protection, consumer and sector law.
