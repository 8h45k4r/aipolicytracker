overview: >-
  Sierra Leone's Ministry of Communication, Technology and Innovation adopted a National AI Strategy (2024) after UNESCO's
  readiness assessment, focusing on public services, health, agriculture, education and skills; no AI-specific law exists.
regulatory_status_summary: National AI strategy (2024) as policy; no AI-specific law.
binding_vs_guidance: 'Binding: none recorded. Strategy or guidance: National AI Strategy (2024).'
how_to_use:
- Open the official source on each instrument before relying on any date or obligation.
- Treat strategies and guidance as signals of coming regulation, not as binding requirements.
- >-
  Check data-protection, consumer, employment and sector law that applies to AI systems regardless of AI-specific instruments.
- >-
  Use the African Union Continental AI Strategy (2024) as the regional reference where a national instrument is missing.
