overview: >-
  Jamaica's National AI Task Force delivered a national AI policy framework in 2024 covering governance, ethics, skills
  and public-sector use, and the government committed to a national AI policy under the Ministry of Science, Energy, Telecommunications
  and Transport; the Data Protection Act 2020 (in force December 2023) applies to AI processing personal data.
regulatory_status_summary: National AI policy framework (2024) as policy; data-protection law applies.
binding_vs_guidance: 'Binding: none recorded. Strategy or guidance: National AI policy framework (2024).'
how_to_use:
- Open the official source on each instrument before relying on any date or obligation.
- Treat strategies and guidance as signals of coming regulation, not as binding requirements.
- >-
  Check data-protection, consumer, employment and sector law that applies to AI systems regardless of AI-specific instruments.
