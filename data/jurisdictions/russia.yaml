overview: >-
  Russia's National Strategy for the Development of AI to 2030 was approved by Presidential Decree No. 490 of 10 October
  2019 and substantially updated by Decree No. 124 of 15 February 2024. Federal Law No. 123-FZ (2020) created an experimental
  legal regime for AI in Moscow, and Federal Law No. 258-FZ (2020) provides a general framework for digital-innovation experimental
  regimes. An industry AI Code of Ethics (2021) has hundreds of signatories. No comprehensive binding AI law exists; personal-data
  and information laws apply.
regulatory_status_summary: >-
  National AI strategy (2019, updated 2024) as policy; experimental legal regimes in force; AI ethics code voluntary.
binding_vs_guidance: >-
  Binding: Federal Law 123-FZ (Moscow AI experimental regime). Strategy or guidance: National AI Strategy to 2030 (Decree
  490, updated 2024).
how_to_use:
- Open the official source on each instrument before relying on any date or obligation.
- Treat strategies and guidance as signals of coming regulation, not as binding requirements.
- >-
  Check data-protection, consumer, employment and sector law that applies to AI systems regardless of AI-specific instruments.
