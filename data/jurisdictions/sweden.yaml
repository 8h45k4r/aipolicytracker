overview: >-
  Sweden applies the EU AI Act and has framed national policy through a 2018 national approach to AI and the AI Commission's
  roadmap for Sweden (SOU 2024:94, November 2024), which proposed investments, an AI task force, data access and public-sector
  adoption measures. The Swedish Authority for Privacy Protection (IMY) has published regulatory guidance and run sandboxes
  on AI; the government has proposed IMY, the Swedish Post and Telecom Authority and other bodies as AI Act authorities.
regulatory_status_summary: >-
  EU AI Act applies; AI Commission roadmap (2024) under implementation as policy; national approach (2018).
binding_vs_guidance: 'Binding: none recorded. Strategy or guidance: AI Commission roadmap for Sweden (SOU 2024:94).'
current_priorities: >-
  AI Act authority designation, AI investment package following the AI Commission, public-sector AI and data access.
how_to_use:
- >-
  Start from the EU AI Act record for obligations; use this page for the national authorities, penalties and strategy.
- Open the official source on each instrument before relying on any date or obligation.
- >-
  Check national data-protection, employment and consumer law that applies to AI systems regardless of the AI Act.
