overview: >-
  The Pan-Canadian AI Strategy is Canada's national AI strategy, first funded in Budget 2017 with $125 million and
  delivered largely through CIFAR and three national AI institutes. The Artificial Intelligence and Data Act (AIDA)
  was proposed as Part 3 of Bill C-27 and would have required organisations designing, developing or deploying high-impact
  AI systems to assess and mitigate risks of harm and bias, keep records and publish information, with enforcement
  by an AI and Data Commissioner and penalties for serious offences. This voluntary code asks Canadian developers
  and managers of advanced generative AI systems to commit to measures under six principles: accountability, safety,
  fairness and equity, transparency, human oversight and monitoring, and validity and robustness.
