overview: >-
  Iran approved a national AI document in 2024 and created a National AI Organisation; texts were not verified from an official
  source. General law (data protection where enacted, consumer, telecommunications and sector rules) applies to AI systems.
  This record exists so that coverage is complete and honest: it will be expanded when an official AI instrument is published
  or a reviewer adds one with its source.
