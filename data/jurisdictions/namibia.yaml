overview: >-
  Namibia's Ministry of Information and Communication Technology has been developing a national AI policy under the Fourth
  Industrial Revolution task-force recommendations (2022), and a Data Protection Bill is before Parliament; no AI-specific
  law exists.
regulatory_status_summary: National AI policy in development; data-protection bill pending.
binding_vs_guidance: 'Binding: none recorded. Strategy or guidance: National AI policy (in development).'
how_to_use:
- Open the official source on each instrument before relying on any date or obligation.
- Treat strategies and guidance as signals of coming regulation, not as binding requirements.
- >-
  Check data-protection, consumer, employment and sector law that applies to AI systems regardless of AI-specific instruments.
- >-
  Use the African Union Continental AI Strategy (2024) as the regional reference where a national instrument is missing.
