overview: >-
  Benin adopted a National Strategy for Artificial Intelligence and Big Data 2023–2027 in January 2023 through the Ministry
  of Digital Affairs and Digitalisation, with use cases in health, education, agriculture and public services, and the Digital
  Code (2017) provides the personal-data framework.
regulatory_status_summary: National AI and big-data strategy 2023–2027 as policy; Digital Code applies.
binding_vs_guidance: 'Binding: none recorded. Strategy or guidance: National AI and Big Data Strategy 2023–2027.'
how_to_use:
- Open the official source on each instrument before relying on any date or obligation.
- Treat strategies and guidance as signals of coming regulation, not as binding requirements.
- >-
  Check data-protection, consumer, employment and sector law that applies to AI systems regardless of AI-specific instruments.
- >-
  Use the African Union Continental AI Strategy (2024) as the regional reference where a national instrument is missing.
