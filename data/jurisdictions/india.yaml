faq:
  - question: Does India have an AI law?
    answer: >
      Not a dedicated one. AI is governed through the Digital Personal Data Protection Act 2023, the IT Act and
      intermediary rules, sector regulation, and non-binding governance guidelines published by MeitY in
      November 2025.
  - question: What is the IndiaAI Mission?
    answer: >
      A Union Cabinet-approved programme (March 2024) funding compute capacity, datasets, application development,
      skilling, startup financing and safe and trusted AI, implemented by the IndiaAI division of Digital India
      Corporation.
