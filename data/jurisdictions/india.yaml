overview: >
  India has no dedicated AI statute. AI governance rests on the Digital Personal Data Protection Act 2023 and its
  2025 Rules, the Information Technology Act 2000 and the IT (Intermediary Guidelines and Digital Media Ethics
  Code) Rules 2021 as applied to AI and synthetic media, sector regulators such as the RBI and SEBI, and a series of
  policy documents: NITI Aayog's Responsible AI approach papers, the IndiaAI Mission approved in March 2024, and the
  India AI Governance Guidelines released by MeitY in November 2025. The stated approach favours enabling
  innovation with light-touch, principle-based governance and existing-law enforcement.
regulatory_status_summary: >
  No binding cross-sector AI law. Binding obligations arise from the DPDP Act 2023 (phased commencement under the
  November 2025 Rules), the IT Act and intermediary rules, and sector regulation. The India AI Governance
  Guidelines (November 2025) are non-binding. A reviewer must confirm the commencement schedule of the DPDP Rules.
binding_vs_guidance: >
  Binding: DPDP Act 2023 and DPDP Rules 2025 (phased), IT Act 2000 and IT Rules 2021, Consumer Protection Act 2019,
  sector rules (RBI, SEBI, IRDAI). Guidance: India AI Governance Guidelines 2025, NITI Aayog Responsible AI papers,
  MeitY advisories to intermediaries on AI models and deepfakes.
current_priorities: >
  Implementing the IndiaAI Mission (compute, datasets, safety institute), operationalising DPDP consent and
  breach rules, addressing deepfakes and synthetic media through intermediary rules, and the AI Safety Institute.
how_to_use:
  - Treat the DPDP Act as the primary binding constraint for AI processing personal data of Indian residents.
  - If you operate a platform or intermediary, review IT Rules 2021 duties on synthetic media and AI models.
  - Use the India AI Governance Guidelines as the reference for regulator expectations and voluntary commitments.
  - Check sector rules (RBI for lending and credit scoring, SEBI for markets, IRDAI for insurance).
