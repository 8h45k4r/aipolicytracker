overview: >-
  Indonesia's long-range national AI strategy, prepared by a BPPT-led multi-stakeholder working group. A ministerial
  circular that lays out ethical values for developing and using AI, such as inclusivity, humanity, security, accessibility,
  transparency, accountability, personal data protection, sustainability and respect for intellectual property.
  A draft presidential regulation, prepared under Presidential Decree No.
regulatory_status_summary: >-
  Instruments on record: Strategi Nasional Kecerdasan Artifisial Indonesia 2020-2045 (2020, strategy, adopted);
  Surat Edaran Menteri Komunikasi dan Informatika Nomor 9 Tahun 2023 tentang Etika Kecerdasan Artifisial (2023,
  regulation, in force); Rancangan Peraturan Presiden tentang Peta Jalan Kecerdasan Artifisial Nasional 2026-2029
  (2026, strategy, proposed). Each is linked to its official source; human verification pending.
binding_vs_guidance: >-
  Binding: Surat Edaran Menteri Komunikasi dan Informatika Nomor 9 Tahun 2023 tentang Etika Kecerdasan Artifisial.
  Strategy or guidance: Strategi Nasional Kecerdasan Artifisial Indonesia 2020-2045, Rancangan Peraturan Presiden
  tentang Peta Jalan Kecerdasan Artifisial Nasional 2026-2029.
how_to_use:
- Open the official source on each instrument before relying on any date or obligation.
- >-
  Treat strategies and guidance as signals of coming regulation, not as binding requirements.
