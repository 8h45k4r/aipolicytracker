overview: >-
  Uzbekistan approved a Strategy for the development of artificial intelligence technologies until 2030 by Presidential
  Resolution in October 2024, building on the 2021 AI development measures, with priorities on public services, data, talent
  and an AI ethics framework; the Personal Data Law applies.
regulatory_status_summary: AI development strategy to 2030 (2024) as policy; no AI-specific law.
binding_vs_guidance: 'Binding: none recorded. Strategy or guidance: AI development strategy to 2030 (2024).'
how_to_use:
- Open the official source on each instrument before relying on any date or obligation.
- Treat strategies and guidance as signals of coming regulation, not as binding requirements.
- >-
  Check data-protection, consumer, employment and sector law that applies to AI systems regardless of AI-specific instruments.
