overview: >-
  Italy is the first EU member state with a comprehensive national AI law: Law No. 132 of 23 September 2025 lays down principles
  and delegations for AI, designates the Agency for Digital Italy (AgID) and the National Cybersecurity Agency (ACN) as
  national authorities, adds sector rules for health, work, professions, justice and public administration, restricts access
  for children under 14 and creates new criminal offences for harmful deepfakes. It sits alongside the EU AI Act and the
  Italian AI strategy 2024–2026. The Garante (data-protection authority) has been active on generative AI, including its
  2023 order against ChatGPT and a 2024 fine.
regulatory_status_summary: >-
  EU AI Act applies; national AI law in force since 10 October 2025; AI strategy 2024–2026 as policy; active data-protection
  enforcement.
binding_vs_guidance: >-
  Binding: Law No. 132/2025 on artificial intelligence. Strategy or guidance: Italian AI Strategy 2024–2026.
current_priorities: >-
  Implementing the delegated decrees under Law 132/2025, AgID/ACN supervision, health and public-administration use, deepfake
  offences.
how_to_use:
