faq:
- question: Does Italy have a national AI law in addition to the EU AI Act?
  answer: >-
    Yes. Law No. 132 of 23 September 2025 entered into force on 10 October 2025. It does not replace the EU AI Act; it designates
    national authorities, adds sector provisions and criminal offences, and delegates the government to adopt implementing
    decrees.
