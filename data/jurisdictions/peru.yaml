overview: >-
  Law 31814, promulgated on 4 July 2023 and published on 5 July 2023, declares AI development of national interest
  and frames its use within Peru's digital transformation process. This regulation, published on 9 September 2025,
  develops Law 31814 with six titles and 36 articles.
