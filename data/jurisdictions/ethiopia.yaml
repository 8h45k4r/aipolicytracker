overview: >-
  Ethiopia approved a National Artificial Intelligence Policy in 2024, implemented by the Ethiopian Artificial Intelligence
  Institute (established 2020), covering AI in agriculture, health, security and public services, talent, data and ethics;
  the Personal Data Protection Proclamation (2024) applies.
regulatory_status_summary: National AI policy (2024) as policy; AI Institute leads; data-protection law applies.
binding_vs_guidance: 'Binding: none recorded. Strategy or guidance: National AI Policy (2024).'
how_to_use:
- Open the official source on each instrument before relying on any date or obligation.
- Treat strategies and guidance as signals of coming regulation, not as binding requirements.
- >-
  Check data-protection, consumer, employment and sector law that applies to AI systems regardless of AI-specific instruments.
- >-
  Use the African Union Continental AI Strategy (2024) as the regional reference where a national instrument is missing.
