overview: >-
  Luxembourg applies the EU AI Act and published "Artificial Intelligence: a strategic vision for Luxembourg" in 2019, followed
  by public-sector AI programmes (AI4Gov) and the national data-protection authority CNPD's guidance. Luxembourg has proposed
  the CNPD and sector regulators (CSSF for finance) as AI Act authorities.
regulatory_status_summary: EU AI Act applies; AI strategic vision (2019) as policy; authority designation in progress.
binding_vs_guidance: 'Binding: none recorded. Strategy or guidance: AI: a strategic vision for Luxembourg (2019).'
how_to_use:
- >-
  Start from the EU AI Act record for obligations; use this page for the national authorities, penalties and strategy.
- Open the official source on each instrument before relying on any date or obligation.
- >-
  Check national data-protection, employment and consumer law that applies to AI systems regardless of the AI Act.
