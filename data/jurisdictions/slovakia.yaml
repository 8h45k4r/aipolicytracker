overview: >-
  Slovakia applies the EU AI Act, set out its AI direction in the 2019 "Action Plan for the Digital Transformation of Slovakia
  2019–2022" and a 2024 national AI strategy to 2030, and coordinates through the Ministry of Investments, Regional Development
  and Informatisation. The Office for Personal Data Protection is the data-protection authority.
regulatory_status_summary: EU AI Act applies; national AI strategy 2030 (2024) as policy.
binding_vs_guidance: 'Binding: none recorded. Strategy or guidance: National AI Strategy 2030.'
how_to_use:
- >-
  Start from the EU AI Act record for obligations; use this page for the national authorities, penalties and strategy.
- Open the official source on each instrument before relying on any date or obligation.
- >-
  Check national data-protection, employment and consumer law that applies to AI systems regardless of the AI Act.
