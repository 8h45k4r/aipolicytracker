overview: >-
  Texas enacted the Texas Responsible Artificial Intelligence Governance Act (TRAIGA, HB 149) in June 2025, effective 1
  January 2026. Narrower than Colorado's law, it prohibits specific harmful uses (manipulation to incite self-harm or crime,
  social scoring by government, unlawful discrimination with intent, certain biometric identification by government, sexual
  deepfakes of minors), requires government agencies to disclose AI interaction to consumers, creates an AI regulatory sandbox
  and a Texas AI Council, and gives the Attorney General exclusive enforcement with a 60-day cure period.
regulatory_status_summary: TRAIGA in force from 1 January 2026; enforcement by the Attorney General.
binding_vs_guidance: 'Binding: Texas Responsible AI Governance Act (TRAIGA). Strategy or guidance: none recorded.'
