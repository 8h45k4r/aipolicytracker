overview: >-
  Morocco launched the "Digital Morocco 2030" strategy in September 2024 with AI as a pillar (national AI centre, talent,
  public-sector use) and the Ministry of Digital Transition and Administrative Reform has been preparing a national AI strategy
  and a draft AI law; the CNDP (data-protection commission) applies Law 09-08 to AI processing personal data.
regulatory_status_summary: >-
  Digital Morocco 2030 with AI pillar as policy; national AI strategy and AI bill in preparation; data-protection law applies.
binding_vs_guidance: 'Binding: none recorded. Strategy or guidance: Digital Morocco 2030 (AI pillar).'
how_to_use:
- Open the official source on each instrument before relying on any date or obligation.
- Treat strategies and guidance as signals of coming regulation, not as binding requirements.
- >-
  Check data-protection, consumer, employment and sector law that applies to AI systems regardless of AI-specific instruments.
- >-
  Use the African Union Continental AI Strategy (2024) as the regional reference where a national instrument is missing.
