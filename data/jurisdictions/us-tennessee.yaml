overview: >-
  Tennessee enacted the ELVIS Act (Ensuring Likeness, Voice and Image Security Act) in March 2024, the first US state law
  explicitly protecting individuals' voice against unauthorised AI cloning by extending the right of publicity and adding
  liability for distributing tools whose primary purpose is producing unauthorised voice or likeness.
regulatory_status_summary: ELVIS Act (voice and likeness protection against unauthorised AI cloning) in force since 1 July 2024; no general AI statute.
binding_vs_guidance: 'Binding: Tennessee ELVIS Act. Strategy or guidance: none recorded.'
