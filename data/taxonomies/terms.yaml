  - { slug: transport, name: Transport and mobility }
  - { slug: telecommunications, name: Telecommunications and digital services }
risk_category:
  - { slug: prohibited, name: Prohibited practice, description: "Use banned outright (terminology used by the EU AI Act; other jurisdictions may differ)." }
  - { slug: high_risk, name: High-risk, description: "Use subject to the strictest requirements before and after deployment." }
  - { slug: transparency_risk, name: Transparency obligations, description: "Use permitted with disclosure or labelling duties (for example chatbots, synthetic content)." }
  - { slug: minimal_risk, name: Minimal or unregulated risk, description: "No AI-specific obligations beyond general law." }
  - { slug: systemic_risk, name: Systemic-risk general-purpose model, description: "General-purpose models with high-impact capabilities subject to additional duties." }
  - { slug: unclassified, name: Not classified by the instrument, description: "The instrument does not use a risk tiering." }
