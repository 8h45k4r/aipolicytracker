name: Policy data correction
description: Report inaccurate or outdated information about a policy, status, or jurisdiction
labels: ["data", "correction"]
body:
  - type: input
    id: policy
    attributes:
      label: Policy / entry name
      placeholder: "e.g. EU Artificial Intelligence Act"
    validations:
      required: true
  - type: input
    id: jurisdiction
    attributes:
      label: Jurisdiction (country / region)
    validations:
      required: true
  - type: textarea
    id: incorrect
    attributes:
      label: What is incorrect or outdated?
      description: Quote the current value shown in the tracker.
    validations:
      required: true
  - type: textarea
    id: correct
    attributes:
      label: What should it say?
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Official or openly licensed sources
      description: Links to the government, regulator, or primary-source documents that support the correction. Commentary from paid databases or copyrighted analysis cannot be used.
      placeholder: "https://..."
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: The sources above are official or publicly licensed and I have not reproduced copyrighted commentary or standards text.
          required: true
