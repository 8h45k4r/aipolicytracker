name: Bug report
description: Something is broken in the application
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "e.g. macOS 14, PHP 8.3, Chrome 128, commit abc123"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact any personal data or secrets before pasting.
      render: shell
