name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Azure App Service
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, bcmath, pdo_pgsql
          coverage: none

      - name: Install Composer dependencies (production)
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Build front-end assets
        run: npm ci && npm run build

      - name: Package
        run: |
          rm -rf node_modules tests .github
          zip -qr release.zip . -x ".git/*" "storage/logs/*" "storage/framework/cache/*" "storage/framework/sessions/*" "storage/framework/views/*"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.zip
          retention-days: 7

      - name: Deploy
        if: ${{ vars.AZURE_DEPLOY_VIA_ACTION == 'true' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip
          # Zip deploys do not remove files that were deleted or moved in the repository;
          # stale data/ files then fail policy:validate (duplicate slugs) and the import is
          # skipped. Clean the target before unpacking so wwwroot mirrors the release.
          type: zip
          clean: true
          restart: true

      # The Free-tier container is sometimes stopped by the platform seconds after a
      # deploy restarts it and no replacement is started. Poll the health endpoint and,
      # if it stays down, issue one restart through the Kudu API using the publish
      # profile credentials, then poll again.
      - name: Wait for health (self-heal once if needed)
        if: ${{ vars.AZURE_DEPLOY_VIA_ACTION == 'true' }}
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          health="https://${APP_NAME}.azurewebsites.net/up"
          wait_healthy() { for i in $(seq 1 "$1"); do code=$(curl -s -o /dev/null -m 30 -w '%{http_code}' "$health" || true); echo "health $i: $code"; [ "$code" = "200" ] && return 0; sleep 30; done; return 1; }
          if wait_healthy 12; then echo "healthy"; exit 0; fi
          echo "still down after 6 min; restarting via Kudu"
          user=$(echo "$PUBLISH_PROFILE" | grep -o 'userName="[^"]*"' | head -1 | cut -d'"' -f2)
          pass=$(echo "$PUBLISH_PROFILE" | grep -o 'userPWD="[^"]*"' | head -1 | cut -d'"' -f2)
          curl -s -o /dev/null -w 'restart: %{http_code}\n' -X POST -u "$user:$pass" "https://${APP_NAME}.scm.azurewebsites.net/api/app/restart"
          sleep 90
          wait_healthy 12 || { echo "::error::site did not become healthy after restart"; exit 1; }
