name: Daily alerts

# Triggers the daily alert send for Pro accounts on the production app (no
# always-on scheduler on the Free tier). The token is compared in constant
# time server-side; the command is idempotent per user and day.
on:
  schedule:
    - cron: "30 6 * * *" # every day 06:30 UTC
  workflow_dispatch:

permissions: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger alerts
        run: |
          curl -sS -f -X POST "https://aipolicytracker.org/cron/alerts" \
            -H "Authorization: Bearer ${{ secrets.CRON_TOKEN }}" \
            -H "Accept: application/json"
