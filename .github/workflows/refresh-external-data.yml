name: Refresh external datasets

# Weekly "cron" for third-party data (AI Incident Database, MIT AI Risk
# Repository). Runs the sync commands and opens a pull request so the change
# passes the same gates as any other data change. Nothing is written to
# production directly.
on:
  schedule:
    - cron: "0 4 * * 2" # Tuesdays 04:00 UTC, after AIID's Monday export
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, bcmath, zip, simplexml
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate --force
      - name: Sync AI Incident Database summary
        run: php artisan external:sync-aiid
      - name: Sync MIT AI Risk Repository taxonomy
        run: php artisan external:sync-mit-risk
      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: data/external-refresh
          title: "Weekly refresh of external datasets (AIID, MIT AI Risk Repository)"
          commit-message: "Refresh external datasets (AIID summary, MIT risk taxonomy)"
          author: "Bhaskar Bhatt <8h45k4r@gmail.com>"
          committer: "Bhaskar Bhatt <8h45k4r@gmail.com>"
          body: |
            Automated weekly refresh of `data/external/`.

            ## Role gates
            - Engineering: aggregates regenerated by `external:sync-aiid` / `external:sync-mit-risk`; CI must pass.
            - UI/UX: N/A (data only).
            - Documentation: N/A (see docs/modules/external-data.md).
            - Compliance: attribution and licence fields are carried inside the JSON; no report texts stored.
          labels: data
