name: Validate policy data

# Runs the schema and cross-reference validator over data/ and prints every error,
# then checks the corpus against the verification policy so records cannot go stale
# unnoticed, and against the completeness policy so a record cannot be published
# without what makes it checkable. Use it from the Actions tab (workflow_dispatch) when PHP is not
# available locally.
on:
  workflow_dispatch:
  pull_request:
    paths: ['data/**', 'config/verification.php', 'app/Services/Verification/**', 'config/completeness.php', 'app/Services/Completeness/**']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist --no-scripts
      - run: cp .env.example .env && php artisan key:generate --force
      - run: php artisan policy:validate
      - name: Seed the read model
        run: php artisan migrate --force && php artisan db:seed --force && php artisan policy:import
      - name: Verification policy (freshness)
        run: php artisan policy:freshness --list=40
      - name: Completeness policy (coverage)
        run: php artisan policy:coverage --list=40
