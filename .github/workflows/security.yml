name: Security

# Six scans, run where each one pays for itself:
#
#   every pull request and push to main   secrets (Gitleaks), SAST (Semgrep), SCA (composer/npm audit, Trivy)
#   same, when deploy files change        IaC (Trivy config, Checkov) and container image (Trivy)
#   weekly and on demand                  DAST (ZAP baseline) and API (ZAP active scan of /openapi.json)
#
# Accepted findings are listed with their reason next to the rule that ignores
# them (.gitleaks.toml, .zap/rules.tsv, SEMGREP_ACCEPTED below). Results are also
# summarised in docs/reference/security-scanning.md.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets (Gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan every commit
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            git /repo --config /repo/.gitleaks.toml --redact --exit-code 1

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    env:
      # Triaged rules. Each is a false positive for this codebase:
      #  - laravel-dangerous-model-construction: models use $guarded = [], but no
      #    controller passes unfiltered request input to create/fill; every write
      #    goes through validated() or an explicit array.
      #  - laravel-cookie-null-domain: a null domain is a host-only cookie, which is
      #    the stricter setting.
      SEMGREP_ACCEPTED: "laravel-dangerous-model-construction laravel-cookie-null-domain"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.178.0 semgrep scan \
            --config p/php --config p/security-audit --config p/secrets \
            --config p/javascript --config p/github-actions --config p/dockerfile \
            --exclude vendor --exclude node_modules --exclude public/build --exclude storage \
            --metrics=off --json -o semgrep.json --sarif-output semgrep.sarif || true
          test -s semgrep.json
      - name: Fail on untriaged ERROR findings
        run: |
          python3 - <<'PY'
          import json, os, sys
          accepted = os.environ["SEMGREP_ACCEPTED"].split()
          results = json.load(open("semgrep.json"))["results"]
          blocking = [r for r in results
                      if r["extra"]["severity"] == "ERROR"
                      and not any(r["check_id"].endswith(a) or f".{a}." in r["check_id"] for a in accepted)]
          for r in blocking:
              print(f'::error file={r["path"]},line={r["start"]["line"]}::{r["check_id"]}: {r["extra"]["message"][:200]}')
          print(f"{len(results)} findings, {len(blocking)} blocking")
          sys.exit(1 if blocking else 0)
          PY
      - name: Upload to code scanning
        # A fork's pull request gets a read-only token, so the upload would fail the job.
        if: always() && hashFiles('semgrep.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  sca:
    name: Dependencies (composer audit, npm audit, Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.3"
          coverage: none
      - name: composer audit
        run: composer audit --locked --no-interaction
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          # The newest 26.x, not whichever 26.x the runner image cached (security releases).
          check-latest: true
      - name: npm audit
        # Every dependency, build tools included: the browser bundle is built with them.
        # The script fails on any high or critical advisory except the ones it lists
        # with a reason (today only Tailwind 3's braces chain, which has no fix short of
        # Tailwind 4 and runs only on our own globs at build time).
        run: node scripts/npm-audit.mjs
      - name: Trivy (lockfiles, known CVEs with a fix)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln
          skip-dirs: vendor,node_modules
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  iac:
    name: IaC (Trivy config, Checkov)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy misconfiguration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          skip-dirs: vendor,node_modules
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Checkov (Dockerfile, GitHub Actions)
        run: |
          pip install --quiet checkov==3.3.19
          # CKV_GHA_7: flags any workflow_dispatch input; composer-lock.yml
          # validates its one input before use.
          checkov -d . --framework dockerfile,github_actions --skip-path vendor --skip-path node_modules \
            --skip-check CKV_GHA_7 --compact --quiet

  container:
    name: Container image (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the production image
        # A planted env file in the place production keeps its own (deploy/.env) must not
        # reach the image: .dockerignore once matched .env at the context root only, and the
        # host's secrets were copied in.
        run: |
          printf 'PLANTED=1\n' > deploy/.env
          printf 'PLANTED=1\n' > .env.production
          docker build --pull -t aipolicytracker:scan .
          rm -f deploy/.env .env.production
      - name: No environment file is inside the image
        run: |
          found="$(docker run --rm --entrypoint sh aipolicytracker:scan -c 'find / -xdev \( -name .env -o -name ".env.*" \) ! -name .env.example 2>/dev/null' || true)"
          if [ -n "$found" ]; then echo "::error::environment files in the image: $found"; exit 1; fi
          echo "no .env files in the image"
      - name: The image runs the PHP release the Dockerfile pins
        # A pinned base is the point: the runtime gets security releases by a
        # reviewed change, and this proves the built image carries that release.
        run: |
          pinned="$(sed -n 's/^FROM php:\([0-9.]*\)-.*/\1/p' Dockerfile)"
          actual="$(docker run --rm --entrypoint php aipolicytracker:scan -r 'echo PHP_VERSION;')"
          echo "pinned $pinned, image $actual"
          [ -n "$pinned" ] && [ "$pinned" = "$actual" ]
      - name: Share cards can be drawn in this image (social:doctor)
        # The image went to production once without a font: every card silently
        # fell back to the static picture, and nothing was red. The doctor exits
        # non-zero when no face resolves, so here it is as a gate.
        run: |
          docker run --rm --entrypoint php \
            -e APP_KEY="base64:$(head -c 32 /dev/zero | base64)" \
            -e DB_CONNECTION=sqlite -e DB_DATABASE=:memory: \
            -e CACHE_STORE=array -e SESSION_DRIVER=array -e QUEUE_CONNECTION=sync \
            aipolicytracker:scan artisan social:doctor
      - name: The image boots and serves through nginx and php-fpm
        # The entrypoint is what production runs: migrations, caches, then nginx and
        # php-fpm on 8080. This starts it against PostgreSQL, as deploy/compose.yml
        # does, and checks what the deploy probes check, plus the server itself:
        # parallel requests, static files from nginx, no other PHP file executes,
        # dot files hidden, the health check passes and a stop is graceful. APP_URL is an
        # https address because the start-up check refuses anything else in production.
        run: |
          set -euo pipefail
          docker network create smoke
          docker run -d --name smoke-db --network smoke -e POSTGRES_DB=aip -e POSTGRES_USER=aip \
            -e POSTGRES_PASSWORD=smoke postgres:16-alpine
          for _ in $(seq 1 30); do docker exec smoke-db pg_isready -U aip -d aip && break; sleep 2; done
          docker run -d --name smoke-app --network smoke -p 127.0.0.1:8080:8080 \
            -e APP_KEY="base64:$(head -c 32 /dev/urandom | base64)" -e APP_URL=https://smoke.aipolicytracker.test \
            -e DB_CONNECTION=pgsql -e DB_HOST=smoke-db -e DB_PORT=5432 -e DB_DATABASE=aip \
            -e DB_USERNAME=aip -e DB_PASSWORD=smoke -e SESSION_DRIVER=database \
            -e CACHE_STORE=database -e QUEUE_CONNECTION=database aipolicytracker:scan
          up=""
          for _ in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:8080/up && up=1 && break; sleep 2; done
          [ -n "$up" ] || { docker logs smoke-app; exit 1; }
          for p in / /policies /obligations /api/v1/ /llms.txt /robots.txt; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$p")"
            echo "$code $p"; [ "$code" = 200 ] || { docker logs --tail 50 smoke-app; exit 1; }
          done
          # Eight requests at once all answer (artisan serve answered one at a time without workers).
          seq 1 8 | xargs -P 8 -I{} curl -fsS -o /dev/null http://127.0.0.1:8080/policies
          asset="$(docker exec smoke-app sh -c 'ls public/build/assets/*.css | head -1')"
          curl -fsSI "http://127.0.0.1:8080/${asset#public/}" | grep -qi '^cache-control: public, max-age=31536000, immutable'
          [ "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/.htaccess)" = 404 ]
          [ "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/build/x.php)" = 404 ]
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' smoke-app)" = healthy ] && break; sleep 5
          done
          docker inspect -f '{{.State.Health.Status}}' smoke-app | grep -qx healthy \
            || { docker inspect -f '{{json .State.Health}}' smoke-app; exit 1; }
          # A background process that dies is started again by the entrypoint's supervisor.
          docker exec smoke-app pkill -KILL -f 'artisan queue:work'
          restarted=""
          for _ in $(seq 1 15); do docker exec smoke-app pgrep -f 'artisan queue:work' >/dev/null && restarted=1 && break; sleep 1; done
          [ -n "$restarted" ] || { echo "::error::the queue worker was not restarted"; docker logs --tail 30 smoke-app; exit 1; }
          docker logs smoke-app 2>&1 | grep -q 'queue exited with status' || { echo "::error::no restart notice in the log"; exit 1; }
          start=$(date +%s); docker stop -t 30 smoke-app
          code="$(docker inspect -f '{{.State.ExitCode}}' smoke-app)"
          echo "stopped in $(( $(date +%s) - start ))s with exit code $code"
          [ "$code" = 0 ] || { docker logs --tail 50 smoke-app; exit 1; }
          # The php-fpm base image's own stop signal is SIGQUIT; the entrypoint must exit
          # cleanly on it too (a stop sent by an orchestrator that uses the base default).
          docker start smoke-app >/dev/null
          for _ in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:8080/up 2>/dev/null && break; sleep 2; done
          start=$(date +%s); docker kill --signal QUIT smoke-app >/dev/null
          for _ in $(seq 1 30); do [ "$(docker inspect -f '{{.State.Running}}' smoke-app)" = false ] && break; sleep 1; done
          code="$(docker inspect -f '{{.State.ExitCode}}' smoke-app)"
          echo "SIGQUIT: stopped in $(( $(date +%s) - start ))s with exit code $code"
          [ "$(docker inspect -f '{{.State.Running}}' smoke-app)" = false ] && [ "$code" = 0 ] || { docker logs --tail 30 smoke-app; exit 1; }
      - name: Clean up the smoke test
        if: always()
        run: docker rm -f smoke-app smoke-db >/dev/null 2>&1 || true
      - name: Trivy image scan (OS packages and PHP dependencies)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aipolicytracker:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  dast:
    name: DAST and API (ZAP)
    # Active scanning takes a while; it runs weekly and on demand, not per PR.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, pdo_sqlite, gd
          coverage: none
      - name: Start the app in production mode on a throwaway database
        env:
          APP_ENV: production
          APP_DEBUG: "false"
          APP_URL: http://127.0.0.1:8080
          DB_CONNECTION: sqlite
          DB_DATABASE: /tmp/dast.sqlite
          SESSION_DRIVER: file
          SESSION_SECURE_COOKIE: "false"
          CACHE_STORE: file
          MAIL_MAILER: log
          PHP_CLI_SERVER_WORKERS: "4"
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          cp .env.example .env && php artisan key:generate --force
          touch /tmp/dast.sqlite
          php artisan migrate --force && php artisan policy:import && php artisan external:import
          nohup php artisan serve --host=0.0.0.0 --port=8080 > /tmp/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/up >/dev/null && break; sleep 1; done
          # The spec names the public https origin; point the scanner at this one.
          curl -fs http://127.0.0.1:8080/openapi.json \
            | jq '.servers = [{"url": "http://127.0.0.1:8080/api/v1"}]' > openapi-local.json
      - name: ZAP baseline (passive, whole site)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://127.0.0.1:8080
          rules_file_name: .zap/rules.tsv
          cmd_options: "-I -m 5"
          allow_issue_writing: false
          artifact_name: zap-baseline
      - name: ZAP API scan (active, OpenAPI)
        uses: zaproxy/action-api-scan@5158fe4d9d8fcc75ea204db81317cce7f9e5453d # v0.10.0
        with:
          target: openapi-local.json
          format: openapi
          rules_file_name: .zap/rules.tsv
          cmd_options: "-I"
          allow_issue_writing: false
          artifact_name: zap-api
