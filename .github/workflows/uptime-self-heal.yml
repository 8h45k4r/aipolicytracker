name: Uptime check

# Probes the public site every fifteen minutes and fails if it stays down, which
# is the alert: a failed scheduled run notifies the repository's watchers.
#
# It used to probe the App Service hostname directly and, when that failed,
# issue a restart through the Kudu API. Both halves are wrong now. The site is
# served from its own host, so probing the old hostname measured something this
# project no longer runs, and the restart was aimed at an application that has
# been deliberately stopped — it fired every fifteen minutes against it.
#
# There is deliberately no self-heal step any more. Restarting the current host
# would need credentials for it, and a scheduled workflow holding credentials
# that can restart production is a larger thing to own than the outage it would
# shorten. It reports; a person decides.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the public health endpoint
        env:
          SITE: ${{ vars.SITE_URL || 'https://aipolicytracker.org' }}
        run: |
          set -u
          probe() { curl -s -o /dev/null --max-time 20 -w '%{http_code}' "$SITE/up"; }
          a=$(probe); echo "probe 1: $a"
          [ "$a" = "200" ] && exit 0
          # One retry, because a single timeout is not an outage.
          sleep 30
          b=$(probe); echo "probe 2: $b"
          [ "$b" = "200" ] && exit 0
          echo "::error::$SITE/up did not answer 200 (got $a then $b)"
          exit 1
