name: Weekly digest

# Triggers the digest send on the production app (no always-on scheduler on the
# Free tier). The token is compared in constant time server-side.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger digest
        run: |
          curl -sS -f -X POST "https://aipolicytracker.org/cron/digest" \
            -H "Authorization: Bearer ${{ secrets.CRON_TOKEN }}" \
            -H "Accept: application/json"
