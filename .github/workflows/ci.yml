name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: PHP lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, bcmath, intl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      # The deploy script runs these on every release. A config file holding a
      # closure, or a broken route or view, fails here instead of aborting the
      # container's startup after the site is already live.
      - name: Production caches build (config, routes, views)
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          # Clear them again before the suite, or the tests run against cached config and
          # routes rather than their own environment. Targeted clears only: optimize:clear
          # also runs cache:clear, which needs the database, and there is none here yet.
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear

      - name: Run tests
        run: composer test

      # Every page the sitemap publishes, rendered in process and checked: a title
      # of at most sixty characters with no internal identifier in it, one H1, a
      # description within budget, a canonical, and nothing noindexed in the
      # sitemap. The rules are enforced here rather than remembered.
      - name: Page rules across the sitemap (seo:audit)
        run: |
          touch database/database.sqlite
          php artisan migrate --force --no-interaction
          php artisan policy:import
          php artisan external:import
          php artisan seo:audit --fail-on-violation

      # Blocking: the codebase is formatted, so a style regression fails the build.
      - name: Code style (Laravel Pint)
        run: composer lint

  # Production runs PostgreSQL; the job above runs in-memory SQLite. The two
  # disagree in ways that reach production silently: an unmatched double-quoted
  # identifier is a string literal in SQLite and an error in PostgreSQL (which
  # took /reviewers down), and a constraint violation inside a transaction
  # poisons the whole transaction in PostgreSQL but not in SQLite (which hid a
  # 500 on every retried billing webhook). Both drivers now run the same suite.
  backend-postgres:
    name: PHP tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aipolicytracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo, pdo_pgsql, pgsql, bcmath, intl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      # The same sequence azure/startup.sh runs on every release, against the same
      # engine production uses. A migration that only works on SQLite fails here
      # instead of crash-looping the container after the deploy reports success.
      - name: Migrate and import, as the deploy does
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: aipolicytracker_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: |
          php artisan migrate --force
          php artisan policy:import

      # Passed as real environment variables so they win over phpunit.xml, which
      # pins sqlite for the fast job.
      - name: Run tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: aipolicytracker_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: php artisan test

  frontend:
    name: JS lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # public/build is committed, because the production host does not build
      # assets: a Vite build needs Node plus roughly 200 MB of node_modules,
      # which is most of the memory budget on the host this site shares with
      # another application.
      #
      # This checks that the committed manifest is present and covers every
      # Vite input. It deliberately does NOT compare the committed bytes against
      # a fresh build: the bundle is not reproducible across machines. The same
      # source and the same package-lock produced app.js at 257.32 kB here,
      # 257.48 kB with a stale node_modules and 257.50 kB on a runner, so a byte
      # comparison fails on every pull request regardless of whether the assets
      # are stale. Freshness is debt #30, not something this step can establish.
      - name: Committed manifest covers every entry
        run: |
          test -f public/build/manifest.json \
            || { echo "public/build/manifest.json is not committed"; exit 1; }
          node -e '
            const m = require("./public/build/manifest.json");
            const want = ["resources/js/app.jsx", "resources/css/public.css", "resources/js/public.js"];
            const missing = want.filter(k => !m[k]);
            if (missing.length) {
              console.error("committed manifest is missing entries: " + missing.join(", "));
              console.error("run: npm run build, and commit public/build");
              process.exit(1);
            }
            console.log("manifest covers all " + want.length + " entries");
          '
