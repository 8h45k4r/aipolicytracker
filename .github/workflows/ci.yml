name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: PHP lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, bcmath, intl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      # The deploy script runs these on every release. A config file holding a
      # closure, or a broken route or view, fails here instead of aborting the
      # container's startup after the site is already live.
      - name: Production caches build (config, routes, views)
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          # Clear them again before the suite, or the tests run against cached config and
          # routes rather than their own environment. Targeted clears only: optimize:clear
          # also runs cache:clear, which needs the database, and there is none here yet.
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear

      - name: Run tests
        run: composer test

      # Non-blocking until the codebase has been formatted once with
      # `composer lint:fix`; then remove continue-on-error to enforce style.
      - name: Code style (Laravel Pint)
        run: composer lint
        continue-on-error: true

  # Production runs PostgreSQL; the job above runs in-memory SQLite. The two
  # disagree in ways that reach production silently: an unmatched double-quoted
  # identifier is a string literal in SQLite and an error in PostgreSQL (which
  # took /reviewers down), and a constraint violation inside a transaction
  # poisons the whole transaction in PostgreSQL but not in SQLite (which hid a
  # 500 on every retried billing webhook). Both drivers now run the same suite.
  backend-postgres:
    name: PHP tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aipolicytracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo, pdo_pgsql, pgsql, bcmath, intl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      # The same sequence azure/startup.sh runs on every release, against the same
      # engine production uses. A migration that only works on SQLite fails here
      # instead of crash-looping the container after the deploy reports success.
      - name: Migrate and import, as the deploy does
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: aipolicytracker_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: |
          php artisan migrate --force
          php artisan policy:import

      # Passed as real environment variables so they win over phpunit.xml, which
      # pins sqlite for the fast job.
      - name: Run tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: aipolicytracker_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: php artisan test

  frontend:
    name: JS lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
