name: Regenerate composer.lock

# Manual helper for maintainers without a local PHP toolchain: updates the lock
# file for the given packages and uploads it as an artifact to commit locally.
on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Space-separated packages to update (e.g. symfony/yaml)"
        required: true

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, intl, bcmath
          coverage: none
      - name: Update lock for requested packages
        run: composer update ${{ inputs.packages }} --with-all-dependencies --no-install --no-interaction --no-progress
      - name: Validate
        run: composer validate --no-check-publish
      - uses: actions/upload-artifact@v4
        with:
          name: composer-lock
          path: composer.lock
          retention-days: 1
