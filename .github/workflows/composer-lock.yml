name: Regenerate composer.lock

# Manual helper for maintainers without a local PHP toolchain: updates the lock
# file for the given packages and uploads it as an artifact to commit locally.
on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Space-separated packages to update (e.g. symfony/yaml)"
        required: true

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.2"
          extensions: mbstring, intl, bcmath
          coverage: none
      - name: Update lock for requested packages
        # The input is passed through the environment rather than expanded into
        # the command line, so a value can never become shell syntax.
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          # Each word must be a vendor/package name, so nothing starting with "-"
          # can reach composer as an option.
          for p in $PACKAGES; do
            echo "$p" | grep -Eq '^[a-z0-9_.-]+/[a-z0-9_.-]+$' || { echo "::error::not a package name: $p"; exit 1; }
          done
          # shellcheck disable=SC2086
          composer update $PACKAGES --with-all-dependencies --no-install --no-scripts --no-interaction --no-progress
      - name: Validate
        run: composer validate --no-check-publish
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: composer-lock
          path: composer.lock
          retention-days: 1
