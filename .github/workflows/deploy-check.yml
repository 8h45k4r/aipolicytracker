# Which features on main is the live site serving? Run it from the Actions tab after
# a deploy; the job summary lists every feature as live or not live, with the commit
# that introduced it. The checks are in scripts/deploy-check.sh, which runs the same
# way against a local copy of main (every row passes there).
name: Deployment check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check the live site
    runs-on: ubuntu-latest
    # Thirty probes against a live site, each allowed its own connect and read
    # timeout, so an origin that accepts connections and then stalls holds the job
    # open far longer than the probes themselves should take. Capped for the same
    # reason every job in ci.yml is: a run that cannot end cannot report.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Probe one marker per shipped feature
        env:
          SITE: ${{ vars.SITE_URL || 'https://aipolicytracker.org' }}
        run: scripts/deploy-check.sh "$SITE"
