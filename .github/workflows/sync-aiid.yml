name: Sync AI incidents

# Pulls new and modified AI Incident Database records into production every six
# hours through the token-protected cron trigger (no always-on scheduler on the
# Free tier). Nothing is written to the repository; the weekly refresh workflow
# does that so a clean deploy starts from the same state.
on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger incident sync
        run: |
          curl -sS -f -m 300 -X POST "https://aipolicytracker.org/cron/external-sync" \
            -H "Authorization: Bearer ${{ secrets.CRON_TOKEN }}" \
            -H "Accept: application/json"
